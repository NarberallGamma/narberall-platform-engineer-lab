# Nginx in front of HSM adapter
# Based on the ingress shape from Helm charts
# Host: hsm-adapter (10.10.16.170)

# HTTP server — redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hsm-adapter.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hsm-adapter.example.com;

    ssl_certificate /etc/nginx/ssl/example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root path — redirect to Swagger UI
    location = / {
        return 301 /hsm-adapter/swagger-ui/index.html;
    }

    # HSM adapter prefix
    location /hsm-adapter/ {
        # Strip /hsm-adapter before proxying
        rewrite ^/hsm-adapter/(.*) /$1 break;

        proxy_pass http://localhost:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /hsm-adapter;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check (direct path under the prefix)
    location /hsm-adapter/actuator/health {
        proxy_pass http://localhost:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
