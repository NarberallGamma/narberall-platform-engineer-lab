---
- name: Check whether the host is already joined to the domain
  ansible.builtin.command: realm list
  register: realm_list
  changed_when: false
  failed_when: false

- name: Show hostname fact before join
  ansible.builtin.debug:
    msg: "Current hostname: {{ ansible_facts['hostname'] }}, inventory_hostname: {{ inventory_hostname }}"

- name: Save current hostname
  ansible.builtin.set_fact:
    original_hostname: "{{ ansible_facts['hostname'] }}"

- name: Determine computer name in AD
  ansible.builtin.set_fact:
    ad_computer_name: "{{ domain_join_hostname if (domain_join_hostname | default('') | length > 0) else original_hostname }}"

- name: Temporarily set short hostname for domain join
  ansible.builtin.hostname:
    name: "{{ domain_join_hostname }}"
  when:
    - (realm_list.rc != 0) or (ad_domain not in realm_list.stdout)
    - domain_join_hostname | default('') | length > 0

- name: Join the domain (if not already joined)
  ansible.builtin.command: >-
    realm join
    --user={{ domain_admin_user }}
    --computer-ou='{{ ad_computer_ou }}'
    --os-name='{{ os_name }}'
    --os-version='{{ os_version }}'
    {{ ad_domain }}
  args:
    stdin: "{{ domain_admin_password | default('') }}\n"
  when: (realm_list.rc != 0) or (ad_domain not in realm_list.stdout)

- name: Delay after realm join for AD sync
  ansible.builtin.pause:
    seconds: 10
  when: (realm_list.rc != 0) or (ad_domain not in realm_list.stdout)

- name: Show realm status
  ansible.builtin.command: realm list
  register: realm_list_after
  changed_when: false

- name: Debug realm list
  ansible.builtin.debug:
    var: realm_list_after.stdout_lines
