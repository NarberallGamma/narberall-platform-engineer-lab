---
- name: Update apt cache
  apt: update-cache=yes cache_valid_time=86400

- name: Update all packages
  apt: upgrade=dist

- name: neo4j | install java package
  apt:
    name: "{{ neo4j_java_package_name }}"
    state: present
    install_recommends: yes
    update_cache: yes

- name: add Neo4j apt key
  apt_key: url=http://debian.neo4j.org/neotechnology.gpg.key state=present


- name: set Neo4j repository
  apt_repository: repo="deb http://debian.neo4j.org/repo {{ neo4j_package_version }}/" state=present update_cache=yes

- name: install neo4j package
  apt: name={{ neo4j_package }} state=present update_cache=yes force=yes

- name: Plugins dir
  file:
    path: /plugins
    state: directory

- name: Wget plugins
  shell: |
    wget -P /plugins https://github.com/neo4j-contrib/neo4j-apoc-procedures/releases/download/3.5.0.5/apoc-3.5.0.5-all.jar
    wget -P /plugins https://repo1.maven.org/maven2/org/mongodb/bson/3.12.1/bson-3.12.1.jar
    wget -P /plugins https://repo1.maven.org/maven2/org/mongodb/mongodb-driver/3.12.1/mongodb-driver-3.12.1.jar
    wget -P /plugins https://repo1.maven.org/maven2/org/mongodb/mongo-java-driver/3.12.1/mongo-java-driver-3.12.1.jar
    wget -P /plugins https://repo1.maven.org/maven2/org/mongodb/mongodb-driver-core/3.12.1/mongodb-driver-core-3.12.1.jar
    wget -P /plugins https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-annotations/2.10.2jackson-annotations--2.10.2.jar
    wget -P /plugins https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-core/2.10.2/jackson-core-2.9.8.jar
    wget -P /plugins https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.10.2jackson-databind-2.10.2.jar
    wget -P /plugins https://repo1.maven.org/maven2/mysql/mysql-connector-java/5.1.34/mysql-connector-java-5.1.34.jar

- name: Main configuration
  template:
    src: neo4j.conf.j2
    dest: /etc/neo4j/neo4j.conf
    owner: root
    group: root
    mode: 0644

- name: Create a directory if it does not exist
  file:
    path: /etc/systemd/system/neo4j.service.d
    state: directory
    mode: '0755'

- name: Main configuration for neo4j systemd
  copy:
    src: "{{ role_path }}/files/override.conf"
    dest: "/etc/systemd/system/neo4j.service.d/override.conf"

- name: restart neo4j
  systemd:
    state: restarted
    daemon_reload: yes
    name: neo4j
