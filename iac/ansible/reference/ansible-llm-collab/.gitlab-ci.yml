# The inputs below show up under Run pipeline -> Inputs and can be changed before a run.
# SSH_PRIVATE_KEY is set in Settings -> CI/CD -> Variables (only for deploying to another host).
spec:
  inputs:
    DEPLOY_TARGET_HOST:
      default: ""
      description: "Target host for the SSH deploy (empty = deploy on the runner host, no SSH)"
    PLAYBOOK:
      default: ""
      description: "Playbook to run after the repo sync (empty = sync only)"
    SSH_USER:
      default: "root"
      description: "SSH user on the remote host"
    ANSIBLE_REPO_CHOWN_USER:
      default: "ansible"
      description: "Owner of the repo directory"
    ANSIBLE_REPO_CHOWN_UID:
      default: "1001"
      description: "Owner UID"
    ANSIBLE_REPO_CHOWN_GID:
      default: "1001"
      description: "Owner GID"
---
include:
  - project: 'platform-infra/common-ci'
    file: 'deploys/ansible-deploy.yaml'
    ref: main
    inputs:
      DEPLOY_TARGET_HOST: $[[ inputs.DEPLOY_TARGET_HOST ]]
      PLAYBOOK: $[[ inputs.PLAYBOOK ]]
      SSH_USER: $[[ inputs.SSH_USER ]]
      ANSIBLE_REPO_CHOWN_USER: $[[ inputs.ANSIBLE_REPO_CHOWN_USER ]]
      ANSIBLE_REPO_CHOWN_UID: $[[ inputs.ANSIBLE_REPO_CHOWN_UID ]]
      ANSIBLE_REPO_CHOWN_GID: $[[ inputs.ANSIBLE_REPO_CHOWN_GID ]]
