# Manual "host -> EDR agent name" mappings for coverage calculation.
#
# Needed where a link exists but is missing from the data. Main case — Macs
# in the domain: the agent registers under the local name
# (`MacBook-Air-admin.local`), and if the network name looks like an IP,
# macOS truncates it at the first dot and EDR gets `192`. There is no
# domain name in any API field — nothing can join this automatically.
#
# merge3 does NOT pair these by username (a second laptop of the same person
# would silently ruin the metric): it writes candidates to the log as
# "Candidates for aliases.yaml (matched user…)". Check visually in the EDR
# console and add them here:
#
#   sudo docker logs sec-stack-edr-exporter-1 2>&1 | grep 'Candidates for aliases'
#
# Agent name comes from the `name` column of `{company}_edr.csv` (case and
# underscores do not matter). For truncated names, use `displayname`: several
# different Macs sit under the name `192`, and only the full name tells them
# apart. If no agent with that name is in the export, merge3 warns — usually
# the agent was reinstalled and the mapping is stale.
#
# File is optional: without it, coverage is calculated as before. Changes go
# through an MR; ansible deploys it to the VM next to exclusions.yaml.
# Format:
#
# companies:
#   project-e:
#     m-user-a: MAC              # Mac.loc, lastuser a.user
#     m-user-b: 192.168.1.15     # name truncated to '192', refer to displayname

companies: {}
