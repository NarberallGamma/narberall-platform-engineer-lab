{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}
  namespace: {{ include "openobserve-collector.namespace" . }}
  labels:
    {{- include "openobserve-collector.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecret.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: ZO_MAIN_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: {{ .Values.externalSecret.tokenProperty }}
{{- end }}
