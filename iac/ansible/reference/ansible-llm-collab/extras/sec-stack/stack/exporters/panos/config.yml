# panos-exporter config. Firewall names here = targets in vmagent/prometheus.yml
# and suffixes of API-key variables (PANOS_API_KEY_NGFW01_SITE_A, etc.).
#
# Obtain an API key like this (a separate read-only sec-stack user on each FW,
# superuser read-only role):
#   curl -sk "https://<fw>/api/?type=keygen&user=<user>&password=<pass>"
#
# IPsec tunnels are monitored DYNAMICALLY: the list comes from the device
# running config (excluding disabled); no manual entries are needed.
#
# If a tunnel is expected to be down — do not exclude it from monitoring;
# assign a role (role label on panos_ipsec_tunnel_up). Only primary is
# alerted as critical:
#   primary  — working tunnel (default); down = alert;
#   reserve  — standby, down while the primary is up: visible on the dashboard,
#              not sent to chat;
#   broken   — known not-to-come-up / unfinished, also no alerts.
# Role is set here (ipsec_tunnel_roles) or via a marker in the tunnel comment
# on PAN-OS itself: [sec-stack:role=reserve] — then the network engineer
# updates it, without an MR here. Config overrides comment.
# ignore_ipsec_tunnels is stricter: no metric at all.

listen: 0.0.0.0:9654

firewalls:
  ngfw01-site-a:
    host: ngfw01-site-a.example.com
    verify_tls: false # TODO: enable after proper certs on mgmt
    # ignore_ipsec_tunnels: [tunnel-to-nowhere]
    ipsec_tunnel_roles:
      ipsec-to-peer-a-reserve: reserve # reserve for ipsec-to-peer-a, expected down
      ipsec-peer-b: broken       # does not come up; drop the role once it is finished
  ngfw02-site-a:
    host: ngfw02-site-a.example.com
    verify_tls: false
  # ngfw-test-site-a is broken — removed from polling so the chat is not
  # flooded with a permanent PanosUnreachable. Restore here and in
  # vmagent/prometheus.yml once it is fixed.
  # ngfw-test-site-a:
  #   host: ngfw-test-site-a.example.com
  #   verify_tls: false
  ngfw-project-b:
    host: ngfw-project-b.example.com
    verify_tls: false
    ipsec_tunnel_roles:
      ipsec-to-vps2: broken # cannot come up; drop the role once it is fixed
  ngfw-project-c:
    host: ngfw-project-c.example.com
    verify_tls: false
  ngfw01-project-d:
    host: ngfw01-project-d.example.com
    verify_tls: false
  ngfw02-project-d:
    host: ngfw02-project-d.example.com
    verify_tls: false
  ngfw01-project-e:
    host: ngfw01-project-e.example.com
    verify_tls: false
