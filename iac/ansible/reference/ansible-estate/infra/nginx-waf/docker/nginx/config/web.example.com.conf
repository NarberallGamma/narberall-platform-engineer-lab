# Updated configuration for web.example.com with WebSocket support
# Place at: /docker/nginx/config/web.example.com.conf

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/web.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/web.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/web.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name web.example.com;
    listen 80;

    return 301 https://web.example.com;
}

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/web.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/web.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/web.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name web.example.com;
    listen 443 ssl;
    ssl_certificate /docker/certgen/data/example.com.crt;
    ssl_certificate_key /docker/certgen/data/example.com.key;

    include /etc/nginx/conf_add/wallarm-blocked-page;
    client_max_body_size 100m;

    # ============================================
    # BLOCK SWAGGER AND ACTUATOR for allowed APIs
    # ============================================
    
    # Block swagger-ui for treasury-web
    location ~ ^/api/v0/treasury-web/swagger-ui {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Block swagger-ui for treasury-web-ws
    location ~ ^/api/v0/treasury-web-ws/swagger-ui {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Block actuator for treasury-web (full block, including health)
    location ~ ^/api/v0/treasury-web/actuator {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Block actuator for treasury-web-ws (full block, including health)
    location ~ ^/api/v0/treasury-web-ws/actuator {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # BLOCK PATHS UP TO AND INCLUDING /api/v0
    # Return 403 for root, /api and /api/v0
    # ============================================
    
    # Block the root path
    location = / {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api (no trailing slash)
    location = /api {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api/ (with slash, but not /api/v0/)
    location ~ ^/api/$ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api/v0 (no trailing slash)
    location = /api/v0 {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api/v0/ (with slash, but not allowed paths)
    location = /api/v0/ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # ALLOWED API PATHS (treasury-web and treasury-web-ws)
    # Important: these rules must come BEFORE blocking other APIs
    # ============================================
    
    # Special location for /docs/upload with Wallarm response parsing disabled
    # (to avoid "overlimit_res" blocks for large files)
    location ~ ^/api/v0/treasury-web/docs/upload {
        # Disable Wallarm response parsing for this location
        wallarm_parse_response off;
        
        # Increase the WAF processing time limit for file uploads
        # From 1 s (default) to 10 s for heavy requests with files
        wallarm_process_time_limit 10000;
        # Block mode: attack — block only in blocking mode (depends on wallarm_mode)
        # Safer than off: monitoring mode passes the request, blocking mode still blocks
        wallarm_process_time_limit_block attack;
        
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Increase timeouts for large file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
    
    # Allow /api/v0/treasury-web/ (except swagger/actuator already blocked above)
    location ~ ^/api/v0/treasury-web/ {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Allow /api/v0/treasury-web-ws/ with WebSocket support
    location ~ ^/api/v0/treasury-web-ws/ {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        
        # Basic headers
        proxy_set_header Host web.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        
        # WebSocket-specific settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for WebSocket (long-lived connections)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        proxy_cache off;
        
        # Extra headers for correct WebSocket operation
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # ============================================
    # BLOCK ALL OTHER API PATHS
    # Allow only: /api/v0/treasury-web/ and /api/v0/treasury-web-ws/
    # ============================================
    
    # Block all /api/v0/* paths except the allowed ones
    location ~ ^/api/v0/(?!treasury-web/|treasury-web-ws/) {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # EVERYTHING ELSE (non-API paths) — allow
    # ============================================
    
    location / {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

