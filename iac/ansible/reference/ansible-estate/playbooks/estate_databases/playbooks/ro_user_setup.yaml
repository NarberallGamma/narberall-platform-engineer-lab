---
# Extra read-only account playbook: GRANT CONNECT + SELECT (no OWNER, no treasury_user/schema_flyway).
# Run: ansible-playbook ro_user_setup.yaml --extra-vars "ro_user=superset_main ro_password=..."
#         ansible-playbook ro_user_setup.yaml --extra-vars "ro_user=... ro_password=... db_name=treasury_contract|db_list=[...]"
# Without db_name / db_list, default_databases from vars below is used.
- name: Create a PostgreSQL RO user (GRANT CONNECT + SELECT, no OWNER)
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    pg_host: "10.10.16.30"
    pg_port: 5432
    pg_admin_user: root
    pg_admin_password: ""

    ro_user: "superset_main"
    ro_password: ""

    # Object-creator role for ALTER DEFAULT PRIVILEGES FOR ROLE (not the extra account OWNER).
    default_privileges_for_role: schema_flyway

    # Full list of estate application databases (RDS prod snapshot, 2026-07). Override: db_name or db_list.
    # treasury_contract_restored_3: temporary/restored database, may be absent on preprod.
    default_databases:
      - cryptopro_service
      - hsm
      - keycloak
      - nodes_btc
      - nodes_eth
      - nodes_tron
      - treasury_aml
      - treasury_api
      - treasury_csp
      - treasury_aml
      - treasury_audit
      - treasury_auth_provider
      - treasury_contract
      - treasury_contract_restored_3
      - treasury_csp
      - treasury_notification
      - treasury_onboarding
      - treasury_otp
      - treasury_rates
      - treasury_report
      - treasury_safe_deal_adapter
      - treasury_lp_adapter
      - treasury_treasury_adapter
      - treasury_web

  pre_tasks:
    - name: Check ro_user and ro_password
      ansible.builtin.fail:
        msg: "Set ro_user and ro_password in playbook vars or via --extra-vars"
      when: >
        ro_user is not defined or (ro_user | default('') | trim | length) == 0
        or ro_password is not defined or (ro_password | default('') | length) == 0

    - name: Resolve the database list to process
      ansible.builtin.set_fact:
        db_list: "{{ db_list | default(default_databases) }}"
      when: db_name is not defined or db_name == '' or db_name is none

    - name: Resolve the database list from db_name
      ansible.builtin.set_fact:
        db_list: "{{ [db_name] }}"
      when: db_name is defined and db_name != '' and db_name is not none

    - name: Fail when the database list is empty
      ansible.builtin.fail:
        msg: "ERROR: database list is empty. Set db_name or db_list"
      when: db_list is not defined or db_list | length == 0

    - name: Show parameters
      ansible.builtin.debug:
        msg:
          - "RO user: {{ ro_user }}"
          - "Databases ({{ db_list | length }}): {{ db_list | join(', ') }}"

  roles:
    - ro_user
