---
# Default values for the prepare_servers role
# Override in group_vars, host_vars, or inventory

# Wait for apt/dpkg lock during dist-upgrade and Docker install (seconds). ansible.builtin.apt default is 60.
prepare_servers_apt_lock_timeout: 600

# Docker settings
# If unset, the standard directory /var/lib/docker is used
docker_data_dir: "/var/lib/docker"

# containerd data directory (layers/content, often tens of GiB). Default is /var/lib/containerd on the root volume;
# to place it on the same disk as docker_data_dir — set e.g. /docker/containerd (see group_vars prepare_servers).
containerd_data_dir: "/var/lib/containerd"

# Official Docker repository (download.docker.com)
docker_apt_channel: stable
# Remove docker.io / docker-compose distro packages before installing docker-ce
docker_remove_distro_packages: true
# Distro packages only; omit containerd/runc — otherwise a rerun after docker-ce can conflict.
# On apt conflict during the first docker-ce install — remove packages manually per Docker docs.
docker_distro_packages_remove:
  - docker.io
  - docker-doc
  - docker-compose
  - docker-compose-v2
  - podman-docker

# rsync /var/lib/docker and /var/lib/containerd to docker_data_dir / containerd_data_dir (see tasks/docker_migrate.yml)
docker_migrate_data: false
docker_migrate_docker_backup_path: "/var/lib/docker.pre-migrate.bak"
docker_migrate_containerd_backup_path: "/var/lib/containerd.pre-migrate.bak"

# docker save/load images to tar before apt purge docker.io and after docker-ce install (tasks/docker_images_*.yml)
docker_images_backup_enabled: true
docker_images_backup_dir: "/docker/backup/docker-images"
docker_images_backup_marker: "{{ docker_images_backup_dir }}/.images_saved"
docker_images_restore_marker: "{{ docker_images_backup_dir }}/.images_restored"

# Skip apt repository and package install (docker-ce already installed)
docker_skip_package_install: false
