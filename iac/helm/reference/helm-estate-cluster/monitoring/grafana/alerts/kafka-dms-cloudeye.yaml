# Alert rules for dashboard "Kafka (DMS) - CloudEye" (uid: 61384089-7711-487c-8bde-68a540d66a86).
# Metrics: prometheus-cloudeye-exporter (job=cloudeye-exporter). Datasource UID: PBFA97CFB590B2093.
# noDataState: OK: missing metrics (scrape/CES gap) must not raise DatasourceNoData; notify only when the query returns a value and the threshold fires.
# execErrState: OK: query errors (Prometheus timeout, datasource down) must not raise DatasourceError; notify only on a metric threshold.
apiVersion: 1

groups:
  - orgId: 1
    name: Kafka DMS CloudEye
    folder: Alerting
    interval: 30s
    rules:
      - uid: kafka_dms_consumer_lag_warn
        title: Kafka DMS - Total Consumer Lag > 100
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: sum(sbercloud_sys_dms_messages_remained{job="cloudeye-exporter", kafka_groups!~"estate-web-ws-.*"})
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              refId: C
              expression: '{{ printf "$" }}B > 100'
        dashboardUid: 61384089-7711-487c-8bde-68a540d66a86
        panelId: 134
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: "Kafka DMS total consumer lag exceeds 100 messages"
          description: "sum(sbercloud_sys_dms_messages_remained) excluding estate-web-ws-* groups. Dashboard: Total Consumer Lag."
        labels:
          dashboard: "Kafka (DMS) - CloudEye"
          severity: warning

