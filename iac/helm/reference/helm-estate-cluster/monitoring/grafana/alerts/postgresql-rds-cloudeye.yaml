# Alert rules for dashboard "PostgreSQL (RDS) - CloudEye" (uid: pg_exporter_monitoring).
# Metrics: prometheus-cloudeye-exporter (job=cloudeye-exporter). Datasource UID: PBFA97CFB590B2093.
# noDataState: OK: missing metrics (scrape/CES gap) must not raise DatasourceNoData; notify only when the query returns a value and the threshold fires.
# execErrState: OK: query errors (Prometheus timeout, datasource down) must not raise DatasourceError; notify only on a metric threshold.
apiVersion: 1

groups:
  - orgId: 1
    name: PostgreSQL RDS CloudEye
    folder: Alerting
    interval: 30s
    rules:
      - uid: pg_rds_replica_status_not_up
        title: PostgreSQL RDS - Replica Status not Up
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: clamp_max(max(sbercloud_sys_rds_slave_replication_status{job="cloudeye-exporter"} > bool 0), 1)
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              refId: C
              expression: '{{ printf "$" }}B < 1'
        dashboardUid: pg_exporter_monitoring
        panelId: 49
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: "PostgreSQL RDS replica status is not Up (panel Replica Status)"
          description: "clamp_max(max(slave_replication_status > bool 0), 1) < 1. Dashboard: Replica Status."
        labels:
          dashboard: "PostgreSQL (RDS) - CloudEye"
          severity: critical

      - uid: pg_rds_master_status_not_up
        title: PostgreSQL RDS - Master DB Status not Up
        condition: C
