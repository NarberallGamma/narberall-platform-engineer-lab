---
# CIS Ubuntu 24 Benchmark — variables for ansible-lockdown.ubuntu24_cis
# Role install: ansible-galaxy install -r requirements.yml
# Run: ansible-playbook playbooks/prepare_servers.yml --tags cis -e "enable_cis=true"

# Level: Level 1 by default (Level 2 is more aggressive — enable deliberately)
ubtu24cis_level_1: true
ubtu24cis_level_2: false

# Do not reboot automatically — reboot is managed manually
skip_reboot: true
ubtu24cis_disruption_high: false

# ---------------------------------------------------------------------------
# TEMPORARILY DISABLED SECTIONS (conflict with the current prepare_servers)
# ---------------------------------------------------------------------------

# Section 5 (SSH, PAM, sudo, account policies) — DISABLED
# Conflicts:
#   - 5.1.x: CIS writes configs to /etc/ssh/sshd_config.d/, while ssh_pass_auth.yml
#             deletes them and sets PasswordAuthentication yes directly
#   - 5.3.x: CIS overwrites /etc/pam.d/common-* via pam-auth-update,
#             breaking pam_sss.so and pam_mkhomedir from sssd.yml
#   - 5.2.x: CIS may conflict with /etc/sudoers.d/domain-admins (NOPASSWD)
# Re-enable after rewriting ssh_pass_auth.yml and sssd.yml into a CIS-compatible form.
ubtu24cis_section5: false

# Section 4 (Firewall) — DISABLED
# Conflict: CIS enables UFW with default-deny-outbound, blocking the edr-vendor agent
#           (edr-proxy.example.com:80 and :443).
# Re-enable after adding UFW rules for the agent in the prepare_servers role.
ubtu24cis_firewall_package: "none"

# ---------------------------------------------------------------------------
# Active sections (1, 2, 3, 6, 7) — no conflicts
# ---------------------------------------------------------------------------
# Section 1: kernel modules, partitions, AppArmor, process hardening, banners
# Section 2: removal of extra services, NTP
# Section 3: network sysctl parameters
# Section 6: auditd, journald, rsyslog
# Section 7: file permissions
