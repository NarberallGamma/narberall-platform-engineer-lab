# Example HTTP(S) vhost for AKHQ (web UI, not stream).
# Place in conf.d on the proxy; SSL — environment certificates.
#
# Backend: Kafka host, inventory IP, port — kafka_akhq_host_port from Ansible (default 8080).
# server_name — align with kafka_akhq_public_host / kafka_advertised_host.
#
# Fill in server_name and proxy_pass for the environment; nginx -t && reload after edits.

server {
    listen 443 ssl;
    server_name kafka-akhq.example.com;

    # ssl_certificate ... ssl_certificate_key ...

    # proxy_pass without a trailing / on the upstream URI.
    # If Location from AKHQ still arrives as //ui (old config with context-path: "/"): uncomment the line below.
    # proxy_redirect ~*^//ui(.*)$ https://$host/ui$1;
    location / {
        proxy_pass http://10.10.1.41:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
