# CI for git.example.com: builds the exporter image and pushes it to this
# project registry. The sec-stack stack pulls it by version (see
# stack/docker-compose.yml in sec-stack) - no sources ever land on the
# monitoring VM.
#
# The image is built with kaniko: no privileged runner and no docker:dind.
#
# Only one runner requirement: it must be available to this project (a group
# runner, or one registered here separately).
#
# The registry push uses this project own CI_JOB_TOKEN - no separate
# credentials to provision.

stages: [lint, build]

default:
  interruptible: true
  tags:
    - sec-stack-runner

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - python -m py_compile edr_exporter.py merge3.py vkcloud.py sbercloud-adv.py active-directory.py vendor-edr.py edr_report.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Matching tests: the rules that have already failed silently (names, duplicates,
# IP fallback). No cloud or EDR data needed - fixtures are built inside the tests.
test:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir uv
    - uv sync --group dev --frozen
    - uv run pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""] # the image ships its own entrypoint; gitlab-runner needs it empty
  script:
    # Registry credentials for kaniko: it reads them from the docker config.
    # docker login is not an option here - there is no daemon, by design
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
    # A tag builds the release version (the one sec-stack pins); main builds a
    # floating edge tag for checks. Prod never runs a floating tag.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$CI_COMMIT_TAG latest"
      else
        TAGS="edge main-$CI_COMMIT_SHORT_SHA"
      fi
      DESTINATIONS=""
      for t in $TAGS; do
        DESTINATIONS="$DESTINATIONS --destination $CI_REGISTRY_IMAGE:$t"
        echo "will publish $CI_REGISTRY_IMAGE:$t"
      done
      # one build pass, several tags on the output
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        $DESTINATIONS
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
