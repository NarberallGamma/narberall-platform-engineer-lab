# Nginx WAF configuration for web-treasury.example.com
# Place at: /docker/nginx/config/web-treasury.example.com.conf

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/web-treasury.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/web-treasury.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/web-treasury.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name web-treasury.example.com;
    listen 80;

    return 301 https://web-treasury.example.com;
}

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/web-treasury.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/web-treasury.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/web-treasury.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name web-treasury.example.com;
    listen 443 ssl;
    ssl_certificate /docker/certgen/data/example.com.crt;
    ssl_certificate_key /docker/certgen/data/example.com.key;

    include /etc/nginx/conf_add/wallarm-blocked-page;
    client_max_body_size 100m;

    # ============================================
    # BLOCK SWAGGER AND ACTUATOR for the allowed API
    # ============================================
    
    # Block swagger-ui for treasury-api
    location ~ ^/api/v0/treasury-api/swagger-ui {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Block actuator for treasury-api (full block, including health)
    location ~ ^/api/v0/treasury-api/actuator {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Block settings for treasury-api (full block of the entire path)
    location ~ ^/api/v0/treasury-api/settings {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # BLOCK PATHS UP TO AND INCLUDING /api/v0
    # Return 403 for root, /api and /api/v0
    # ============================================
    
    # Block the root path
    location = / {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api (no trailing slash)
    location = /api {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api/ (with slash, but not /api/v0/)
    location ~ ^/api/$ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api/v0 (no trailing slash)
    location = /api/v0 {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api/v0/ (with slash, but not allowed paths)
    location = /api/v0/ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # BLOCK ALL OTHER API PATHS
    # Allow only: /api/v0/treasury-api/
    # ============================================
    
    # Block all /api/v0/* paths except the allowed one
    # To allow treasury-csp (and any other services): replace (?!treasury-api/) with (?!treasury-api/|service/)
    location ~ ^/api/v0/(?!treasury-api/) {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # ALLOWED API PATH
    # ============================================
    
    # Allow /api/v0/treasury-api/ (except swagger/actuator already blocked above)
    location ~ ^/api/v0/treasury-api/ {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web-treasury.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # TEMPORARY ACCESS TO /api/v0/treasury-csp/
    # To restore access: 1) uncomment the block below
    # 2) in the location ~ ^/api/v0/(?!...) above, add |treasury-csp/
    # ============================================
    # location ~ ^/api/v0/treasury-csp/ {
    #     proxy_pass https://k8s-ift;
    #     proxy_ssl_server_name on;
    #     proxy_ssl_name $host;
    #     proxy_set_header Host web-treasury.example.com;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header x-ms-proxy $server_name;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    # ============================================
    # EVERYTHING ELSE (non-API paths) — allow
    # ============================================
    
    location / {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web-treasury.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

