---
llm_dev_app_root: "/docker/apps/llm-dev"
llm_dev_models_dir: "{{ llm_dev_app_root }}/models"

llm_dev_model_filename: "model.gguf"

# CUDA12 + llama-server; ggml-org registry (historically ggerganov/llama.cpp may have been removed from ghcr).
llm_dev_llama_image: "ghcr.io/ggml-org/llama.cpp:server-cuda"
# Image ghcr.io/ggml-org/llama.cpp (*-server*): binary in /app (see .devops/cuda.Dockerfile target server), not on PATH with a custom shell entrypoint.
llm_dev_llama_server_binary: "/app/llama-server"

llm_dev_compose_project_name: "llm-dev"
llm_dev_env_file_name: ".env"
llm_dev_compose_restart_policy: unless-stopped

llm_dev_listen_port: 8080
# llama-server bind address inside the container (--host); published to the host via a separate port mapping.
llm_dev_llama_listen_host: "0.0.0.0"
# Publish llama on loopback only (nginx on the same host sends requests to 127.0.0.1:llm_dev_llama_host_port)
llm_dev_llama_host_bind_address: "127.0.0.1"
llm_dev_llama_host_port: "{{ llm_dev_listen_port }}"

llm_dev_ctx_size: 4096
llm_dev_gpu_layers: 99
# Extra llama-server arguments in compose (list → space-joined string), then optionally llm_dev_llama_extra_args as a single string.
llm_dev_llama_extra_args_list: []
llm_dev_llama_extra_args: ""

llm_dev_assert_model_present: false

llm_dev_enable_api_key: false
llm_dev_enable_hf_token: false

llm_dev_compose_pull: "missing"

# docker compose up: always recreate containers (equivalent of --force-recreate), not only when compose/env changes.
# Module values: auto | always | never.
llm_dev_compose_recreate: "always"

# docker_compose_v2 tasks (pull/up) on a slow image channel → async on the controller (overridden in group_vars/llm_dev).
llm_dev_compose_async_seconds: 10800
llm_dev_compose_poll_seconds: 15

# Open WebUI — browser chat; OpenAI-compatible backend → llama-server on the docker network.
llm_dev_open_webui_enabled: true
llm_dev_open_webui_image: "ghcr.io/open-webui/open-webui:main"
llm_dev_open_webui_env_file_name: "open-webui.env"
llm_dev_open_webui_host_bind_address: "127.0.0.1"
llm_dev_open_webui_host_port: 8081

# Public UI URL behind the reverse proxy (redirects, OAuth). Empty — do not set WEBUI_URL.
llm_dev_open_webui_public_url: ""

# Matches llm_dev_nginx_path_webui (open-webui.env template); when only llm_dev_deploy runs without group_vars — a safe default.
llm_dev_nginx_path_webui: "/"

# Docker limits — see group_vars/llm_dev/main.yml ("Docker cgroup limits" section).
llm_dev_container_limits_enabled: false
