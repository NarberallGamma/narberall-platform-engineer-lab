---
# Role nextcloud_init: WebDAV user/password — from variables (vars, -e, CI Variables) or from Vault.
# If nextcloud_webdav_user/nextcloud_webdav_password are already set — Vault is not called.
# Vault paths and key names: nextcloud_vault_mount_point, nextcloud_vault_path, nextcloud_vault_key_webdav_user, nextcloud_vault_key_webdav_password (group_vars).
# For Vault on the control node: VAULT_ADDR, VAULT_TOKEN (or AppRole).

- name: Assert that a client name is set
  ansible.builtin.assert:
    that: client_name is defined and client_name | length > 0
    fail_msg: 'Set client_name: ansible-playbook ... -e "client_name=Acme LLC"'
  when: not (nextcloud_reapply_all_clients_enabled | default(false) | bool) and not (nextcloud_ldap_reset_groups_enabled | default(false) | bool)
  tags: always

# Vault key names depend on the profile (nextcloud_profile_map → playbook pre_tasks).
# Access via secrets[k_user] in vars, not _vault.secret[k] in one expression: otherwise Jinja sometimes
# turns it into an attribute lookup and raises "dict has no attribute ansible_regul_…".
- name: Load Nextcloud secrets from Vault
  ansible.builtin.set_fact:
    nextcloud_webdav_user: "{{ secrets[k_user] }}"
    nextcloud_webdav_password: "{{ secrets[k_pass] }}"
  vars:
    _vault: "{{ lookup('community.hashi_vault.vault_kv2_get', nextcloud_vault_path, engine_mount_point=nextcloud_vault_mount_point) }}"
    secrets: "{{ _vault['secret'] }}"
    k_user: "{{ nextcloud_vault_key_webdav_user }}"
    k_pass: "{{ nextcloud_vault_key_webdav_password }}"
  no_log: true
  when: >
    (nextcloud_webdav_user is not defined or nextcloud_webdav_user | length == 0) or
    (nextcloud_webdav_password is not defined or nextcloud_webdav_password | length == 0)

- name: Assert that WebDAV credentials are set
  ansible.builtin.assert:
    that:
      - nextcloud_webdav_user is defined and nextcloud_webdav_user | length > 0
      - nextcloud_webdav_password is defined and nextcloud_webdav_password | length > 0
    fail_msg: 'Set nextcloud_webdav_user and nextcloud_webdav_password (Vault or -e/group_vars/CI Variables). Vault path: nextcloud_vault_mount_point, nextcloud_vault_path.'
  tags: always
