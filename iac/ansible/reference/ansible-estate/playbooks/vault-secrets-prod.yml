---
# Vault Secrets Upload Playbook for PROD Environment
# Загрузка секретов в Vault кластер prod

- name: Upload secrets to Vault PROD
  hosts: localhost
  gather_facts: no
  connection: local
  
  pre_tasks:
    - name: Load vault cluster variables
      include_vars: ../group_vars/prod/vault_cluster.yml
      tags: [always]
    
    - name: Load vault secrets
      include_vars: ../group_vars/prod/vault_secrets.yml
      tags: [always]
    
    - name: Check VAULT_TOKEN environment variable
      fail:
        msg: |
          ERROR: VAULT_TOKEN environment variable is not set!
          
          Please export VAULT_TOKEN before running this playbook:
            export VAULT_TOKEN="your-root-token"
          
          You can get the root token from Vault initialization output.
      when: lookup('env', 'VAULT_TOKEN') == ''
      tags: [always]
    
    - name: Verify no CHANGE_ME values in secrets
      fail:
        msg: |
          ERROR: Found CHANGE_ME placeholder in secret "{{ item.name }}"!
          
          Please replace all CHANGE_ME values with actual PROD secrets in:
            group_vars/prod/vault_secrets.yml
          
          All secrets must be updated before deploying to PROD!
      when: item.data | to_json | regex_search('CHANGE_ME')
      loop: "{{ vault_secrets }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [always]
    
    - name: Display deployment information
      debug:
        msg:
          - "=== VAULT SECRETS UPLOAD - PRODUCTION ==="
          - "Environment: PRODUCTION"
          - "Vault Address: {{ vault_addr }}"
          - "Virtual IP: {{ vault_virtual_ip }}"
          - "Domain: {{ vault_domain }}"
          - "Mount Point: {{ vault_mount_point }}"
          - "Secrets to upload: {{ vault_secrets | length }}"
          - ""
          - "Secret names:"
          - "{{ vault_secrets | map(attribute='name') | list }}"
      tags: [always]
    
    - name: Pause for PRODUCTION confirmation
      pause:
        prompt: |
          
          ⚠️  WARNING: PRODUCTION ENVIRONMENT ⚠️
          
          You are about to upload {{ vault_secrets | length }} secrets to PRODUCTION Vault cluster.
          This will overwrite existing secrets!
          
          Are you sure you want to continue?
          
          Type 'yes' to proceed or Ctrl+C to abort:
      register: prod_confirmation
      when: not (ansible_check_mode | default(false))
      tags: [always]
    
    - name: Verify PRODUCTION confirmation
      fail:
        msg: "PRODUCTION deployment aborted by user"
      when: 
        - not (ansible_check_mode | default(false))
        - prod_confirmation.user_input | default('') != 'yes'
      tags: [always]
  
  roles:
    - vault-secrets
  
  post_tasks:
    - name: Display completion message
      debug:
        msg:
          - "=== SECRETS UPLOAD COMPLETE ==="
          - "Environment: PRODUCTION"
          - "Total secrets uploaded: {{ vault_secrets | length }}"
          - "Vault Address: {{ vault_addr }}"
          - ""
          - "You can now access secrets via:"
          - "  - Vault UI: https://{{ vault_domain }}"
          - "  - Vault CLI: vault kv get {{ vault_mount_point }}/SECRET_NAME"
          - "  - API: {{ vault_addr }}/v1/{{ vault_mount_point }}/data/SECRET_NAME"
          - ""
          - "⚠️  IMPORTANT: Save the VAULT_TOKEN securely!"
      tags: [always]


