---
# Enable automatic GGUF download before compose deploy
llm_dev_model_fetch_enabled: true

# Preset: key in llm_dev_model_catalog (set in group_vars of the llm_dev group). Empty string — manual mode: llm_dev_model_hf_repo, llm_dev_model_hf_revision, llm_dev_model_hf_files / hf_file, llm_dev_model_filename.

# Force re-download even if the file already exists
llm_dev_model_force_download: false

# Request the HF token from Vault (same key as llm_dev_enable_hf_token); can be disabled for public repositories
llm_dev_model_fetch_hf_token_from_vault: false

# If the model is gated or an API quota is needed — enable and store a token in Vault
llm_dev_model_fetch_requires_hf_token: false

# Force-hide curl task stderr/output (even without an HF token); default is off (easier diagnostics).
llm_dev_model_fetch_force_curl_no_log: false

# Short string flag or extra curl arguments (e.g. "-4" when IPv6 to huggingface.co is broken).
llm_dev_model_fetch_curl_extra_args: ""
llm_dev_model_fetch_curl_user_agent: "llm-dev-ansible-fetch/1.0 (curl; GGUF)"

# Metadata/manifest directory next to the app (under {{ llm_dev_app_root }})
llm_dev_sources_dir: "{{ llm_dev_app_root }}/sources"

# Preset catalog: override in group_vars of the llm_dev group (see group_vars/llm_dev/main.yml → llm_dev_model_catalog).
llm_dev_model_catalog: {}

# Manual mode (llm_dev_model_preset empty)
llm_dev_model_hf_repo: ""
llm_dev_model_hf_revision: "main"
# One file or several (GGUF shards); when the list is empty, only hf_file is used.
llm_dev_model_hf_files: []
llm_dev_model_hf_file: ""
