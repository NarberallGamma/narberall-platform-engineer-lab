---
# Vault Secrets Upload Playbook for PREPROD Environment
# Загрузка секретов в Vault кластер preprod

- name: Upload secrets to Vault PREPROD
  hosts: localhost
  gather_facts: no
  connection: local
  
  pre_tasks:
    - name: Load vault cluster variables
      include_vars: ../group_vars/preprod/vault_cluster.yml
      tags: [always]
    
    - name: Load vault secrets
      include_vars: ../group_vars/preprod/vault_secrets.yml
      tags: [always]
    
    - name: Check VAULT_TOKEN environment variable
      fail:
        msg: |
          ERROR: VAULT_TOKEN environment variable is not set!
          
          Please export VAULT_TOKEN before running this playbook:
            export VAULT_TOKEN="your-root-token"
          
          You can get the root token from Vault initialization output.
      when: lookup('env', 'VAULT_TOKEN') == ''
      tags: [always]
    
    - name: Display deployment information
      debug:
        msg:
          - "=== VAULT SECRETS UPLOAD - PREPROD ==="
          - "Environment: PREPROD"
          - "Vault Address: {{ vault_addr }}"
          - "Virtual IP: {{ vault_virtual_ip }}"
          - "Domain: {{ vault_domain }}"
          - "Mount Point: {{ vault_mount_point }}"
          - "Secrets to upload: {{ vault_secrets | length }}"
          - ""
          - "Secret names:"
          - "{{ vault_secrets | map(attribute='name') | list }}"
      tags: [always]
    
    - name: Pause for confirmation
      pause:
        prompt: |
          
          You are about to upload {{ vault_secrets | length }} secrets to PREPROD Vault cluster.
          
          Press ENTER to continue or Ctrl+C to abort...
      when: not (ansible_check_mode | default(false))
      tags: [always]
  
  roles:
    - vault-secrets
  
  post_tasks:
    - name: Display completion message
      debug:
        msg:
          - "=== SECRETS UPLOAD COMPLETE ==="
          - "Environment: PREPROD"
          - "Total secrets uploaded: {{ vault_secrets | length }}"
          - "Vault Address: {{ vault_addr }}"
          - ""
          - "You can now access secrets via:"
          - "  - Vault UI: https://{{ vault_domain }}"
          - "  - Vault CLI: vault kv get {{ vault_mount_point }}/SECRET_NAME"
          - "  - API: {{ vault_addr }}/v1/{{ vault_mount_point }}/data/SECRET_NAME"
      tags: [always]


