[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
# community.sops.sops — transparent decrypt of *.sops.yml from group_vars/host_vars
vars_plugins_enabled = host_group_vars,community.sops.sops
# In a closed segment this can be relaxed; better to distribute known_hosts:
# host_key_checking = False

[ssh_connection]
pipelining = True
