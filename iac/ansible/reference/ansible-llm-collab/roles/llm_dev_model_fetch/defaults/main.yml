---
# Включить автоматическую загрузку GGUF перед деплоем compose
llm_dev_model_fetch_enabled: true

# Пресет: ключ в llm_dev_model_catalog (задаётся в group_vars группы llm_dev). Пустая строка — ручной режим: llm_dev_model_hf_repo, llm_dev_model_hf_revision, llm_dev_model_hf_files / hf_file, llm_dev_model_filename.

# Принудительно перекачать файл, даже если уже есть
llm_dev_model_force_download: false

# Запрос HF-токена из Vault (тот же ключ, что llm_dev_enable_hf_token); для публичных репозиториев можно выключить
llm_dev_model_fetch_hf_token_from_vault: false

# Если модель gated или нужен лимит API — включить и завести токен в Vault
llm_dev_model_fetch_requires_hf_token: false

# Принудительно скрывать stderr/вывод задачи curl (даже без HF-токена); по умолчанию — нет (удобнее диагностика).
llm_dev_model_fetch_force_curl_no_log: false

# Короткий строковый флаг или набор аргументов curl (например «-4» при проблемном IPv6 до huggingface.co).
llm_dev_model_fetch_curl_extra_args: ""
llm_dev_model_fetch_curl_user_agent: "llm-dev-ansible-fetch/1.0 (curl; GGUF)"

# Каталог метаданных/манифеста рядом с приложением (под {{ llm_dev_app_root }})
llm_dev_sources_dir: "{{ llm_dev_app_root }}/sources"

# Каталог пресетов: переопределить в group_vars группы llm_dev (см. group_vars/llm_dev/main.yml → llm_dev_model_catalog).
llm_dev_model_catalog: {}

# Ручной режим (llm_dev_model_preset пустой)
llm_dev_model_hf_repo: ""
llm_dev_model_hf_revision: "main"
# Один файл или несколько (шардов GGUF); при пустом списке используется только hf_file.
llm_dev_model_hf_files: []
llm_dev_model_hf_file: ""
