# Render expects secret-values.yaml (gitignored). Start from this example.
# Replace CHANGE_ME locally. Production can omit these keys when
# lockbox.production is set and ExternalSecret owns the same Secret name.

s3_cache_proxy:
  aws_access_key_id:
    _default: CHANGE_ME
  aws_secret_access_key:
    _default: CHANGE_ME
