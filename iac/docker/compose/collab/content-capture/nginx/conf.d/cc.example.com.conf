server {
    listen 80;
    server_name cc.example.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS front for the OCR stations
server {
    listen 443 ssl http2;
    server_name cc.example.com;

    # Same TLS material as the app containers
    ssl_certificate     /etc/nginx/ssl/wildcard.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Backends use self-signed Kestrel certs
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;

    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # Station UI appends /ContentCapture/Server again → 404 without this rewrite:
    # /ContentCapture/Server/ContentCapture/Server/IdentityProviders
    location ^~ /ContentCapture/Server/ContentCapture/Server/ {
        rewrite ^/ContentCapture/Server/ContentCapture/Server/(.*)$ /ContentCapture/Server/$1 break;
        proxy_pass https://127.0.0.1:8443;
    }
    # Client typo: Server./ instead of Server/
    location ~ ^/ContentCapture/Server\./ContentCapture/Server/(.*)$ {
        rewrite ^/ContentCapture/Server\./ContentCapture/Server/(.*)$ /ContentCapture/Server/$1 break;
        proxy_pass https://127.0.0.1:8443;
    }
    # WebLogin with a broken prefix
    location ~* ^/contentcapture/server/ContentCapture/Server/(.*)$ {
        rewrite ^ /ContentCapture/Server/$1 break;
        proxy_pass https://127.0.0.1:8443;
    }

    # ==============================================
    # AppServer API (higher priority)
    # One proxy_pass to 127.0.0.1:8443. A second pass to :443 breaks routing → 404.
    # ==============================================
    location /ContentCapture/ {
        proxy_pass https://127.0.0.1:8443/ContentCapture/;
#        proxy_pass https://10.10.1.42:443/ContentCapture/;
    }

    # ==============================================
    # Monitoring
    # ==============================================
    location /monitoring/ {
        proxy_pass https://127.0.0.1:9102/;
    }
    location /monitoring {
        return 301 /monitoring/;
    }

    # ==============================================
    # Verification
    # ==============================================
    location /verification/ {
        proxy_pass https://127.0.0.1:9103/;
    }
    location /verification {
        return 301 /verification/;
    }

    # ==============================================
    # Scanning
    # ==============================================
    location /scanning/ {
        proxy_pass https://127.0.0.1:9104/;
    }
    location /scanning {
        return 301 /scanning/;
    }

    # ==============================================
    # WebLogin — remainder (root)
    # ==============================================
    location / {
        proxy_pass https://127.0.0.1:9101/;
    }
}
