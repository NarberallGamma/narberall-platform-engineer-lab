wallarm_acl_db default {
  wallarm_acl_path /var/lib/nginx/wallarm_acl_default;
  wallarm_acl_mapsize 64m;
}

geo $wallarm_mode_real {
  default block;
  include /etc/nginx/conf_add/wallarm-scanner-ip-list;
  include /etc/nginx/conf_add/wallarm-trusted-infra-ip-list;
}

wallarm_application 2;
wallarm_mode $wallarm_mode_real;
wallarm_parse_websocket off;
wallarm_enable_libdetection off;
proxy_request_buffering off;
wallarm_parse_response off;
wallarm_acl_access_phase off;
wallarm_block_page &/usr/share/nginx/html/wallarm_blocked.html response_code=403 type=attack,acl_ip,acl_source;

server {
  listen 127.0.0.9:80;

  server_name localhost;

  allow 127.0.0.0/8;
  deny all;

  wallarm_mode off;
  access_log off;

  location /wallarm-acl {
    wallarm_acl default;
    wallarm_acl_api on;
  }
}
server {
  listen 127.0.0.8:80;

  server_name localhost;

  allow 127.0.0.0/8;
  deny all;

  wallarm_mode off;
  access_log off;

  location /wallarm-status {
    wallarm_status on;
  }
}
