---
# Revoke GRANTs of an extra account (audit, InfoSec, operations) before deletion.
# No REASSIGN OWNED. Does not touch treasury_user, schema_flyway, or their default privileges.
# DROP ROLE is not run by default (drop_role_after_cleanup=false).
# Run:
#   ansible-playbook drop_db_user.yaml --extra-vars "drop_user=estate_0006 pg_admin_password=..."
#   ansible-playbook drop_db_user.yaml --extra-vars "drop_user=estate_0006 drop_role_after_cleanup=true pg_admin_password=..."
- name: Revoke GRANTs of an extra PostgreSQL role
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    pg_host: "10.10.16.30"
    pg_port: 5432
    pg_admin_user: root
    pg_admin_password: ""

    drop_user: "estate_0006"
    drop_role_after_cleanup: false

    protected_roles:
      - root
      - treasury_user
      - schema_flyway
      - postgres
      - rdsadmin
      - rds_superuser

    default_databases:
      - cryptopro_service
      - hsm
      - keycloak
      - nodes_btc
      - nodes_eth
      - nodes_tron
      - treasury_aml
      - treasury_api
      - treasury_csp
      - treasury_aml
      - treasury_audit
      - treasury_auth_provider
      - treasury_contract
      - treasury_contract_restored_3
      - treasury_csp
      - treasury_notification
      - treasury_onboarding
      - treasury_otp
      - treasury_rates
      - treasury_report
      - treasury_safe_deal_adapter
      - treasury_lp_adapter
      - treasury_treasury_adapter
      - treasury_web

  pre_tasks:
    - name: Check drop_user
      ansible.builtin.fail:
        msg: "Set drop_user in vars or --extra-vars"
      when: drop_user is not defined or (drop_user | default('') | trim | length) == 0

    - name: Refuse to strip dependencies from application and system roles
      ansible.builtin.fail:
        msg: "drop_user={{ drop_user }}: role is in protected_roles, operation refused"
      when: drop_user in protected_roles

    - name: Resolve the database list to process
      ansible.builtin.set_fact:
        db_list: "{{ db_list | default(default_databases) }}"
      when: db_name is not defined or db_name == '' or db_name is none

    - name: Resolve the database list from db_name
      ansible.builtin.set_fact:
        db_list: "{{ [db_name] }}"
      when: db_name is defined and db_name != '' and db_name is not none

    - name: Fail when the database list is empty
      ansible.builtin.fail:
        msg: "ERROR: database list is empty. Set db_name or db_list"
      when: db_list is not defined or db_list | length == 0

    - name: Show parameters
      ansible.builtin.debug:
        msg:
          - "Role to drop: {{ drop_user }}"
          - "REASSIGN OWNED: not used"
          - "DROP ROLE after cleanup: {{ drop_role_after_cleanup | default(false) }}"
          - "Databases ({{ db_list | length }}): {{ db_list | join(', ') }}"

  roles:
    - drop_db_user
