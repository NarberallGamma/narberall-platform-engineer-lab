apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "front-base.fullname" . }}
  labels:
    {{- include "front-base.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "front-base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "front-base.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "front-base.fullname" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or (.Values.emptyDir.enabled) }}
          env:
            - name: EMPTYDIR
              value: {{ .Values.emptyDir.path }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "front-base.fullname" . }}-env
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (.Values.emptyDir.enabled) }}
          volumeMounts:
            {{- if or ( .Values.emptyDir.enabled ) }}
            - name: emptydir
              mountPath: "{{ .Values.emptyDir.path }}"
            {{- end }}
          {{- end }}
      {{- if or (.Values.emptyDir.enabled) }}  
      volumes:
        {{- if or ( .Values.emptyDir.enabled ) }} 
        - name: emptydir
          emptyDir: {}
        {{- end }} 
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
