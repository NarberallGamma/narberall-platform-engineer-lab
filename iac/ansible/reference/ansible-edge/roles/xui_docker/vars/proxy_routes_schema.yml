---
# xui_proxy_routes[] — main targets for outbound on Jump (one inbound vless-proxy-ru :443)
#
# route_suffix: nl | by | …
#   → outbound tag: outbound-vless-<suffix>
#   → main inbound: vless-main-<suffix>, chain UUID: client-main-<main_artifacts_host>
#
# Active route (legacy single mode): xui_routing_outbound_tag
# Per-inbound mode: xui_routing_per_inbound + xui_proxy_routing_rules[]
# Legacy switch without recreating inbound:
#   --tags routing -e xui_routing_outbound_tag=outbound-vless-by
#
# Required in each element:
#   route_suffix, main_artifacts_host (after xui_main on main)
#
# Jump clients: <user>-proxy-ru (xui_route_suffix: ru, xui_client_users in xui_proxy.yml)
#
# Artifacts:
#   artifacts/xui/<proxy>/clients/<email>.txt
#   artifacts/xui/<proxy>/proxy-outbounds.json
#   artifacts/xui/<proxy>/proxy-routing-active.json
