global:
  imageRegistry: ""

image:
  registry: "example.registry/platform/base-images"
  repository: "cloud-ru-status-exporter"
  tag: "1.4"
  pullPolicy: Always
  pullSecrets:
    - registry-pull

namespaceOverride: "monitoring"

replicas: 1
kind: Deployment

service:
  type: ClusterIP
  port: 8087
  targetPort: 8087
  annotations: {}

containerPort: 8087
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

config:
  # platform: service_availability statuses
  platform: "advanced"
  # emergency_platforms: Advanced only (same as service statuses)
  emergency_platforms:
    - advanced
  api_base_url: "https://api.cloud.ru"
  scrape_interval_seconds: 300
  paths:
    configFile: "/etc/cloud-ru-status/config.yml"
    configDir: "/etc/cloud-ru-status"

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

nodeSelector: {}
affinity: {}
tolerations: []

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

restartPolicy: Always
revisionHistoryLimit: 10

serviceMonitor:
  enabled: true
  interval: 60s
  scrapeTimeout: 30s
  labels: {}
  relabelings: []
  metricRelabelings: []
