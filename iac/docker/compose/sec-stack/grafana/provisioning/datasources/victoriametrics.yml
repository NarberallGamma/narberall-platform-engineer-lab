apiVersion: 1
# Datasource was created without an explicit uid — provisioning cannot change
# uid, so it is recreated (no data in the datasource; it is just a pointer).
deleteDatasources:
  - name: VictoriaMetrics
    orgId: 1
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics   # stable uid — dashboards reference it
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      timeInterval: 30s
