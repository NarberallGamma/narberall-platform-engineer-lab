---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: enable_timezone | bool

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  when: enable_apt_basics | bool
  ignore_errors: yes

- name: Upgrade installed packages (dist-upgrade)
  ansible.builtin.apt:
    upgrade: dist
    autoremove: yes
    lock_timeout: "{{ prepare_servers_apt_lock_timeout }}"
  when: enable_apt_upgrade | bool

# Try Ubuntu packages first (software-properties-common is available on Ubuntu)
- name: Install base packages (Ubuntu - software-properties-common)
  ansible.builtin.apt:
    name:
      - software-properties-common
      - net-tools
    state: present
  when: enable_apt_basics | bool
  register: ubuntu_packages_install
  ignore_errors: yes

# If install failed (e.g. on Debian where the package may be missing), use alternative packages
- name: Install base packages (Debian - alternative to software-properties-common)
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - net-tools
    state: present
  when: enable_apt_basics | bool and ubuntu_packages_install.failed | default(false)

- name: Rename host (if host_hostname is set and differs)
  ansible.builtin.hostname:
    name: "{{ host_hostname }}"
  when: enable_hostname_change | bool and host_hostname | length > 0 and host_hostname != ansible_facts['hostname']

- name: Update /etc/hosts after hostname change
  ansible.builtin.include_tasks: hosts_file.yml
  vars:
    hosts_file_hostname: "{{ host_hostname }}"
  when: enable_hostname_change | bool and host_hostname | length > 0

- name: Configure DNS (systemd-resolved) if needed
  ansible.builtin.include_tasks: dns.yml
  when: enable_dns | bool and dns_manage | bool

- name: Prepare packages for domain join
  ansible.builtin.apt:
    name:
      - sssd-ad
      - sssd-tools
      - realmd
      - adcli
    state: present
  when: enable_realm | bool

- name: Join domain (realm)
  ansible.builtin.include_tasks: realm.yml
  when: enable_realm | bool

- name: SSSD and PAM configuration
  ansible.builtin.include_tasks: sssd.yml
  when: enable_sssd | bool

- name: Configure SSH for password authentication of domain users
  ansible.builtin.include_tasks: ssh_pass_auth.yml
  when: enable_ssh_pass_auth | bool

- name: Install EDR agent
  ansible.builtin.include_tasks: agent.yml
  when: enable_agent | bool and ((agent_deb_local | length > 0) or (agent_deb_url | length > 0))

- name: Install and configure Docker
  ansible.builtin.include_tasks: docker.yml
  when: enable_docker | bool
  tags: [docker]

- name: Check enable_docker before NVIDIA GPU
  ansible.builtin.assert:
    that:
      - enable_docker | bool
    fail_msg: "enable_nvidia_gpu: true requires enable_docker: true (Docker is installed before Container Toolkit)."
  when: enable_nvidia_gpu | bool

- name: NVIDIA GPU — driver, Container Toolkit, CDI, docker --gpus check
  ansible.builtin.include_role:
    name: prepare_nvidia_gpu
    apply:
      tags:
        - nvidia_gpu
        - prepare
  tags:
    - nvidia_gpu
    - prepare
  when: enable_nvidia_gpu | bool

- name: Permissions hardening
  ansible.builtin.include_tasks: permissions.yml
  when: enable_hardening | bool and harden_permissions | bool

- name: Change root password (manual or auto-generated into artifacts)
  ansible.builtin.include_tasks: root_password.yml
  when: enable_root_password_change | bool
