# TODO: вписать реальные токены/чаты. Секреты сюда попадают при деплое —
# Ansible шаблонизирует этот файл из SOPS-секретов (см. ansible/roles/sec_stack).
route:
  receiver: default
  group_by: [alertname, site]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Heartbeat уходит отдельно и часто, минуя группировку
    - matchers: [alertname = DeadManSwitch]
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: [severity = critical]
      receiver: critical

receivers:
  - name: default
    # warning и ниже — в рабочий чат, бот sec-stack
    # telegram_configs:
    #   - bot_token: "CHANGE_ME"   # бот sec-stack (@sec-stack_alertmanager_bot или подобное)
    #     chat_id: -1000000000001
    #     parse_mode: HTML

  - name: critical
    # telegram_configs:
    #   - bot_token: "CHANGE_ME"
    #     chat_id: -1000000000001   # чат critical: только critical, без флуда
    #     parse_mode: HTML

  - name: heartbeat
    # Бесплатный вариант: healthchecks.io — алерт DeadManSwitch пингует URL,
    # а healthchecks поднимает тревогу, когда пинги пропали.
    # webhook_configs:
    #   - url: "https://hc-ping.com/<uuid>"
    #     send_resolved: false

inhibit_rules:
  # Если файрвол целиком недоступен — не спамить про его туннели/лицензии
  - source_matchers: [alertname = PanosUnreachable]
    target_matchers: [alertname =~ "Panos(IpsecTunnelDown|IpsecTunnelStale|HAUnhealthyState|SessionUsageHigh)"]
    equal: [firewall]
