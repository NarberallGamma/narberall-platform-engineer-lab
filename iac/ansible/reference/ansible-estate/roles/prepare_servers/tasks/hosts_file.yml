---
# 127.0.1.1 line in /etc/hosts: without it sudo and some utilities fail to resolve hostname after hostnamectl.
- name: "Sync 127.0.1.1 in /etc/hosts ({{ hosts_file_hostname }})"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ hosts_file_hostname }}"
    insertafter: '^127\.0\.0\.1\s'
  when: hosts_file_hostname | default('') | length > 0
