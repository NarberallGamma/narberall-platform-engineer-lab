---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-create-topology-{{ now | unixEpoch }}
  annotations:
    werf.io/weight: "-55"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: {{ .Chart.Name }}-create-topology
    spec:
      restartPolicy: Never

      {{- include "imagePullSecrets" . | indent 6 }}
      {{- include "tolerations" . | indent 6 }}
      {{- include "nodeSelector" . | indent 6 }}
      {{- include "priorityClassName" . | indent 6 }}

      initContainers:
        {{ include "init-rabbitmq" . | indent 8 }}

      containers:
      - name: create-topology
        image: {{ index .Values.werf.image "backend" }}
        command: ["/bin/bash", "-c"]
        args: ["php createTopology.php"]
        envFrom:
          - configMapRef:
              name: {{ $.Chart.Name }}-env
          - secretRef:
              name: {{ $.Chart.Name }}-env