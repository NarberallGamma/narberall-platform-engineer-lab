---
- name: LLM dev application directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop:
    - { path: "{{ llm_dev_app_root }}", mode: "0755" }
    - { path: "{{ llm_dev_models_dir }}", mode: "0755" }

- name: Open WebUI data directory
  ansible.builtin.file:
    path: "{{ llm_dev_app_root }}/open-webui-data"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: llm_dev_open_webui_enabled | bool

- name: Check that the GGUF model file exists
  ansible.builtin.stat:
    path: "{{ llm_dev_models_dir }}/{{ llm_dev_model_filename }}"
  register: llm_dev_model_stat
  when: llm_dev_assert_model_present | bool

- name: Fail if the model is missing
  ansible.builtin.assert:
    that:
      - llm_dev_model_stat.stat.exists | default(false)
      - (llm_dev_model_stat.stat.size | default(0)) > 0
    fail_msg: >-
      Expected file {{ llm_dev_models_dir }}/{{ llm_dev_model_filename }}.
      Enable llm_dev_model_fetch_enabled and a preset in group_vars/llm_dev/main.yml, or place the GGUF by hand;
      for debugging, disable llm_dev_assert_model_present.
  when: llm_dev_assert_model_present | bool
