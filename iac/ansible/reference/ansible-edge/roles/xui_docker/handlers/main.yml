---
- name: Restart xui container
  ansible.builtin.command: "docker restart {{ xui_container_name }}"
  changed_when: true

- name: Restart SSH tunnel socat service
  ansible.builtin.systemd:
    name: "{{ xui_ssh_tunnel_systemd_unit }}.service"
    state: restarted
    daemon_reload: true

- name: Reload sshd
  ansible.builtin.service:
    name: "{{ xui_ssh_tunnel_sshd_service | default('ssh') }}"
    state: reloaded
