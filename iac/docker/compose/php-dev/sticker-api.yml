services:
  php_api:
    build:
      context: ../../images/apps/php-api
      dockerfile: Dockerfile
    container_name: php_api
    restart: unless-stopped
    environment:
      PHP_IDE_CONFIG: "serverName=ShopApi"
    volumes:
      - ../../images/apps/php-api/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      - /path/to/composer-cache:/root/.composer/cache:delegated
      - /path/to/app:/app:delegated
    depends_on:
      - rabbit
      - postgres

  nginx_php:
    image: nginx:stable-alpine
    container_name: nginx_php_api
    restart: unless-stopped
    ports:
      - '${HOST_PORT_NGINX}:80'
    volumes:
      - /path/to/app:/app
      - ../../images/apps/php-api/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php_api

  rabbit:
    image: rabbitmq:4.0.4-management-alpine
    container_name: rabbit_api
    restart: unless-stopped
    ports:
      - '${HOST_PORT_RABBITMQ}:5672'
    environment:
      RABBITMQ_DEFAULT_USER: CHANGE_ME
      RABBITMQ_DEFAULT_PASS: CHANGE_ME

  postgres:
    image: postgres:15
    container_name: postgres_api
    restart: unless-stopped
    tty: true
    ports:
      - '${HOST_PORT_POSTGRES}:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      PGPASSWORD: 'CHANGE_ME'
      POSTGRES_DB: 'sticker_api'
      POSTGRES_USER: 'sticker_api'
      POSTGRES_PASSWORD: 'CHANGE_ME'

  postgres_autotest:
    image: postgres:15
    container_name: postgres_autotest_api
    restart: unless-stopped
    tty: true
    ports:
      - '${HOST_PORT_POSTGRES_TEST}:5432'
    volumes:
      - postgres-autotests:/var/lib/postgresql/data
    environment:
      PGPASSWORD: 'CHANGE_ME'
      POSTGRES_DB: 'sticker_api_autotest'
      POSTGRES_USER: 'sticker_api_autotest'
      POSTGRES_PASSWORD: 'CHANGE_ME'

volumes:
  postgres:
  postgres-autotests: