# vmagent scrape config for the site-a location.
# For other locations (site-b, on-prem) — a copy with a different
# external_labels.site and its own targets; remote_write points at the
# central VictoriaMetrics.

global:
  scrape_interval: 30s
  external_labels:
    site: site-a

scrape_configs:
  # --- stack self-monitoring --------------------------------------------------
  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]
  - job_name: vmagent
    static_configs:
      - targets: ["vmagent:8429"]
  - job_name: vmalert
    static_configs:
      - targets: ["vmalert:8880"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # --- Palo Alto (via panos-exporter, multi-target) ---------------------------
  # targets — firewall names from exporters/panos/config.yml, not IPs.
  - job_name: panos
    scrape_interval: 60s
    # exporter polls the PAN-OS API with a 15s timeout per call — the default
    # 10s scrape is not enough, especially while firewalls are unreachable
    scrape_timeout: 50s
    metrics_path: /metrics
    static_configs:
      - targets:
          - ngfw01-site-a
          - ngfw02-site-a
          # - ngfw-test-site-a   # broken, see exporters/panos/config.yml
          - ngfw-project-b
          - ngfw-project-c
          - ngfw01-project-d
          - ngfw02-project-d
          - ngfw01-project-e
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: firewall
      - target_label: __address__
        replacement: panos-exporter:9654

  # --- EDR coverage -----------------------------------------------------------
  # Exporter computes coverage in the background every 6 hours and serves the
  # last snapshot, so a regular frequent scrape does not load it.
  - job_name: edr
    scrape_interval: 60s
    static_configs:
      - targets: ["edr-exporter:9655"]

  # --- Teleport ---------------------------------------------------------------
  # The Teleport VM must have the diagnostic endpoint enabled:
  # teleport start --diag-addr=0.0.0.0:3000 (see README). Until then the target is down.
  - job_name: teleport
    static_configs:
      - targets: ["teleport.example.com:3000"]
        labels:
          service: teleport

  # --- node_exporter on infrastructure VMs ------------------------------------
  # TODO: uncomment with real IPs (Teleport VM + 5 db VMs), after rolling out
  # node_exporter with the ansible role.
  # - job_name: node
  #   static_configs:
  #     - targets: ["<TELEPORT_IP>:9100"]
  #       labels:
  #         role: teleport
  #     - targets: ["<DB1_IP>:9100", "<DB2_IP>:9100", "<DB3_IP>:9100", "<DB4_IP>:9100", "<DB5_IP>:9100"]
  #       labels:
  #         role: teleport-db

  # --- TLS endpoints: availability + certificate expiry -----------------------
  - job_name: blackbox-tls
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://git.example.com              # GitLab — first real TLS target
          - https://vault.example.com    # Vaultwarden (passwords)
          # TODO: Teleport proxy, firewall web UIs, GP portals, etc.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: probe_target
      - target_label: __address__
        replacement: blackbox:9115

  # --- ICMP: basic reachability -----------------------------------------------
  # Ping FROM THIS VM. For pings "from VM A to VM B" blackbox is placed on VM A —
  # that is the next step.
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 10.10.1.20   # GitLab; TODO: firewall mgmt IPs and other critical addresses
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: probe_target
      - target_label: __address__
        replacement: blackbox:9115
