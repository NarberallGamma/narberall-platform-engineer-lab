apiVersion: v1
kind: Service
metadata:
  name: "{{ include "console.fullname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: 9090
  - name: https
    port: 9443
  selector:
    {{- include "console.selectorLabels" . | nindent 4 }}
