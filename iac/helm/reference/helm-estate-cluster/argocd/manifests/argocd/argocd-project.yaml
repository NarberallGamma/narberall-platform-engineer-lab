apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: "Platform applications (GitOps). Infra stays on CI Helm."

  sourceRepos:
    - 'https://git.example.com/*'
    - 'https://argoproj.github.io/argo-helm'

  destinations:
  - namespace: '*'
    server: https://203.0.113.10:6443

  clusterResourceWhitelist:
  - group: '*'
    kind: '*'

  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'

  syncWindows:
  - kind: allow
    schedule: '0 0 * * *'
    duration: 24h
