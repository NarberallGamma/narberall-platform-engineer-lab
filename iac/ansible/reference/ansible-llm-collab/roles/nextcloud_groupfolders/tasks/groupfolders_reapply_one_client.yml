---
# One client in the reapply loop: set client_name, load the matrix, expand paths, apply permissions (no MKCOL).
# Called from groupfolders_reapply_all_clients.yml with vars: _current_client.

- name: Set the current client name for permission apply
  ansible.builtin.set_fact:
    client_name: "{{ _current_client }}"

- name: Prepare the folder list from the matrix for client_name
  ansible.builtin.include_tasks: groupfolders_prepare_folders_flat_for_client.yml

- name: Apply matrix permissions (root + per path) for client {{ _current_client }}
  ansible.builtin.include_tasks: groupfolders_apply_permissions.yml
