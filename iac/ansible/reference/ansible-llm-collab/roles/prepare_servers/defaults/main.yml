---
# Defaults for the prepare_servers role
# These values can be overridden in group_vars, host_vars, or inventory

# Wait for apt/dpkg lock during dist-upgrade and Docker install (seconds). ansible.builtin.apt defaults to 60.
prepare_servers_apt_lock_timeout: 600

# Docker settings
# If unset, the standard directory /var/lib/docker is used
docker_data_dir: "/var/lib/docker"

# containerd data directory (layers/content, often tens of GiB). Default is /var/lib/containerd on the root volume;
# to place it on the same disk as docker_data_dir — set e.g. /docker/containerd (see group_vars prepare_servers).
containerd_data_dir: "/var/lib/containerd"

# Official Docker repository (download.docker.com)
docker_apt_channel: stable
# Remove docker.io / docker-compose packages from the distro repository before installing docker-ce
docker_remove_distro_packages: true
# Distro packages only; without containerd/runc — otherwise a rerun after docker-ce can conflict.
# If apt reports a conflict on the first docker-ce install — remove packages manually per Docker docs.
docker_distro_packages_remove:
  - docker.io
  - docker-doc
  - docker-compose
  - docker-compose-v2
  - podman-docker
