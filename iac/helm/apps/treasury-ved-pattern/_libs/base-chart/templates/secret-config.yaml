{{- if .Values.keystore.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  name: {{ include "base-chart.fullname" . }}-jcs-secret
  labels:
    {{- include "base-chart.labels" . | nindent 4 }}
data:
  {{ .Values.keystore.filename }}: {{ .Values.keystore.data}}
{{- end }}

