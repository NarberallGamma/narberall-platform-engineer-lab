apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: collector
spec:
  config:
    exporters:
      kafka:
        brokers:
        {{- range index .Values.collector.kafka.brokers .Values.werf.env }}
        - {{ . }}
        {{- end }}
        encoding: {{ .Values.collector.kafka.encoding }}
        topic: {{ .Values.collector.kafka.topic }}
    processors:
      transform/clean_logs:
        log_statements:
        - context: log
          statements:
          - set(body, ParseJSON(body))
          - keep_keys(body, {{ .Values.collector.filter.keepKeys | toJson }})
          - set(attributes, {})
          - delete_record if not body.endpoint contains {{ .Values.collector.filter.endpointContains | quote }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    service:
      pipelines:
        logs:
          exporters:
          - kafka
          processors:
          - transform/clean_logs
          receivers:
          - otlp
      telemetry:
        logs:
          level: debug
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
  mode: {{ .Values.collector.mode }}
  nodeSelector:
    {{- toYaml .Values.collector.nodeSelector | nindent 4 }}
  replicas: {{ .Values.collector.replicas }}
  resources:
    {{- toYaml .Values.collector.resources | nindent 4 }}
  tolerations:
    {{- toYaml .Values.collector.tolerations | nindent 2 }}
  upgradeStrategy: {{ .Values.collector.upgradeStrategy }}
