---
- name: Stack directory
  ansible.builtin.file:
    path: "{{ sec_stack_dir }}"
    state: directory
    mode: "0755"

- name: Deploy stack/ (compose + configs + exporters)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../stack/"
    dest: "{{ sec_stack_dir }}/"
    mode: preserve
  register: sec_stack_files
  notify: Restart stack services with static configs

- name: edr-exporter data directory
  # Lives outside stack/ in the repo: collectors (in the container, as nobody)
  # write CSV dumps and the report here. recurse + owner nobody so the container
  # can OVERWRITE old files (otherwise PermissionError on files owned by others).
  # Symbolic mode: directories get X (0775), files do not (0664).
  ansible.builtin.file:
    path: "{{ sec_stack_dir }}/exporters/edr/data"
    state: directory
    owner: nobody
    group: "{{ ansible_user }}"
    mode: "u=rwX,g=rwX,o=rX"
    recurse: true

- name: Deploy exclusions.yaml for edr-exporter
  # Prod coverage config lives here (a copy in cybersec/edr-coverage is for
  # laptop runs). Changes go through an MR, not by hand on the VM.
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../stack/exporters/edr/exclusions.yaml"
    dest: "{{ sec_stack_dir }}/exporters/edr/data/exclusions.yaml"
    mode: "0644"

- name: Deploy aliases.yaml for edr-exporter
  # Manual "host -> agent" mappings (Macs that register under a local name).
  # Optional for the exporter, but always present here —
  # empty companies: {} behaves the same as a missing file.
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../stack/exporters/edr/aliases.yaml"
    dest: "{{ sec_stack_dir }}/exporters/edr/data/aliases.yaml"
    mode: "0644"

- name: edr-exporter collector config directory
  # Secret AD/cloud/edr-vendor configs. Separate from data/: mounted into
  # the container read-only. 0750 + deploy-user group, owner nobody
  # (the container runs as nobody and reads the configs).
  ansible.builtin.file:
    path: "{{ sec_stack_dir }}/exporters/edr/config"
    state: directory
    owner: nobody
    group: "{{ ansible_user }}"
    mode: "0750"

- name: Render collector configs from SOPS
  # Each sec_stack_edr_configs key (filename -> contents) is written to
  # /config. A source without a config is skipped by the exporter (not an error),
  # so only sources that have credentials need to be placed here.
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ sec_stack_dir }}/exporters/edr/config/{{ item.key }}"
    owner: nobody
    group: "{{ ansible_user }}"
    mode: "0640"
  loop: "{{ sec_stack_edr_configs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  notify: Restart edr-exporter

- name: Generate alertmanager.yml from secrets
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ sec_stack_dir }}/alertmanager/alertmanager.yml"
    # the alertmanager container does not read the config as root — 0600 breaks it
    mode: "0644"
  notify: Restart stack services with static configs

- name: Generate .env from secrets
  ansible.builtin.template:
    src: env.j2
    dest: "{{ sec_stack_dir }}/.env"
    mode: "0600"
  register: sec_stack_env_file

- name: Log in to the GitLab registry (edr-exporter image)
  # --password-stdin, not as an argument: otherwise the token shows in the process list
  ansible.builtin.command:
    cmd: docker login --username {{ sec_stack_registry_user | quote }} --password-stdin {{ sec_stack_registry_host | quote }}
    stdin: "{{ sec_stack_registry_token }}"
  when: sec_stack_registry_token | length > 0
  changed_when: false
  no_log: true

- name: Bring up / update the stack
  ansible.builtin.command:
    cmd: docker compose up -d --build --remove-orphans
    chdir: "{{ sec_stack_dir }}"
  register: sec_stack_compose_result
  changed_when: sec_stack_files.changed or sec_stack_env_file.changed
