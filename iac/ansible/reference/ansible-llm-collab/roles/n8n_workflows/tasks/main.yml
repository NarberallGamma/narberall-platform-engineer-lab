---
# Role n8n_workflows: sync workflows from the repo into n8n via REST API.
# Expects: n8n_api_key (role n8n_init), n8n_base_url, n8n_workflows_to_sync.
# For each entry in n8n_workflows_to_sync the JSON is loaded from files/n8n_workflows/workflows/<name>.json,
# the workflow is looked up in n8n by name and created (POST) or updated (PUT).

- name: Assert n8n_base_url
  ansible.builtin.assert:
    that: n8n_base_url is defined and n8n_base_url | length > 0
    fail_msg: 'Set n8n_base_url in group_vars (e.g. https://n8n.x.example.com).'
  tags: always

- name: Sync workflows into n8n (sync_workflows)
  ansible.builtin.include_tasks: sync_workflows.yml
  loop: "{{ n8n_workflows_to_sync }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _workflow_key: "{{ item }}"
  when: n8n_workflows_to_sync | length > 0
