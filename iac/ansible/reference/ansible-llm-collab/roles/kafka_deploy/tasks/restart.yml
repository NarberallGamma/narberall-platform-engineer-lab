---
# Only the explicit kafka_restart tag (together with never — not in a general run without tags)
- name: Force-recreate Kafka containers
  community.docker.docker_compose_v2:
    project_src: "{{ kafka_app_root }}"
    project_name: "{{ kafka_compose_project_name }}"
    state: present
    recreate: always
  tags: [never, kafka_restart]
