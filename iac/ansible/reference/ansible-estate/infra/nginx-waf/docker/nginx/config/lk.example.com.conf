upstream k8s-ift {
    server 10.10.14.112:443 max_fails=3 fail_timeout=2m;
    server 10.10.14.85:443 max_fails=3 fail_timeout=2m;
    server 10.10.14.15:443 max_fails=3 fail_timeout=2m;    
}

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/lk.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/lk.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/lk.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name lk.example.com;
    listen 80;

    return 301 https://lk.example.com;

}

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/lk.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/lk.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/lk.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name lk.example.com;
    listen 443 ssl;
    ssl_certificate /docker/certgen/data/example.com.crt;
    ssl_certificate_key /docker/certgen/data/example.com.key;

    include /etc/nginx/conf_add/wallarm-blocked-page;
    client_max_body_size 100m;
 
    location / {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host lk.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
	#ws
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";	
    }
}
