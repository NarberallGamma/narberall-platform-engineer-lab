{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.clusterSecretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.clusterSecretStore.name }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vaultAddress | quote }}
      path: {{ .Values.externalSecrets.vaultPath | quote }}
      version: {{ .Values.externalSecrets.vaultKVVersion | quote }}
      {{- with .Values.externalSecrets.vaultNamespace }}
      namespace: {{ . | quote }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ .Values.externalSecrets.auth.mountPath | quote }}
          role: {{ .Values.externalSecrets.auth.role | quote }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount.name }}
            namespace: {{ include "vault.namespace" . }}
{{- end }}
