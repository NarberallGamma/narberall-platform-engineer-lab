# Run (one client): ./scripts/run/run_nextcloud_groupfolders.sh --profile nextcloud-dev "Example Client LLC"  (or: --limit nextcloud-dev.example.com — without a profile the map below is used by inventory_hostname).
# Parallelism: ./scripts/run/run_nextcloud_groupfolders.sh --profile nextcloud-dev --mkcol-threads 4 --occ-threads 4 "Example Client LLC" (without flags — nextcloud_concurrency_* from this file).
# or: ansible-playbook ... --limit … -e "client_name=Example Client LLC"
# Run script: --profile nextcloud-dev|nextcloud-prod|regul (auto-host, see nextcloud_profile_default_inventory_host) or --limit only — then the profile comes from nextcloud_matrix_profile_by_host below.
# “All clients” mode: --all-clients (ACL only) or --all-clients-create (MKCOL+ACL).
# Group folder name, WebDAV, matrix, occ container — in nextcloud_profile_map (the profile selects the matrix key: nextcloud-dev | nextcloud-prod | regul).

# Matrix profile by inventory_hostname — for the playbook (--limit sets the SSH node; the key is the inventory host name).
# Regul: inventory host app-02.example.com ([nextcloud_regul] in hosts.ini). Prod: nextcloud-prod-oc3.example.com ([nextcloud_prod_cluster], backup 10.10.3.20).
# To override mappings — -e or the run script --profile without --limit.
nextcloud_matrix_profile_by_host:
  nextcloud-dev.example.com: nextcloud-dev
  nextcloud-prod-oc3.example.com: nextcloud-prod
  app-02.example.com: regul

# Default inventory host for --profile without --limit (must match the resolve block in run_nextcloud_groupfolders.sh).
nextcloud_profile_default_inventory_host:
  nextcloud-dev: nextcloud-dev.example.com
  nextcloud-prod: nextcloud-prod-oc3.example.com
  regul: app-02.example.com

# Profile descriptions (keys match values in nextcloud_matrix_profile_by_host).
nextcloud_profile_map:
  nextcloud-dev:
    # Root group folder name in Nextcloud.
    nextcloud_groupfolder_name: "Clients INTFS"
    # WebDAV URL to the group folder root.
    # DEV: https://demo-nextcloud.x.example.com/remote.php/webdav/Clients%20INTFS/
    # PROD (other stand): https://nextcloud.x.example.com/remote.php/webdav/Clients%20INTFS/
    nextcloud_webdav_url: "https://demo-nextcloud.x.example.com/remote.php/webdav/Clients%20INTFS"
    # Nextcloud container name on the host for occ.
    nextcloud_container_name: "app-server"
    # Path to the dev matrix (Clients INTFS, nextcloud-dev profile): group_vars/env/matrix_nextcloud_dev_cloud_platform.yaml.
    nextcloud_matrix_file: "{{ playbook_dir }}/../group_vars/env/matrix_nextcloud_dev_cloud_platform.yaml"
    # Field names in the Ubuntu_servers secret (KV keys, not values).
    nextcloud_vault_key_webdav_user: "ansible_dev_nextcloud_webdav_user"
    nextcloud_vault_key_webdav_password: "ansible_dev_nextcloud_webdav_password"
  nextcloud-prod:
    # Root group folder name in Nextcloud (same as dev — Clients INTFS).
    nextcloud_groupfolder_name: "Clients INTFS"
    # PROD: https://nextcloud.x.example.com/settings/users
    nextcloud_webdav_url: "https://nextcloud.x.example.com/remote.php/webdav/Clients%20INTFS"
    # Nextcloud container name on the host for occ (same as dev; override via host_vars for prod if needed).
    nextcloud_container_name: "app-server"
    # Matrix: copy of dev, file matrix_nextcloud_prod_cloud_platform.yaml (keep in sync with dev when the matrix changes).
    nextcloud_matrix_file: "{{ playbook_dir }}/../group_vars/env/matrix_nextcloud_prod_cloud_platform.yaml"
    nextcloud_vault_key_webdav_user: "ansible_prod_nextcloud_webdav_user"
    nextcloud_vault_key_webdav_password: "ansible_prod_nextcloud_webdav_password"
  regul:
    # Root group folder name in Nextcloud (as in UI / groupfolders:list; on the stand — “Regul clients”).
    nextcloud_groupfolder_name: "Regul clients"
    # Path to the Regul matrix.
    nextcloud_matrix_file: "{{ playbook_dir }}/../group_vars/env/matrix_regul_cloud_platform.yaml"
    # WebDAV URL to the group folder root (path segment = folder name with spaces → %20).
    nextcloud_webdav_url: "https://cloud.example.com/remote.php/webdav/Regul%20clients"
    # Nextcloud container name on the host for occ.
    nextcloud_container_name: "NC_CLIENTS_APP_SERVER"
    # Field names in the Ubuntu_servers secret (KV keys, not values).
    nextcloud_vault_key_webdav_user: "ansible_regul_nextcloud_webdav_user"
    nextcloud_vault_key_webdav_password: "ansible_regul_nextcloud_webdav_password"

# --- Re-apply permissions for all existing clients (after an LDAP reset, etc.) ---
# Enabled mode: lists client folders from WebDAV (groupfolder root), prints the list,
# then sequentially applies matrix permissions for each client (--all-clients / nextcloud_reapply_all_clients_enabled).
# MKCOL-for-all option (--all-clients-create / nextcloud_reapply_all_clients_mkcol_enabled): before ACL for each client —
# idempotent WebDAV MKCOL along matrix paths (new folders appear; existing ones are not deleted).
# Off by default (false).
nextcloud_reapply_all_clients_enabled: false
# Only together with nextcloud_reapply_all_clients_enabled: for each listed client — MKCOL, then the shared occ logic.
nextcloud_reapply_all_clients_mkcol_enabled: false
# Concurrent operations in a batch (async on one host): WebDAV MKCOL and occ groupfolders:permissions. Role defaults: 1; here for platform stands — 4.
nextcloud_concurrency_mkcol: 4
nextcloud_concurrency_occ: 4
# --- Replay ACL from the matrix for one client_name only (MKCOL is not run) — targeted testing ---
nextcloud_reapply_permissions_only: false
# --- LDAP group cache reset (prep for correct group names from AD) ---
# Enabled mode only resets the listed groups (occ ldap:reset-group). Checks and init
# (other roles/playbook) still run, but folder hierarchy creation and matrix ACL
# are not applied in this run — a separate prep mode. Off by default (no).
nextcloud_ldap_reset_groups_enabled: false
# Group names to reset (old names in parentheses in the UI: INTFS Clients Admin (FS Admin users), etc.).
# After reset, the next AD sync creates the groups under the correct names (INTFS Clients *).
nextcloud_ldap_reset_groups:
  - "FS Admin users"
  - "FS Accounting users"
  - "FS Corp users"
  - "FS HR users"
  - "FS Payroll users"
  - "FS Legal Users"
# --- Per-client exceptions: permissions “same as root” ---
# For the listed clients the detailed path matrix is not applied: one path (the client folder name)
# with the same groups as the Clients INTFS root (access and write for all). Subfolders are not enumerated.
# Example: "01 General information" — no Internal exchange/File exchange structure, so access is given to all.
nextcloud_root_like_clients:
  - "01 General information"
  - "0_General information"
# ---

# Whether to apply permissions on the root group folder (occ groupfolders:group) for all groups from the matrix.
# Needed for the group folder to be visible; detailed per-path grants — via nextcloud_apply_per_folder_permissions.
nextcloud_apply_root_groups: false
# Whether to apply per-folder permissions (occ groupfolders:permissions path + view/edit from the matrix).
nextcloud_apply_per_folder_permissions: true
# Per matrix/wiki: view = +read; edit = +read +write +create +delete and an explicit share deny (-- -share), as in the UI of existing clients.
# In occ one allow line after --group=…: first “+…” grants, then “--”, then denials (see occ groupfolders:permissions docs).
nextcloud_occ_edit_permissions: "+read +write +create +delete -- -share"
# “One RO for all matrix groups” (no separate LDAP Cloud … RO in AD): the matrix view uses marker __NC_MATRIX_RO_ALL__;
# Ansible assigns every group from the matrix view/edit union that is not edit on that row, RO only in the UI (+read and deny write/create/delete/share).
nextcloud_occ_ro_permissions: "+read -- -write -create -delete -share"
# Ordinary view — explicit group list in YAML (not the marker): +read only (no separate deny line; to match RO — switch to the marker).
nextcloud_occ_view_permissions: "+read"
nextcloud_matrix_ro_sentinel: "__NC_MATRIX_RO_ALL__"
# Access deny (occ after “--”). Explicit deny_on_l4_children rules in the matrix still apply; plus auto for other paths (see below).
# e.g. “-read -write -create -delete -share”. For deny rows in the matrix, if perms is unset, nextcloud_occ_deny_permissions is used.
nextcloud_occ_deny_permissions: "-read -write -create -delete -share"
# For every group in the matrix union that has no edit or view row on the given path (and is not implied RO via __NC_MATRIX_RO_ALL__),
# assign an explicit deny — as in prod, so access is not inherited from the parent for “extra” groups (IntSecurity only for two groups, etc.).
nextcloud_occ_auto_deny_unlisted_matrix_groups: true
# Root permissions for occ groupfolders:group: words separated by space — read, write, share, delete
# Empty = read only. On the root, read+write is enough for visibility; detail is per path.
nextcloud_occ_group_permission: "read write share delete"

# Vault: mount and secret path only. Key names in the Ubuntu_servers secret — in nextcloud_profile_map per profile (-e if needed).
# UI: Secrets → platform-infra → Ubuntu_servers. Key selection by host — nextcloud_matrix_profile_by_host + playbook pre_tasks before nextcloud_init.
nextcloud_vault_mount_point: "platform-infra"
nextcloud_vault_path: "Ubuntu_servers"

# WebDAV credentials: pulled from Vault by default. If set here (or in the playbook / -e / CI Variables) — Vault is not called.
# nextcloud_webdav_user: ""
# nextcloud_webdav_password: ""
# For Vault access (token with read on Ubuntu_servers) set in the environment when running the playbook (including repo CI Variables):
#   VAULT_ADDR=https://vault.x.example.com
#   VAULT_TOKEN=<token with read access to the Ubuntu_servers secret>
