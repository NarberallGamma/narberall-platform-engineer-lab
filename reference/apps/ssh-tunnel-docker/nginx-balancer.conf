# Load dynamic modules (e.g. stream for Alpine nginx-mod-stream)
include /etc/nginx/modules/*.conf;
worker_processes 1;
events { worker_connections 1024; }
# TCP balancer: 10808 -> round-robin to 10809..10814 (6 tunnels)
stream {
    upstream tunnels {
        server 127.0.0.1:10809;
        server 127.0.0.1:10810;
        server 127.0.0.1:10811;
        server 127.0.0.1:10812;
        server 127.0.0.1:10813;
        server 127.0.0.1:10814;
    }
    server {
        listen 10808;
        proxy_pass tunnels;
        proxy_connect_timeout 10s;
        proxy_timeout 24h;
        proxy_socket_keepalive on;
    }
}
