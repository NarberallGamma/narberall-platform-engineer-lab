# Edge nginx: log directory bind and a custom nginx.conf (host network).
services:
  nginx:
    image: nginx:1.27.4
    restart: always
    network_mode: host
    volumes:
       - ./config:/etc/nginx/conf.d
       - ./certs:/etc/nginx/certs
       - ./logs:/var/log/nginx
       - ./nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      options:
        max-size: '50m'
        max-file: '1'
