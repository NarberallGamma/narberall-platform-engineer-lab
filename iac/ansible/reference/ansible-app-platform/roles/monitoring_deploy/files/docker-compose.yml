version: '2.1'

services:

  'prometheus':
      image: 'mirror.gcr.io/prom/prometheus:v2.54.1'
      restart: always
        #ports: ['172.17.0.1:9090:9090']
      ports: ['9090:9090']        
      command:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=1d
        - --web.console.libraries=/usr/share/prometheus/console_libraries
        - --web.console.templates=/usr/share/prometheus/consoles
        - --web.enable-lifecycle
        - --web.config.file=/etc/prometheus/web.yml  
        - --web.enable-remote-write-receiver
      volumes:
        - ./config:/etc/prometheus
        - ./data:/prometheus
      networks:
        - prometheus-net

  alertmanager:
    image: mirror.gcr.io/prom/alertmanager:v0.27.0
    restart: always
    networks:
        - prometheus-net
    volumes:
      - ./alertmanager/:/etc/alertmanager/
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.118.0
    restart: always
    command:
      - -retentionPeriod=30d
      - -dedup.minScrapeInterval=1m
      - -loggerLevel=WARN
      - -storageDataPath=/victoria-metrics-data
    volumes:
      - /docker/victoriametrics/data:/victoria-metrics-data
    ports: ['8428:8428']
    networks:
      - prometheus-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    restart: always
    ports: ['8080:8080']
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - prometheus-net

  kube-state-metrics:
    image: mirror.gcr.io/bitnami/kube-state-metrics:2.13.0
    restart: always
    entrypoint: kube-state-metrics --port=8080 --telemetry-port=8081 --kubeconfig=/data/dev-01-kubeconfig.yaml --apiserver=https://10.10.6.145:5443
    volumes:
    - ./data:/data
    networks:
      - prometheus-net

networks:
  prometheus-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.213.0/24

