---
# Role: create schema_flyway, grant schema privileges, and split schema_flyway (DDL) / treasury_user (DML).
# Requires: community.postgresql, community.general.

# community.postgresql needs psycopg2 in Python; on Alpine use the py3-psycopg2 package (apk), not pip (PEP 668).
# Image registry.../base-images/ansible: see also the Dockerfile (py3-psycopg2 in RUN apk).
- name: Install py3-psycopg2 for community.postgresql modules
  community.general.apk:
    name: py3-psycopg2
    state: present

- name: Create the schema_flyway user
  community.postgresql.postgresql_user:
    name: "{{ schema_flyway }}"
    password: "{{ schema_flyway_password }}"
    state: present
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres

- name: Grant REPLICATION to all app users (for Debezium / logical replication)
  community.postgresql.postgresql_query:
    query: "ALTER ROLE {{ item }} WITH REPLICATION;"
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres
  loop: "{{ app_users }}"
  ignore_errors: true

- name: Grant schema_flyway CONNECT on each database
  community.postgresql.postgresql_query:
    query: "GRANT CONNECT ON DATABASE {{ item }} TO {{ schema_flyway }};"
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres
  loop: "{{ db_list }}"

# Flyway 2.13 (treasury_csp, treasury_api, and others): CREATE SCHEMA kafka_idempotent_consumer /
# kafka_transactional_outbox requires CREATE at the database level, not only USAGE/CREATE in public.
- name: Grant schema_flyway CREATE on each database (new Flyway schemas)
  community.postgresql.postgresql_query:
    query: "GRANT CREATE ON DATABASE {{ item }} TO {{ schema_flyway }};"
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres
  loop: "{{ db_list }}"

- name: Transfer ownership of user schemas (root) to schema_flyway
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE r RECORD;
      BEGIN
        FOR r IN
          SELECT n.nspname
          FROM pg_catalog.pg_namespace n
          JOIN pg_catalog.pg_roles rl ON n.nspowner = rl.oid
          WHERE n.nspname NOT LIKE 'pg_%'
            AND n.nspname != 'information_schema'
            AND rl.rolname = '{{ pg_admin_user }}'
        LOOP
          EXECUTE format('ALTER SCHEMA %I OWNER TO %I', r.nspname, '{{ schema_flyway }}');
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

- name: Grant schema_flyway privileges on public and change schema owner
  community.postgresql.postgresql_query:
    query: |
      GRANT USAGE, CREATE ON SCHEMA public TO {{ schema_flyway }};
      ALTER SCHEMA public OWNER TO {{ schema_flyway }};
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

- name: Transfer ownership of tables in public to schema_flyway
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE r RECORD;
      BEGIN
        FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public')
        LOOP
          EXECUTE format('ALTER TABLE public.%I OWNER TO %I', r.tablename, '{{ schema_flyway }}');
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

- name: Transfer ownership of sequences in public to schema_flyway
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE r RECORD;
      BEGIN
        FOR r IN (SELECT sequencename FROM pg_sequences WHERE schemaname = 'public')
        LOOP
          EXECUTE format('ALTER SEQUENCE public.%I OWNER TO %I', r.sequencename, '{{ schema_flyway }}');
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

# Flyway 2.13 (treasury_api): ALTER TYPE network_name ADD VALUE requires ownership of the enum type.
- name: Transfer ownership of enum/domain types in public to schema_flyway (root types)
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE r RECORD;
      BEGIN
        FOR r IN
          SELECT t.typname
          FROM pg_catalog.pg_type t
          JOIN pg_catalog.pg_namespace n ON t.typnamespace = n.oid
          JOIN pg_catalog.pg_roles rl ON t.typowner = rl.oid
          WHERE n.nspname = 'public'
            AND t.typtype IN ('e', 'd')
            AND rl.rolname = '{{ pg_admin_user }}'
        LOOP
          BEGIN
            EXECUTE format('ALTER TYPE %I.%I OWNER TO %I', 'public', r.typname, '{{ schema_flyway }}');
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'Skipped type public.%', r.typname;
          END;
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

# afterMigrate.sql runs CREATE/ALTER FUNCTION — the owner must be schema_flyway.
# Root can transfer only functions it owns (root). The rest cannot be transferred by root.
- name: Transfer ownership of functions in public to schema_flyway (root-owned functions only)
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE r RECORD;
      BEGIN
        FOR r IN
          SELECT n.nspname, p.proname, pg_catalog.pg_get_function_identity_arguments(p.oid) AS args
          FROM pg_catalog.pg_proc p
          JOIN pg_catalog.pg_namespace n ON p.pronamespace = n.oid
          JOIN pg_catalog.pg_roles rl ON p.proowner = rl.oid
          WHERE n.nspname = 'public' AND rl.rolname = '{{ pg_admin_user }}'
        LOOP
          BEGIN
            EXECUTE format('ALTER FUNCTION %I.%I(%s) OWNER TO %I', r.nspname, r.proname, r.args, '{{ schema_flyway }}');
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'Skipped %.%(%)', r.nspname, r.proname, r.args;
          END;
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"
  ignore_errors: true

# For treasury_user to run ALTER FUNCTION ... OWNER TO schema_flyway, it must be a member of the schema_flyway role (PostgreSQL requirement). Membership is cluster-level.
- name: Temporarily grant treasury_user membership in schema_flyway (to transfer function ownership)
  community.postgresql.postgresql_query:
    query: "GRANT {{ schema_flyway }} TO {{ treasury_user }}"
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres

# Functions owned by treasury_user (create_new_partition, set_tx_report_sequence, and similar) cannot be transferred by root. Run as treasury_user so treasury_user hands its functions to schema_flyway.
- name: Transfer ownership of treasury_user functions in public to schema_flyway (as treasury_user)
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE r RECORD;
      BEGIN
        FOR r IN
          SELECT n.nspname, p.proname, pg_catalog.pg_get_function_identity_arguments(p.oid) AS args
          FROM pg_catalog.pg_proc p
          JOIN pg_catalog.pg_namespace n ON p.pronamespace = n.oid
          JOIN pg_catalog.pg_roles rl ON p.proowner = rl.oid
          WHERE n.nspname = 'public' AND rl.rolname = '{{ treasury_user }}'
        LOOP
          EXECUTE format('ALTER FUNCTION %I.%I(%s) OWNER TO %I', r.nspname, r.proname, r.args, '{{ schema_flyway }}');
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ treasury_user }}"
    login_password: "{{ treasury_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

- name: Transfer ownership of treasury_user enum/domain types in public to schema_flyway (as treasury_user)
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE r RECORD;
      BEGIN
        FOR r IN
          SELECT t.typname
          FROM pg_catalog.pg_type t
          JOIN pg_catalog.pg_namespace n ON t.typnamespace = n.oid
          JOIN pg_catalog.pg_roles rl ON t.typowner = rl.oid
          WHERE n.nspname = 'public'
            AND t.typtype IN ('e', 'd')
            AND rl.rolname = '{{ treasury_user }}'
        LOOP
          EXECUTE format('ALTER TYPE %I.%I OWNER TO %I', 'public', r.typname, '{{ schema_flyway }}');
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ treasury_user }}"
    login_password: "{{ treasury_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

# Revoke treasury_user membership in schema_flyway after transferring functions and types.
- name: Revoke treasury_user membership in the schema_flyway role
  community.postgresql.postgresql_query:
    query: "REVOKE {{ schema_flyway }} FROM {{ treasury_user }}"
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres

- name: Grant app users privileges on the public schema and DML
  community.postgresql.postgresql_query:
    query: |
      GRANT USAGE ON SCHEMA public TO {{ item[1] }};
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO {{ item[1] }};
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO {{ item[1] }};
      GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO {{ item[1] }};
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item[0] }}"
  loop: "{{ db_list | product(app_users) | list }}"

- name: Default privileges for future schema_flyway objects (per app user)
  community.postgresql.postgresql_query:
    query: |
      ALTER DEFAULT PRIVILEGES FOR ROLE {{ schema_flyway }} IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO {{ item[1] }};
      ALTER DEFAULT PRIVILEGES FOR ROLE {{ schema_flyway }} IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO {{ item[1] }};
      ALTER DEFAULT PRIVILEGES FOR ROLE {{ schema_flyway }} IN SCHEMA public
        GRANT EXECUTE ON FUNCTIONS TO {{ item[1] }};
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item[0] }}"
  loop: "{{ db_list | product(app_users) | list }}"

# All user schemas: privileges for schema_flyway and for each app user (treasury_user, ...)
- name: Grant schema_flyway and app users privileges on all user schemas in each database
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE
        r RECORD;
        v_flyway TEXT := '{{ schema_flyway }}';
        v_user   TEXT := '{{ item[1] }}';
      BEGIN
        FOR r IN
          SELECT nspname
          FROM pg_catalog.pg_namespace
          WHERE nspname NOT LIKE 'pg_%' AND nspname != 'information_schema'
          ORDER BY 1
        LOOP
          EXECUTE format('GRANT USAGE, CREATE ON SCHEMA %I TO %I', r.nspname, v_flyway);
          EXECUTE format('GRANT USAGE, CREATE ON SCHEMA %I TO %I', r.nspname, v_user);
          EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO %I', r.nspname, v_user);
          EXECUTE format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA %I TO %I', r.nspname, v_user);
          EXECUTE format('GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA %I TO %I', r.nspname, v_user);
          EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', v_flyway, r.nspname, v_user);
          EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT USAGE, SELECT ON SEQUENCES TO %I', v_flyway, r.nspname, v_user);
          EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT EXECUTE ON FUNCTIONS TO %I', v_flyway, r.nspname, v_user);
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item[0] }}"
  loop: "{{ db_list | product(app_users) | list }}"

# In user schemas (kafka_transactional_outbox and others) Flyway runs as schema_flyway — ownership or privileges on flyway_schema_history are required.
- name: Transfer ownership of flyway_schema_history in user schemas to schema_flyway
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE
        r RECORD;
        v_flyway TEXT := '{{ schema_flyway }}';
      BEGIN
        FOR r IN
          SELECT nspname
          FROM pg_catalog.pg_namespace
          WHERE nspname NOT IN ('public') AND nspname NOT LIKE 'pg_%' AND nspname != 'information_schema'
          ORDER BY 1
        LOOP
          BEGIN
            EXECUTE format('ALTER TABLE %I.flyway_schema_history OWNER TO %I', r.nspname, v_flyway);
          EXCEPTION WHEN undefined_table THEN
            NULL;
          END;
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

# Explicitly grant privileges on flyway_schema_history in all user schemas (the table may appear after GRANT ON ALL TABLES or belong to another owner)
- name: Grant treasury_user privileges on flyway_schema_history in all user schemas
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE
        r RECORD;
        v_user TEXT := '{{ treasury_user }}';
      BEGIN
        FOR r IN
          SELECT nspname
          FROM pg_catalog.pg_namespace
          WHERE nspname NOT LIKE 'pg_%' AND nspname != 'information_schema'
          ORDER BY 1
        LOOP
          BEGIN
            EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE %I.flyway_schema_history TO %I', r.nspname, v_user);
          EXCEPTION WHEN undefined_table THEN
            NULL;
          END;
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

# Re-grant privileges on all objects in user schemas to each app user
- name: Re-grant app users privileges on all objects in all user schemas
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE
        r RECORD;
        v_user TEXT := '{{ item[1] }}';
      BEGIN
        FOR r IN
          SELECT nspname
          FROM pg_catalog.pg_namespace
          WHERE nspname NOT LIKE 'pg_%' AND nspname != 'information_schema'
          ORDER BY 1
        LOOP
          EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO %I', r.nspname, v_user);
          EXECUTE format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA %I TO %I', r.nspname, v_user);
          EXECUTE format('GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA %I TO %I', r.nspname, v_user);
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item[0] }}"
  loop: "{{ db_list | product(app_users) | list }}"

# Debezium connects as the app user (treasury_user). For a filtered pgoutput publication
# heartbeat and outbox_message must be owned by that user, not schema_flyway.
# Re-run schema_flyway_setup after the first successful application start (Flyway created the outbox).
- name: Transfer ownership of kafka_transactional_outbox tables to the app user (Debezium)
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE
        v_user TEXT := '{{ item[1] }}';
      BEGIN
        IF EXISTS (
          SELECT 1 FROM pg_catalog.pg_namespace WHERE nspname = 'kafka_transactional_outbox'
        ) THEN
          BEGIN
            EXECUTE format('ALTER TABLE kafka_transactional_outbox.heartbeat OWNER TO %I', v_user);
          EXCEPTION WHEN undefined_table THEN
            NULL;
          END;
          BEGIN
            EXECUTE format('ALTER TABLE kafka_transactional_outbox.outbox_message OWNER TO %I', v_user);
          EXCEPTION WHEN undefined_table THEN
            NULL;
          END;
        END IF;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item[0] }}"
  loop: "{{ db_list | product(app_users) | list }}"

- name: Summary
  ansible.builtin.debug:
    msg: "schema_flyway and privilege split applied for databases: {{ db_list | join(', ') }}"
