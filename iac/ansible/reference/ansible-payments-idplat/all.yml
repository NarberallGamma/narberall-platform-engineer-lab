---
- name: Run all_identityplatform
  hosts: swarm_manager
  gather_facts: true

  roles:
    - role: network
      tags: ["network"]

  tasks:

    - name: Deploy redis
      ansible.builtin.include_role:
        name: redis
      when:
        - "{{ (ig_caching_provider | string | lower) == 'redis' }}"
      ### Include the IG deploy role
    - name: Deploy ig
      ansible.builtin.include_role:
        name: ig
    ### Include the IgExt deploy role
    - name: Deploy IG EXT
      ansible.builtin.include_role:
        name: igext
      when:
        - "{{ ig_enable_ReverseAccess | bool }}"

    - block:
    ### Include the postgres deploy role
      - name: Include a role postgres
        ansible.builtin.include_role:
          name: idplat_postgres
        when:
          - "{{ idplat_postgres_install | bool }}"
          - "{{ not deploy_to_k8s | default(false) | bool }}"

      ### Wait until the service is ready 
      - name: Wait for service {{ docker_stack_name }}_idplat_postgres to reach running or failed state
        command: "docker service ps {{ docker_stack_name }}_idplat_postgres --format '{{ '{{.CurrentState}}' }}'"
        register: service_state
        until: "'Running' in service_state.stdout or 'Failed' in service_state.stdout"
        retries: 30
        delay: 10
        changed_when: false
        when:
          - "{{ idplat_postgres_install | bool }}"
          - "{{ not deploy_to_k8s | default(false) | bool }}"
        
      ### Print an error and stop the deploy
      - name: Error message
        fail:
          msg: "Service state is not 'Running'. Check the log"
        when:
          - "'Running' not in service_state.stdout"
          - "{{ idplat_postgres_install | bool }}"
          - "{{ not deploy_to_k8s | default(false) | bool }}"
      tags: idplat_postgres


    - block:
      ### Include the AM Docker deploy role without first-run setup
      - name: Include a role am no first_deploy
        ansible.builtin.include_role:
          name: am
        when:
          - "{{ not am_first_deploy | bool }}"
          - "{{ not am_update_plugins | bool }}"
          - "{{ not am_update_migrations | bool }}"

      - block:
        ### Include the Docker deploy role with first-run setup
        - name: Include a role am with first_deploy
          ansible.builtin.include_role:
            name: amcli
          when:
            - "{{ am_first_deploy | bool }} or {{ am_update_plugins | bool }} or {{ am_update_migrations | bool }}"

        ### Wait for first-run setup to finish
        - name: Wait for service {{ docker_stack_name }}_{{ amcli_name }} to reach complete or failed state
          command: "docker service ps {{ docker_stack_name }}_{{ amcli_name }} --format '{{ '{{.CurrentState}}' }}'"
          register: service_state
          until: "'Complete' in service_state.stdout or 'Failed' in service_state.stdout"
          retries: 30
          delay: 10
          changed_when: false
          when:
            - "{{ am_first_deploy | bool }} or {{ am_update_plugins | bool }} or {{ am_update_migrations | bool }}"
          
        ### Print an error and stop the deploy
        - name: Error message
          fail:
            msg: "First deploy no Complete !"
          when:
            - "'Complete' not in service_state.stdout"
            - "{{ am_first_deploy | bool }} or {{ am_update_plugins | bool }} or {{ am_update_migrations | bool }}"

        ### Remove the first-run setup container after success (kept when debug is on)
        - name: "{{ amcli_name }} -> Docker service {{ docker_stack_name }}_{{ amcli_name }} remove"
          docker_swarm_service:
            name: "{{ docker_stack_name }}_{{ amcli_name }}"
            state: absent
          when: 
            - "{{ am_first_deploy | bool }} or {{ am_update_plugins | bool }} or {{ am_update_migrations | bool }}"
            - "'Complete' in service_state.stdout"
            - "{{ not am_deploy_debug | bool }}"

        ### Start the service after first-run setup succeeds
        - name: Check if the first deploy was successful and run the second playbook
          ansible.builtin.include_role:
            name: am
          vars:
            am_name: "am"
          when: 
            - "'Complete' in service_state.stdout"
            - "{{ am_first_deploy | bool }} or {{ am_update_plugins | bool }} or {{ am_update_migrations | bool }}"

        when:
          - "{{ am_first_deploy | bool }} or {{ am_update_plugins | bool }} or {{ am_update_migrations | bool }}"
      tags: am

