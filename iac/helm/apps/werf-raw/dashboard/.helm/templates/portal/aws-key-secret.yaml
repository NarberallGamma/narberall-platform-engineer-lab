{{- if eq .Values.werf.env "production" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-aws-credentials
  annotations:
    werf.io/weight: "-250"
type: Opaque
stringData:
  credentials: |
    [default]
    aws_access_key_id = {{ .Values.portal.job.aws_access_key_id }}
    aws_secret_access_key = {{ .Values.portal.job.aws_secret_access_key }}
    region = {{ .Values.portal.job.region }}
{{- end }}
