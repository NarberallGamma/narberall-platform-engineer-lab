# PostgreSQL and Redis in this same compose; only 127.0.0.1:8088 is exposed (proxy is a separate nginx).
# First start: see README (db+redis → superset-init → remaining services).
#
# Command and service naming follows apache/superset docker-compose-non-dev.yml
# https://github.com/apache/superset/blob/master/docker-compose-non-dev.yml
# (Docker Hub image instead of build; init profile on superset-init so a repeat up does not re-run docker-init.sh).

x-superset-env: &superset-env
  env_file: .env
  environment:
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    PYTHONPATH: /app/pythonpath
    DATABASE_DIALECT: postgresql
    SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:${POSTGRES_PASSWORD}@db:5432/superset
    REDIS_URL: redis://redis:6379/0
    OAUTHLIB_INSECURE_TRANSPORT: ${OAUTHLIB_INSECURE_TRANSPORT:-0}
  extra_hosts:
    - "${ADFS_EXTRA_HOST_ENTRY:-adfs.example.com:10.10.12.4}"

x-superset-volumes: &superset-volumes
  - ./pythonpath:/app/pythonpath:ro
  - ./data/superset_home:/app/superset_home
  - ./requirements-local.txt:/app/docker/requirements-local.txt:ro
  - ./ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: superset
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      retries: 5

  superset-init:
    profiles: [init]
    <<: *superset-env
    image: ${SUPERSET_IMAGE:-apache/superset:6.0.0}
    user: root
    command: ["/app/docker/docker-init.sh"]
    volumes: *superset-volumes
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  superset:
    <<: *superset-env
    image: ${SUPERSET_IMAGE:-apache/superset:6.0.0}
    user: root
    restart: unless-stopped
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    ports:
      - "127.0.0.1:8088:8088"
    volumes: *superset-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  superset-worker:
    <<: *superset-env
    image: ${SUPERSET_IMAGE:-apache/superset:6.0.0}
    user: root
    restart: unless-stopped
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    volumes: *superset-volumes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  superset-worker-beat:
    <<: *superset-env
    image: ${SUPERSET_IMAGE:-apache/superset:6.0.0}
    user: root
    restart: unless-stopped
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    volumes: *superset-volumes
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
