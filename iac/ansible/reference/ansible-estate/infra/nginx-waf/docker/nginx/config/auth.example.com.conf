# Конфигурация Nginx WAF для auth.example.com
# Разместить в: /docker/nginx/config/auth.example.com.conf

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/auth.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/auth.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/auth.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name auth.example.com;
    listen 80;

    return 301 https://auth.example.com;
}

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/auth.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/auth.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/auth.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name auth.example.com;
    listen 443 ssl;
    ssl_certificate /docker/certgen/data/example.com.crt;
    ssl_certificate_key /docker/certgen/data/example.com.key;

    include /etc/nginx/conf_add/wallarm-blocked-page;
    client_max_body_size 100m;

    # ============================================
    # БЛОКИРОВКА SWAGGER И ACTUATOR для разрешенного API
    # ============================================
    
    # Блокировка swagger-ui для treasury-auth-provider
    location ~ ^/api/v0/treasury-auth-provider/swagger-ui {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Блокировка actuator для treasury-auth-provider (полная блокировка, включая health)
    location ~ ^/api/v0/treasury-auth-provider/actuator {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Блокировка settings для treasury-auth-provider (полная блокировка всего пути)
    location ~ ^/api/v0/treasury-auth-provider/settings {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # БЛОКИРОВКА ПУТЕЙ ДО /api/v0 ВКЛЮЧИТЕЛЬНО
    # Возвращаем 403 для корня, /api и /api/v0
    # ============================================
    
    # Блокируем корневой путь
    location = / {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api (без слэша)
    location = /api {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api/ (со слэшем, но не /api/v0/)
    location ~ ^/api/$ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api/v0 (без слэша)
    location = /api/v0 {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api/v0/ (со слэшем, но не разрешенные пути)
    location = /api/v0/ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # БЛОКИРОВКА ВСЕХ ДРУГИХ API ПУТЕЙ
    # Разрешаем только: /api/v0/treasury-auth-provider/
    # ============================================
    
    # Блокируем все /api/v0/* пути, кроме разрешенного
    location ~ ^/api/v0/(?!treasury-auth-provider/) {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # РАЗРЕШЕННЫЙ API ПУТЬ
    # ============================================
    
    # Разрешаем /api/v0/treasury-auth-provider/ (кроме уже заблокированных swagger/actuator)
    location ~ ^/api/v0/treasury-auth-provider/ {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host auth.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # ВСЕ ОСТАЛЬНОЕ (не API пути) - разрешаем
    # ============================================
    
    location / {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host auth.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

