---
# Extra read-write account playbook: GRANT DML on data (no OWNER, no CREATE on the schema).
# Run: ansible-playbook rw_user_setup.yaml --extra-vars "rw_user=... rw_password=..."
#         ansible-playbook rw_user_setup.yaml --extra-vars "rw_user=... rw_password=... db_name=...|db_list=[...]"
# Without db_name / db_list, default_databases from vars below is used.
- name: Create a PostgreSQL RW user (GRANT DML on data, no OWNER)
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    pg_host: "10.10.16.30"
    pg_port: 5432
    pg_admin_user: root
    pg_admin_password: ""

    rw_user: "app_rw_power"
    rw_password: ""
    # false: GRANTs only, do not change the password (account already created in the cloud)
    manage_password: true

    # Object-creator role for ALTER DEFAULT PRIVILEGES FOR ROLE (not the extra account OWNER).
    default_privileges_for_role: schema_flyway

    # Full list of estate application databases (RDS prod snapshot, 2026-07). openobserve is not included.
    # Override: db_name or db_list.
    # treasury_contract_restored_3: temporary/restored database, may be absent on preprod.
    default_databases:
      - cryptopro_service
      - hsm
      - keycloak
      - nodes_btc
      - nodes_eth
      - nodes_tron
      - treasury_aml
      - treasury_api
      - treasury_csp
      - treasury_aml
      - treasury_audit
      - treasury_auth_provider
      - treasury_contract
      - treasury_contract_restored_3
      - treasury_csp
      - treasury_notification
      - treasury_onboarding
      - treasury_otp
      - treasury_rates
      - treasury_report
      - treasury_safe_deal_adapter
      - treasury_lp_adapter
      - treasury_treasury_adapter
      - treasury_web

  pre_tasks:
    - name: Check rw_user and rw_password
      ansible.builtin.fail:
        msg: "Set rw_user; rw_password is required when manage_password=true (default)"
      when: >
        rw_user is not defined or (rw_user | default('') | trim | length) == 0
        or (
          (manage_password | default(true) | bool)
          and (rw_password is not defined or (rw_password | default('') | length) == 0)
        )

    - name: Resolve the database list to process
      ansible.builtin.set_fact:
        db_list: "{{ db_list | default(default_databases) }}"
      when: db_name is not defined or db_name == '' or db_name is none

    - name: Resolve the database list from db_name
      ansible.builtin.set_fact:
        db_list: "{{ [db_name] }}"
      when: db_name is defined and db_name != '' and db_name is not none

    - name: Fail when the database list is empty
      ansible.builtin.fail:
        msg: "ERROR: database list is empty. Set db_name or db_list"
      when: db_list is not defined or db_list | length == 0

    - name: Show parameters
      ansible.builtin.debug:
        msg:
          - "RW user: {{ rw_user }}"
          - "Databases ({{ db_list | length }}): {{ db_list | join(', ') }}"

  roles:
    - rw_user
