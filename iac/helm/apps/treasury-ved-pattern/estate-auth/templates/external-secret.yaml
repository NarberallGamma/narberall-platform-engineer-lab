apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: estate-auth-vault-secrets
  namespace: estate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: estate-auth-vault-secrets
    creationPolicy: Owner
  data:
  - secretKey: kafkaClientPassword
    remoteRef:
      key: secret/estate-kafka
      property: kafkaClientPassword
  - secretKey: spring.datasource.username
    remoteRef:
      key: secret/estate-auth-app
      property: spring.datasource.username
  - secretKey: spring.datasource.password
    remoteRef:
      key: secret/estate-auth-app
      property: spring.datasource.password
  - secretKey: spring.flyway.user
    remoteRef:
      key: secret/estate-auth-app
      property: spring.flyway.user
  - secretKey: spring.flyway.password
    remoteRef:
      key: secret/estate-auth-app
      property: spring.flyway.password
  - secretKey: private_key
    remoteRef:
      key: secret/estate-auth-app
      property: private_key
  - secretKey: public_key
    remoteRef:
      key: secret/estate-auth-app
      property: public_key
