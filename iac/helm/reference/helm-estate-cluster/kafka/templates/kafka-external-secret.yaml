# ExternalSecret for Connect, connector databases, and AKHQ UI credentials.
# Read keys from vault.example.com/kv/estate-kafka through ClusterSecretStore.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-infrastructure-credentials
  namespace: kafka
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: kafka-vault-credentials
    creationPolicy: Owner
  data:
  - secretKey: kafkaInterBrokerPassword
    remoteRef:
      key: vault.example.com/kv/estate-kafka
      property: kafkaInterBrokerPassword
  - secretKey: kafkaClientPassword
    remoteRef:
      key: vault.example.com/kv/estate-kafka
      property: kafkaClientPassword
  - secretKey: postgresUser
    remoteRef:
      key: vault.example.com/kv/estate-kafka
      property: postgresUser
  - secretKey: postgresPassword
    remoteRef:
      key: vault.example.com/kv/estate-kafka
      property: postgresPassword
  - secretKey: akhqAdminPassword
    remoteRef:
      key: vault.example.com/kv/estate-kafka
      property: akhqAdminPassword
  - secretKey: akhqReaderPassword
    remoteRef:
      key: vault.example.com/kv/estate-kafka
      property: akhqReaderPassword
