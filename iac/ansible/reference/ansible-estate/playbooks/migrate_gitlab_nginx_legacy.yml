---
# Legacy migration: move TLS from GitLab Omnibus nginx to external docker gitlab-nginx.
# Omnibus nginx is fully disabled (nginx['enable']=false); UI -> gitlab-workhorse:8181.
#
# Order (brief downtime on 443):
#   1) Render gitlab-nginx configs and copy certificates from /etc/gitlab/ssl
#   2) Comment out legacy SSL in /etc/gitlab/gitlab.rb, add the proxy block
#   3) gitlab-ctl reconfigure (frees 443)
#   4) docker compose up gitlab-nginx
#
# Run:
#   ./scripts/run/run_migrate_gitlab_nginx_legacy.sh --preprod --limit estate-preprod-gitlab
#   ./scripts/run/run_migrate_gitlab_nginx_legacy.sh --prod --limit estate-prod-gitlab
#
# File prepare only, without reconfigure/compose:
#   ... -- --tags prepare
#
# Variables: group_vars/gitlab-nginx.yml
# Switch: gitlab_nginx_legacy_migration_enabled (false after migrate on the environment)

- name: Migrate GitLab TLS to external gitlab-nginx (legacy)
  hosts: gitlab_nginx
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../group_vars/gitlab-nginx.yml"

  vars:
    gitlab_nginx_app_dir: "{{ docker_app_base_dir }}/gitlab-nginx"
    gitlab_nginx_legacy_rb_comment_patterns:
      - "external_url "
      - "nginx\\['enable'\\]"
      - "nginx\\['ssl_certificate'\\]"
      - "nginx\\['ssl_certificate_key'\\]"
      - "nginx\\['listen_addresses'\\]"
      - "nginx\\['listen_port'\\]"
      - "nginx\\['listen_https'\\]"
      - "nginx\\['redirect_http_to_https'\\]"
      - "letsencrypt\\['enable'\\]"
      - "gitlab_workhorse\\['listen_network'\\]"
      - "gitlab_workhorse\\['listen_addr'\\]"
      - "gitlab_rails\\['trusted_proxies'\\]"
      - "registry_external_url "
      - "registry\\['enable'\\]"
      - "gitlab_rails\\['registry_enabled'\\]"
      - "registry\\['registry_http_addr'\\]"
      - "registry_nginx\\['ssl_certificate'\\]"
      - "registry_nginx\\['ssl_certificate_key'\\]"
      - "registry_nginx\\['enable'\\]"

  pre_tasks:
    - name: Check that legacy migration is enabled in group_vars
      ansible.builtin.assert:
        that:
          - gitlab_nginx_legacy_migration_enabled | default(false) | bool
        fail_msg: >-
          Legacy migration is disabled (gitlab_nginx_legacy_migration_enabled: false in group_vars/gitlab-nginx.yml).
          Migrate on this environment is complete. For a new environment: set true and uncomment migration vars in group_vars.
      tags: [always]

    - name: Check that gitlab-ctl is present
      ansible.builtin.stat:
        path: /usr/bin/gitlab-ctl
      register: gitlab_ctl_bin
      failed_when: not gitlab_ctl_bin.stat.exists | default(false)
      tags: [prepare, migrate, verify]

    - name: Migration info
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "GitLab: https://{{ gitlab_nginx_gitlab_host }}"
          - "Registry: https://{{ gitlab_nginx_registry_host }}"
          - "Certs: {{ gitlab_nginx_legacy_ssl_source_dir }}/{{ gitlab_nginx_cert_basename }}.crt"
          - "Target: {{ gitlab_nginx_app_dir }}/certs/"
      tags: [prepare, migrate, verify]

  tasks:
    - name: Prepare gitlab-nginx (configs without compose up)
      ansible.builtin.include_role:
        name: docker_app
      vars:
        docker_app_compose_up: false
      tags: [prepare, migrate]

    - name: Check GitLab legacy certificates
      ansible.builtin.stat:
        path: "{{ gitlab_nginx_legacy_ssl_source_dir }}/{{ gitlab_nginx_cert_basename }}.{{ item }}"
      register: gitlab_nginx_legacy_cert_stat
      loop:
        - crt
        - key
      tags: [prepare, migrate]

    - name: Assert legacy certificates exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Not found {{ gitlab_nginx_legacy_ssl_source_dir }}/{{ gitlab_nginx_cert_basename }}.{{ item.item }}"
      loop: "{{ gitlab_nginx_legacy_cert_stat.results }}"
      loop_control:
        label: "{{ gitlab_nginx_cert_basename }}.{{ item.item }}"
      tags: [prepare, migrate]

    - name: Copy TLS certificates into gitlab-nginx/certs
      ansible.builtin.copy:
        src: "{{ gitlab_nginx_legacy_ssl_source_dir }}/{{ gitlab_nginx_cert_basename }}.{{ item.ext }}"
        dest: "{{ gitlab_nginx_app_dir }}/certs/{{ gitlab_nginx_cert_basename }}.{{ item.ext }}"
        remote_src: true
        mode: "{{ item.mode }}"
      loop:
        - { ext: crt, mode: "0644" }
        - { ext: key, mode: "0600" }
      tags: [prepare, migrate]

    - name: Back up gitlab.rb before migration
      ansible.builtin.copy:
        src: /etc/gitlab/gitlab.rb
        dest: "/etc/gitlab/gitlab.rb.backup.{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        mode: "0600"
      tags: [migrate]

    - name: Remove the gitlab-nginx managed block before editing legacy lines
      ansible.builtin.blockinfile:
        path: /etc/gitlab/gitlab.rb
        marker: "# {mark} ANSIBLE MANAGED gitlab-nginx"
        state: absent
      tags: [migrate]

    - name: Remove broken legacy comments from previous runs
      ansible.builtin.replace:
        path: /etc/gitlab/gitlab.rb
        regexp: '^# \\1  # legacy: gitlab-nginx migration$'
        replace: ''
      tags: [migrate]

    - name: Comment out legacy SSL/TLS lines in gitlab.rb
      ansible.builtin.replace:
        path: /etc/gitlab/gitlab.rb
        regexp: '^(?!\\s*#)(({{ item }}).*)$'
        replace: '# \1  # legacy: gitlab-nginx migration'
      loop: "{{ gitlab_nginx_legacy_rb_comment_patterns }}"
      tags: [migrate]

    - name: Add the gitlab.rb proxy block for external nginx
      ansible.builtin.blockinfile:
        path: /etc/gitlab/gitlab.rb
        marker: "# {mark} ANSIBLE MANAGED gitlab-nginx"
        block: "{{ lookup('template', playbook_dir ~ '/../roles/docker_app/templates/gitlab-nginx/gitlab.rb.proxy.j2') }}"
        insertafter: EOF
      tags: [migrate]

    - name: gitlab-ctl reconfigure (disable Omnibus nginx, bring up workhorse :8181)
      ansible.builtin.command: /usr/bin/gitlab-ctl reconfigure
      register: gitlab_reconfigure
      changed_when: true
      tags: [migrate]

    - name: Wait for the gitlab-workhorse backend
      ansible.builtin.wait_for:
        host: "{{ docker_app.gitlab_backend_host }}"
        port: "{{ docker_app.gitlab_backend_port }}"
        timeout: 120
        state: started
      tags: [migrate, verify]

    - name: Wait for the registry backend
      ansible.builtin.wait_for:
        host: "{{ docker_app.registry_backend_host }}"
        port: "{{ docker_app.registry_backend_port }}"
        timeout: 120
        state: started
      tags: [migrate, verify]

    - name: Assert Omnibus nginx is not listening on 443
      ansible.builtin.shell: |
        set -euo pipefail
        if ss -tlnp 2>/dev/null | grep ':443 ' | grep -q nginx; then
          ss -tlnp | grep ':443 ' || true
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
      tags: [migrate, verify]

    - name: Start gitlab-nginx compose
      community.docker.docker_compose_v2:
        project_src: "{{ gitlab_nginx_app_dir }}"
        state: present
        pull: "{{ docker_app_compose_pull }}"
      tags: [migrate]

    - name: Check GitLab UI over HTTPS
      ansible.builtin.uri:
        url: "https://{{ gitlab_nginx_gitlab_host }}/users/sign_in"
        validate_certs: true
        status_code: [200, 302]
      register: gitlab_https_check
      retries: 20
      delay: 10
      until: gitlab_https_check is succeeded
      tags: [verify, migrate]

    - name: Check Container Registry over HTTPS (/v2/)
      ansible.builtin.uri:
        url: "https://{{ gitlab_nginx_registry_host }}/v2/"
        validate_certs: true
        status_code: [200, 401]
      register: registry_https_check
      retries: 20
      delay: 10
      until: registry_https_check is succeeded
      tags: [verify, migrate]

    - name: Migration summary
      ansible.builtin.debug:
        msg:
          - "gitlab-nginx: {{ gitlab_nginx_app_dir }}"
          - "GitLab HTTPS: OK ({{ gitlab_https_check.status }})"
          - "Registry HTTPS: OK ({{ registry_https_check.status }})"
          - "SSH git (optional): {{ docker_app.ssh_listen_port | default(2222) }} -> localhost:22"
          - "TLS certs: {{ gitlab_nginx_ssl_dir }}"
      tags: [verify, migrate]

    - name: Migration summary (cert-orchestrator, preprod only)
      ansible.builtin.debug:
        msg:
          - "Preprod: redeploy cert-orchestrator for ssl_dir {{ gitlab_nginx_ssl_dir }}"
          - "./scripts/run/run_docker_app.sh deploy cert-orchestrator --preprod --limit {{ inventory_hostname }}"
      when: inventory_hostname in (groups.get('cert_orchestrator') | default([]))
      tags: [verify, migrate]
