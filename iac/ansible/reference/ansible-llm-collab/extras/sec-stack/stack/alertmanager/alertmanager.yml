# TODO: fill in real tokens/chats. Secrets land here at deploy time —
# Ansible templates this file from SOPS secrets (see ansible/roles/sec_stack).
route:
  receiver: default
  group_by: [alertname, site]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Heartbeat is sent separately and often, bypassing grouping
    - matchers: [alertname = DeadManSwitch]
      receiver: heartbeat
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: [severity = critical]
      receiver: critical

receivers:
  - name: default
    # warning and below — work chat, sec-stack bot
    # telegram_configs:
    #   - bot_token: "CHANGE_ME"   # sec-stack bot (@sec-stack_alertmanager_bot or similar)
    #     chat_id: -1000000000001
    #     parse_mode: HTML

  - name: critical
    # telegram_configs:
    #   - bot_token: "CHANGE_ME"
    #     chat_id: -1000000000001   # critical chat: critical only, no flood
    #     parse_mode: HTML

  - name: heartbeat
    # Free option: healthchecks.io — the DeadManSwitch alert pings a URL,
    # and healthchecks raises an alarm when pings stop.
    # webhook_configs:
    #   - url: "https://hc-ping.com/<uuid>"
    #     send_resolved: false

inhibit_rules:
  # When the firewall is fully unreachable — do not spam about its tunnels/licenses
  - source_matchers: [alertname = PanosUnreachable]
    target_matchers: [alertname =~ "Panos(IpsecTunnelDown|IpsecTunnelStale|HAUnhealthyState|SessionUsageHigh)"]
    equal: [firewall]
