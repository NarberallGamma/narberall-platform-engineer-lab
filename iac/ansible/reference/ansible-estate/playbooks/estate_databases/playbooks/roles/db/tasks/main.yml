# In the registry.../base-images/ansible image (Alpine) pip into system Python is blocked (PEP 668); community.postgresql goes through py3-psycopg2 from apk (same as the schema_flyway role).
- name: Install py3-psycopg2 for community.postgresql modules
  community.general.apk:
    name: py3-psycopg2
    state: present

- name: Terminate all connections to the database
  community.postgresql.postgresql_query:
    query: |
      SELECT pg_terminate_backend(pid)
      FROM pg_stat_activity
      WHERE datname = '{{ item.name }}'
        AND pid <> pg_backend_pid();
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres
  loop: "{{ db }}"
  ignore_errors: yes

- name: Drop PostgreSQL databases
  community.general.postgresql_db:
    name: "{{ item.name }}"
    state: absent

    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
  loop: "{{ db }}"

- name: "Create PostgreSQL databases"
  community.general.postgresql_db:
    name: "{{ item.name }}"
    encoding: "{{ default_encoding }}"
    lc_collate: "{{ default_lc_collate }}"
    lc_ctype: "{{ default_lc_ctype }}"
    owner: "treasury_user"

    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
  loop: "{{ db }}"

- name: Drop the public schema from the database
  community.postgresql.postgresql_schema:
    name: public
    login_db: "{{ item.name }}"
    login_host: "{{ pg_host }}"
    login_user: "{{ treasury_user }}"
    login_password: "{{ treasury_password }}"
    login_port: "{{ pg_port }}"
    state: absent                   # drop the schema
    cascade_drop: yes                    # drop all objects inside the schema
  loop: "{{ db }}"

- name: Create the public schema with a new owner
  community.postgresql.postgresql_schema:
    name: public
    owner: treasury_user
    login_db: "{{ item.name }}"
    login_host: "{{ pg_host }}"
    login_user: "{{ treasury_user }}"          # PostgreSQL superuser
    login_password: "{{ treasury_password }}"
    login_port: "{{ pg_port }}"
    state: present
  loop: "{{ db }}"
