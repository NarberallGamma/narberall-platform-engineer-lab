---
# Save local Docker images to tar before purge docker.io or docker_migrate (engine stop).
# Restore: tasks/docker_images_restore.yml after docker-ce install and Docker start.

- name: Docker images backup condition
  ansible.builtin.set_fact:
    docker_images_backup_needed: >-
      {{
        (docker_images_backup_enabled | default(true) | bool)
        and (
          (docker_remove_distro_packages | default(false) | bool)
          or (docker_migrate_data | default(false) | bool)
        )
      }}
  tags: [docker]

- name: Check Docker images backup marker
  ansible.builtin.stat:
    path: "{{ docker_images_backup_marker }}"
  register: docker_images_backup_marker_stat
  when: docker_images_backup_needed
  tags: [docker]

- name: Backup Docker images to tar (docker save)
  when:
    - docker_images_backup_needed
    - not docker_images_backup_marker_stat.stat.exists | default(false)
  block:
    - name: Check Docker availability for image backup
      ansible.builtin.command: docker info
      register: docker_backup_info
      changed_when: false
      failed_when: false
      tags: [docker]

    - name: Start Docker for image backup (if stopped)
      ansible.builtin.systemd:
        name: docker
        state: started
      when: docker_backup_info.rc != 0
      failed_when: false
      tags: [docker]

    - name: Recheck Docker for image backup
      ansible.builtin.command: docker info
      register: docker_backup_info_retry
      changed_when: false
      failed_when: false
      tags: [docker]

    - name: List Docker images for backup
      ansible.builtin.shell: |
        set -euo pipefail
        docker images --format '{{ "{{" }}.Repository{{ "}}" }}:{{ "{{" }}.Tag{{ "}}" }}'
      args:
        executable: /bin/bash
      register: docker_images_for_backup
      changed_when: false
      when: docker_backup_info_retry.rc == 0
      tags: [docker]

    - name: Filter images for backup
      ansible.builtin.set_fact:
        docker_images_backup_list: >-
          {{
            docker_images_for_backup.stdout_lines | default([])
            | select('match', '.+')
            | reject('equalto', '<none>:<none>')
            | reject('search', '<none>')
            | list
            | unique
          }}
      when: docker_backup_info_retry.rc == 0
      tags: [docker]

    - name: Docker images backup directory
      ansible.builtin.file:
        path: "{{ docker_images_backup_dir }}"
        state: directory
        mode: "0700"
      when:
        - docker_backup_info_retry.rc == 0
        - docker_images_backup_list | default([]) | length > 0
      tags: [docker]

    - name: Save Docker images to tar (docker save)
      ansible.builtin.command:
        argv:
          - docker
          - save
          - "{{ item }}"
          - -o
          - "{{ docker_images_backup_dir }}/{{ item | regex_replace('[^a-zA-Z0-9._-]+', '_') }}.tar"
      loop: "{{ docker_images_backup_list | default([]) }}"
      when: docker_images_backup_list | default([]) | length > 0
      register: docker_save_results
      tags: [docker]

    - name: Marker for completed Docker images backup
      ansible.builtin.copy:
        dest: "{{ docker_images_backup_marker }}"
        content: |
          images:
          {% for img in docker_images_backup_list | default([]) %}
          - {{ img }}
          {% endfor %}
        mode: "0600"
      when: docker_backup_info_retry.rc == 0
      tags: [docker]

    - name: Docker images backup summary
      ansible.builtin.debug:
        msg: |
          Docker images backup on {{ inventory_hostname }}: {{ docker_images_backup_list | default([]) | length }} tar in {{ docker_images_backup_dir }}.
          After migrate and docker load, verify: docker images
          Remove the backup directory after a successful check: rm -rf {{ docker_images_backup_dir }}
      when: docker_images_backup_list | default([]) | length > 0
      tags: [docker]

    - name: Docker images backup skipped (no local images)
      ansible.builtin.debug:
        msg: "Docker images backup: no local images found, no tar files created."
      when:
        - docker_backup_info_retry.rc == 0
        - docker_images_backup_list | default([]) | length == 0
      tags: [docker]

  tags: [docker]
