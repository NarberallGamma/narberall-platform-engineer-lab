---
# Load Docker images from tar after docker-ce install, data-root migrate, and engine start.

- name: Docker images restore condition
  ansible.builtin.set_fact:
    docker_images_restore_needed: >-
      {{
        (docker_images_backup_enabled | default(true) | bool)
        and (
          (docker_remove_distro_packages | default(false) | bool)
          or (docker_migrate_data | default(false) | bool)
        )
      }}
  tags: [docker]

- name: Check Docker images backup marker for restore
  ansible.builtin.stat:
    path: "{{ docker_images_backup_marker }}"
  register: docker_images_backup_marker_restore
  when: docker_images_restore_needed
  tags: [docker]

- name: Check Docker images restore marker
  ansible.builtin.stat:
    path: "{{ docker_images_restore_marker }}"
  register: docker_images_restore_marker_stat
  when: docker_images_restore_needed
  tags: [docker]

- name: Restore Docker images from tar (docker load)
  when:
    - docker_images_restore_needed
    - docker_images_backup_marker_restore.stat.exists | default(false)
    - not docker_images_restore_marker_stat.stat.exists | default(false)
  block:
    - name: Find Docker image tar backups
      ansible.builtin.find:
        paths: "{{ docker_images_backup_dir }}"
        patterns: "*.tar"
        file_type: file
      register: docker_image_backup_tars
      tags: [docker]

    - name: Load Docker images from tar (docker load)
      ansible.builtin.command:
        argv:
          - docker
          - load
          - -i
          - "{{ item.path }}"
      loop: "{{ docker_image_backup_tars.files | default([]) }}"
      when: docker_image_backup_tars.matched | default(0) | int > 0
      register: docker_load_results
      tags: [docker]

    - name: Docker images restore marker
      ansible.builtin.file:
        path: "{{ docker_images_restore_marker }}"
        state: touch
        mode: "0644"
      tags: [docker]

    - name: Docker images restore summary
      ansible.builtin.debug:
        msg: |
          Docker images restored from {{ docker_images_backup_dir }} ({{ docker_image_backup_tars.matched | default(0) }} tar).
          Verify: docker images
          After a check, the backup may be removed: rm -rf {{ docker_images_backup_dir }}
      when: docker_image_backup_tars.matched | default(0) | int > 0
      tags: [docker]

    - name: Docker images restore skipped (tar files not found)
      ansible.builtin.debug:
        msg: "Backup marker exists, but no tar files found in {{ docker_images_backup_dir }} (no images before migrate)."
      when: docker_image_backup_tars.matched | default(0) | int == 0
      tags: [docker]

  tags: [docker]
