groups:
  - name: tls-endpoints
    rules:
      - alert: BlackboxProbeFailed
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Probe {{ $labels.probe_target }} is failing"
          description: "job={{ $labels.job }}: endpoint has been unreachable for 5 minutes."

      - alert: TlsCertificateExpiring
        expr: 0 < (probe_ssl_earliest_cert_expiry - time()) < 86400 * 30
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate {{ $labels.probe_target }} expires in less than 30 days"

      - alert: TlsCertificateExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry - time()) < 86400 * 7
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate {{ $labels.probe_target }} expires in less than 7 days"
