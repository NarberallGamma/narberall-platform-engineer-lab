user www-data;

worker_processes  4;

error_log  /var/log/nginx/error-aggregate.log warn;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    log_format  wallarm  '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for" "$http_x_bug_bounty" "$host" '
                         '"$wallarm_request_cpu_time" "$wallarm_request_mono_time" "$wallarm_serialized_size" '
                         '"$wallarm_is_input_valid" "$wallarm_attack_type" "$wallarm_attack_type_list" "$upstream_status" '
                         '"$uri" "$http_x_verdict" "$http_x_device_id" "$http_x_session_id"';

    # Общий access/error в файлах на маунте хоста (имена вне access.log/error.log: образ может подставлять symlinks на stdio).
    access_log  /var/log/nginx/access-aggregate.log wallarm;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    server_names_hash_bucket_size 128;

    #gzip  on;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 198.51.100.0/24;
    set_real_ip_from 198.51.100.0/24;
    set_real_ip_from 198.51.100.0/24;
    set_real_ip_from 198.51.100.0/24;
    set_real_ip_from 198.51.100.0/24;
    set_real_ip_from 198.51.100.0/24;    

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Условный access_log wallarm-security.log задаётся в vhost через if=$wallarm_attack_type_list (переменная модуля Wallarm).
    # Не использовать map → $log_wallarm_security: в nginx 1.14.x из образа WAF nginx -t даёт unknown "log_wallarm_security" variable.

    include /etc/nginx/conf.d/*.conf;

    server_tokens off;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;

    ssl_protocols TLSv1.2 TLSv1.3;
}
