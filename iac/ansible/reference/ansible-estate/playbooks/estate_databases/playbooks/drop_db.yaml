---
# Drop one or more PostgreSQL databases (no recreate).
# Examples:
#   ansible-playbook drop_db.yaml --extra-vars "db_name=treasury_lp_adapter"
#   ansible-playbook drop_db.yaml --extra-vars "db_list=['treasury_lp_adapter','treasury_otp']"
# pg_admin_password, treasury_password — in vars or --extra-vars.
- name: Drop PostgreSQL databases (drop only)
  hosts: localhost
  connection: local
  become: no
  gather_facts: no
  vars:
    pg_host: "10.10.16.30"
    pg_port: 5432
    pg_admin_user: root
    pg_admin_password: ""
    default_databases: []

  pre_tasks:
    - name: Resolve the database list to drop
      ansible.builtin.set_fact:
        db_list: "{{ db_list | default(default_databases) }}"
      when: db_name is not defined or db_name == '' or db_name is none

    - name: Resolve the database list from db_name
      ansible.builtin.set_fact:
        db_list: "{{ [db_name] }}"
      when: db_name is defined and db_name != '' and db_name is not none

    - name: Fail when the database list is empty
      ansible.builtin.fail:
        msg: "ERROR: set db_name or db_list via --extra-vars"
      when: db_list is not defined or db_list | length == 0

    - name: Show the database list to drop
      ansible.builtin.debug:
        msg: "{{ db_list | length }} databases will be dropped: {{ db_list | join(', ') }}"

  tasks:
    - name: Install py3-psycopg2
      community.general.apk:
        name: py3-psycopg2
        state: present

    - name: Terminate connections to the database
      community.postgresql.postgresql_query:
        query: |
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname = '{{ item }}'
            AND pid <> pg_backend_pid();
        login_host: "{{ pg_host }}"
        login_user: "{{ pg_admin_user }}"
        login_password: "{{ pg_admin_password }}"
        login_port: "{{ pg_port }}"
        login_db: postgres
      loop: "{{ db_list }}"
      ignore_errors: yes

    - name: Drop PostgreSQL databases
      community.general.postgresql_db:
        name: "{{ item }}"
        state: absent
        login_host: "{{ pg_host }}"
        login_user: "{{ pg_admin_user }}"
        login_password: "{{ pg_admin_password }}"
        login_port: "{{ pg_port }}"
      loop: "{{ db_list }}"

    - name: Drop summary
      ansible.builtin.debug:
        msg: "Dropped databases: {{ db_list | join(', ') }}"
