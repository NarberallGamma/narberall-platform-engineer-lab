---
# LLM dev: download GGUF → llama.cpp server + Open WebUI → nginx (TLS, /v1 and UI).
# On every deploy run: containers are recreated (llm_dev_compose_recreate: always), not limited to restart.
# Secrets: llm_dev_init → HashiCorp Vault KV (group_vars/llm_dev/main.yml).
# Run: ./scripts/run/run_llm_dev.sh --limit llm-dev-01.example.com
#
# Tags: llm_dev, llm_dev_init, llm_dev_model_fetch, llm_dev_ouroboros, llm_dev_deploy, llm_dev_nginx, llm_dev_install, llm_dev_manage, llm_dev_config, llm_dev_restart, llm_dev_gpu, llm_dev_gpu_prepare.
# The llm_dev_model_fetch role is also tagged llm_dev_deploy so that --tags llm_dev_deploy pulls the model before the assert in llm_dev_deploy.
#
# Full cycle: the model is downloaded by llm_dev_model_fetch into {{ llm_dev_models_dir }}, manifest into {{ llm_dev_sources_dir }}.
# Before the first run, TLS PEMs for nginx are still required (certs directory or llm_dev_nginx_ssl_sync_src).
# Long steps: group_vars llm_dev_ansible_ssh_timeout_seconds, *_async_* (see group_vars/llm_dev/main.yml).

- name: Deploy LLM dev (model + Compose + nginx)
  hosts: llm_dev
  gather_facts: true
  become: true
  vars:
    ansible_ssh_timeout: "{{ llm_dev_ansible_ssh_timeout_seconds | default(14400) | int }}"

  pre_tasks:
    - name: llm_dev group parameters (group_vars/llm_dev/main.yml)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/llm_dev/main.yml"
      tags: [always]

  roles:
    - role: prepare_nvidia_gpu
      tags: [llm_dev, llm_dev_gpu, llm_dev_install, llm_dev_gpu_prepare]
      when: llm_dev_gpu_host_prepare_enabled | default(false) | bool
    - role: llm_dev_init
      tags: [llm_dev, llm_dev_init, vault, llm_dev_install]
    - role: llm_dev_model_fetch
      tags: [llm_dev, llm_dev_model_fetch, llm_dev_install, llm_dev_deploy]
      when: llm_dev_model_fetch_enabled | bool
    - role: llm_dev_ouroboros_compat
      tags: [llm_dev, llm_dev_ouroboros, llm_dev_config, llm_dev_deploy]
      when: llm_dev_ouroboros_compat_enabled | default(false) | bool
    - role: llm_dev_deploy
      tags: [llm_dev, llm_dev_deploy]
    - role: llm_dev_nginx
      tags: [llm_dev, llm_dev_nginx, llm_dev_install]
      when: llm_dev_nginx_enabled | bool
