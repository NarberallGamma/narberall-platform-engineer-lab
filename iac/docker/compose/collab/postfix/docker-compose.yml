services:
  postfix:
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    image: boky/postfix
    container_name: postfix
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    ports:
      - "587:587"
    volumes:
      - ./dkim:/etc/opendkim/keys
      - ./init-scripts:/docker-init.db:ro
      - /docker/SSL_certs/smtp.example.com/wildcert.pem:/etc/opendkim/keys/mail.crt:ro
      - /docker/SSL_certs/smtp.example.com/wildkey.pem:/etc/opendkim/keys/mail.key:ro
    environment:
      HOSTNAME: smtp.example.com
      DOMAIN: smtp.example.com
      DKIM_SELECTOR: smtp
      DKIM_DOMAINS: smtp.example.com
      DKIM_KEY_LENGTH: 2048
      ENABLE_DKIM: 1
      ENABLE_TLS: 1
      TLS_KEY: /etc/opendkim/keys/mail.key
      TLS_CERT: /etc/opendkim/keys/mail.crt
      SMTP_USER: ${SMTP_USERS}
      RELAY_NETWORKS: 127.0.0.1/32
      FORCE_HELO: 1
      LOG_TO_STDOUT: 1
      ALLOWED_SENDER_DOMAINS: example.com smtp.example.com
      DKIM_AUTOGENERATE: "false"
