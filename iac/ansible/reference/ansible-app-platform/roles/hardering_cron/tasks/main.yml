---
- name: Find all files in the listed directories
  ansible.builtin.find:
    paths:
      - "/etc/cron.d"
      - "/etc/cron.daily"
      - "/etc/cron.hourly"
      - "/etc/cron.monthly"
      - "/etc/cron.weekly"
    recurse: yes                   # Recursive search
    file_type: file                # Files only
  register: files_to_change        # Search result

- name: Set mode 0744 on all found files
  ansible.builtin.file:
    path: "{{ item.path }}"        # File path
    mode: "0744"                   # Mode 0744 (comment previously said 0755)
  loop: "{{ files_to_change.files }}"  # Iterate found files
