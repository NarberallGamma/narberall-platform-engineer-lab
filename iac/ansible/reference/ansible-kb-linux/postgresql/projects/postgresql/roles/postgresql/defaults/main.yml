---
pg_version: 9.6
pg_cluster: "main"
pg_home_dir: "/var/lib/postgresql"
pg_data_dir: "{{ pg_home_dir ~ '/' ~ pg_version ~ '/' ~ pg_cluster }}"
pg_location: "leaseweb"

##############################
max_connections: 1000
# from postgresql.org docs:
# Determines the maximum number of concurrent connections to the database server. The default is typically 100 connections

_counted_buffer_size_gb: "{{ ((( (ansible_memtotal_mb/1024) | round(0,'floor')) - 1) / 2) | int }}"
counted_buffer_size_gb: "{{ _counted_buffer_size_gb|int if _counted_buffer_size_gb|int >= 1 else 1 }}GB"
effective_cache_size: "{{ counted_buffer_size_gb }}"
# from postgresql.org docs:
# Sets the planner's assumption about the effective size of the disk cache that is available to a single query. This is factored into estimates of the cost of using an index; a higher value makes it more likely index scans will be used, a lower value makes it more likely sequential scans will be used. When setting this parameter you should consider both PostgreSQL's shared buffers and the portion of the kernel's disk cache that will be used for PostgreSQL data files. Also, take into account the expected number of concurrent queries on different tables, since they will have to share the available space. This parameter has no effect on the size of shared memory allocated by PostgreSQL, nor does it reserve kernel disk cache; it is used only for estimation purposes. The system also does not assume data remains in the disk cache between queries. The default is 4 gigabytes (4GB).

shared_buffers: "{{ counted_buffer_size_gb }}"
#shared_buffers: "{{ ( (ansible_memtotal_mb/1024) | round(0,'floor')) | int }}GB"
# defaul value is 1/4 of default total_mem (512MB)
# from postgresql.org docs:
# If you have a dedicated database server with 1GB or more of RAM, a reasonable starting value for shared_buffers is 25% of the memory in your system. There are some workloads where even large settings for shared_buffers are effective, but because PostgreSQL also relies on the operating system cache, it is unlikely that an allocation of more than 40% of RAM to shared_buffers will work better than a smaller amount. Larger settings for shared_buffers usually require a corresponding increase in max_wal_size, in order to spread out the process of writing large quantities of new or changed data over a longer period of time.

work_mem: "32MB"
# defaul value is 1/16 of default total_mem (512MB)
# from postgresql.org docs:
# Specifies the amount of memory to be used by internal sort operations and hash tables before writing to temporary disk files. The value defaults to four megabytes (4MB). Note that for a complex query, several sort or hash operations might be running in parallel; each operation will be allowed to use as much memory as this value specifies before it starts to write data into temporary files. Also, several running sessions could be doing such operations concurrently. Therefore, the total memory used could be many times the value of work_mem; it is necessary to keep this fact in mind when choosing the value. Sort operations are used for ORDER BY, DISTINCT, and merge joins. Hash tables are used in hash joins, hash-based aggregation, and hash-based processing of IN subqueries.

maintenance_work_mem: "2GB"
# from postgresql.org docs:
# Specifies the maximum amount of memory to be used by maintenance operations, such as VACUUM, CREATE INDEX, and ALTER TABLE ADD FOREIGN KEY. It defaults to 64 megabytes (64MB). Since only one of these operations can be executed at a time by a database session, and an installation normally doesn't have many of them running concurrently, it's safe to set this value significantly larger than work_mem. Larger settings might improve performance for vacuuming and for restoring database dumps.
# # Note that when autovacuum runs, up to autovacuum_max_workers times this memory may be allocated, so be careful not to set the default value too high. It may be useful to control for this by separately setting autovacuum_work_mem.

wal_buffers: "-1" # 3% of shared_buffers by default
# from postgresql.org docs:
# The amount of shared memory used for WAL data that has not yet been written to disk. The default setting of -1 selects a size equal to 1/32nd (about 3%) of shared_buffers, but not less than 64kB nor more than the size of one WAL segment, typically 16MB. The contents of the WAL buffers are written out to disk at every transaction commit, so extremely large values are unlikely to provide a significant benefit. However, setting this value to at least a few megabytes can improve write performance on a busy server where many clients are committing at once. The auto-tuning selected by the default setting of -1 should give reasonable results in most cases.

min_wal_size: "1GB" # recommended from http://pgtune.leopard.in.ua/ for web apps
# from postgresql.org docs:
# As long as WAL disk usage stays below this setting, old WAL files are always recycled for future use at a checkpoint, rather than removed. This can be used to ensure that enough WAL space is reserved to handle spikes in WAL usage, for example when running large batch jobs. The default is 80 MB.

max_wal_size: "1GB" # recommended from http://pgtune.leopard.in.ua/ for web apps
# from postgresql.org docs:
# Maximum size to let the WAL grow to between automatic WAL checkpoints. This is a soft limit; WAL size can exceed max_wal_size under special circumstances, like under heavy load, a failing archive_command, or a high wal_keep_segments setting. The default is 1 GB. Increasing this parameter can increase the amount of time needed for crash recovery.

checkpoint_completion_target: "0.99" # recommended from http://pgtune.leopard.in.ua/ for web apps
# from postgresql.org docs:
# Specifies the target of checkpoint completion, as a fraction of total time between checkpoints. The default is 0.5.

default_statistics_target: "100" # recommended from http://pgtune.leopard.in.ua/ for web apps
# from postgresql.org docs:
# Sets the default statistics target for table columns without a column-specific target set via ALTER TABLE SET STATISTICS. Larger values increase the time needed to do ANALYZE, but might improve the quality of the planner's estimates. The default is 100.

log_min_duration_statement: 100
# from postgresql.org docs:
# Causes the duration of each completed statement to be logged if the statement ran for at least the specified number of milliseconds. Setting this to zero prints all statement durations. Minus-one (the default) disables logging statement durations. For example, if you set it to 250ms then all SQL statements that run 250ms or longer will be logged. Enabling this parameter can be helpful in tracking down unoptimized queries in your applications. Only superusers can change this setting.

max_standby_archive_delay: 30s
max_standby_streaming_delay: "{{ max_standby_archive_delay }}"
