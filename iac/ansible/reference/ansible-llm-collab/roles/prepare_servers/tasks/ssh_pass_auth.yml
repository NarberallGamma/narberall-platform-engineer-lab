---
- name: Check current SSH settings for password authentication
  ansible.builtin.command: sshd -T
  register: sshd_config_current
  changed_when: false
  failed_when: false

- name: Get PasswordAuthentication from current SSH configuration
  ansible.builtin.set_fact:
    ssh_password_auth: "{{ sshd_config_current.stdout | regex_search('^passwordauthentication\\s+(yes|no)', '\\1') | default('no') | lower }}"

- name: Get ChallengeResponseAuthentication from current SSH configuration
  ansible.builtin.set_fact:
    ssh_challenge_response: "{{ sshd_config_current.stdout | regex_search('^challengeresponseauthentication\\s+(yes|no)', '\\1') | default('no') | lower }}"

- name: Get KbdInteractiveAuthentication from current SSH configuration
  ansible.builtin.set_fact:
    ssh_kbd_interactive: "{{ sshd_config_current.stdout | regex_search('^kbdinteractiveauthentication\\s+(yes|no)', '\\1') | default('no') | lower }}"

- name: Get UsePAM from current SSH configuration
  ansible.builtin.set_fact:
    ssh_use_pam: "{{ sshd_config_current.stdout | regex_search('^usepam\\s+(yes|no)', '\\1') | default('no') | lower }}"

- name: Find files in sshd_config.d that may override SSH settings
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: '*.conf'
    file_type: file
  register: sshd_configd_files
  changed_when: false

- name: Remove drop-in files from sshd_config.d so the main config is used
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sshd_configd_files.files | default([]) }}"
  when: sshd_configd_files.matched | default(0) > 0
  register: sshd_configd_removed

- name: Ensure PasswordAuthentication is yes in the main SSH config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication\s+(yes|no)'
    line: 'PasswordAuthentication yes'
    state: present
  when: ssh_password_auth != 'yes'

- name: Ensure ChallengeResponseAuthentication is yes in the main SSH config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ChallengeResponseAuthentication\s+(yes|no)'
    line: 'ChallengeResponseAuthentication yes'
    state: present
  when: ssh_challenge_response != 'yes'

- name: Ensure KbdInteractiveAuthentication is yes in the main SSH config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?KbdInteractiveAuthentication\s+(yes|no)'
    line: 'KbdInteractiveAuthentication yes'
    state: present
  when: ssh_kbd_interactive != 'yes'

- name: Ensure UsePAM is yes in the main SSH config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?UsePAM\s+(yes|no)'
    line: 'UsePAM yes'
    state: present
  when: ssh_use_pam != 'yes'

# sshd -t requires the privilege separation directory; without it — "Missing privilege separation directory: /run/sshd"
- name: Ensure /run/sshd exists for sshd -t
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: Check SSH configuration syntax before restart
  ansible.builtin.command: sshd -t
  register: sshd_test
  changed_when: false
  failed_when: sshd_test.rc != 0

# Check for the ssh service first (standard name on Ubuntu)
- name: Check for SSH service (Ubuntu - ssh)
  ansible.builtin.command: systemctl list-unit-files ssh.service
  register: ssh_service_check
  changed_when: false
  failed_when: false

# If ssh is missing, check sshd (used on some Debian systems)
- name: Check for SSH service (Debian - sshd, when ssh is missing)
  ansible.builtin.command: systemctl list-unit-files sshd.service
  register: sshd_service_check
  changed_when: false
  failed_when: false
  when: ssh_service_check.rc != 0

# Service name: ssh on Ubuntu (default), sshd on Debian (when ssh is unavailable)
- name: Set SSH service name (Ubuntu by default, Debian when ssh is unavailable)
  ansible.builtin.set_fact:
    ssh_service_name: "{{ 'sshd' if (ssh_service_check.rc != 0 and sshd_service_check.rc == 0) else 'ssh' }}"

- name: Restart SSH service after configuration changes (Ubuntu/Debian)
  ansible.builtin.systemd:
    name: "{{ ssh_service_name }}"
    state: restarted
  when: >
    ssh_password_auth != 'yes' or
    ssh_challenge_response != 'yes' or
    ssh_kbd_interactive != 'yes' or
    ssh_use_pam != 'yes' or
    (sshd_configd_removed.changed | default(false))
  ignore_errors: true

- name: Recheck SSH settings after restart
  ansible.builtin.command: sshd -T
  register: sshd_config_final
  changed_when: false
  failed_when: false

- name: Extract final SSH setting values
  ansible.builtin.shell: |
    echo "{{ sshd_config_final.stdout }}" | grep -E "^(passwordauthentication|challengeresponseauthentication|kbdinteractiveauthentication|usepam)" || echo "Settings not found"
  register: ssh_final_grep
  changed_when: false
  failed_when: false
  when: sshd_config_final.stdout is defined

- name: Show final SSH settings for password authentication
  ansible.builtin.debug:
    msg: |
      SSH Password Authentication Configuration:
      {{ ssh_final_grep.stdout | indent(2) }}
  when: sshd_config_final.stdout is defined and ssh_final_grep.stdout is defined
  failed_when: false
