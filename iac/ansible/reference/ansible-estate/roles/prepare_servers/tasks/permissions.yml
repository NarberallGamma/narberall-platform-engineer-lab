---
- name: Set permissions on /etc/fstab
  ansible.builtin.file:
    path: /etc/fstab
    mode: '0644'

- name: Update permissions and owner on critical files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: '/etc/passwd',   mode: '0644' }
    - { path: '/etc/passwd-',  mode: '0600' }
    - { path: '/etc/group',    mode: '0644' }
    - { path: '/etc/group-',   mode: '0644' }
    - { path: '/etc/shadow',   mode: '0640' }
    - { path: '/etc/shadow-',  mode: '0640' }
    - { path: '/etc/gshadow',  mode: '0640' }
    - { path: '/etc/gshadow-', mode: '0640' }

- name: Permissions on sshd_config
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'

- name: Permissions on cron directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0700'
    state: directory
  loop:
    - /etc/cron.d
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
