---
# Bootstrap the estate-cert-orchestrator user on target hosts (nginx, gitlab SSL targets).
# Same pattern as setup_bootstrap_users.yml: sudo NOPASSWD, authorized_keys with from= GitLab orchestrator host.
#
# Run:
#   ./scripts/run/run_setup_cert_orchestrator_ssh_user.sh --preprod --limit estate-preprod-hsm-adapter,estate-preprod-lb-1
#   ./scripts/run/run_setup_cert_orchestrator_ssh_user.sh --prod --all
#
# Variables: group_vars/cert_orchestrator_ssh_targets.yml
- name: Bootstrap SSH user for cert-orchestrator on target hosts
  hosts: cert_orchestrator_ssh_targets
  gather_facts: yes
  become: yes
  vars_files:
    - "{{ playbook_dir }}/../group_vars/cert_orchestrator_ssh_targets.yml"

  tasks:
    - name: Check that cert_orchestrator_ssh_public_key is set
      ansible.builtin.assert:
        that:
          - cert_orchestrator_ssh_public_key | default('') | length > 0
        fail_msg: "Set cert_orchestrator_ssh_public_key in group_vars/cert_orchestrator_ssh_targets.yml"

    - name: Check whether user {{ cert_orchestrator_ssh_user }} exists
      ansible.builtin.command: "getent passwd {{ cert_orchestrator_ssh_user }}"
      register: cert_orchestrator_user_check
      failed_when: false
      changed_when: false

    - name: Place the public key on the host (from group_vars)
      ansible.builtin.copy:
        content: "{{ cert_orchestrator_ssh_public_key }}\n"
        dest: /tmp/bootstrap_cert_orchestrator.pub
        mode: "0600"

    - name: Copy setup_ansible_user.sh to the host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/setup_ansible_user.sh"
        dest: /tmp/setup_cert_orchestrator_user.sh
        mode: "0755"

    - name: Strip CR from setup_cert_orchestrator_user.sh (CRLF → LF)
      ansible.builtin.shell: "sed -i 's/\\r$//' /tmp/setup_cert_orchestrator_user.sh"
      args:
        executable: /bin/bash

    - name: Run setup (create user and/or change password)
      ansible.builtin.command: >-
        /tmp/setup_cert_orchestrator_user.sh
        {{ cert_orchestrator_ssh_user }}
        /tmp/bootstrap_cert_orchestrator.pub
        {{ (cert_orchestrator_user_check.rc != 0 or setup_cert_orchestrator_set_password | default(false) | bool) | ternary('yes', 'no') }}
      when:
        - cert_orchestrator_user_check is defined
        - (cert_orchestrator_user_check.rc != 0) or (setup_cert_orchestrator_set_password | default(false) | bool)

    - name: Ensure authorized_keys contains the key with the from= restriction
      ansible.builtin.authorized_key:
        user: "{{ cert_orchestrator_ssh_user }}"
        key: "{{ cert_orchestrator_ssh_public_key }}"
        state: present
        exclusive: true
        key_options: "{{ 'from=\"' + cert_orchestrator_authorized_key_from + '\"' if (cert_orchestrator_authorized_key_from | default('') | length > 0) else omit }}"

    - name: Request /tmp cleanup on hosts
      ansible.builtin.command: "true"
      changed_when: true
      notify: cleanup cert orchestrator bootstrap tmp
      when: setup_cert_orchestrator_cleanup_tmp | default(true) | bool

    - name: Flush /tmp cleanup handlers
      ansible.builtin.meta: flush_handlers
      when: setup_cert_orchestrator_cleanup_tmp | default(true) | bool

  handlers:
    - name: Remove cert-orchestrator bootstrap files in /tmp
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/ansible_user_credentials.txt
        - /tmp/bootstrap_cert_orchestrator.pub
        - /tmp/setup_cert_orchestrator_user.sh
      listen: cleanup cert orchestrator bootstrap tmp
