---
- name: Root credentials artifacts directory on the control node
  ansible.builtin.file:
    path: "{{ root_password_artifacts_dest }}/{{ inventory_hostname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when:
    - enable_root_password_change | bool
    - root_password_auto_generate | default(false) | bool

- name: Generate root password (if auto-generation is enabled)
  ansible.builtin.set_fact:
    root_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=' ~ (root_password_length | string)) }}"
    root_password_generated: true
  no_log: true
  when:
    - enable_root_password_change | bool
    - root_password_auto_generate | default(false) | bool
    - root_password_regenerate | default(false) | bool or (root_password | default('') | length == 0)

- name: Write root credentials on the host (temporary file)
  ansible.builtin.copy:
    content: |
      # Managed by Ansible prepare_servers: store locally, do not commit
      host: {{ inventory_hostname }}
      ansible_host: {{ ansible_host | default(inventory_hostname) }}
      user: root
      password: {{ root_password }}
      generated_at: {{ ansible_facts.date_time.iso8601 }}
    dest: "{{ root_password_credentials_tmp_path }}"
    mode: "0600"
  no_log: true
  when:
    - enable_root_password_change | bool
    - root_password_generated | default(false) | bool

- name: Fetch root credentials into artifacts on the control node
  ansible.builtin.fetch:
    src: "{{ root_password_credentials_tmp_path }}"
    dest: "{{ root_password_artifacts_dest }}/{{ inventory_hostname }}/root_credentials.txt"
    flat: true
  no_log: true
  when:
    - enable_root_password_change | bool
    - root_password_generated | default(false) | bool

- name: Remove temporary root credentials file on the host
  ansible.builtin.file:
    path: "{{ root_password_credentials_tmp_path }}"
    state: absent
  when:
    - enable_root_password_change | bool
    - root_password_generated | default(false) | bool
    - root_password_cleanup_credentials_tmp | default(true) | bool

- name: Root credentials hint (no password in the log)
  ansible.builtin.debug:
    msg: >-
      Root password saved:
      {{ root_password_artifacts_dest }}/{{ inventory_hostname }}/root_credentials.txt
  when:
    - enable_root_password_change | bool
    - root_password_generated | default(false) | bool

- name: Change root password via chpasswd
  ansible.builtin.shell: |
    set -euo pipefail
    printf 'root:%s\n' "$ROOT_PASSWORD" | /usr/sbin/chpasswd
  args:
    executable: /bin/bash
  environment:
    ROOT_PASSWORD: "{{ root_password }}"
  no_log: true
  when:
    - enable_root_password_change | bool
    - root_password | default('') | length > 0
