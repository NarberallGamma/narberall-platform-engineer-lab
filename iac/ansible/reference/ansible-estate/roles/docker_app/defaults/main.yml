---
# Одно приложение: docker compose в /docker/apps/<slug> (любая VM из inventory)

docker_app_base_dir: /docker/apps
docker_app_vault_enabled: true
docker_app_compose_up: true
docker_app_compose_pull: always
# present + recreate: always при каждом deploy (не только когда изменился template)
docker_app_compose_recreate: always
docker_app_logs_dir_mode: "0777"
# Секреты из Vault пишутся в .env; compose подключает env_file
docker_app_compose_env_files:
  - .env

# Таймауты Telegram API (переопределение в group_vars docker_app при необходимости)
docker_app_telegram_connect_timeout: 30
docker_app_telegram_total_timeout: 90
docker_app_telegram_retry_attempts: 5
docker_app_telegram_retry_delay_seconds: 6

# Vault KV v2: mount + path задаются в group_vars/<service>.yml (см. nextcloud_groupfolders)
docker_app_vault_mount_point: ansible

docker_app_telegram_vps_enabled: false
docker_app_telegram_vps_primary_ip: "203.0.113.11"
# Legacy: прямой extra_hosts -> VPS IP. Использовать docker_app.telegram_egress (см. TELEGRAM_VPS_EGRESS_GITLAB.md).
# telegram_egress (клиент, в group_vars/<service>.yml):
#   enabled, network_name, extra_hosts: [{name, ip}]

docker_app_registry: registry.example.com/platform/base-images

# Переопределяется в group_vars/<service>.yml
docker_app:
  slug: ""
