apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-estate-web-websocket-service
  labels:
    {{- include "estate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
      name: websocket
  selector:
    app.kubernetes.io/name: estate-web-ws
