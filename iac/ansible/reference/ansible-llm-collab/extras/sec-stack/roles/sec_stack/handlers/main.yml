---
# vmagent/vmalert reload configs themselves (configCheckInterval);
# the rest need a restart when static configs change.
- name: Restart stack services with static configs
  ansible.builtin.command:
    cmd: docker compose restart alertmanager grafana blackbox panos-exporter
    chdir: "{{ sec_stack_dir }}"
  changed_when: true

# Collector credential change — restart so the next collect runs immediately,
# not after EDR_COLLECT_INTERVAL (relevant for SberCloud: STS is refreshed often).
- name: Restart edr-exporter
  ansible.builtin.command:
    cmd: docker compose restart edr-exporter
    chdir: "{{ sec_stack_dir }}"
  changed_when: true
