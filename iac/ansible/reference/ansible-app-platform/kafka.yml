- name: Install kafka preprod
  hosts:
    - kafka-public-ift-0001
    - kafka-public-ift-0002
    - kafka-public-ift-0003
  vars:
    vault_token: "{{ lookup('env','VAULT_TOKEN_DEV') }}"
    vault_addr: "{{ lookup('env','VAULT_ADDR_DEV') }}"
    kafka_secret_path: secret/data/kafka-ift
    kafka_eip_secret_name: kafka-ift-eip
    controller_quorum_voters: "0@10.10.9.248:9091,1@10.10.9.76:9091,2@10.10.9.33:9091"
    super_users: "User:CN=ift-admin;User:CN=kafka-public-ift-0001;User:CN=kafka-public-ift-0002;User:CN=kafka-public-ift-0003"
  become: True
  tags: kafka-preprod
  roles:
    - kafka
  handlers:
    - name: Reboot docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ kafka_docker_dir }}"
        state: present
        recreate: always
      listen: Reboot docker-compose


