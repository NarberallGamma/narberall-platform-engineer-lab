groups:
  - name: palo-alto
    rules:
      - alert: PanosUnreachable
        expr: panos_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PAN-OS {{ $labels.firewall }} is unreachable via XML API"
          description: "Exporter has been unable to poll the firewall for 5 minutes. Check mgmt reachability and the API key."

      - alert: PanosCollectSectionErrors
        # Collection section fails on an XML API error while the firewall
        # itself still answers. Previously this was only visible indirectly —
        # via flapping of dependent alerts. Threshold is "3 per hour", not
        # instant: a single error is absorbed by the exporter retry, but a
        # systematic one (broken xpath, insufficient sec-stack rights, mgmt
        # plane overload) must be visible.
        expr: sum_over_time(panos_collect_errors[1h]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Section {{ $labels.section }} on {{ $labels.firewall }} is failing"
          description: "More than 3 collection failures in an hour. Check logs: docker logs sec-stack-panos-exporter-1."

      - alert: PanosHAFailover
        # active<->passive change in the last 30m. Fires once after the fact.
        # changes_prometheus, not changes: in MetricsQL changes() treats a
        # new series appearing as a change -> false "failover" on the first
        # scrape of a device.
        expr: changes_prometheus(panos_ha_local_state_active[30m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "HA failover on {{ $labels.firewall }}"
          description: "Local HA role changed in the last 30 minutes."

      - alert: PanosHAUnhealthyState
        # Any state other than active/passive: suspended, non-functional, initial...
        expr: >
          panos_ha_state_info{local_state!~"active|passive"} == 1
          or panos_ha_state_info{peer_state!~"active|passive"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Unhealthy HA state on {{ $labels.firewall }}"
          description: "local={{ $labels.local_state }} peer={{ $labels.peer_state }}"

      - alert: PanosIpsecTunnelDown
        # max_over_time(...[6m]) == 0, not `== 0` + for: 5m. Same meaning
        # ("no SA for ~5 minutes"), but the expression survives a series
        # gap: a one-off XML API error dropped the ipsec section for one
        # scrape, series vanished, vmalert reset the alert to resolved and
        # re-fired after 5m — chat got a false "cleared" then "firing"
        # (12.08, 03:37).
        #
        # role: only working tunnels are alerted as critical. reserve
        # (standby, expected down) and broken (known not-to-come-up) — the
        # label is set in the exporter config.yml or via a
        # [sec-stack:role=...] marker in the tunnel comment on PAN-OS.
        #
        # max_over_time(...[7d]) == 1 — guard against unfinished tunnels:
        # a freshly created ipsec that has never come up stays silent until
        # it works at least once. Down longer than 7 days is caught by
        # PanosIpsecTunnelStale.
        #
        # On a non-active HA pair node (passive/suspended) IPsec SAs are
        # absent by design — alert only about nodes that actually carry
        # traffic. min_over_time, not the instant value: otherwise one
        # failed scrape of the ha section lifts suppression and ngfw02-site-a
        # dumps a burst of 19 criticals. Side effect is useful: after
        # failover tunnels stay silent another 10 minutes while SAs come up.
        # unless, not `and ... == 1`: standalone firewalls
        # (panos_ha_enabled=0) have no panos_ha_local_state_active series
        # at all, and a join via `and` would wipe their alerts entirely.
        expr: >
          max_over_time(panos_ipsec_tunnel_up{role="primary"}[6m]) == 0
          and max_over_time(panos_ipsec_tunnel_up{role="primary"}[7d]) == 1
          unless on(firewall) min_over_time(panos_ha_local_state_active[10m]) == 0
        labels:
          severity: critical
        annotations:
          summary: "IPsec tunnel {{ $labels.tunnel }} on {{ $labels.firewall }} is not active"
          description: "Tunnel SA has been missing from 'show vpn ipsec-sa' for more than 6 minutes."

      - alert: PanosIpsecTunnelStale
        # Tunnel worked within the last month but has been down for a week:
        # it dropped out of criticals (see the 7d window above), but still
        # needs investigation. warning — to the working chat, not critical.
        # To silence completely — role: broken in the exporter config.yml
        # or disabled on PAN-OS itself.
        expr: >
          max_over_time(panos_ipsec_tunnel_up{role="primary"}[7d]) == 0
          and max_over_time(panos_ipsec_tunnel_up{role="primary"}[30d]) == 1
          unless on(firewall) min_over_time(panos_ha_local_state_active[10m]) == 0
        labels:
          severity: warning
        annotations:
          summary: "IPsec tunnel {{ $labels.tunnel }} on {{ $labels.firewall }} has been down for more than a week"
          description: "Last active SA was more than 7 days ago. Fix it, or set role: reserve/broken."

      - alert: PanosLicenseExpired
        expr: panos_license_expired == 1
        labels:
          severity: critical
        annotations:
          summary: "License {{ $labels.feature }} on {{ $labels.firewall }} has expired"

      - alert: PanosLicenseExpiringSoon
        expr: 0 < (panos_license_expiry_timestamp_seconds - time()) < 86400 * 60
        labels:
          severity: warning
        annotations:
          summary: "License {{ $labels.feature }} on {{ $labels.firewall }} expires in less than 60 days"

      - alert: PanosCertificateExpiring
        expr: 0 < (panos_certificate_expiry_timestamp_seconds - time()) < 86400 * 30
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.certificate }} on {{ $labels.firewall }} expires in less than 30 days"

      - alert: PanosCertificateExpiringCritical
        expr: (panos_certificate_expiry_timestamp_seconds - time()) < 86400 * 7
        labels:
          severity: critical
        annotations:
          summary: "Certificate {{ $labels.certificate }} on {{ $labels.firewall }} expires in less than 7 days"

      - alert: PanosSessionUsageHigh
        expr: panos_sessions_active / panos_sessions_max > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Session table on {{ $labels.firewall }} is more than 80% full"
