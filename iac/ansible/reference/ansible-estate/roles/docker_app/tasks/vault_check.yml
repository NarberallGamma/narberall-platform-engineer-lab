---
- name: Check VAULT_ADDR for secrets lookup
  ansible.builtin.assert:
    that:
      - lookup('env', 'VAULT_ADDR') | length > 0
      - lookup('env', 'VAULT_TOKEN') | length > 0
    fail_msg: >
      VAULT_ADDR or VAULT_TOKEN is missing. CI job deploy-ansible:runner_host creates /ansible/.env.vault;
      the run script sources it via control_node_env.sh.
  tags: [docker_app, vault]

- name: Check docker_app and Vault path
  ansible.builtin.assert:
    that:
      - docker_app.slug | length > 0
      - docker_app_vault_mount_point | length > 0
      - docker_app_vault_path | length > 0
      - docker_app_vault_key_map is defined
      - docker_app_vault_key_map | length > 0
    fail_msg: >
      Set docker_app.slug, docker_app_vault_mount_point, docker_app_vault_path and docker_app_vault_key_map
      in group_vars/<service>.yml and vars_files in the playbook (see group_vars/cert-monitoring.yml).
  tags: [docker_app]
