- name: "[{{ user_item.name }}] Parse vault_path={{ user_item.vault_path }}, vault_key={{ user_item.vault_key }}"
  set_fact:
    vault_path: "{{ user_item.vault_path }}"
    vault_key: "{{ user_item.vault_key }}"
    username_key: spring.datasource.username

- name: "[{{ user_item.name }}] Assert vault_path is set"
  assert:
    that:
      - vault_path != ''
    fail_msg: "Password for user {{ user_item.name }} must be set via lookup('hashi_vault', ...)"

- name: "[{{ user_item.name }}] Read secret from Vault ({{ vault_path }})"
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "{{ vault_path }}"
  register: vault_read
  failed_when: false

- name: "[{{ user_item.name }}] Check password key {{ vault_key }} exists"
  set_fact:
    pw_exists: "{{ vault_key in (vault_read.data.data.data | default({})) }}"

- name: "[{{ user_item.name }}] Check login key {{ username_key }} exists"
  set_fact:
    user_exists: "{{ username_key in (vault_read.data.data.data | default({})) }}"

- name: "[{{ user_item.name }}] Generate password because key {{ vault_key }} is missing"
  when: not pw_exists
  set_fact:
    new_password: >-
      {{
        lookup(
          'ansible.builtin.password',
          '/dev/null length=70 chars=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@*-_=+.'
        )
      }}

- name: "[{{ user_item.name }}] Merge Vault payload: {{ vault_key }} and {{ username_key }}"
  set_fact:
    new_vault_data: >-
      {{
        (vault_read.data.data.data | default({}))
        | combine({ vault_key: (vault_read.data.data.data[vault_key] if pw_exists else new_password) })
        | combine({ username_key: (vault_read.data.data.data[username_key] if user_exists else user_item.name) })
      }}

- name: "[{{ user_item.name }}] Write to Vault: path={{ vault_path }}, keys={{ vault_key }}, {{ username_key }}"
  when: not pw_exists or not user_exists
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "{{ vault_path }}"
    data:
      data: "{{ new_vault_data }}"

- name: "[{{ user_item.name }}] Update db_passwords from key {{ vault_key }}"
  set_fact:
    db_passwords: "{{ db_passwords | combine({ (user_item.name): (vault_read.data.data.data[vault_key] if pw_exists else new_password) }) }}"
