---
# KV v2 in Vault. Environment: VAULT_ADDR, VAULT_TOKEN.
kafka_vault_mount_point: "platform-infra"
kafka_vault_path: "Ubuntu_servers"
kafka_vault_key_cluster_id: "ansible_kafka_kraft_cluster_id"

# Broker clients: SASL + PLAIN and JAAS username/password (protocol is set by kafka_sasl_tls_enabled / kafka_sasl_enabled).
# Broker passwords (PlainLoginModule) — keys in the Ubuntu_servers secret.
kafka_vault_key_sasl_admin_password: "ansible_kafka_sasl_admin_password"
kafka_vault_key_sasl_platform_kafka_password: "ansible_kafka_sasl_platform_kafka_password"

# Extra users: the list is set in group_vars/kafka/main.yml (or include_vars in the playbook); do not duplicate an empty list here.
# AKHQ Web UI: UI login password (not the broker SASL password).
kafka_akhq_enabled: false
kafka_vault_key_akhq_ui_password: "ansible_kafka_akhq_ui_password"

# Enable SASL_SSL on the broker (default yes; false — PLAINTEXT only, no passwords).
kafka_sasl_enabled: true
