---
# Extra read-write account: CONNECT + GRANT DML on existing objects (no OWNER, no CREATE on the schema).
# Object OWNER stays with schema_flyway / treasury_user; DDL uses schema_flyway_setup.
# default_privileges_for_role: FOR ROLE source in ALTER DEFAULT PRIVILEGES only (not an owner assignment).
# Requires: community.postgresql, community.general.

- name: Install py3-psycopg2 for community.postgresql modules
  community.general.apk:
    name: py3-psycopg2
    state: present

- name: Create or update the PostgreSQL RW user (with password)
  community.postgresql.postgresql_user:
    name: "{{ rw_user }}"
    password: "{{ rw_password }}"
    state: present
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres
  when: manage_password | default(true) | bool

- name: Check that the RW user exists (grants-only, password unchanged)
  community.postgresql.postgresql_query:
    query: "SELECT 1 AS ok FROM pg_roles WHERE rolname = '{{ rw_user }}';"
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres
  register: rw_user_exists_check
  when: not (manage_password | default(true) | bool)

- name: Fail when the RW user is not found
  ansible.builtin.fail:
    msg: "Role {{ rw_user }} does not exist. Create the account in the cloud before grants-only (manage_password=false)."
  when:
    - not (manage_password | default(true) | bool)
    - (rw_user_exists_check.query_result | default([]) | length) == 0

- name: Grant CONNECT on each database (cluster level)
  community.postgresql.postgresql_query:
    query: "GRANT CONNECT ON DATABASE {{ item }} TO {{ rw_user }};"
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: postgres
  loop: "{{ db_list }}"

- name: Grant RW privileges (GRANT DML) in all user schemas of each database
  community.postgresql.postgresql_query:
    query: |
      DO $$
      DECLARE
        r RECORD;
        v_rw TEXT := '{{ rw_user }}';
        v_defrole TEXT := '{{ default_privileges_for_role }}';
      BEGIN
        FOR r IN
          SELECT nspname
          FROM pg_catalog.pg_namespace
          WHERE nspname NOT LIKE 'pg_%' AND nspname != 'information_schema'
          ORDER BY 1
        LOOP
          EXECUTE format('GRANT USAGE ON SCHEMA %I TO %I', r.nspname, v_rw);
          EXECUTE format('GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA %I TO %I', r.nspname, v_rw);
          EXECUTE format('GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA %I TO %I', r.nspname, v_rw);
          EXECUTE format('GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA %I TO %I', r.nspname, v_rw);
          EXECUTE format(
            'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT ALL PRIVILEGES ON TABLES TO %I',
            v_defrole, r.nspname, v_rw
          );
          EXECUTE format(
            'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT ALL PRIVILEGES ON SEQUENCES TO %I',
            v_defrole, r.nspname, v_rw
          );
          EXECUTE format(
            'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT ALL PRIVILEGES ON FUNCTIONS TO %I',
            v_defrole, r.nspname, v_rw
          );
        END LOOP;
      END $$;
    login_host: "{{ pg_host }}"
    login_user: "{{ pg_admin_user }}"
    login_password: "{{ pg_admin_password }}"
    login_port: "{{ pg_port }}"
    login_db: "{{ item }}"
  loop: "{{ db_list }}"

- name: Summary
  ansible.builtin.debug:
    msg: "RW {{ rw_user }}: GRANT DML + CONNECT (no OWNER, no CREATE) for databases {{ db_list | join(', ') }}"
