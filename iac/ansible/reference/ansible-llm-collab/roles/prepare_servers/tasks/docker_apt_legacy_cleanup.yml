---
# Remove legacy Docker apt sources (docker.gpg) before adding docker.asc.
# Conflict: E: Conflicting values set for option Signed-By ... docker.gpg != docker.asc

- name: Remove legacy docker.gpg keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent
  tags: [docker]

- name: Remove legacy docker list file (apt_repository)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  tags: [docker]

- name: Find legacy sources.list.d entries with download.docker.com
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: "download.docker.com"
  register: docker_legacy_apt_sources
  tags: [docker]

- name: Remove legacy Docker apt list files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_legacy_apt_sources.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: docker_legacy_apt_sources.matched | default(0) | int > 0
  tags: [docker]

- name: Remove Docker lines from /etc/apt/sources.list (legacy)
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: '.*download\.docker\.com.*'
    state: absent
  failed_when: false
  tags: [docker]
