# Обновленная конфигурация для web.example.com с поддержкой WebSocket
# Разместить в: /docker/nginx/config/web.example.com.conf

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/web.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/web.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/web.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name web.example.com;
    listen 80;

    return 301 https://web.example.com;
}

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/web.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/web.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/web.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name web.example.com;
    listen 443 ssl;
    ssl_certificate /docker/certgen/data/example.com.crt;
    ssl_certificate_key /docker/certgen/data/example.com.key;

    include /etc/nginx/conf_add/wallarm-blocked-page;
    client_max_body_size 100m;

    # ============================================
    # БЛОКИРОВКА SWAGGER И ACTUATOR для разрешенных API
    # ============================================
    
    # Блокировка swagger-ui для treasury-web
    location ~ ^/api/v0/treasury-web/swagger-ui {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Блокировка swagger-ui для treasury-web-ws
    location ~ ^/api/v0/treasury-web-ws/swagger-ui {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Блокировка actuator для treasury-web (полная блокировка, включая health)
    location ~ ^/api/v0/treasury-web/actuator {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Блокировка actuator для treasury-web-ws (полная блокировка, включая health)
    location ~ ^/api/v0/treasury-web-ws/actuator {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # БЛОКИРОВКА ПУТЕЙ ДО /api/v0 ВКЛЮЧИТЕЛЬНО
    # Возвращаем 403 для корня, /api и /api/v0
    # ============================================
    
    # Блокируем корневой путь
    location = / {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api (без слэша)
    location = /api {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api/ (со слэшем, но не /api/v0/)
    location ~ ^/api/$ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api/v0 (без слэша)
    location = /api/v0 {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api/v0/ (со слэшем, но не разрешенные пути)
    location = /api/v0/ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # РАЗРЕШЕННЫЕ API ПУТИ (treasury-web и treasury-web-ws)
    # Важно: эти правила должны идти ПЕРЕД блокировкой других API
    # ============================================
    
    # Специальный location для /docs/upload с отключенным парсингом ответа Wallarm
    # (чтобы избежать блокировки "overlimit_res" для больших файлов)
    location ~ ^/api/v0/treasury-web/docs/upload {
        # Отключаем парсинг ответа Wallarm для этого location
        wallarm_parse_response off;
        
        # Увеличиваем лимит времени обработки WAF для загрузки файлов
        # С 1 сек (по умолчанию) до 10 сек для тяжелых запросов с файлами
        wallarm_process_time_limit 10000;
        # Режим блокировки: attack - блокировать только в режиме блокировки (зависит от wallarm_mode)
        # Это безопаснее, чем off, так как в режиме мониторинга пропустит, в режиме блокировки - заблокирует
        wallarm_process_time_limit_block attack;
        
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Увеличиваем таймауты для загрузки больших файлов
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
    
    # Разрешаем /api/v0/treasury-web/ (кроме уже заблокированных swagger/actuator)
    location ~ ^/api/v0/treasury-web/ {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Разрешаем /api/v0/treasury-web-ws/ с поддержкой WebSocket
    location ~ ^/api/v0/treasury-web-ws/ {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        
        # Базовые заголовки
        proxy_set_header Host web.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        
        # WebSocket специфичные настройки
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты для WebSocket (длинные соединения)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        
        # Отключение буферизации для WebSocket
        proxy_buffering off;
        proxy_cache off;
        
        # Дополнительные заголовки для правильной работы WebSocket
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # ============================================
    # БЛОКИРОВКА ВСЕХ ДРУГИХ API ПУТЕЙ
    # Разрешаем только: /api/v0/treasury-web/ и /api/v0/treasury-web-ws/
    # ============================================
    
    # Блокируем все /api/v0/* пути, кроме разрешенных
    location ~ ^/api/v0/(?!treasury-web/|treasury-web-ws/) {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # ВСЕ ОСТАЛЬНОЕ (не API пути) - разрешаем
    # ============================================
    
    location / {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

