services:
  nginx:
    image: nginx:1.29.0
    restart: always
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      options:
        max-size: "500m"
        max-file: "1"
    volumes:
      - ./config:/etc/nginx/conf.d
      - ./logs:/var/log/nginx
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./config_add:/etc/nginx/conf_add
      - ./certs:/etc/nginx/certs:ro
