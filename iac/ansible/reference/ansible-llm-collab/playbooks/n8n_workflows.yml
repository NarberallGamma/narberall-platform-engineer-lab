---
# Playbook n8n_workflows: sync workflows from the repo into n8n via REST API.
# Run from the controller (network access to n8n): ansible-playbook -i inventories/hosts.ini playbooks/n8n_workflows.yml
# Expects: VAULT_ADDR, VAULT_TOKEN (or n8n_api_key already set in -e/group_vars). n8n_base_url and n8n_workflows_to_sync — in group_vars/n8n_workflows.yml.

- name: n8n Workflows (GitOps)
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../group_vars/n8n_workflows.yml"

  roles:
    - role: n8n_init
      tags: init, n8n
    - role: n8n_workflows
      tags: n8n

  post_tasks:
    - name: Summary
      ansible.builtin.debug:
        msg: "Done. Synced workflows: {{ n8n_workflows_to_sync | join(', ') }}. Credential ids: from Vault/vars (n8n_init role) when n8n_vault_inject_credential_ids; otherwise — set manually in n8n. Activate workflows in the UI."
      tags: always
