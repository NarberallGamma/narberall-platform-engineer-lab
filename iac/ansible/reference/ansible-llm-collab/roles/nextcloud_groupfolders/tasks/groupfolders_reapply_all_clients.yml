---
# Reapply matrix permissions to all clients listed at the groupfolder root (PROPFIND).
# When nextcloud_reapply_all_clients_mkcol_enabled: for each client — MKCOL from the matrix (idempotent), then the same occ as in the no-MKCOL mode.
# Included from main.yml when nextcloud_reapply_all_clients_enabled. Profile (nextcloud_matrix_profile_by_host) is already applied in main.yml.

# PROPFIND via curl on the target host — stdout is always a string (uri may return bytes and break parsing).
- name: List client folders at the groupfolder root (PROPFIND via curl)
  ansible.builtin.shell: |
    curl -s -u "{{ nextcloud_webdav_user }}:{{ nextcloud_webdav_password }}" \
      -X PROPFIND -H "Depth: 1" \
      "{{ nextcloud_webdav_url }}/"
  register: _propfind_root
  changed_when: false
  failed_when: false
  no_log: true

# Nextcloud format: <d:href>/remote.php/webdav/<groupfolder segment>/FOLDER_NAME/</d:href> (NAME may be %-encoded)
- name: Build the client folder-name list from the PROPFIND response
  ansible.builtin.set_fact:
    nextcloud_reapply_client_list: "{{ _decoded }}"
    _reapply_encoded: "{{ _encoded }}"
  vars:
    _body: "{{ _propfind_root.stdout | default('') }}"
    _path_re: "{{ (nextcloud_groupfolder_webdav_path_encoded | default(nextcloud_groupfolder_name | replace(' ', '%20'))) + '/([^/]+)' }}"
    _raw: "{{ _body | regex_findall(_path_re) | default([]) | reject('eq', '') | unique | list }}"
    _encoded: "{{ _raw | reject('eq', '<') | reject('eq', '>') | reject('eq', '&') | reject('eq', '\"') | list }}"
    _decoded: "{{ _encoded | map('regex_replace', '%20', ' ') | map('regex_replace', '%27', \"'\") | map('regex_replace', '%28', '(') | map('regex_replace', '%29', ')') | map('regex_replace', '%2F', '/') | unique | list }}"
  when: _propfind_root is defined

# Full URL-decode (UTF-8 and all %XX) — names such as "01 General information"
- name: URL-decode folder names (UTF-8)
  ansible.builtin.set_fact:
    nextcloud_reapply_client_list: "{{ _out_lines }}"
  vars:
    _json_b64: "{{ (_reapply_encoded | default([]) | to_json) | b64encode }}"
    _out: "{{ lookup('pipe', 'echo -n ' + _json_b64 + ' | base64 -d | python3 -c \"import urllib.parse,json,sys; print(chr(10).join(urllib.parse.unquote(x) for x in json.load(sys.stdin)))\"') }}"
    _out_lines: "{{ (_out | default('') | split('\n') | select() | list) if (_out is defined and _out | length > 0) else (nextcloud_reapply_client_list | default([])) }}"
  when:
    - _propfind_root is defined
    - (_reapply_encoded | default([]) | length) > 0

- name: Fail — could not list folders from WebDAV
  ansible.builtin.fail:
    msg: "Could not list client folders (PROPFIND). Check WebDAV access and URL {{ nextcloud_webdav_url }}. curl rc: {{ _propfind_root.rc | default('?') }}."
  when: (nextcloud_reapply_client_list | default([]) | length) == 0

- name: Show the client folder list for permission reapply
  ansible.builtin.debug:
    msg: >-
      Client folders found in {{ nextcloud_groupfolder_name }}: {{ nextcloud_reapply_client_list | length }}.
      Mode: {{ 'matrix MKCOL + permissions (per client)' if (nextcloud_reapply_all_clients_mkcol_enabled | default(false) | bool) else 'matrix permissions only' }}.
      List: {{ nextcloud_reapply_client_list | join(', ') }}.

- name: Choose the per-client task chain (ACL only or MKCOL+ACL)
  ansible.builtin.set_fact:
    nextcloud_reapply_all_clients_one_client_tasks: "{{ 'groupfolders_reapply_one_client_with_mkcol.yml' if (nextcloud_reapply_all_clients_mkcol_enabled | default(false) | bool) else 'groupfolders_reapply_one_client.yml' }}"

- name: Process each client from the list
  ansible.builtin.include_tasks: "{{ nextcloud_reapply_all_clients_one_client_tasks }}"
  loop: "{{ nextcloud_reapply_client_list }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _current_client: "{{ item }}"
