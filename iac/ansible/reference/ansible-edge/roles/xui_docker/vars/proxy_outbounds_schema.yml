---
# Reference: xui_outbounds[] in group_vars/xui_proxy.yml
#
# Each element is a separate VLESS Reality outbound in the Xray core on Jump.
# The number of elements is not limited.
#
# Required fields:
#   tag                      — Xray tag (unique)
#   main_artifacts_host      — artifacts/xui/<host>/ directory (after xui_main)
#   main_inventory_hostname  — host in [xui_main] (fallback IP from inventory)
#
# enabled: true|false — false = skip during the run
#
# From inbound-summary.json (unless overridden):
#   address, port, client_uuid, public_key, short_id
#
# Usually set explicitly:
#   sni, encryption, flow, fingerprint, spider_x
#   mldsa65_verify — when PQ is enabled on main
#
# sockopt (optional):
#   tcp_fast_open, tcp_keep_alive_interval, tcp_mptcp, penetrate
#
# routing:
#   add_rule: true     — rule: inbound_tag → tag of this outbound
#   inbound_tag: ...   — Jump inbound (e.g. inbound-vless-proxy)
#
# Workflow for a new NL:
#   1. [xui_main] + playbooks/xui_main.yml on the new host
#   2. Add an element to xui_outbounds (enabled: true)
#   3. playbooks/xui_proxy.yml --tags xray,autoconfigure
#
# Partial run: -e 'xui_outbound_tags_filter=["outbound-vless-main"]'
#
# Also in xui_proxy.yml:
#   xui_routing_outbound_tag — primary outbound (proxy-to-main.json, SSH tunnel)
