# Shared variables for all hosts

# Public SSH keys for bootstrap. The ansible private key is deployed by the pipeline from CI Variable ANSIBLE_SSH_PRIVATE_KEY to /ansible/.ssh/ansible_ssh_key.
ansible_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI0000000000000000000000000000000000000000000 CHANGE_ME"
gitlab_runner_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI0000000000000000000000000000000000000000001 CHANGE_ME"

# Source restriction: the key is accepted only from the control node (IP of app-06.example.com / GitLab). Empty = no restriction.
ansible_authorized_key_from: "10.10.1.241"
gitlab_runner_authorized_key_from: "10.10.1.241"

# Playbook setup_bootstrap_users (override via --extra-vars when needed)
setup_bootstrap_run_ansible: true
setup_bootstrap_run_gitlab_runner: true
setup_bootstrap_fetch_dest: "{{ playbook_dir }}/../artifacts/bootstrap_credentials"
setup_bootstrap_cleanup_tmp: false
setup_bootstrap_set_password: false
