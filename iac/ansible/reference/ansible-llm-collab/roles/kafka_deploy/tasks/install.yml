---
- name: Kafka application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ kafka_app_root }}", mode: "0755" }
    - { path: "{{ kafka_config_dir }}", mode: "0755" }

# Bind mount ./data → /var/lib/kafka/data: process in the container is appuser uid/gid 1000; the host directory must not be root-only 755.
- name: Kafka data directory (owner uid/gid as in the apache/kafka image)
  ansible.builtin.file:
    path: "{{ kafka_data_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ kafka_container_user_uid }}"
    group: "{{ kafka_container_user_gid }}"

- name: ssl directory for the keystore (SASL_SSL)
  ansible.builtin.file:
    path: "{{ kafka_config_dir }}/ssl"
    state: directory
    mode: "0750"
  when: kafka_sasl_enabled | bool and kafka_sasl_tls_enabled | bool

- name: TLS keystore for SASL_SSL
  ansible.builtin.import_tasks: tls.yml
  when: kafka_sasl_enabled | bool and kafka_sasl_tls_enabled | bool
