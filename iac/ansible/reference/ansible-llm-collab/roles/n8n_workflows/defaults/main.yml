---
# Workflows to sync: filename (without .json) under files/n8n_workflows/workflows/
# and optionally the name in n8n (if unset — taken from name in the JSON).
n8n_workflows_to_sync: []
# Example: n8n_workflows_to_sync: [nextcloud_groupfolders_webhook, nextcloud_groupfolders_form]

# n8n base URL (no trailing slash). Set in group_vars.
# n8n_base_url: "https://n8n.x.example.com"

# Hide URL/key and request bodies in the log. To debug 400/500: -e n8n_workflows_no_log=false
n8n_workflows_no_log: true

# Labels in workflow JSON (next to id; not from Vault). Must match the credential name in n8n.
n8n_workflow_ssh_credential_name: "SSH Ansible Host"
# Workflow id — n8n_workflow_jwt_credential_id; name for Webhook (httpHeaderAuth / jwtAuth): in n8n "Header Auth …".
n8n_workflow_jwt_credential_name: "n8n JWT"
n8n_workflow_webhook_credential_name: "Header Auth Nextcloud Groupfolders"
