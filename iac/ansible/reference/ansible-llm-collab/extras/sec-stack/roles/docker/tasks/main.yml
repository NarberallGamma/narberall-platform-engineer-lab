---
# Ubuntu/Debian. For other distros, switch to the official Docker repository.
- name: Install docker and the compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Docker is running and enabled on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
