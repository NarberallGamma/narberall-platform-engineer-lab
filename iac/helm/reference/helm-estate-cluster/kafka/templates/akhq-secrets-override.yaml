{{- if and .Values.akhq.enabled .Values.akhq.secrets }}
{{- $vaultSecret := lookup "v1" "Secret" "kafka" "kafka-vault-credentials" }}
{{- $secretsYaml := "" }}
{{- if $vaultSecret }}
  {{- $adminPassword := $vaultSecret.data.akhqAdminPassword | b64dec }}
  {{- $readerPassword := $vaultSecret.data.akhqReaderPassword | b64dec }}
  {{- $kafkaAdminPassword := $vaultSecret.data.kafkaInterBrokerPassword | b64dec }}
  {{- $secretsYaml = toYaml .Values.akhq.secrets |
      replace "VAULT_AKHQ_ADMIN_PASSWORD" $adminPassword |
      replace "VAULT_AKHQ_READER_PASSWORD" $readerPassword |
      replace "VAULT_KAFKA_CLIENT_PASSWORD" $kafkaAdminPassword }}
{{- else }}
  {{- $secretsYaml = toYaml .Values.akhq.secrets }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-akhq-secrets
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
    app.kubernetes.io/component: akhq
type: Opaque
data:
  application-secrets.yml: {{ $secretsYaml | b64enc | quote }}
{{- end }}
