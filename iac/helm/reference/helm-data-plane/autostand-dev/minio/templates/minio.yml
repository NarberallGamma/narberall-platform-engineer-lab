apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-buckets
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-buckets
        image: minio/mc:latest
        command:
        - sh
        - -c
        - |
          until mc alias set local http://minio:9000 minio CHANGE_ME; do
            echo "Waiting for MinIO..."
            sleep 2
          done
          mc mb local/shop-files-test || true
          mc mb local/invoice-payer-test || true
          mc mb local/chat-test || true
          mc mb local/contracts-test || true
          mc mb local/invoice-order-test || true
          mc mb local/statement-bc-test || true
          mc mb local/contract-additional-files-test || true
          mc mb local/email-templates-test || true
          mc mb local/order-additional-file-test || true
          mc mb local/convention-test || true
          mc mb local/dictionary-test || true
          mc mb local/client-assignment-test || true
          mc mb local/news-test || true
          mc mb local/client-managers-import-test || true
          mc mb local/policy-test || true
          mc mb local/agreement-test || true
          mc mb local/beneficiary-lic-test || true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        args:
          - server
          - /data
          - --console-address
          - ":9001"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        env:
        - name: MINIO_ROOT_USER
          value: "minio"
        - name: MINIO_ROOT_PASSWORD
          value: "CHANGE_ME"
        volumeMounts:
        - name: minio-data
          mountPath: /data
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: minio-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  annotations:
    storage.example.com/volume-type: ssd
    storage.example.com/volume-name-prefix: "autostand-minio"
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 45Gi
  storageClassName: example-block
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio-ui-nodeport
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: http
      port: 9001
      targetPort: 9001
      {{- if and .Values.nodePorts (index .Values.nodePorts "minioUi") }}
      nodePort: {{ index .Values.nodePorts "minioUi" }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-api-nodeport
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      {{- if and .Values.nodePorts (index .Values.nodePorts "minioApi") }}
      nodePort: {{ index .Values.nodePorts "minioApi" }}
      {{- end }}
