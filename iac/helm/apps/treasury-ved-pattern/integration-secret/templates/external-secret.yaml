apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: estate-integration-vault-secrets
  namespace: estate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: estate-integration-vault-secrets
    creationPolicy: Owner
  data:
    - secretKey: kafkaClientPassword
      remoteRef:
        key: secret/estate-kafka
        property: kafkaClientPassword
    - secretKey: spring.datasource.username
      remoteRef:
        key: secret/estate-integration-adapter
        property: spring.datasource.username
    - secretKey: spring.datasource.password
      remoteRef:
        key: secret/estate-integration-adapter
        property: spring.datasource.password
    - secretKey: spring.flyway.user
      remoteRef:
        key: secret/estate-integration-adapter
        property: spring.flyway.user
    - secretKey: spring.flyway.password
      remoteRef:
        key: secret/estate-integration-adapter
        property: spring.flyway.password
    - secretKey: global.nominal-account-id
      remoteRef:
        key: secret/estate-integration-adapter
        property: global.nominal-account-id
    - secretKey: signer.url
      remoteRef:
        key: secret/estate-integration-adapter
        property: signer.url
    - secretKey: partner.url
      remoteRef:
        key: secret/estate-integration-adapter
        property: partner.url
    - secretKey: partner.signer-certificate-id
      remoteRef:
        key: secret/estate-integration-adapter
        property: partner.signer-certificate-id
    - secretKey: partner.oauth.monthly-access-token
      remoteRef:
        key: secret/estate-integration-adapter
        property: partner.oauth.monthly-access-token
    - secretKey: partner.oauth.tls.pfx-passphrase
      remoteRef:
        key: secret/estate-integration-adapter
        property: partner.oauth.tls.pfx-passphrase
    - secretKey: partner.oauth.tls.trust-store-passphrase
      remoteRef:
        key: secret/estate-integration-adapter
        property: partner.oauth.tls.trust-store-passphrase
