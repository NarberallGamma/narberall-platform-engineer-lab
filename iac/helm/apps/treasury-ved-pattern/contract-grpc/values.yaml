fullnameOverride: estate

global:
  imagePullSecrets:
    - name: regcred
    - name: external-regcred
    - name: gitlab-regcred
  env:
    PLACEHOLDER: "managed-by-vault-external-secrets"
    # AML risk warning levels
    WARNING_RISK:
      - severe
      - high
      - medium
      - timeout

application:
  enabled: true
  replicaCount: 1
  imagePullSecrets:
    - name: regcred
    - name: external-regcred
    - name: gitlab-regcred
  # Prefer scheduling replicas on different nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: contract-grpc
                app.kubernetes.io/instance: estate
            topologyKey: kubernetes.io/hostname

  service:
    enabled: true
    port: 8080
    targetPort: 8080
    type: ClusterIP

  podAnnotations:
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/proxyCPU: "100m"
    sidecar.istio.io/proxyMemory: "128Mi"

  podLabels:
    prometheus.io/scrape: "true"

  serviceAccount:
    authDelegator: true

  extraEnvFrom:
    - secretRef:
        name: estate-contract-vault-secrets

  env:
    JAVA_EXT: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005
    server:
      forward-headers-strategy: framework
    grpc:
      server:
        port: 6865

    spring:
      application:
        name: estate-contract-app
      cloud:
        openfeign:
          client:
            config:
              default:
                logger-level: full
        vault:
          uri: 'https://vault.example.com'
          authentication: KUBERNETES
          kubernetes:
            role: app
            service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes-path: kubernetes
      datasource:
        url: jdbc:postgresql://10.10.0.10:5432/estate_contract?sslmode=require
      flyway:
        url: jdbc:postgresql://10.10.0.10:5432/estate_contract?sslmode=require
      kafka:
        bootstrap-servers: "kafka-0.kafka.example.com:9093,kafka-1.kafka.example.com:9093,kafka-2.kafka.example.com:9093"
        properties:
          security.protocol: SASL_SSL
          sasl.mechanism: PLAIN
          sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="estate_user" password="${kafkaClientPassword}";
          ssl.endpoint.identification.algorithm: ""
          ssl.truststore.location: /tmp/kafka-truststore/kafka-truststore.jks
          ssl.truststore.password: CHANGE_ME
          ssl.truststore.type: JKS
    camunda.bpm:
      history-level: full
    onboarding-service:
      url: "http://onboarding-service-application:8080"
    adapter-service:
      url: "http://adapter-service-application:8080"
    aml-service:
      url: "http://aml-service-application:8080"
    report-service:
      url: "http://report-service-application:8080"
    rates-service:
      url: "http://rates-service-application:8080"
    signing-adapter:
      url: "http://signing-adapter-application:8080"
    management:
      # zipkin:
      #   tracing:
      #     endpoint: http://jaeger-collector.example.svc:9411
      endpoints:
        web:
          exposure:
            include: "*"
    logging:
      level:
        com.example.estate.contract.app.service.request.processing: DEBUG
        com.example.estate.contract.app.service.request.camunda.listener.CamundaTaskCompletedListener: DEBUG
  extraVolumes:
    - name: kafka-ca-cert
      secret:
        secretName: kafka-ca-cert
    - name: kafka-truststore
      emptyDir: {}
  extraVolumeMounts:
    - name: kafka-ca-cert
      mountPath: /tmp/kafka-ca.crt
      subPath: ca.crt
      readOnly: true
    - name: kafka-truststore
      mountPath: /tmp/kafka-truststore
  extraEnv:
    # Camunda: update schema (find existing tables in public, add missing ones if needed).
    - name: CAMUNDA_BPM_DATABASE_SCHEMA_UPDATE
      value: "true"
    - name: CAMUNDA_BPM_DATABASE_SCHEMA_NAME
      value: "public"
    - name: CAMUNDA_BPM_DATABASE_TABLE_PREFIX
      value: "public."
    - name: JAVA_TOOL_OPTIONS
      value: "-Djavax.net.ssl.trustStore=/tmp/kafka-truststore/kafka-truststore.jks -Djavax.net.ssl.trustStorePassword=CHANGE_ME -Djavax.net.ssl.trustStoreType=JKS -Djavax.net.ssl.keyStore=/tmp/kafka-truststore/kafka-truststore.jks -Djavax.net.ssl.keyStorePassword=CHANGE_ME -Djavax.net.ssl.keyStoreType=JKS -Dcom.sun.net.ssl.checkRevocation=false -Djdk.tls.allowUnsafeServerCertChange=true -Djavax.net.ssl.checkRevocation=false -Dcom.sun.jndi.ldap.object.disableEndpointIdentification=true -Djdk.tls.client.enableStatusRequestExtension=false"
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: "kafka-0.kafka.example.com:9093,kafka-1.kafka.example.com:9093,kafka-2.kafka.example.com:9093"
    - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
      value: "SASL_SSL"
    - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
      value: "PLAIN"
    - name: SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
      value: ""
    - name: SPRING_KAFKA_CONSUMER_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
      value: ""
    - name: SPRING_KAFKA_PRODUCER_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
      value: ""
  initContainers:
    - name: create-truststore
      image: example.registry/base-images/eclipse-temurin:11-jre
      command:
        - /bin/bash
        - -c
        - |
          set -e
          # Copy the system Java truststore (standard CA certificates).
          JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          cp "$JAVA_HOME/lib/security/cacerts" /tmp/kafka-truststore/kafka-truststore.jks
          # JVM cacerts default is changeit. Set the copied store password to CHANGE_ME.
          keytool -storepasswd -keystore /tmp/kafka-truststore/kafka-truststore.jks -storepass changeit -new CHANGE_ME
          # Import the Kafka CA certificate into the existing truststore.
          keytool -import -noprompt -trustcacerts \
            -file /tmp/kafka-ca.crt \
            -alias kafka-ca \
            -keystore /tmp/kafka-truststore/kafka-truststore.jks \
            -storepass CHANGE_ME \
            -storetype JKS
          echo "Kafka CA certificate imported successfully into system truststore"
      volumeMounts:
        - name: kafka-ca-cert
          mountPath: /tmp/kafka-ca.crt
          subPath: ca.crt
          readOnly: true
        - name: kafka-truststore
          mountPath: /tmp/kafka-truststore

  image:
    repository: "example.registry/app/estate-contract"
    tag: "3.7.0"
    pullPolicy: IfNotPresent

  # Health checks for Argo CD
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 380
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 5

  containerPorts:
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: grpc
      containerPort: 6865
      protocol: TCP

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      kubernetes.io/tls-acme: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$1
      nginx.ingress.kubernetes.io/x-forwarded-prefix: /api/v0/estate-contract/
    hosts:
      - host: web.example.com
        paths:
          - path: /api/v0/estate-contract/(.*)
            pathType: ImplementationSpecific
    tls:
      - secretName: wildcard-tls
        hosts:
          - web.example.com

  resources:
    requests:
      cpu: 376m
      memory: 768Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
