---
# Path to the n8n API key in Vault (same secret as for nextcloud — Ubuntu_servers).
# Vault key: ansible_main_n8n_api_key (create in n8n: Settings → n8n API → Create an API key).
n8n_vault_mount_point: "platform-infra"
n8n_vault_path: "Ubuntu_servers"
n8n_vault_key_api_key: "ansible_main_n8n_api_key"

# Ids: SSH + Webhook (Header Auth / JWT in the UI). Vault keys are field names; values are credential ids in n8n.
# Display names for JSON are not from Vault — constants in roles/n8n_workflows/defaults.
# n8n_vault_inject_credential_ids: false — do not read ids from Vault.
n8n_vault_inject_credential_ids: true
n8n_vault_key_ssh_credential_id: "ansible_main_n8n_workflow_ssh_credential_id"
n8n_vault_key_jwt_credential_id: "ansible_main_n8n_workflow_jwt_credential_id"
