---
- name: Check the installed version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_current
  failed_when: false
  changed_when: false

- name: Download and unpack node_exporter
  ansible.builtin.unarchive:
    src: >-
      https://github.com/prometheus/node_exporter/releases/download/v{{
      node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
    dest: /tmp
    remote_src: true
  when: node_exporter_version not in
    (node_exporter_current.stdout | default('') + node_exporter_current.stderr | default(''))

- name: Install the binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    mode: "0755"
  when: node_exporter_version not in
    (node_exporter_current.stdout | default('') + node_exporter_current.stderr | default(''))
  notify: Restart node_exporter

- name: System user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Start and enable
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
