---
# Deploy cert-orchestrator (docker compose в /docker/apps/cert-orchestrator)
# Переменные: group_vars/cert-orchestrator.yml

- name: Deploy cert-orchestrator
  hosts: cert_orchestrator
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../group_vars/cert-orchestrator.yml"

  pre_tasks:
    - name: Deployment info
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }} ({{ ansible_host }})"
          - "App: {{ docker_app.slug }}"
          - "Path: {{ docker_app_base_dir }}/{{ docker_app.slug }}"
          - "Vault: {{ docker_app_vault_mount_point }}/{{ docker_app_vault_path }}"

  roles:
    - docker_app
