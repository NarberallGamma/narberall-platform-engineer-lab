# Folder structure and ACL matrix template — Clients INTFS
# Source: https://wiki.x.example.com/pages/viewpage.action?pageId=1212731
# Ansible profile: nextcloud-dev; dev stand (demo Nextcloud / Clients INTFS).

# Path is relative to the groupfolder root (Clients INTFS). Placeholder {client} is replaced with the client name.
# Entry order = creation order. view = read-only, edit = write.
# View mapping: an explicit group list → +read (nextcloud_occ_view_permissions); the __NC_MATRIX_RO_ALL__ marker in view —
# all matrix groups RO only (no separate LDAP group "INTFS Clients RO"; see group_vars nextcloud_occ_ro_permissions).
# edit → +read +write +create +delete (nextcloud_occ_edit_permissions).
# Level 4 only under `{client}/{client}/Accounting`: `children_mkcol` — MKCOL; subfolders without their own `children` row inherit the Accounting node view/edit (explicit occ).
# Optional `children` — L4 overrides; "Contracts" has no separate row — inherit from the parent. `deny_on_l4_children` — explicit deny (e.g. Assistant on all L4 except except_child_name "Contracts") for correct Nextcloud advanced ACL.
#
# Anchors (defaults): &name defines a named fragment, *name inserts it. To change a permission list —
# edit defaults (one place); folders only keep *name references. New set: add an entry in defaults
# with &new_name and set view/edit: *new_name in folders.
#
# view uses the __NC_MATRIX_RO_ALL__ marker (defaults: view_ro) instead of the LDAP group "INTFS Clients RO"; Ansible expands it to RO for the union of all matrix groups (see roles/nextcloud_groupfolders groupfolders_apply_permissions.yml).
# L3 "PAY requests" under {client}/{client}: no __NC_MATRIX_RO_ALL__ — only INTFS Clients Payroll and INTFS Clients IntControl; explicit matrix_deny for the other matrix groups plus auto-deny in group_vars.
#
# When occ paths diverge from the on-disk tree — optional children_mkcol_occ_path_fallback in the matrix (see matrix_regul_cloud_platform.yaml).

defaults:
  view_ro: &view_ro [__NC_MATRIX_RO_ALL__]
  edit_it: &edit_it [INTFS Clients IT]
  view_empty: &view_empty []
  edit_accounting: &edit_accounting
    - INTFS Clients Accounting
    - INTFS Clients Admin
    - INTFS Clients Finance
    - INTFS Clients Corp
    - INTFS Clients IntControl
  # Internal exchange (level 2): the same groups for view and edit (like Corp — one anchor for view and edit)
  edit_internal: &edit_internal
    - INTFS Clients Payroll
    - INTFS Clients Accounting
    - INTFS Clients Admin
    - INTFS Clients Compliance
    - INTFS Clients EconSecurity
    - INTFS Clients IntSecurity
    - INTFS Clients Legal
    - INTFS Clients HR
    - INTFS Clients Corp
    - INTFS Clients Finance
    - INTFS Clients 1C
    - INTFS Clients IntControl
  edit_file_exchange: &edit_file_exchange
    - INTFS Clients Admin
    - INTFS Clients Finance
    - INTFS Clients Compliance
    - INTFS Clients EconSecurity
    - INTFS Clients IntSecurity
    - INTFS Clients Legal
    - INTFS Clients Accounting
    - INTFS Clients HR
    - INTFS Clients 1C
    - INTFS Clients IntControl
  edit_clients_info: &edit_clients_info
    - INTFS Clients Admin
    - INTFS Clients Legal
    - INTFS Clients Finance
    - INTFS Clients Assistant
    - INTFS Clients IntControl
  assistant_only: &assistant_only [INTFS Clients Assistant]
  edit_corp: &edit_corp
    - INTFS Clients Corp
    - INTFS Clients Admin
    - INTFS Clients Finance
  edit_payroll_hr: &edit_payroll_hr
    - INTFS Clients Payroll
    - INTFS Clients HR
    - INTFS Clients Admin
    - INTFS Clients Finance
  edit_int_security: &edit_int_security
    - INTFS Clients IntSecurity
    - INTFS Clients EconSecurity
  edit_econ_security: &edit_econ_security
    - INTFS Clients EconSecurity
    - INTFS Clients IntSecurity
    - INTFS Clients Compliance
    - INTFS Clients Admin
    - INTFS Clients IntControl
  edit_compliance: &edit_compliance
    - INTFS Clients Compliance
    - INTFS Clients IntSecurity
    - INTFS Clients EconSecurity
    - INTFS Clients Admin
    - INTFS Clients IntControl
  edit_legal: &edit_legal
    - INTFS Clients Legal
    - INTFS Clients Admin
    - INTFS Clients IntSecurity
    - INTFS Clients Accounting
    - INTFS Clients Assistant
    - INTFS Clients IntControl
  edit_purchasing: &edit_purchasing
    - INTFS Clients Admin
    - INTFS Clients IntControl
  edit_trebovaniya_pay: &edit_trebovaniya_pay
    - INTFS Clients Payroll
    - INTFS Clients IntControl
  intfs_matrix_deny_trebovaniya_pay: &intfs_matrix_deny_trebovaniya_pay
    - group: INTFS Clients IT
    - group: INTFS Clients Accounting
    - group: INTFS Clients Admin
    - group: INTFS Clients Finance
    - group: INTFS Clients Corp
    - group: INTFS Clients Assistant
    - group: INTFS Clients Compliance
    - group: INTFS Clients EconSecurity
    - group: INTFS Clients IntSecurity
    - group: INTFS Clients Legal
    - group: INTFS Clients HR
    - group: INTFS Clients 1C
  edit_int_control: &edit_int_control [INTFS Clients IntControl]
  edit_file_hra: &edit_file_hra
    - INTFS Clients HR
    - INTFS Clients Payroll
    - INTFS Clients Admin
    - INTFS Clients Finance
  edit_file_corp: &edit_file_corp
    - INTFS Clients Corp
    - INTFS Clients Admin
  edit_file_accounting: &edit_file_accounting
    - INTFS Clients Payroll
    - INTFS Clients HR
    - INTFS Clients Admin
    - INTFS Clients Finance
    - INTFS Clients Accounting
    - INTFS Clients IntControl
  edit_file_intsecurity: &edit_file_intsecurity [INTFS Clients IntSecurity]

folders:
  - path: "{client}"
    view: *view_ro
    edit: *edit_it

  - path: "{client}/{client}"
    view: *view_ro
    edit: *edit_it

  - path: "{client}/Internal exchange"
    view: *edit_internal
    edit: *edit_internal

  - path: "{client}/File exchange"
    view: *view_ro
    edit: *edit_file_exchange

  # Level 3 (Client name): the same groups for view and edit (except Clients info). L4 only here, not under File exchange/Accounting.
  - path: "{client}/{client}/Accounting"
    view: *edit_accounting
    edit: *edit_accounting
    children_mkcol:
      - Expense reports
      - Reconciliations
      - Bank
      - Revenue
      - Civil contracts
      - Contracts
      - Period close
      - Inventory count
      - Client instructions
      - Minimum balances and deposits
      - Reporting
      - Entertainment expenses
      - Sales
      - Unified tax account reconciliation
      - Statistics
      - Invoices
      - FTS requests
      - Accounting policy
    deny_on_l4_children:
      except_child_name: "Contracts"
      groups: *assistant_only

  # Clients info — exception: RO view (all matrix groups), edit — its own list
  - path: "{client}/{client}/Clients info"
    view: *view_ro
    edit: *edit_clients_info

  - path: "{client}/{client}/Corp"
    view: *edit_corp
    edit: *edit_corp

  - path: "{client}/{client}/Payroll+HR"
    view: *edit_payroll_hr
    edit: *edit_payroll_hr

  - path: "{client}/{client}/IntSecurity"
    view: *edit_int_security
    edit: *edit_int_security

  - path: "{client}/{client}/EconSecurity"
    view: *edit_econ_security
    edit: *edit_econ_security

  - path: "{client}/{client}/Compliance"
    view: *edit_compliance
    edit: *edit_compliance

  - path: "{client}/{client}/Legal"
    view: *edit_legal
    edit: *edit_legal

  - path: "{client}/{client}/Purchasing"
    view: *edit_purchasing
    edit: *edit_purchasing

  - path: "{client}/{client}/Internal control"
    view: *edit_int_control
    edit: *edit_int_control

  - path: "{client}/{client}/PAY requests"
    view: *edit_trebovaniya_pay
    edit: *edit_trebovaniya_pay
    matrix_deny: *intfs_matrix_deny_trebovaniya_pay

  # Level 3 (File exchange): the same groups for view and edit
  - path: "{client}/File exchange/HRA"
    view: *edit_file_hra
    edit: *edit_file_hra

  - path: "{client}/File exchange/Corp"
    view: *edit_file_corp
    edit: *edit_file_corp

  # No children_mkcol: the L4 tree exists only on {client}/{client}/Accounting above.
  - path: "{client}/File exchange/Accounting"
    view: *edit_file_accounting
    edit: *edit_file_accounting

  - path: "{client}/File exchange/IntSecurity"
    view: *edit_file_intsecurity
    edit: *edit_file_intsecurity
