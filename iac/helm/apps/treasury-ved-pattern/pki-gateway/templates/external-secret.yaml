apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pki-gateway-vault-secrets
  namespace: estate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: pki-gateway-vault-secrets
    creationPolicy: Owner
  data:
    - secretKey: treasury.policy-gateway.dgtry.pin
      remoteRef:
        key: secret/pki-gateway-app
        property: treasury.policy-gateway.dgtry.pin
