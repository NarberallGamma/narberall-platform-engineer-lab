---
# Nextcloud Groupfolders playbook (Clients INTFS).
# Creates the folder tree from the matrix (WebDAV); permissions are applied via occ on the server.
# Host is not set in the playbook: --limit <inventory host> is required (the run script fills it from --profile) via run_nextcloud_groupfolders.sh.
# Run: ./scripts/run/run_nextcloud_groupfolders.sh --profile nextcloud-dev "Example Client LLC"
#        or: ansible-playbook -i inventories/hosts.ini playbooks/nextcloud_groupfolders.yml --limit nextcloud-dev.example.com -e "client_name=Example Client LLC"
# Replay ACL for one client only (no MKCOL): -e nextcloud_reapply_permissions_only=true -e client_name="…"
#        or ./scripts/run/run_nextcloud_groupfolders.sh --profile regul --permissions-only "Client name"
# All clients — matrix ACL only: --all-clients; MKCOL from the matrix for each then ACL: --all-clients-create.
#        or -e nextcloud_reapply_all_clients_enabled=true [-e nextcloud_reapply_all_clients_mkcol_enabled=true]
#
# WebDAV secrets — from Vault. Variables — group_vars/nextcloud_groupfolders.yml.
# Nextcloud groupfolders: folder and ACL matrix (see group_vars/env/matrix_*_cloud_platform.yaml by profile, children_mkcol / children).

- name: Nextcloud Groupfolders
  hosts: all
  gather_facts: true

  # group_vars/nextcloud_groupfolders.yml and the matrix (path set in nextcloud_profile_map) — loaded explicitly.
  vars_files:
    - "{{ playbook_dir }}/../group_vars/nextcloud_groupfolders.yml"

  vars:
    # Required at run time: -e "client_name=Example Client LLC"
    # client_name: ""

  pre_tasks:
    - name: Mode variables do not conflict
      ansible.builtin.assert:
        that:
          - not (((nextcloud_reapply_all_clients_enabled | default(false) | bool)) and ((nextcloud_reapply_permissions_only | default(false) | bool)))
          - not (((nextcloud_reapply_permissions_only | default(false) | bool)) and ((nextcloud_ldap_reset_groups_enabled | default(false) | bool)))
          - not (((nextcloud_reapply_all_clients_mkcol_enabled | default(false) | bool)) and not ((nextcloud_reapply_all_clients_enabled | default(false) | bool)))
          - not (((nextcloud_reapply_all_clients_mkcol_enabled | default(false) | bool)) and ((nextcloud_reapply_permissions_only | default(false) | bool)))
        fail_msg: >-
          nextcloud_reapply_all_clients_enabled and nextcloud_reapply_permissions_only cannot be enabled together;
          nextcloud_reapply_permissions_only also cannot be combined with nextcloud_ldap_reset_groups_enabled.
          nextcloud_reapply_all_clients_mkcol_enabled is allowed only together with nextcloud_reapply_all_clients_enabled and is incompatible with nextcloud_reapply_permissions_only.
      tags: always

    - name: Host is present in the profile map (Vault key names from nextcloud_profile_map)
      ansible.builtin.assert:
        that:
          - nextcloud_matrix_profile_by_host is defined
          - nextcloud_matrix_profile_by_host | length > 0
          - inventory_hostname in nextcloud_matrix_profile_by_host
          - nextcloud_profile_map is defined
          - nextcloud_matrix_profile_by_host[inventory_hostname] in nextcloud_profile_map
        fail_msg: >-
          Add "{{ inventory_hostname }}" to nextcloud_matrix_profile_by_host and pick a profile from nextcloud_profile_map (nextcloud-dev, nextcloud-prod, regul).
          Or pass the dict via -e.
      tags: always

    - name: Vault WebDAV key names by host profile (nextcloud-dev | nextcloud-prod | regul), before the nextcloud_init role
      ansible.builtin.set_fact:
        nextcloud_vault_key_webdav_user: "{{ nextcloud_profile_map[_nc_gf_vault_profile].nextcloud_vault_key_webdav_user }}"
        nextcloud_vault_key_webdav_password: "{{ nextcloud_profile_map[_nc_gf_vault_profile].nextcloud_vault_key_webdav_password }}"
      vars:
        _nc_gf_vault_profile: "{{ nextcloud_matrix_profile_by_host[inventory_hostname] }}"
      tags: always

    - name: Check client_name (not required for all-clients reapply or LDAP-reset-only mode)
      ansible.builtin.assert:
        that: client_name is defined and client_name | length > 0
        fail_msg: 'Pass the client name: -e "client_name=Example Client LLC"'
      when:
        - not (nextcloud_reapply_all_clients_enabled | default(false) | bool)
        - not ((nextcloud_ldap_reset_groups_enabled | default(false) | bool) and ((nextcloud_ldap_reset_groups | default([])) | length > 0))
      tags: always

  roles:
    - role: nextcloud_init
      tags: init, nextcloud
    - role: nextcloud_groupfolders
      tags: nextcloud

  post_tasks:
    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Done. Mode: re-apply permissions for all clients
          {{ '(MKCOL from the matrix for each client, then ACL)' if (nextcloud_reapply_all_clients_mkcol_enabled | default(false) | bool) else '(matrix ACL only)' }}.
          Host: {{ inventory_hostname }}.
      when: nextcloud_reapply_all_clients_enabled | default(false) | bool
      tags: always

    - name: Summary (replay matrix ACL only, MKCOL was not run)
      ansible.builtin.debug:
        msg: "Done. Mode: replay matrix ACL only (no MKCOL). Client: {{ client_name }}. Host: {{ inventory_hostname }}."
      when:
        - nextcloud_reapply_permissions_only | default(false) | bool
        - client_name is defined
      tags: always

    - name: Summary (one client — full scenario with MKCOL)
      ansible.builtin.debug:
        msg: "Done. Client: {{ client_name }}. Host: {{ inventory_hostname }}."
      when:
        - not (nextcloud_reapply_all_clients_enabled | default(false) | bool)
        - not (nextcloud_reapply_permissions_only | default(false) | bool)
      tags: always
