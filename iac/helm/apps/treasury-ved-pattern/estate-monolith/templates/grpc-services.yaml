---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-estate-onboarding-grpc-service
  labels:
    {{- include "estate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 6865
      targetPort: 6865
      protocol: TCP
      name: grpc
  selector:
    app.kubernetes.io/name: estate-onboarding
