# Alert rules for Node Exporter Full dashboard (uid: rYdddlPWk).
# Host metrics + disk usage (formerly separate node-exporter-disk file): single group Node Exporter Host Health.
# Job match: external-node-exporter|node-exporter-kubernetes.
# Datasource UID: PBFA97CFB590B2093.
# Uptime under 1h after reboot (same condition as former "Recent reboot" title; single rule to avoid duplicate alerts).
# noDataState: OK: missing series must not raise DatasourceNoData; notify only when the query returns a value and the threshold fires.
# execErrState: OK: query errors (Prometheus timeout, datasource down) must not raise DatasourceError; notify only on a metric threshold.
apiVersion: 1

groups:
  - orgId: 1
    name: Node Exporter Host Health
    folder: Alerting
    interval: 1m
    rules:
      - uid: node_exp_recent_reboot
        title: Node Exporter - Uptime < 1 hour (recent reboot)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: |
                node_time_seconds{job=~"external-node-exporter|node-exporter-kubernetes"}
                - node_boot_time_seconds{job=~"external-node-exporter|node-exporter-kubernetes"}
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              refId: C
              expression: '{{ printf "$" }}B < 3600'
        dashboardUid: rYdddlPWk
        panelId: 15
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: 'Uptime below 1 hour on {{ "{{" }} {{ "$" }}{{ "labels.instance" }} {{ "}}" }} (recent reboot)'
          description: "node_time_seconds - node_boot_time_seconds < 3600. Dashboard: Uptime."
        labels:
          dashboard: "Node Exporter Full"
          severity: critical

      - uid: node_exp_ram_used_warn
        title: Node Exporter - RAM Used > 80%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: |
                clamp_min(
                  (
                    1
                    - (
                      node_memory_MemAvailable_bytes{job=~"external-node-exporter|node-exporter-kubernetes"}
                      / node_memory_MemTotal_bytes{job=~"external-node-exporter|node-exporter-kubernetes"}
                    )
                  ) * 100,
                  0
                )
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              refId: C
              expression: '{{ printf "$" }}A > 80'
        dashboardUid: rYdddlPWk
        panelId: 16
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: 'RAM used above 80% on {{ "{{" }} {{ "$" }}{{ "labels.instance" }} {{ "}}" }}'
          description: "1 - MemAvailable/MemTotal. Dashboard: RAM Used."
        labels:
          dashboard: "Node Exporter Full"
          severity: warning

