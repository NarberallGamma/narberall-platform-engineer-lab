{{- if .Values.smtp.createExternalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "grafana.fullname" . }}-smtp-vault
  namespace: {{ include "grafana.namespace" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.smtp.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.smtp.externalSecret.secretStoreRef.name | default "vault-cluster-secret-store" }}
    kind: {{ .Values.smtp.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ required "smtp.existingSecret is required when smtp.createExternalSecret is true" .Values.smtp.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.smtp.userKey | default "mail.username" }}
      remoteRef:
        key: {{ .Values.smtp.vaultPath | default "secret/grafana" }}
        property: mail.username
    - secretKey: {{ .Values.smtp.passwordKey | default "mail.password" }}
      remoteRef:
        key: {{ .Values.smtp.vaultPath | default "secret/grafana" }}
        property: mail.password
{{- end }}
