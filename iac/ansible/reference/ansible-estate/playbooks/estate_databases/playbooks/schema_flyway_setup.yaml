---
# Playbook to set up the schema_flyway user and split privileges (Flyway/DDL — schema_flyway, application/DML — treasury_user).
# Without db_name / db_list in --extra-vars the playbook stops (empty default_databases).
# Examples:
#   ansible-playbook schema_flyway_setup.yaml --extra-vars "db_name=treasury_contract"
#   ansible-playbook schema_flyway_setup.yaml --extra-vars "db_name=treasury_api"
#   ansible-playbook schema_flyway_setup.yaml --extra-vars "db_name=treasury_csp"
#   ansible-playbook schema_flyway_setup.yaml --extra-vars "db_name=treasury_safe_deal_adapter"
#   ansible-playbook schema_flyway_setup.yaml --extra-vars "db_name=treasury_lp_adapter"
#   ansible-playbook schema_flyway_setup.yaml --extra-vars "db_list=['treasury_safe_deal_adapter','cryptopro_service','nodes_btc']"
# After the first successful application start (Flyway created kafka_transactional_outbox):
# repeat setup for treasury_* / services with a Debezium connector (outbox OWNER -> treasury_user).
# Variables pg_admin_password, treasury_password, schema_flyway_password — in vars or --extra-vars (or vault).
- name: Set up the schema_flyway user and split privileges (DDL vs DML)
  hosts: localhost
  connection: local
  become: no
  gather_facts: no
  vars:
    pg_host: "10.10.16.30"
    pg_port: 5432
    pg_admin_user: root
    pg_admin_password: ""

    treasury_user: treasury_user
    treasury_password: ""

    schema_flyway: schema_flyway
    schema_flyway_password: ""

    # DML privileges are granted to treasury_user (treasury and Treasury connect as treasury_user). When another treasury_user appears, add it to additional_app_users.
    additional_app_users: []
    app_users: "{{ [treasury_user] + (additional_app_users | default([])) | unique }}"

    # default_databases is intentionally empty: without an explicit db_name or db_list the playbook does not touch databases.
    # Summary (21 databases: previous 18 + 3 new), reference only. keycloak was not in the old default — it is in restore.yaml.
    #   (new) treasury_safe_deal_adapter, treasury_lp_adapter, cryptopro_service, nodes_btc
    #   (previous) treasury_treasury_adapter, treasury_contract, treasury_audit, hsm, treasury_aml, treasury_api,
    #   treasury_csp, nodes_eth, nodes_tron, treasury_aml, treasury_auth_provider, treasury_csp,
    #   treasury_notification, treasury_otp, treasury_rates, treasury_report, treasury_web, treasury_onboarding
    # Override: db_name=... or db_list=['a','b']
    default_databases: []

  pre_tasks:
    - name: Resolve the database list to process
      ansible.builtin.set_fact:
        db_list: "{{ db_list | default(default_databases) }}"
      when: db_name is not defined or db_name == '' or db_name is none

    - name: Resolve the database list from db_name (when a single database is set)
      ansible.builtin.set_fact:
        db_list: "{{ [db_name] }}"
      when: db_name is defined and db_name != '' and db_name is not none

    - name: Fail when the database list is empty
      ansible.builtin.fail:
        msg: "ERROR: database list is empty. Set db_name or db_list via --extra-vars"
      when: db_list is not defined or db_list | length == 0

    - name: Show the database list to process
      ansible.builtin.debug:
        msg: "{{ db_list | length }} databases will be processed: {{ db_list | join(', ') }}"

  roles:
    - schema_flyway
