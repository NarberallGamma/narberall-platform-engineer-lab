          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: clamp_max(max(sbercloud_sys_rds_rds001_cpu_util{job="cloudeye-exporter"} > bool 0) or max(sbercloud_sys_rds_rds002_mem_util{job="cloudeye-exporter"} > bool 0), 1)
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              refId: C
              expression: '{{ printf "$" }}B < 1'
        dashboardUid: pg_exporter_monitoring
        panelId: 48
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: "PostgreSQL RDS master DB status is not Up (panel Master DB Status)"
          description: "CPU/mem availability probe < 1. Dashboard: Master DB Status."
        labels:
          dashboard: "PostgreSQL (RDS) - CloudEye"
          severity: critical

