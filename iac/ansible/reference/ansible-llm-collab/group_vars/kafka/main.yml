# Playbook: playbooks/kafka_deploy.yml, inventory group: kafka
# Run: from the control node /ansible after git pull — ./scripts/run/run_kafka.sh --limit kafka-prod.example.com
# (Vault: .env.vault; SSH: .ssh/ansible_ssh_key). Locally without .env.vault — export VAULT_ADDR and VAULT_TOKEN.
# Compose templates: roles/kafka_deploy/templates/ (not in group_vars — Ansible convention).

# =============================================================================
# Volumes and data
# =============================================================================
# Compose data volume: ./data → /var/lib/kafka/data (host directory must be owned by uid/gid 1000 — otherwise AccessDenied in the container at KAFKA_LOG_DIRS).
# With SASL — ./config/kafka_server_jaas.conf (same uid/gid 1000).
# Alongside: .env; with SASL_SSL — ./config/ssl.
# Different uid in the image: kafka_container_user_uid / kafka_container_user_gid in kafka_deploy role defaults.

# =============================================================================
# Secrets and access (important)
# =============================================================================
# Mode: SASL_PLAINTEXT + PLAIN (no TLS on the broker when kafka_sasl_tls_enabled: false).
# Clients: security.protocol=SASL_PLAINTEXT, sasl.mechanism=PLAIN, JAAS PlainLoginModule (platform_kafka / admin).
# SASL_SSL on the broker: kafka_sasl_tls_enabled: true and a keystore in config/ssl (kafka_deploy role, tls.yml).
# Vault (Ubuntu_servers): ansible_kafka_sasl_admin_password, ansible_kafka_sasl_platform_kafka_password, CLUSTER_ID;
# for extra SASL users — keys from kafka_sasl_extra_users (e.g. ansible_kafka_sasl_svc_1c_kafka_password);
# when kafka_akhq_enabled: ansible_kafka_akhq_ui_password (AKHQ web UI login password).
# Disable SASL: kafka_sasl_enabled: false — PLAINTEXT only, no password.
# CLUSTER_ID from Vault — KRaft cluster identifier.

# --- Vault (init) ---
# UI: Secrets → platform-infra → Ubuntu_servers
kafka_vault_mount_point: "platform-infra"
kafka_vault_path: "Ubuntu_servers"
kafka_vault_key_cluster_id: "ansible_kafka_kraft_cluster_id"
kafka_vault_key_sasl_admin_password: "ansible_kafka_sasl_admin_password"
kafka_vault_key_sasl_platform_kafka_password: "ansible_kafka_sasl_platform_kafka_password"
kafka_vault_key_akhq_ui_password: "ansible_kafka_akhq_ui_password"

kafka_sasl_enabled: true
# TLS on the broker together with SASL (SASL_SSL). false — SASL_PLAINTEXT + password only.
kafka_sasl_tls_enabled: false

# Extra SASL PLAIN users (JAAS user_<username>). In Vault (Ubuntu_servers) — vault_key = password.
kafka_sasl_extra_users:
  - username: svc_1c_kafka
    vault_key: ansible_kafka_sasl_svc_1c_kafka_password

# If set here or via -e — Vault is not called for CLUSTER_ID.
# kafka_cluster_id: ""

# --- AKHQ (Kafka UI) ---
# Image: tchiotludo/akhq; broker connection inside compose: kafka:9092 (SASL — admin account from Vault).
# In Vault (Ubuntu_servers): ansible_kafka_akhq_ui_password — UI login password (stored in the config as SHA-256).
# Public name: kafka-akhq.<same domain as kafka> — from kafka_akhq_public_host (default derived from kafka_advertised_host).
# Proxy: HTTP(S) reverse proxy to host port kafka_akhq_host_port (8080), see roles/kafka_deploy/files/kafka_akhq_nginx.example.conf
kafka_akhq_enabled: true
kafka_akhq_image: "tchiotludo/akhq:0.27.0"
kafka_akhq_host_port: 8080

# --- Deploy ---
kafka_app_root: "/docker/apps/kafka"
kafka_image: "apache/kafka:3.9.2"
kafka_listener_port: 9092

# Name for advertised.listeners and bootstrap.servers (when kafka_sasl_tls_enabled — certificate CN/SAN).
kafka_advertised_host: kafka.example.com

# Broker count and target RF — see kafka_effective_replication_factor calculation in kafka_deploy role defaults.
kafka_broker_count: 1
kafka_target_replication_factor: 3

# Image pull policy on compose up: missing | always | never | policy
kafka_compose_pull: "missing"

# Kafka container restart: unless-stopped by default (see kafka_deploy defaults).
# kafka_compose_restart_policy: unless-stopped

# Auto-parameters for new topics (when auto.create.topics.enable=true)
kafka_default_num_partitions: 10
kafka_log_retention_hours: 168
kafka_log_roll_ms: 259200000

# "Synchronous" flush (frequent fsync) — disk load; increase intervals if needed.
kafka_log_flush_interval_messages: 1
kafka_log_flush_interval_ms: 1
