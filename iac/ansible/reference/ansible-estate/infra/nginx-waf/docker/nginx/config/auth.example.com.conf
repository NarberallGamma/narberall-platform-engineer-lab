# Nginx WAF configuration for auth.example.com
# Place at: /docker/nginx/config/auth.example.com.conf

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/auth.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/auth.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/auth.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name auth.example.com;
    listen 80;

    return 301 https://auth.example.com;
}

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/auth.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/auth.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/auth.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name auth.example.com;
    listen 443 ssl;
    ssl_certificate /docker/certgen/data/example.com.crt;
    ssl_certificate_key /docker/certgen/data/example.com.key;

    include /etc/nginx/conf_add/wallarm-blocked-page;
    client_max_body_size 100m;

    # ============================================
    # BLOCK SWAGGER AND ACTUATOR for the allowed API
    # ============================================
    
    # Block swagger-ui for treasury-auth-provider
    location ~ ^/api/v0/treasury-auth-provider/swagger-ui {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Block actuator for treasury-auth-provider (full block, including health)
    location ~ ^/api/v0/treasury-auth-provider/actuator {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Block settings for treasury-auth-provider (full block of the entire path)
    location ~ ^/api/v0/treasury-auth-provider/settings {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # BLOCK PATHS UP TO AND INCLUDING /api/v0
    # Return 403 for root, /api and /api/v0
    # ============================================
    
    # Block the root path
    location = / {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api (no trailing slash)
    location = /api {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api/ (with slash, but not /api/v0/)
    location ~ ^/api/$ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api/v0 (no trailing slash)
    location = /api/v0 {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Block /api/v0/ (with slash, but not allowed paths)
    location = /api/v0/ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # BLOCK ALL OTHER API PATHS
    # Allow only: /api/v0/treasury-auth-provider/
    # ============================================
    
    # Block all /api/v0/* paths except the allowed one
    location ~ ^/api/v0/(?!treasury-auth-provider/) {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # ALLOWED API PATH
    # ============================================
    
    # Allow /api/v0/treasury-auth-provider/ (except swagger/actuator already blocked above)
    location ~ ^/api/v0/treasury-auth-provider/ {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host auth.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # EVERYTHING ELSE (non-API paths) — allow
    # ============================================
    
    location / {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host auth.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

