---
- name: nginx-proxy directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop:
    - { path: "{{ llm_dev_nginx_root }}", mode: "0755" }
    - { path: "{{ llm_dev_nginx_root }}/config", mode: "0755" }
    - { path: "{{ llm_dev_nginx_root }}/certs", mode: "0755" }
    - { path: "{{ llm_dev_nginx_root }}/certs/{{ llm_dev_nginx_ssl_cert_subdir }}", mode: "0755" }
    - { path: "{{ llm_dev_nginx_root }}/logs", mode: "0755" }
    - { path: "{{ llm_dev_nginx_root }}/logs/{{ llm_dev_public_server_name }}", mode: "0755" }
    - { path: "{{ llm_dev_nginx_root }}/logs/default", mode: "0755" }

- name: Sync TLS from the control node into the certs directory
  ansible.builtin.copy:
    src: "{{ llm_dev_nginx_ssl_sync_src }}/"
    dest: "{{ llm_dev_nginx_root }}/certs/{{ llm_dev_nginx_ssl_cert_subdir }}/"
  when: llm_dev_nginx_ssl_sync_src | default('') | length > 0
  no_log: true

- name: Check that the certificate exists on the host
  ansible.builtin.stat:
    path: "{{ llm_dev_nginx_root }}/certs/{{ llm_dev_nginx_ssl_cert_subdir }}/{{ llm_dev_nginx_ssl_cert_file }}"
  register: llm_dev_nginx_cert_stat

- name: Check that the key exists on the host
  ansible.builtin.stat:
    path: "{{ llm_dev_nginx_root }}/certs/{{ llm_dev_nginx_ssl_cert_subdir }}/{{ llm_dev_nginx_ssl_cert_key_file }}"
  register: llm_dev_nginx_key_stat

- name: Fail when TLS files are missing
  ansible.builtin.assert:
    that:
      - llm_dev_nginx_cert_stat.stat.exists | default(false)
      - llm_dev_nginx_cert_stat.stat.size | default(0) > 0
      - llm_dev_nginx_key_stat.stat.exists | default(false)
      - llm_dev_nginx_key_stat.stat.size | default(0) > 0
    fail_msg: >-
      TLS files are expected under {{ llm_dev_nginx_root }}/certs/{{ llm_dev_nginx_ssl_cert_subdir }}/:
      {{ llm_dev_nginx_ssl_cert_file }}, {{ llm_dev_nginx_ssl_cert_key_file }}.
      Place them manually or set llm_dev_nginx_ssl_sync_src; disable llm_dev_nginx_assert_certs_present if needed.
  when: llm_dev_nginx_assert_certs_present | bool
