# Пример HTTP(S) vhost для AKHQ (веб-интерфейс, не stream).
# Вставить в conf.d на прокси; SSL — сертификаты среды.
#
# Бэкенд: хост с Kafka, IP из инвентаря, порт — kafka_akhq_host_port из Ansible (по умолчанию 8080).
# server_name — согласовать с kafka_akhq_public_host / kafka_advertised_host.
#
# server_name и proxy_pass подставить под среду; nginx -t && reload после правок.

server {
    listen 443 ssl;
    server_name kafka-akhq.example.com;

    # ssl_certificate ... ssl_certificate_key ...

    # proxy_pass без завершающего / у URI upstream.
    # Если Location от AKHQ всё же приходит как //ui (старый конфиг с context-path: "/"): раскомментировать строку ниже.
    # proxy_redirect ~*^//ui(.*)$ https://$host/ui$1;
    location / {
        proxy_pass http://10.10.1.41:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
