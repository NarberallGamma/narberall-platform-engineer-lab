    SMS_KZ_LOGIN:
      prodlike: "CHANGE_ME"
      production: "CHANGE_ME"
    SMS_UZ_LOGIN:
      prodlike: "CHANGE_ME"
      production: "CHANGE_ME"

    CALL_LOGIN:
