---
# Expects: nextcloud_folders_flat. WebDAV PROPFIND against the group-folder root and MKCOL from the list.
# MKCOL is idempotent (HTTP 201 / 405 / 409): existing directories are not deleted or overwritten.

- name: Check that the WebDAV account can access the group folder (PROPFIND)
  ansible.builtin.uri:
    url: "{{ nextcloud_webdav_url }}/"
    method: PROPFIND
    user: "{{ nextcloud_webdav_user }}"
    password: "{{ nextcloud_webdav_password }}"
    force_basic_auth: true
    headers:
      Depth: "1"
  register: _webdav_access_check
  failed_when: false
  when: nextcloud_folders_flat | length > 0

- name: Fail — WebDAV account has no access to the group folder
  ansible.builtin.fail:
    msg: |
      WebDAV account ({{ nextcloud_webdav_user }}) has no access to group folder «{{ nextcloud_groupfolder_name }}» (HTTP {{ _webdav_access_check.status | default('?') }}).
      Check the folder name in Nextcloud and in nextcloud_profile_map (Regul clients, etc.), the WebDAV URL, and that the user is in groups with access to this folder: Nextcloud → Users → account → Group membership.
  when:
    - nextcloud_folders_flat | length > 0
    - _webdav_access_check.status is not defined or _webdav_access_check.status not in [200, 207]

# MKCOL order: by increasing path depth (segment count); within a wave — by path.
# Parallelism: async batches (nextcloud_concurrency_mkcol > 1). throttle on a single host with loop often gives no real parallelism — do not use.
- name: Unique path depths for MKCOL (waves)
  ansible.builtin.set_fact:
    _mkcol_depths_ordered: "{{ nextcloud_folders_flat | map(attribute='path') | map('split', '/') | map('length') | unique | sort | list }}"
  when: nextcloud_folders_flat | length > 0

- name: Initialize the MKCOL queue
  ansible.builtin.set_fact:
    _mkcol_ordered_flat: []
  when: nextcloud_folders_flat | length > 0

- name: Enqueue MKCOL folders for the next depth wave
  ansible.builtin.set_fact:
    _mkcol_ordered_flat: "{{ _mkcol_ordered_flat + _mkcol_wave_slice }}"
  vars:
    _mkcol_wave_slice: "{{ nextcloud_folders_flat | selectattr('path', 'match', '^' ~ ('([^/]+/)' * ((_mkcol_depth_val | int) - 1)) ~ '[^/]+$') | sort(attribute='path') | list }}"
  loop: "{{ _mkcol_depths_ordered }}"
  loop_control:
    loop_var: _mkcol_depth_val
    label: "depth={{ _mkcol_depth_val }}"
  when: nextcloud_folders_flat | length > 0

- name: MKCOL batch size (1 — no parallel async)
  ansible.builtin.set_fact:
    _mkcol_run_n: "{{ [nextcloud_concurrency_mkcol | default(1) | int, 1] | max }}"
  when:
    - nextcloud_folders_flat | length > 0
    - _mkcol_ordered_flat is defined
    - _mkcol_ordered_flat | length > 0

- name: Create folders in Nextcloud via WebDAV (MKCOL), idempotent (sequential)
  ansible.builtin.uri:
    url: "{{ nextcloud_webdav_url }}/{{ _mkcol_folder.path | urlencode }}"
    method: MKCOL
    user: "{{ nextcloud_webdav_user }}"
    password: "{{ nextcloud_webdav_password }}"
    status_code: [201, 405, 409]
    force_basic_auth: true
  loop: "{{ _mkcol_ordered_flat }}"
  loop_control:
    loop_var: _mkcol_folder
    label: "{{ _mkcol_folder.path }}"
  register: _webdav_mkcol
  when:
    - nextcloud_folders_flat | length > 0
    - _mkcol_ordered_flat is defined
    - _mkcol_ordered_flat | length > 0
    - (_mkcol_run_n | default(1) | int) <= 1

- name: Create folders in Nextcloud via WebDAV (MKCOL), async batches
  ansible.builtin.include_tasks: groupfolders_mkcol_async_batch.yml
  loop: "{{ _mkcol_ordered_flat | batch(_mkcol_run_n | int) | list }}"
  loop_control:
    loop_var: _mkcol_batch
    label: "MKCOL async, paths in batch={{ _mkcol_batch | length }}"
  when:
    - nextcloud_folders_flat | length > 0
    - _mkcol_ordered_flat is defined
    - _mkcol_ordered_flat | length > 0
    - (_mkcol_run_n | default(1) | int) > 1
