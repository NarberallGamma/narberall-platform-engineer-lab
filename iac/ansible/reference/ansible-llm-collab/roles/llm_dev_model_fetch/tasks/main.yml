---
# Role llm_dev_model_fetch: download GGUF into {{ llm_dev_models_dir }}, write a manifest under {{ llm_dev_sources_dir }}.

- name: Check that curl is present on the host
  ansible.builtin.command:
    cmd: curl --version
  register: llm_dev_model_fetch_curl
  changed_when: false
  failed_when: llm_dev_model_fetch_curl.rc != 0

- name: Assert that a preset or manual download parameters are set
  ansible.builtin.assert:
    that:
      - >
        (llm_dev_model_preset | default('') | string | length > 0) or
        (
          (llm_dev_model_hf_repo | default('') | string | length) > 0 and
          (
            (llm_dev_model_hf_files | default([]) | length) > 0 or
            (llm_dev_model_hf_file | default('') | string | length) > 0
          ) and
          (llm_dev_model_filename | default('') | string | length) > 0
        )
    fail_msg: >-
      Set llm_dev_model_preset (see group_vars/llm_dev/main.yml → llm_dev_model_catalog)
      or provide llm_dev_model_hf_repo, llm_dev_model_hf_files / llm_dev_model_hf_file, llm_dev_model_filename manually.

- name: Validate preset against the catalog
  ansible.builtin.assert:
    that:
      - llm_dev_model_preset in llm_dev_model_catalog
    fail_msg: >-
      Unknown llm_dev_model_preset={{ llm_dev_model_preset }}.
      Available keys: {{ llm_dev_model_catalog.keys() | list | join(', ') }}
  when: llm_dev_model_preset | default('') | string | length > 0

- name: Resolve model parameters from the preset
  ansible.builtin.set_fact:
    llm_dev_model_fetch_resolved_repo: "{{ llm_dev_model_catalog[llm_dev_model_preset].hf_repo }}"
    llm_dev_model_fetch_resolved_revision: "{{ llm_dev_model_catalog[llm_dev_model_preset].hf_revision }}"
    llm_dev_model_fetch_resolved_hf_file: "{{ llm_dev_model_catalog[llm_dev_model_preset].hf_file | default('', true) }}"
    llm_dev_model_fetch_resolved_hf_files: "{{ llm_dev_model_catalog[llm_dev_model_preset].hf_files | default([llm_dev_model_catalog[llm_dev_model_preset].hf_file], true) }}"
    llm_dev_model_fetch_resolved_description: "{{ llm_dev_model_catalog[llm_dev_model_preset].description | default('') }}"
  when: llm_dev_model_preset | default('') | string | length > 0

- name: Pin local GGUF filename from the preset
  ansible.builtin.set_fact:
    llm_dev_model_filename: "{{ llm_dev_model_catalog[llm_dev_model_preset].local_filename }}"
  when: llm_dev_model_preset | default('') | string | length > 0

- name: Resolve model parameters in manual mode
  ansible.builtin.set_fact:
    llm_dev_model_fetch_resolved_repo: "{{ llm_dev_model_hf_repo }}"
    llm_dev_model_fetch_resolved_revision: "{{ llm_dev_model_hf_revision | default('main') }}"
    llm_dev_model_fetch_resolved_hf_file: "{{ llm_dev_model_hf_file | default('', true) }}"
    llm_dev_model_fetch_resolved_hf_files: "{{ llm_dev_model_hf_files | default([llm_dev_model_hf_file], true) }}"
    llm_dev_model_fetch_resolved_description: "custom"
  when: llm_dev_model_preset | default('') | string | length == 0

- name: Align the first shard with the -m argument in compose
  ansible.builtin.assert:
    that:
      - llm_dev_model_fetch_resolved_hf_files[0] == llm_dev_model_filename
    fail_msg: >-
      Filename for -m (llm_dev_model_filename / preset local_filename) must match the first hf_files / hf_file entry
      (first GGUF shard; llama.cpp picks up the remaining shards from the same directory).

- name: Validate the Hugging Face file list
  ansible.builtin.assert:
    that:
      - llm_dev_model_fetch_resolved_hf_files | length > 0
      - llm_dev_model_fetch_resolved_hf_files | reject('equalto', '') | list | length == llm_dev_model_fetch_resolved_hf_files | length
    fail_msg: >-
      Empty or invalid file list (hf_files / hf_file): preset or manual mode.

- name: Build Hugging Face download URL (first file — for the manifest)
  ansible.builtin.set_fact:
    llm_dev_model_download_url: >-
      https://huggingface.co/{{ llm_dev_model_fetch_resolved_repo }}/resolve/{{ llm_dev_model_fetch_resolved_revision }}/{{ llm_dev_model_fetch_resolved_hf_files[0] }}

- name: Model and sources directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop:
    - { path: "{{ llm_dev_app_root }}", mode: "0755" }
    - { path: "{{ llm_dev_models_dir }}", mode: "0755" }
    - { path: "{{ llm_dev_sources_dir }}", mode: "0755" }

- name: Assert HF token when authentication is required
  ansible.builtin.assert:
    that:
      - llm_dev_hf_token is defined
      - (llm_dev_hf_token | default('') | string | length) > 0
    fail_msg: >-
      When llm_dev_model_fetch_requires_hf_token=true, set the token in Vault (key {{ llm_dev_vault_key_hf_token }}) or -e llm_dev_hf_token=...
  when: llm_dev_model_fetch_requires_hf_token | bool

- name: Check for local GGUF shards
  ansible.builtin.stat:
    path: "{{ llm_dev_models_dir }}/{{ item }}"
  loop: "{{ llm_dev_model_fetch_resolved_hf_files }}"
  register: llm_dev_model_fetch_shard_stats

- name: Decide whether a download is needed
  ansible.builtin.set_fact:
    llm_dev_model_fetch_shards_present: >-
      {{ llm_dev_model_fetch_shard_stats.results | selectattr('stat.exists') | list | length }}
    llm_dev_model_fetch_primary_size: "{{ llm_dev_model_fetch_shard_stats.results[0].stat.size | default(0) }}"

- name: Set download flag (force, missing shards, or first shard too small)
  ansible.builtin.set_fact:
    llm_dev_model_fetch_needs_download: >-
      {{
        (llm_dev_model_force_download | bool) or
        (llm_dev_model_fetch_shards_present | int != llm_dev_model_fetch_resolved_hf_files | length) or
        (llm_dev_model_fetch_primary_size | int < 1048576)
      }}

- name: Remove existing shards on forced download
  ansible.builtin.file:
    path: "{{ llm_dev_models_dir }}/{{ item }}"
    state: absent
  loop: "{{ llm_dev_model_fetch_resolved_hf_files }}"
  when: llm_dev_model_force_download | bool

- name: Remove partial files on forced download
  ansible.builtin.file:
    path: "{{ llm_dev_models_dir }}/.{{ item }}.partial"
    state: absent
  loop: "{{ llm_dev_model_fetch_resolved_hf_files }}"
  when: llm_dev_model_force_download | bool

- name: Write model manifest
  ansible.builtin.template:
    src: model_manifest.yml.j2
    dest: "{{ llm_dev_sources_dir }}/model_manifest.yml"
    mode: "0644"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Download GGUF shard from Hugging Face (curl, resume support)
  ansible.builtin.shell: |
    set -euo pipefail
    dest="{{ llm_dev_models_dir }}/{{ item }}"
    tmp="{{ llm_dev_models_dir }}/.{{ item }}.partial"
    url="https://huggingface.co/{{ llm_dev_model_fetch_resolved_repo }}/resolve/{{ llm_dev_model_fetch_resolved_revision }}/{{ item }}"
    if [ -n "${HF_TOKEN:-}" ]; then
      extra=( -H "Authorization: Bearer ${HF_TOKEN}" )
    else
      extra=()
    fi
    mkdir -p "{{ llm_dev_models_dir }}"
    # Some HF/CDN edges require a User-Agent; on connectivity errors try llm_dev_model_fetch_curl_extra_args=-4 on VMs with broken IPv6 only.
    curl -fL --retry 10 --retry-delay 20 --connect-timeout 60 \
      -A "{{ llm_dev_model_fetch_curl_user_agent }}" {{ llm_dev_model_fetch_curl_extra_args | default('', true) }} \
      "${extra[@]}" -C - -o "$tmp" "$url"
    mv -f "$tmp" "$dest"
  args:
    executable: /bin/bash
  environment:
    HF_TOKEN: "{{ llm_dev_hf_token | default('') }}"
  loop: "{{ llm_dev_model_fetch_resolved_hf_files }}"
  register: llm_dev_model_fetch_download
  changed_when: true
  when: llm_dev_model_fetch_needs_download | bool
  no_log: "{{ llm_dev_model_fetch_force_curl_no_log | default(false) | bool or ((llm_dev_hf_token | default('')) | trim | length) > 0 }}"
  loop_control:
    label: "{{ item }}"

- name: Confirm the target GGUF (first shard) is present
  ansible.builtin.stat:
    path: "{{ llm_dev_models_dir }}/{{ llm_dev_model_filename }}"
  register: llm_dev_model_fetch_verify

- name: Confirm all shard files are present
  ansible.builtin.stat:
    path: "{{ llm_dev_models_dir }}/{{ item }}"
  loop: "{{ llm_dev_model_fetch_resolved_hf_files }}"
  register: llm_dev_model_fetch_verify_all

- name: Assert first-shard size and that remaining shards exist
  ansible.builtin.assert:
    that:
      - llm_dev_model_fetch_verify.stat.exists | default(false)
      - (llm_dev_model_fetch_verify.stat.size | default(0)) > 1048576
      - (llm_dev_model_fetch_verify_all.results | selectattr('stat.exists') | list | length) == (llm_dev_model_fetch_resolved_hf_files | length)
    fail_msg: >-
      After download the model is missing or too small: {{ llm_dev_models_dir }}/{{ llm_dev_model_filename }}.
      Check the network, HF token, and files in repository {{ llm_dev_model_fetch_resolved_repo }} (first URL: {{ llm_dev_model_download_url }}).

- name: Permissions on model files
  ansible.builtin.file:
    path: "{{ llm_dev_models_dir }}/{{ item }}"
    state: file
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ llm_dev_model_fetch_resolved_hf_files }}"
  when: llm_dev_model_fetch_verify_all.results | selectattr('stat.exists') | list | length == llm_dev_model_fetch_resolved_hf_files | length
  loop_control:
    label: "{{ item }}"
