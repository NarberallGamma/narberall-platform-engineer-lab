# Playbook: playbooks/llm_dev_deploy.yml, inventory group: llm_dev
# Run: ./scripts/run/run_llm_dev.sh --limit llm-dev-01.example.com
#
# =============================================================================
# Target hardware (2026-06, migration from vGPU L4-8Q)
# =============================================================================
# Flavor VK Cloud PA2: GPU1-16-48-V100-1 — 16 vCPU, 48 GiB RAM, 1× Tesla V100 16 GiB VRAM (full GPU).
# Old stand: vGPU-8-16-L4-8Q (8 vCPU, 16 GiB RAM, 8 GiB VRAM); on 8 GiB VRAM the ceiling is -c 32768 q8_0.
# Host prep: prepare_servers (enable_docker + enable_nvidia_gpu) or llm_dev_gpu_host_prepare_enabled.
#
llm_dev_target_flavor: "GPU1-16-48-V100-1"
llm_dev_target_gpu_vram_gib: 16
llm_dev_target_host_ram_gib: 48
llm_dev_target_host_vcpus: 16
# =============================================================================
# Vault (KV Ubuntu_servers / platform-infra)
# =============================================================================
#   - ansible_llm_dev_server_api_key — if llm_dev_enable_api_key: true
#   - ansible_llm_dev_hf_token — if llm_dev_enable_hf_token: true or model download from Vault (see llm_dev_model_fetch_*)
#   - ansible_llm_dev_webui_secret_key — if llm_dev_open_webui_enabled: true (WEBUI_SECRET_KEY)
#
# =============================================================================
# GGUF model (downloaded by the llm_dev_model_fetch role)
# =============================================================================
# Presets and HF sources are set here: llm_dev_model_preset + llm_dev_model_catalog (not in role defaults).
# Spec: preset key qwen9b_q4_k_m (prefix qwen9b).
# Qwen3.5-9B — one GGUF per quant:
#   Q4_K_M (~5.89 GiB) — default: VRAM headroom for context and KV, usually faster tok/s on 8 GB.
#   Q5_K_M (~6.86 GiB) — heavier on VRAM, higher weight quality; if memory is tight / speed drops — go back to Q4 or lower llm_dev_ctx_size.
# Switching Q4↔Q5: in the preset below, replace the name in hf_files and local_filename with the needed gguf (same hf_repo).
# Manual mode: llm_dev_model_preset: "" and llm_dev_model_hf_* variables; when llm_dev_model_fetch_enabled: false set llm_dev_model_filename by hand (file in {{ llm_dev_models_dir }}).
# Resulting -m: {{ llm_dev_models_dir }}/<local_filename>; several shards — first file = -m.
# Manifest: {{ llm_dev_sources_dir }}/model_manifest.yml
# After changing the model file: llm_dev_model_force_download: true if needed, or clear {{ llm_dev_models_dir }}.
#
# =============================================================================
# Ansible timeouts (long steps: GGUF via curl, docker compose pull/up)
# =============================================================================
# ansible_ssh_timeout — ansible.builtin.ssh parameter (sec.): socket read on an already established SSH (long GGUF download).
# For docker compose pull/up — async on community.docker.docker_compose_v2 tasks (below).
#
llm_dev_ansible_ssh_timeout_seconds: 14400
llm_dev_compose_async_seconds: 10800
llm_dev_compose_poll_seconds: 15
# docker compose up (llm_dev_deploy / llm_dev_nginx roles): recreate containers on every run (not only docker restart).
llm_dev_compose_recreate: "always"

# GPU host prep (prepare_nvidia_gpu role) from the llm_dev_deploy playbook — without a full prepare_servers.
# On a new PA2 VM: false after a successful prepare_servers (docker + nvidia).
llm_dev_gpu_host_prepare_enabled: false

llm_dev_model_fetch_enabled: true
llm_dev_model_preset: "qwen9b_q4_k_m"
llm_dev_model_force_download: false
llm_dev_model_fetch_hf_token_from_vault: false
llm_dev_model_fetch_requires_hf_token: false

# Preset catalog (hf_repo, hf_revision, hf_files, local_filename) — the only place that selects the artifact for llm_dev_model_fetch.
llm_dev_model_catalog:
  qwen9b_q4_k_m:
    description: >-
      Spec: key qwen9b_q4_k_m. Current: Qwen3.5-9B GGUF Q4_K_M (one file; hf_repo and file name below).
    hf_repo: "bartowski/Qwen_Qwen3.5-9B-GGUF"
    hf_revision: "main"
    hf_files:
      - "Qwen_Qwen3.5-9B-Q4_K_M.gguf"
    local_filename: "Qwen_Qwen3.5-9B-Q4_K_M.gguf"
  qwen25_7b_instruct_q4_k_m:
    description: >-
      Alias of qwen9b_q4_k_m (same content); obsolete key name.
    hf_repo: "bartowski/Qwen_Qwen3.5-9B-GGUF"
    hf_revision: "main"
    hf_files:
      - "Qwen_Qwen3.5-9B-Q4_K_M.gguf"
    local_filename: "Qwen_Qwen3.5-9B-Q4_K_M.gguf"

# GGUF name in docker-compose (-m /models/...). Required with partial tags (llm_dev_config, llm_dev_ouroboros)
# without llm_dev_model_fetch: otherwise the deploy role default (model.gguf) is used.
# Must match local_filename of the active preset (qwen9b_q4_k_m). Update here when switching the preset.
llm_dev_model_filename: "Qwen_Qwen3.5-9B-Q4_K_M.gguf"

llm_dev_app_root: "/docker/apps/llm-dev"
llm_dev_models_dir: "{{ llm_dev_app_root }}/models"

llm_dev_sources_dir: "{{ llm_dev_app_root }}/sources"

# After download, check that the GGUF is present before compose (true is recommended when fetch is enabled)
llm_dev_assert_model_present: true

llm_dev_vault_mount_point: "platform-infra"
llm_dev_vault_path: "Ubuntu_servers"
llm_dev_vault_key_server_api_key: "ansible_llm_dev_server_api_key"
llm_dev_vault_key_hf_token: "ansible_llm_dev_hf_token"
llm_dev_vault_key_webui_secret_key: "ansible_llm_dev_webui_secret_key"

llm_dev_enable_api_key: false
llm_dev_enable_hf_token: false

# --- Application stack (llama + Open WebUI) ---
# Images moved from ghcr.io/ggerganov/llama.cpp to ghcr.io/ggml-org/llama.cpp (see docs/docker.md in the llama.cpp repo).
llm_dev_llama_image: "ghcr.io/ggml-org/llama.cpp:server-cuda"
llm_dev_llama_server_binary: "/app/llama-server"

llm_dev_compose_project_name: "llm-dev"
llm_dev_env_file_name: ".env"
llm_dev_compose_restart_policy: unless-stopped
llm_dev_compose_pull: "missing"

llm_dev_listen_port: 8080
# --- llama-server: V100 16 GiB VRAM, GGUF Q4_K_M, KV q8_0 ---
# Compose: -m /models/<llm_dev_model_filename>, --host/--port, -c, -ngl, --api-key (opt.).
llm_dev_llama_listen_host: "0.0.0.0"
llm_dev_llama_host_bind_address: "127.0.0.1"
llm_dev_llama_host_port: "{{ llm_dev_listen_port }}"
# KV context (-c). V100 16 GiB + Q4_K_M + q8_0: 262144 (n_ctx_train Qwen3.5-9B). On OOM → 196608 → 131072 → 104448 → 65536 → 32768.
# L4-8Q (8 GiB): ceiling 32768 q8_0.
llm_dev_ctx_size: 262144
llm_dev_gpu_layers: 99
# KV q8_0 (long-context quality). Weights — only Q4_K_M in the GGUF. batch 256 — lower VRAM peak on a long prefill.
llm_dev_llama_extra_args_list:
  - "--cache-type-k"
  - "q8_0"
  - "--cache-type-v"
  - "q8_0"
  - "--batch-size"
  - "256"
  - "--ubatch-size"
  - "256"
  - "--parallel"
  - "1"
  - "--threads"
  - "14"
  - "--threads-batch"
  - "14"
  - "--flash-attn"
  - "auto"
  - "--metrics"
# Single string (obsolete / quick hack): appended after the list.
llm_dev_llama_extra_args: ""

# =============================================================================
# Ouroboros Desktop / OpenAI without role=system (llm_dev_ouroboros_compat role)
# =============================================================================
# Problem: the built-in Qwen template in the GGUF requires system first -> 400
# "System message must be at the beginning" (clients like Ouroboros send only user/assistant).
# Ouroboros: patched official Qwen3.5-9B chat template (HF minus «system must be at beginning»).
# File: roles/llm_dev_ouroboros_compat/files/qwen35_9b_ouroboros_patched_chat_template.jinja
# Enable: true + --tags "llm_dev_ouroboros,llm_dev_config". Disable: false (template from the GGUF).
llm_dev_ouroboros_compat_enabled: true
llm_dev_ouroboros_compat_dir: "{{ llm_dev_app_root }}/chat-templates"
llm_dev_ouroboros_compat_template_filename: "qwen35_9b_ouroboros_patched_chat_template.jinja"
llm_dev_ouroboros_compat_container_mount: "/chat-templates"

llm_dev_open_webui_enabled: true
llm_dev_open_webui_image: "ghcr.io/open-webui/open-webui:main"
llm_dev_open_webui_env_file_name: "open-webui.env"
llm_dev_open_webui_host_bind_address: "127.0.0.1"
llm_dev_open_webui_host_port: 8081

# Public Open WebUI base URL (HTTPS behind nginx)
llm_dev_open_webui_public_url: "https://llm-dev-01.example.com"

# --- Public TLS / log name ---
llm_dev_public_server_name: "llm-dev-01.example.com"

# --- nginx in Docker (separate compose, host network — same pattern as /docker/nginx on proxy-01.example.com) ---
llm_dev_nginx_enabled: true
llm_dev_nginx_root: "{{ llm_dev_app_root }}/nginx-proxy"
llm_dev_nginx_image: "nginx:1.27-bookworm"
llm_dev_nginx_compose_project_name: "llm-dev-nginx"
llm_dev_nginx_restart_policy: always

# Bind address for listen (like listen 10.10.12.13:443 on the proxy); for a single VM this is often the interface IP or 0.0.0.0
llm_dev_nginx_listen_ip: "{{ ansible_host }}"

# PEM directory on the host: {{ llm_dev_nginx_root }}/certs/corp.example.com/ → /docker/apps/llm-dev/nginx-proxy/certs/corp.example.com/
llm_dev_nginx_ssl_cert_subdir: "corp.example.com"
llm_dev_nginx_ssl_cert_file: "wildcert.pem"
llm_dev_nginx_ssl_cert_key_file: "wildkey.pem"

# Optional: local directory on the control node with PEMs for ansible.builtin.copy to the host (subdir under certs/{{ llm_dev_nginx_ssl_cert_subdir }}/)
llm_dev_nginx_ssl_sync_src: ""

llm_dev_nginx_assert_certs_present: true

llm_dev_nginx_log_max_size: "50m"
llm_dev_nginx_log_max_file: "1"

llm_dev_nginx_client_max_body_size: "50m"
llm_dev_nginx_proxy_read_timeout: "3600s"
llm_dev_nginx_proxy_connect_timeout: "75s"

llm_dev_nginx_ssl_protocols: "TLSv1.2 TLSv1.3"

# --- URL prefixes (nginx): externally and llama upstream (OpenAI-compatible path on llama — usually /v1/) ---
# Examples: path_api="/gateway/llm/v1/", llama_upstream_openai_prefix="/v1/" — clients hit /gateway/llm/v1/..., backend receives /v1/...
llm_dev_nginx_path_api: "/v1/"
llm_dev_nginx_llama_upstream_openai_prefix: "/v1/"
# WebUI: "/" — vhost root; otherwise a prefix, e.g. "/chat/" (trailing slash in values is optional — normalized).
llm_dev_nginx_path_webui: "/"

# =============================================================================
# Docker cgroup limits (cpus / mem_limit / memswap_limit)
# Target host: GPU1-16-48-V100-1 — 16 vCPU, 48 GiB RAM (not vGPU L4-8Q).
# Sum of cpus ≈ 15.5 (14 + 1 + 0.5). memswap_limit = mem_limit.
# VRAM is limited by the model/KV (-c, q8_0), not these fields.
# =============================================================================
llm_dev_container_limits_enabled: true
llm_dev_llama_cpus: "14.0"
llm_dev_llama_mem_limit: "40g"
llm_dev_llama_memswap_limit: "40g"
llm_dev_open_webui_cpus: "1.0"
llm_dev_open_webui_mem_limit: "4096m"
llm_dev_open_webui_memswap_limit: "4096m"
llm_dev_nginx_cpus: "0.5"
llm_dev_nginx_mem_limit: "256m"
llm_dev_nginx_memswap_limit: "256m"
