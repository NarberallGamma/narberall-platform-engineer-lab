---
# Установка Docker Engine из официального репозитория download.docker.com
# (docker-ce, Compose V2 как плагин: docker compose).
# Удаление пакетов дистрибутива (docker.io, docker-compose и т.д.) — см. docker_remove_distro_packages.
#
# Ручное удаление Docker из репозитория дистрибутива (как в документации Docker), если миграция без Ansible:
#   systemctl stop docker.socket docker 2>/dev/null || true
#   apt-get purge -y docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc
#   apt-get autoremove -y
# Каталог data-root (например /docker/system) не удалять, если нужны сохранённые volumes/образы.

- name: Определить дистрибутив для репозитория Docker (ubuntu / debian)
  ansible.builtin.set_fact:
    docker_apt_dist: "{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else ('debian' if ansible_facts['distribution'] == 'Debian' else '') }}"
  tags: [docker]

- name: Проверка поддерживаемого дистрибутива для официального Docker
  ansible.builtin.assert:
    that:
      - docker_apt_dist | length > 0
    fail_msg: "Официальный репозиторий Docker поддерживается только для Ubuntu и Debian (текущий: {{ ansible_facts['distribution'] }})."
  tags: [docker]

- name: Архитектура пакетов Docker для apt (amd64 / arm64 / armhf)
  ansible.builtin.set_fact:
    docker_apt_arch: >-
      {{
        'arm64' if ansible_facts['architecture'] == 'aarch64'
        else ('armhf' if ansible_facts['architecture'] == 'armv7l'
        else ('amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture']))
      }}
  tags: [docker]

- name: Бэкап образов Docker перед purge/migrate
  ansible.builtin.include_tasks: docker_images_backup.yml
  when: enable_docker | default(false) | bool
  tags: [docker]

- name: Остановить сервис Docker перед снятием пакетов дистрибутива
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - docker.socket
    - docker
  failed_when: false
  when: docker_remove_distro_packages | bool
  tags: [docker]

- name: Удалить пакеты Docker из репозитория дистрибутива (docker.io, compose v1 и т.д.)
  ansible.builtin.apt:
    name: "{{ docker_distro_packages_remove }}"
    state: absent
    purge: true
    autoremove: true
    lock_timeout: "{{ prepare_servers_apt_lock_timeout }}"
  when: docker_remove_distro_packages | bool
  tags: [docker]

- name: Установить зависимости для apt по HTTPS
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    lock_timeout: "{{ prepare_servers_apt_lock_timeout }}"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Каталог для keyring apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Очистить legacy apt sources Docker (docker.gpg vs docker.asc)
  ansible.builtin.include_tasks: docker_apt_legacy_cleanup.yml
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: GPG-ключ репозитория Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ docker_apt_dist }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Репозиторий Docker (stable)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ docker_apt_dist }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: "{{ docker_apt_channel }}"
    architectures: "{{ docker_apt_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Обновить кеш apt после добавления репозитория Docker
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: "{{ prepare_servers_apt_lock_timeout }}"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Установить Docker Engine и Compose V2 (плагин)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    lock_timeout: "{{ prepare_servers_apt_lock_timeout }}"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Set default docker_data_dir if not specified
  ansible.builtin.set_fact:
    docker_data_dir: "{{ docker_data_dir | default('/var/lib/docker') }}"
  tags: [docker]

- name: Set default containerd_data_dir if not specified
  ansible.builtin.set_fact:
    containerd_data_dir: "{{ containerd_data_dir | default('/var/lib/containerd') }}"
  tags: [docker]

- name: Перенос данных Docker и containerd в целевые каталоги
  ansible.builtin.include_tasks: docker_migrate.yml
  when: docker_migrate_data | bool
  tags: [docker]

- name: Create Docker data directory if custom path specified
  ansible.builtin.file:
    path: "{{ docker_data_dir }}"
    state: directory
    mode: "0755"
  when: docker_data_dir != "/var/lib/docker"
  tags: [docker]

- name: Configure Docker daemon to use custom data directory
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "{{ docker_data_dir }}"
      }
    mode: "0644"
  when: docker_data_dir != "/var/lib/docker"
  notify: restart docker
  tags: [docker]

# Миграция данных с /var/lib/containerd вынесена вручную (rsync + смена root + переименование старого каталога).
# Здесь только каталог и строка root в config.toml пакета docker-ce/containerd.io (как data-root для docker).

- name: Create containerd data directory if custom path specified
  ansible.builtin.file:
    path: "{{ containerd_data_dir }}"
    state: directory
    mode: "0711"
  when: containerd_data_dir != "/var/lib/containerd"
  tags: [docker]

- name: Configure containerd root in /etc/containerd/config.toml
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: "^#?root\\s*=.*"
    line: 'root = "{{ containerd_data_dir }}"'
    insertafter: '^disabled_plugins'
    backup: true
  when: containerd_data_dir != "/var/lib/containerd"
  notify: restart containerd stack
  tags: [docker]

- name: Start and enable Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  tags: [docker]

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  tags: [docker]

- name: Восстановление образов Docker из tar после migrate/purge
  ansible.builtin.include_tasks: docker_images_restore.yml
  when: enable_docker | default(false) | bool
  tags: [docker]
