---
# groupfolders_main: load the matrix, create folders over WebDAV, apply permissions (root + per path).
# Included from main.yml when LDAP-reset mode (nextcloud_ldap_reset_groups_enabled) is off.

- name: Prepare the folder list from the matrix for client_name
  ansible.builtin.include_tasks: groupfolders_prepare_folders_flat_for_client.yml

- name: WebDAV check and MKCOL
  ansible.builtin.include_tasks: groupfolders_webdav_check_and_mkcol.yml

- name: Apply matrix permissions (root + per path) for the client
  ansible.builtin.include_tasks: groupfolders_apply_permissions.yml
