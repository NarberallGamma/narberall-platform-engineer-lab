---
# Move Docker/containerd data to docker_data_dir / containerd_data_dir before changing config.
# Idempotency: marker {{ docker_data_dir }}/.migrated_from_var_lib_docker
# Old directories are renamed to docker_migrate_*_backup_path (see summary message at the end).

- name: Initialize docker_migrate backup list for this run
  ansible.builtin.set_fact:
    docker_migrate_backups_created: []
  when: docker_migrate_data | bool
  tags: [docker]

- name: Check Docker data-root migration marker
  ansible.builtin.stat:
    path: "{{ docker_data_dir }}/.migrated_from_var_lib_docker"
  register: docker_data_migrated_marker
  tags: [docker]

- name: Check whether the old Docker directory exists
  ansible.builtin.stat:
    path: /var/lib/docker
  register: docker_old_lib_stat
  tags: [docker]

- name: Migrate Docker data-root (rsync /var/lib/docker -> {{ docker_data_dir }})
  when:
    - docker_migrate_data | bool
    - docker_data_dir != "/var/lib/docker"
    - not docker_data_migrated_marker.stat.exists
    - docker_old_lib_stat.stat.isdir | default(false)
  block:
    - name: Stop Docker before moving data-root
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.socket
        - docker
      failed_when: false
      tags: [docker]

    - name: Docker data-root destination directory
      ansible.builtin.file:
        path: "{{ docker_data_dir }}"
        state: directory
        mode: "0755"
      tags: [docker]

    - name: rsync /var/lib/docker -> {{ docker_data_dir }}
      ansible.builtin.command:
        argv:
          - rsync
          - -aHAX
          - /var/lib/docker/
          - "{{ docker_data_dir }}/"
      changed_when: true
      tags: [docker]

    - name: Marker for completed Docker data-root migration
      ansible.builtin.file:
        path: "{{ docker_data_dir }}/.migrated_from_var_lib_docker"
        state: touch
        mode: "0644"
      tags: [docker]

    - name: Rename old /var/lib/docker to backup
      ansible.builtin.command:
        argv:
          - mv
          - /var/lib/docker
          - "{{ docker_migrate_docker_backup_path }}"
      when: docker_old_lib_stat.stat.isdir | default(false)
      register: docker_data_backup_rename
      changed_when: true
      tags: [docker]

    - name: Remember Docker data-root backup path
      ansible.builtin.set_fact:
        docker_migrate_backups_created: "{{ docker_migrate_backups_created + [docker_migrate_docker_backup_path] }}"
      when: docker_data_backup_rename is changed
      tags: [docker]

- name: Check containerd root migration marker
  ansible.builtin.stat:
    path: "{{ containerd_data_dir }}/.migrated_from_var_lib_containerd"
  register: containerd_data_migrated_marker
  tags: [docker]

- name: Check whether the old containerd directory exists
  ansible.builtin.stat:
    path: /var/lib/containerd
  register: containerd_old_lib_stat
  tags: [docker]

- name: Migrate containerd root (rsync /var/lib/containerd -> {{ containerd_data_dir }})
  when:
    - docker_migrate_data | bool
    - containerd_data_dir != "/var/lib/containerd"
    - not containerd_data_migrated_marker.stat.exists
    - containerd_old_lib_stat.stat.isdir | default(false)
  block:
    - name: Stop Docker and containerd before moving containerd root
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.socket
        - docker
        - containerd
      failed_when: false
      tags: [docker]

    - name: containerd root destination directory
      ansible.builtin.file:
        path: "{{ containerd_data_dir }}"
        state: directory
        mode: "0711"
      tags: [docker]

    - name: rsync /var/lib/containerd -> {{ containerd_data_dir }}
      ansible.builtin.command:
        argv:
          - rsync
          - -aHAX
          - /var/lib/containerd/
          - "{{ containerd_data_dir }}/"
      changed_when: true
      tags: [docker]

    - name: Marker for completed containerd root migration
      ansible.builtin.file:
        path: "{{ containerd_data_dir }}/.migrated_from_var_lib_containerd"
        state: touch
        mode: "0644"
      tags: [docker]

    - name: Rename old /var/lib/containerd to backup
      ansible.builtin.command:
        argv:
          - mv
          - /var/lib/containerd
          - "{{ docker_migrate_containerd_backup_path }}"
      when: containerd_old_lib_stat.stat.isdir | default(false)
      register: containerd_data_backup_rename
      changed_when: true
      tags: [docker]

    - name: Remember containerd root backup path
      ansible.builtin.set_fact:
        docker_migrate_backups_created: "{{ docker_migrate_backups_created + [docker_migrate_containerd_backup_path] }}"
      when: containerd_data_backup_rename is changed
      tags: [docker]

- name: docker_migrate summary — backup directories and removal command
  ansible.builtin.debug:
    msg: |
      Docker/containerd migration on {{ inventory_hostname }}: local backups kept:
      {% for p in docker_migrate_backups_created %}  {{ p }}
      {% endfor %}
      Verify: docker ps && docker info | grep -i 'Docker Root Dir'
      Remove after a successful check: sudo rm -rf {{ docker_migrate_backups_created | join(' ') }}
  when:
    - docker_migrate_data | bool
    - docker_migrate_backups_created | default([]) | length > 0
  tags: [docker]
