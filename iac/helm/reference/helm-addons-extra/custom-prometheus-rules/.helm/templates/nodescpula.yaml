{{- define "plk_annotations_cpubusy" }}
plk_protocol_version: "1"
plk_grouped_by__cpubusycustommon: CpuBusyCustomMon
plk_create_group_if_not_exists__cpubusycustommon: CpuBusyCustomMon
plk_markup_format: markdown
{{- end }}
{{- if ne .Values.werf.env "dev" }}
---
apiVersion: deckhouse.io/v1alpha1
kind: CustomPrometheusRules
metadata:
  labels:
    component: rules
    prometheus: main
  name: customcpubusy
spec:
  groups:
  - name: cpulaalers
    rules:
    - alert: CPUBusy85-5
      expr: |
        100 - (avg by (node) (irate(node_cpu_seconds_total{job="node-exporter", node=~"kube-prod.*(clickhouse|production).*", mode="idle"}[1m])) * 100) > 85
      for: 5m
      labels:
        severity_level: "2"
        team: platform-alerts
      annotations:
        {{- include "plk_annotations_cpubusy" . | indent 8 }}
        identifier: "{{`{{ $labels.node }}`}}"
        summary: "CPUBusy80-5"
        description: |-
          Node "{{`{{ $labels.node }}`}}" has seen a 85 percent spike in CPU usage in the last 5 minutes.
{{- end }}