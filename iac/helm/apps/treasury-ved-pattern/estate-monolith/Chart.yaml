apiVersion: v2
name: estate-monolith
description: DEMO-stand overlay. Custom Kafka, Postgres, websocket, and gRPC templates. Vendor charts stay pinned, not vendored.
type: application
version: 0.1.0
appVersion: "1.16.0"

# Six vendor tarballs from the source stand stay out of git. Fetch at install time.
# base-chart and front-base point at the shared libs owned by the pattern siblings.
dependencies:
  - name: kafka
    version: 12.17.5
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
  - name: akhq
    version: 0.3.1
    repository: "https://akhq.io/"
    condition: akhq.enabled
  - name: front-base
    version: 0.1.1
    repository: "file://../_libs/front-base"
    condition: operator-ui.enabled
    alias: operator-ui
  - name: base-chart
    version: 0.2.1
    repository: "file://../_libs/base-chart"
    condition: estate-chain-eth.enabled
    alias: estate-chain-eth
  - name: base-chart
    version: 0.2.1
    repository: "file://../_libs/base-chart"
    condition: estate-ledger.enabled
    alias: estate-ledger
  - name: base-chart
    version: 0.2.1
    repository: "file://../_libs/base-chart"
    condition: estate-onboarding.enabled
    alias: estate-onboarding
  - name: base-chart
    version: 0.2.1
    repository: "file://../_libs/base-chart"
    condition: estate-contract.enabled
    alias: estate-contract
  - name: base-chart
    version: 0.2.1
    repository: "file://../_libs/base-chart"
    condition: estate-web-ws.enabled
    alias: estate-web-ws
  - name: vault
    version: 0.28.1
    repository: "https://helm.releases.hashicorp.com/"
    condition: vault.enabled
  - name: keycloak
    version: 17.0.2
    repository: "https://codecentric.github.io/helm-charts"
    condition: keycloak.enabled
