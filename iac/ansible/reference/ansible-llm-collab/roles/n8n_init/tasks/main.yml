---
# Роль n8n_init: API key n8n + опционально id credentials воркфлоу из того же KV (Ubuntu_servers).
# Переменные: n8n_vault_* (defaults, group_vars). n8n_vault_inject_credential_ids — чтение id из Vault.

- name: Загрузить API key n8n из Vault
  ansible.builtin.set_fact:
    n8n_api_key: "{{ _vault.secret[n8n_vault_key_api_key] }}"
  vars:
    _vault: "{{ lookup('community.hashi_vault.vault_kv2_get', n8n_vault_path, engine_mount_point=n8n_vault_mount_point) }}"
  no_log: true
  when: n8n_api_key is not defined or n8n_api_key | length == 0

- name: Проверить, что n8n_api_key задан
  ansible.builtin.assert:
    that: n8n_api_key is defined and n8n_api_key | length > 0
    fail_msg: 'Задать n8n_api_key: Vault (ключ {{ n8n_vault_key_api_key }} в {{ n8n_vault_path }}) или -e/group_vars.'
  tags: always

# Id credentials (ноды SSH, Webhook+JWT) — тот же KV, что и API key. Имена в JSON: roles/n8n_workflows/defaults.
- name: Секрет Ubuntu_servers (id credentials воркфлоу n8n)
  ansible.builtin.set_fact:
    _n8n_sec: "{{ (lookup('community.hashi_vault.vault_kv2_get', n8n_vault_path, engine_mount_point=n8n_vault_mount_point)).secret | default({}) }}"
  no_log: true
  when: n8n_vault_inject_credential_ids | default(true) | bool

- name: Id credentials воркфлоу n8n из Vault
  ansible.builtin.set_fact:
    n8n_workflow_ssh_credential_id: "{{ n8n_workflow_ssh_credential_id | default(_n8n_ssh_id, true) }}"
    n8n_workflow_jwt_credential_id: "{{ n8n_workflow_jwt_credential_id | default(_n8n_jwt_id, true) }}"
  vars:
    _n8n_ssh_id: "{{ _n8n_sec[n8n_vault_key_ssh_credential_id] if n8n_vault_key_ssh_credential_id in _n8n_sec else '' }}"
    _n8n_jwt_id: "{{ _n8n_sec[n8n_vault_key_jwt_credential_id] if n8n_vault_key_jwt_credential_id in _n8n_sec else '' }}"
  no_log: true
  when:
    - n8n_vault_inject_credential_ids | default(true) | bool
    - _n8n_sec is defined
