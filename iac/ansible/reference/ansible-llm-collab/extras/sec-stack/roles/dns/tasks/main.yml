---
- name: systemd-resolved drop-in config directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  when: dns_servers | length > 0

- name: Set corporate DNS
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/corporate-dns.conf
    mode: "0644"
    content: |
      # Managed by ansible (sec-stack). Default cloud resolver does not know
      # the internal zone example.com.
      [Resolve]
      DNS={{ dns_servers | join(' ') }}
      Domains=~.
  when: dns_servers | length > 0
  notify: Restart systemd-resolved

- name: Apply resolved settings immediately
  ansible.builtin.meta: flush_handlers
