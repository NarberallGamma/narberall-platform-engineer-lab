---
# Expects: client_name. Load the matrix, expand, and build nextcloud_folders_flat.
# Called from groupfolders_main, groupfolders_reapply_one_client, and groupfolders_reapply_one_client_with_mkcol.

- name: Load the folder-and-permissions matrix
  ansible.builtin.include_vars:
    file: "{{ nextcloud_matrix_file }}"
    name: nextcloud_matrix

- name: Expand the matrix into a flat folder list (see groupfolders_expand_matrix.yml)
  ansible.builtin.include_tasks: groupfolders_expand_matrix.yml

- name: For "root-like permissions" clients — one path, all groups from the matrix
  ansible.builtin.set_fact:
    nextcloud_folders_flat: "{{ [{'path': client_name, 'view': _all_groups, 'edit': _all_groups, 'occ_skip': false}] }}"
  vars:
    _all_groups: "{{ ((_folders_out_expanded | map(attribute='view') | flatten) + (_folders_out_expanded | map(attribute='edit') | flatten)) | unique | list }}"
  when: client_name in (nextcloud_root_like_clients | default([]))

- name: Keep the full folder list from the matrix (regular clients)
  ansible.builtin.set_fact:
    nextcloud_folders_flat: "{{ _folders_out_expanded }}"
  when: client_name not in (nextcloud_root_like_clients | default([]))
