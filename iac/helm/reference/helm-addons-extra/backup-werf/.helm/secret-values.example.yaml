# Copy to secret-values.yaml (gitignored). Fill CHANGE_ME. Do not commit the live file.
# ssh_key is a single-line string consumed by the template (b64enc). No PEM file in git.
ssh_key: CHANGE_ME

mysql:
  app:
    cnf:
      _default: |
        [client]
        user=backup
        password=CHANGE_ME
        host=mysql-app.estate.example.com
      production: |
        [client]
        user=backup
        password=CHANGE_ME
        host=mysql-app.estate.example.com
  app_rds:
    cnf: |
      [client]
      user=backup
      password=CHANGE_ME
      host=mysql-app.rds.example.com

mongodb:
  password:
    staging:
      generic: CHANGE_ME
      audit: CHANGE_ME
    production:
      partners: CHANGE_ME
      transactions: CHANGE_ME
      kyc: CHANGE_ME
      trading: CHANGE_ME
      promotions: CHANGE_ME
      audit: CHANGE_ME
      clients: CHANGE_ME
      kafka: CHANGE_ME
      trading5: CHANGE_ME
