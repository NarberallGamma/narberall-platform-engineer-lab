apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ if .Values.externalSecret.name }}{{ .Values.externalSecret.name }}{{ else }}{{ include "prometheus-cloudeye-exporter.fullname" . }}{{ end }}
  namespace: {{ include "prometheus-cloudeye-exporter.namespace" . }}
  labels:
    {{- include "prometheus-cloudeye-exporter.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name | default "vault-cluster-secret-store" }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ if .Values.externalSecret.secretName }}{{ .Values.externalSecret.secretName }}{{ else }}{{ include "prometheus-cloudeye-exporter.fullname" . }}{{ end }}
    creationPolicy: Owner
  data:
  - secretKey: access_key
    remoteRef:
      key: {{ .Values.externalSecret.vaultPath | default "secret/cloudeye-exporter" }}
      property: access_key
  - secretKey: secret_key
    remoteRef:
      key: {{ .Values.externalSecret.vaultPath | default "secret/cloudeye-exporter" }}
      property: secret_key
  {{- if .Values.config.auth.use_project_id }}
  - secretKey: project_id
    remoteRef:
      key: {{ .Values.externalSecret.vaultPath | default "secret/cloudeye-exporter" }}
      property: project_id
  {{- else }}
  - secretKey: project_name
    remoteRef:
      key: {{ .Values.externalSecret.vaultPath | default "secret/cloudeye-exporter" }}
      property: project_name
  {{- end }}
