        title: Kafka DMS - Memory Usage > 70% (per broker)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: max by (kafka_broker) (sbercloud_sys_dms_broker_memory_usage{job="cloudeye-exporter"})
