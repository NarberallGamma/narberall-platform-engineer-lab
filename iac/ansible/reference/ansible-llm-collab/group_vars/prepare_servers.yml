# Variables for the prepare_servers role. Fill in values here before a run.
timezone: Europe/Moscow

# Task-block toggles
enable_timezone: false
enable_apt_basics: false
enable_apt_upgrade: false
# Permanently changes the server hostname; for a temporary change only, use domain_join_hostname
enable_hostname_change: false
enable_dns: false
enable_realm: false
enable_sssd: false
enable_ssh_pass_auth: false
# enable_hardening: hardening master block
enable_hardening: false
# harden_permissions: permissions on /etc/passwd, shadow, sshd_config, cron (tasks/permissions.yml); requires enable_hardening: true
harden_permissions: false
enable_agent: false
enable_root_password_change: false
enable_docker: false
# NVIDIA GPU + Container Toolkit + CDI for docker compose gpus: all (LLM and others)
enable_nvidia_gpu: false

# Hostname: by default do not change; use the current ansible_hostname fact
host_hostname: ""

# Short hostname for domain join (set temporarily before realm join, because AD limits the computer name to 15 characters)
domain_join_hostname: ""

# DNS: both corp.example.com domain controllers (AD replica; not a single nameserver)
dns_manage: false
dns_servers:
  - 10.10.1.9
  - 10.10.1.8
search_domains:
  - corp.example.com

# Domain and OU for join
ad_domain: corp.example.com
ad_realm: CORP.EXAMPLE.COM
ad_computer_ou: "OU=Ubuntu,OU=Servers,OU=Assets,DC=corp,DC=example,DC=com"
os_name: Linux
os_version: "Ubuntu 24"

# Domain credentials (username/password)
domain_admin_user: "admin"
domain_admin_password: "CHANGE_ME"

# SSSD
sssd_use_fqdn: false
# The %hostname% Administrators group is added automatically; extra groups go here.
# These groups are written both to the sudoers file and to the SSSD configuration.
# For login, add the user to the group in AD; after AD changes: sss_cache -E on the server.
# Master baseline: [] — only <hostname> Administrators (no domain users). Example: - domain users
simple_allow_groups: []
# These users are written both to the sudoers file and to the SSSD configuration.
simple_allow_users:
  - admin
  - admin02
  - admin03
  - admin04
  - admin05

# edr-vendor agent
# Either a download URL or a local file from the artifacts directory
agent_deb_url: ""  # download URL (if empty, the local file is used)
agent_deb_local: "edr-agent.example.deb"  # file name in the artifacts directory
agent_remote_path: "/tmp/edr-agent.deb"
agent_remove_before_install: false
agent_remove_purge: false
agent_force_reinstall: false
agent_env:
  BZ_AUTHORITY_SERVICE: "edr-proxy.example.com:80"
  BZ_SENSORS_SERVICE: "edr-proxy.example.com:443"
  BZ_POLLING_PERIOD: "300s"
  BZ_DIAL_TIMEOUT: "15s"
  BZ_AGENT_GROUPS: "nixprod"

# Root password change (plaintext or auto-generate when enable_root_password_change)
root_password: ""
root_password_auto_generate: false
root_password_length: 30
root_password_regenerate: false
root_password_artifacts_dest: "{{ playbook_dir }}/../artifacts/root_credentials"
root_password_credentials_tmp_path: "/tmp/ansible_root_credentials.txt"
root_password_cleanup_credentials_tmp: true

# Docker settings
# Docker data directory; Engine is installed from the official download.docker.com repo (docker-ce, compose plugin).
docker_data_dir: "/docker/system"
# containerd data directory (recommended on the same disk as docker_data_dir — otherwise image layers may fill /).
containerd_data_dir: "/docker/containerd"
# Move /var/lib/docker and /var/lib/containerd to docker_data_dir / containerd_data_dir (tasks/docker_migrate.yml).
# Requires enable_docker: true; stops Docker and containerd; old directories become *.pre-migrate.bak (result in PLAY RECAP).
# One-shot on the host or with --tags docker; leave false after migration.
docker_migrate_data: false
# docker save/load of images into /docker/backup/docker-images before purge of docker.io and after docker-ce (tasks/docker_images_*.yml).
docker_images_backup_enabled: false
docker_images_backup_dir: "/docker/backup/docker-images"
# docker_remove_distro_packages: false  # uncomment after migrating to docker-ce so purge is not run on every play

# NVIDIA GPU (prepare_nvidia_gpu role, after enable_docker: true)
# Chain: nvidia-smi → Container Toolkit → nvidia-ctk cdi generate → runtime configure → docker run --gpus all
prepare_nvidia_install_driver_if_missing: false
prepare_nvidia_reboot_after_driver: false
prepare_nvidia_verify_docker_gpu: false
