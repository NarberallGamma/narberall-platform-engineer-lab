---
- name: Disallow root login over SSH (sshd)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PermitRootLogin\s+'
    line: "PermitRootLogin no"
    validate: "sshd -t -f %s"
  notify: reload sshd
  when: vps_ssh_disable_root_login | bool
  tags: [vps, ssh, prepare_vps]

- name: Allow root login over SSH (sshd, explicit value)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PermitRootLogin\s+'
    line: "PermitRootLogin yes"
    validate: "sshd -t -f %s"
  notify: reload sshd
  when: not vps_ssh_disable_root_login | bool
  tags: [vps, ssh, prepare_vps]
