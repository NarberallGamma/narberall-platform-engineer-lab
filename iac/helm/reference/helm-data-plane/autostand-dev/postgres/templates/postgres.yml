apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init-multiple-dbs.sql: |
    CREATE DATABASE app_lab;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        args:
        - -c
        - max_connections=10000
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: app
        - name: POSTGRES_PASSWORD
          value: CHANGE_ME
        - name: POSTGRES_DB
          value: defaultdb
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: init-script
        configMap:
          name: postgres-init
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  annotations:
    storage.example.com/volume-type: ssd
    storage.example.com/volume-name-prefix: "autostand-postgres"
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: example-block
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgresnodeport
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: http
      port: 5432
      targetPort: 5432
      {{- if and .Values.nodePorts (index .Values.nodePorts "postgres") }}
      nodePort: {{ index .Values.nodePorts "postgres" }}
      {{- end }}
