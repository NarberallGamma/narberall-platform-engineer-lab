apiVersion: v1
kind: ConfigMap
metadata:
 name: {{ .Chart.Name }}-nginx-conf
data:
  logs.js: |-
    function body_json(r) {
      try {
        JSON.parse(r.requestText);
      } catch (e) {
        if (r.requestText === undefined) {
          return '""';
        }
        return '"' + r.requestText + '"';
      }
      return JSON.stringify(JSON.parse(r.requestText));
    }
    function headers_json(r) {
      return JSON.stringify(r.headersIn);
    }
    export default {body_json, headers_json};

  nginx.conf: |-
    load_module modules/ngx_http_js_module.so;

    user nginx;
    #daemon off;
    worker_processes  1;

    error_log  /dev/stderr;
    pid        /var/run/nginx.pid;

    worker_rlimit_nofile 200000;
    timer_resolution 200ms;

    events {
      worker_connections 50000;
      use epoll;
    }

    http {
      js_import logs.js;
      js_set $headers_json logs.headers_json;
      js_set $body_json logs.body_json;

      include       /etc/nginx/mime.types;
      server_names_hash_bucket_size  128;
      client_header_timeout   10m;
      client_body_timeout     10m;
      send_timeout            10m;
      types_hash_max_size 2048;
      access_log off;

      set_real_ip_from 0.0.0.0/0;
      real_ip_header X-Forwarded-For;

      log_format main escape=none
        '{'
          '"time": "$time_iso8601",'
          '"request_id": "$request_id",'
          '"remote_addr": "$remote_addr", '
          '"remote_user": "$remote_user", '
          '"bytes_received": $request_length,'
          '"bytes_sent": $bytes_sent,'
          '"protocol": "$server_protocol",'
          '"scheme": "$scheme",'
          '"method": "$request_method",'
          '"host": "$host",'
          '"request_uri": "$request_uri",'
          '"request_query": "$args",'
          '"request_body": $body_json,'
          '"referrer": "$http_referer",'
          '"user_agent": "$http_user_agent",'
          '"request_time": $request_time,'
          '"status": $status,'
          '"vhost": "$server_name",'
          '"nginx_upstream_addr": "$upstream_addr",'
          '"nginx_upstream_bytes_received": "$upstream_bytes_received",'
          '"nginx_upstream_response_time": "$upstream_response_time",'
          '"nginx_upstream_status": "$upstream_status",'
          '"location": "$log_location",'
          '"headers": $headers_json '
        '}';

      sendfile        on;

      keepalive_timeout       65;
      keepalive_requests	   100;
      tcp_nodelay        on;
      tcp_nopush on;

      resolver d8-kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

      server_tokens off;

      proxy_redirect off;
      proxy_read_timeout 300;
      proxy_connect_timeout 300;

      gzip  on;
      gzip_http_version 1.0;
      gzip_comp_level 4;
      gzip_proxied any;
      gzip_vary off;
      gzip_types text/plain text/css application/x-javascript text/xml application/xml application/rss+xml application/atom+xml text/javascript application/javascript application/json text/mathml;
      gzip_min_length  1000;
      gzip_disable     "msie6";

      variables_hash_max_size 1024;
      variables_hash_bucket_size 64;
      types_hash_bucket_size 64;

      # upstreams
      upstream backend-fpm {
        server 127.0.0.1:9000;
      }

      # some maps
      map $http_x_forwarded_proto $thescheme {
        default $scheme;
        https https;
        http http;
      }

      map $thescheme $phphttps {
        https on;
        http "";
      }

      # Vhosts
      server {
        listen 80;

        server_name _;
        server_tokens off;
        server_name_in_redirect  off;
        underscores_in_headers on;

        root /app/public;

        set $log_location "undef";

        charset utf-8;
        client_max_body_size 200m;
        fastcgi_intercept_errors on;

        access_log /dev/stdout main;
        error_log /dev/stderr;
        index index.php index.html index.htm;

        location / {
          set $log_location "root";
          try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
          set $log_location "php";
          fastcgi_pass backend-fpm;
          fastcgi_split_path_info ^(.+\.php)(/.*)$;
          include fastcgi_params;
          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          fastcgi_param PATH_INFO $fastcgi_path_info;
          internal;
        }

        location ~ \.php$ {
          return 404;
        }

        location ~* "^\/keep-alive$" {
          set $log_location "keep-alive-web";
          access_log off;
          try_files $uri /index.php$is_args$args;
        }

        location ~* "^\/api\/v1\/keep-alive$" {
          set $log_location "keep-alive-api";
          access_log off;
          try_files $uri /index.php$is_args$args;
        }

      }
    }

  fastcgi_params: |-
    fastcgi_param  QUERY_STRING       $query_string;
    fastcgi_param  REQUEST_METHOD     $request_method;
    fastcgi_param  CONTENT_TYPE       $content_type;
    fastcgi_param  CONTENT_LENGTH     $content_length;

    fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
    fastcgi_param  REQUEST_URI        $request_uri;
    fastcgi_param  DOCUMENT_URI       $document_uri;
    fastcgi_param  DOCUMENT_ROOT      $document_root;
    fastcgi_param  SERVER_PROTOCOL    $server_protocol;
    fastcgi_param  REQUEST_SCHEME     $thescheme;
    fastcgi_param  HTTPS              $phphttps if_not_empty;

    fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
    fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;

    fastcgi_param  REMOTE_ADDR        $remote_addr;
    fastcgi_param  REMOTE_PORT        $remote_port;
    fastcgi_param  SERVER_ADDR        $server_addr;
    fastcgi_param  SERVER_PORT        $server_port;
    fastcgi_param  SERVER_NAME        $server_name;

    # PHP only, required if PHP was built with --enable-force-cgi-redirect
    fastcgi_param  REDIRECT_STATUS    200;

