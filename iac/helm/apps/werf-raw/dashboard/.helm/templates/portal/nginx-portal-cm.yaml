---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-{{ .Values.werf.env }}-nginx-config
data:
  nginx.conf: |
    user nginx;
    error_log  /dev/stderr;
    pid /run/nginx.pid;
    worker_processes 2;
    worker_rlimit_nofile 409600;

    events {
      worker_connections 100000;
      multi_accept on;
    }

    http {
      set_real_ip_from 0.0.0.0/0;

      charset utf-8;
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      server_tokens off;
      log_not_found off;
      types_hash_max_size 2048;
      client_max_body_size 300M;

      keepalive_timeout 65;
      client_body_timeout 20;
      send_timeout 10;

      resolver 10.10.0.10 valid=3s;

      # MIME
      include mime.types;
      default_type application/octet-stream;

      # logging
      log_format combined_plus '{ "ip": "$remote_addr", "http_user": "$remote_user", "request_id": "$request_id", "time": "$time_local",'
        ' "method": "$request_method", "uri": "$scheme://$http_host$request_uri", "protocol": "$server_protocol", "status": "$status", "body_size": "$body_bytes_sent", "referrer": "$http_referer", '
        ' "user_agent": "$http_user_agent", "request_time": "$request_time", "cache_status": "$upstream_cache_status",'
        ' "upstream_response_time": "$upstream_response_time", "upstream_addr": "$upstream_addr", "upstream_status": "$upstream_status", "upstream_response_length": "$upstream_response_length", "rewrited": "$uri$is_args$args", "redirect": "$sent_http_location", "location": "$log_location"}';

      # gzip
      gzip on;
      gzip_vary on;
      gzip_proxied any;
      gzip_comp_level 1;
      gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

      # highload?
      proxy_buffer_size 16k;
      proxy_buffers 32 16k;
      proxy_busy_buffers_size 64k;
      proxy_max_temp_file_size 0;

      fastcgi_buffer_size 16k;
      fastcgi_buffers 32 16k;
      fastcgi_busy_buffers_size 64k;
      fastcgi_max_temp_file_size 0;

      large_client_header_buffers 8 16k;
      client_header_buffer_size 4k;
      client_body_buffer_size 256k;

      proxy_cache_path      /tmp/nginx-cache levels=1:2 keys_zone=static-cache:2m max_size=1g inactive=1m use_temp_path=off;
      proxy_cache_key       $scheme$proxy_host$request_uri;
      proxy_cache_lock      on;
      proxy_cache_background_update on;
      proxy_cache_use_stale updating;

      server {
        listen 80 default;
        server_name _;

        access_log /dev/stdout combined_plus;

        root {{ .Values.portal.root_path }}/apps/web;

        location /registration {
          rewrite ^\/registration(\/?.*) /index.html$1 last;
        }

        location /static {
{{- if eq .Values.werf.env "production" }}
           try_files $uri $uri/ @s3fallback;
{{- else }}
           try_files $uri $uri/ 404
{{- end }}
           set $log_location "static";
           error_page 404 =404;
        }
        location /assets {
{{- if eq .Values.werf.env "production" }}
           try_files $uri $uri/ @s3fallback;
{{- else }}
           try_files $uri $uri/ 404
{{- end }}
           set $log_location "assets";
           error_page 404 =404;
        }
        location / {
          try_files $uri $uri/ /index.html;
        }

        location ~* "^\/_tech\/ngx-status$" {
          stub_status;
          set $log_location "tech-nginx";
        }
{{- if eq .Values.werf.env "production" }}
        location @s3fallback {
          set $s3_bucket "{{ .Values.portal.job.bucket }}";
          set $s3_endpoint "{{ .Values.portal.job.endpoint }}";
          set $log_location "s3_fallback";
          #rewrite ^(.*)$ /$s3_bucket$1 break;
          proxy_set_header   Host $s3_endpoint;
          proxy_buffering off;
          proxy_ssl_server_name on;
          proxy_pass https://$s3_endpoint$request_uri;
        }
{{- end }}
      }
    }
