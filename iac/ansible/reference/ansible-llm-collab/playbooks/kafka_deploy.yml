---
# Kafka (apache/kafka, KRaft) in Docker Compose; host directory — kafka_app_root (default /docker/apps/kafka).
# Init: CLUSTER_ID from Vault (kafka_init) or -e kafka_cluster_id=...
# Run: ./scripts/run/run_kafka.sh --limit kafka-prod.example.com
# Tags: kafka (everything), kafka_install (directories + compose), kafka_manage | kafka_config (template + compose), kafka_restart (recreate containers).

- name: Deploy Kafka (Docker Compose)
  hosts: kafka
  gather_facts: true
  become: true

  # Explicit load: one file with all kafka group variables, independent of how Ansible maps inventory and group_vars in Docker.
  pre_tasks:
    - name: kafka group parameters (group_vars/kafka/main.yml)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/kafka/main.yml"
      tags: [always]

  roles:
    - role: kafka_init
      tags: [kafka, kafka_init, vault, kafka_install]
    - role: kafka_deploy
      tags: [kafka, kafka_deploy]
