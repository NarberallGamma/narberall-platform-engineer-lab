---
# Install Docker Engine from the official download.docker.com repository
# (docker-ce, Compose V2 as a plugin: docker compose).
# Removal of distro packages (docker.io, docker-compose, etc.) — see docker_remove_distro_packages.
#
# Manual removal of distro Docker (as in Docker docs), if migrating without Ansible:
#   systemctl stop docker.socket docker 2>/dev/null || true
#   apt-get purge -y docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc
#   apt-get autoremove -y
# Do not remove the data-root directory (e.g. /docker/system) if saved volumes/images are needed.

- name: Determine distro for Docker repository (ubuntu / debian)
  ansible.builtin.set_fact:
    docker_apt_dist: "{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else ('debian' if ansible_facts['distribution'] == 'Debian' else '') }}"
  tags: [docker]

- name: Check supported distro for official Docker
  ansible.builtin.assert:
    that:
      - docker_apt_dist | length > 0
    fail_msg: "Official Docker repository is supported only for Ubuntu and Debian (current: {{ ansible_facts['distribution'] }})."
  tags: [docker]

- name: Docker apt package architecture (amd64 / arm64 / armhf)
  ansible.builtin.set_fact:
    docker_apt_arch: >-
      {{
        'arm64' if ansible_facts['architecture'] == 'aarch64'
        else ('armhf' if ansible_facts['architecture'] == 'armv7l'
        else ('amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture']))
      }}
  tags: [docker]

- name: Backup Docker images before purge/migrate
  ansible.builtin.include_tasks: docker_images_backup.yml
  when: enable_docker | default(false) | bool
  tags: [docker]

- name: Stop Docker service before removing distro packages
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - docker.socket
    - docker
  failed_when: false
  when: docker_remove_distro_packages | bool
  tags: [docker]

- name: Remove distro Docker packages (docker.io, compose v1, etc.)
  ansible.builtin.apt:
    name: "{{ docker_distro_packages_remove }}"
    state: absent
    purge: true
    autoremove: true
    lock_timeout: "{{ prepare_servers_apt_lock_timeout }}"
  when: docker_remove_distro_packages | bool
  tags: [docker]

- name: Install dependencies for apt over HTTPS
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    lock_timeout: "{{ prepare_servers_apt_lock_timeout }}"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Directory for apt keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Clean up legacy Docker apt sources (docker.gpg vs docker.asc)
  ansible.builtin.include_tasks: docker_apt_legacy_cleanup.yml
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Docker repository GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ docker_apt_dist }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Docker repository (stable)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ docker_apt_dist }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: "{{ docker_apt_channel }}"
    architectures: "{{ docker_apt_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Update apt cache after adding Docker repository
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: "{{ prepare_servers_apt_lock_timeout }}"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Install Docker Engine and Compose V2 (plugin)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    lock_timeout: "{{ prepare_servers_apt_lock_timeout }}"
  when: not (docker_skip_package_install | default(false) | bool)
  tags: [docker]

- name: Set default docker_data_dir if not specified
  ansible.builtin.set_fact:
    docker_data_dir: "{{ docker_data_dir | default('/var/lib/docker') }}"
  tags: [docker]

- name: Set default containerd_data_dir if not specified
  ansible.builtin.set_fact:
    containerd_data_dir: "{{ containerd_data_dir | default('/var/lib/containerd') }}"
  tags: [docker]

- name: Migrate Docker and containerd data to target directories
  ansible.builtin.include_tasks: docker_migrate.yml
  when: docker_migrate_data | bool
  tags: [docker]

- name: Create Docker data directory if custom path specified
  ansible.builtin.file:
    path: "{{ docker_data_dir }}"
    state: directory
    mode: "0755"
  when: docker_data_dir != "/var/lib/docker"
  tags: [docker]

- name: Configure Docker daemon to use custom data directory
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "{{ docker_data_dir }}"
      }
    mode: "0644"
  when: docker_data_dir != "/var/lib/docker"
  notify: restart docker
  tags: [docker]

# Data migration from /var/lib/containerd is handled separately (rsync + root change + rename of the old directory).
# Here only the directory and the root line in config.toml of the docker-ce/containerd.io package (same as data-root for docker).

- name: Create containerd data directory if custom path specified
  ansible.builtin.file:
    path: "{{ containerd_data_dir }}"
    state: directory
    mode: "0711"
  when: containerd_data_dir != "/var/lib/containerd"
  tags: [docker]

- name: Configure containerd root in /etc/containerd/config.toml
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: "^#?root\\s*=.*"
    line: 'root = "{{ containerd_data_dir }}"'
    insertafter: '^disabled_plugins'
    backup: true
  when: containerd_data_dir != "/var/lib/containerd"
  notify: restart containerd stack
  tags: [docker]

- name: Start and enable Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  tags: [docker]

- name: Add current user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  tags: [docker]

- name: Restore Docker images from tar after migrate/purge
  ansible.builtin.include_tasks: docker_images_restore.yml
  when: enable_docker | default(false) | bool
  tags: [docker]
