{{- $env := .Values.werf.env }}
{{- $app_urls := pluck .Values.global.cluster .Values.app.app_urls | first }}
{{- $app_urls := pluck $env $app_urls | first | default $app_urls._default }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-nginx
data:
  nginx.conf: |-
    user www-data;
    #daemon off;
    worker_processes  1;

    error_log  /dev/stderr;
    pid        /var/run/nginx.pid;

    worker_rlimit_nofile 200000;
    timer_resolution 200ms;

    events {
      worker_connections 50000;
      use epoll;
    }

    http {
      include       /etc/nginx/mime.types;
      server_names_hash_bucket_size  128;
      client_header_timeout   10m;
      client_body_timeout     10m;
      send_timeout            10m;
      types_hash_max_size 2048;
      access_log off;

      log_format  stat  '$remote_addr $remote_user [$time_local] $request_method "$scheme://$http_host$request_uri" $server_protocol $status $bytes_sent $body_bytes_sent "$http_referer" "$http_user_agent" reqtime="$request_time" upconntime="$upstream_connect_time" upresptime="$upstream_response_time" upaddr="$upstream_addr" upstatus="$upstream_status" redirect="$sent_http_location"';

      sendfile on;

      keepalive_timeout 65;
      keepalive_requests 100;
      tcp_nodelay on;
      tcp_nopush on;

      resolver 10.10.0.10 valid=3s;

      server_tokens off;

      proxy_redirect off;
      proxy_read_timeout 300;
      proxy_connect_timeout 300;

      gzip on;
      gzip_http_version 1.0;
      gzip_comp_level 2;
      gzip_proxied any;
      gzip_vary off;
      gzip_types text/plain text/css application/x-javascript text/xml application/xml application/rss+xml application/atom+xml text/javascript application/javascript application/json text/mathml;
      gzip_min_length  1000;
      gzip_disable     "msie6";

      variables_hash_max_size 1024;
      variables_hash_bucket_size 64;
      types_hash_bucket_size 64;

      # upstreams
      upstream backend-fpm {
        server 127.0.0.1:9000;
      }

      # some maps
      map $http_x_forwarded_proto $thescheme {
        default $scheme;
        https https;
        http http;
      }

      map $thescheme $phphttps {
        https on;
        http "";
      }

      # Vhosts
      server {
        listen 80;

        server_name {{ list $ $app_urls $env | include "server_name" }};
        server_tokens off;
        server_name_in_redirect  off;
        underscores_in_headers on;

        root /app/public;

        set $log_location "undef";

        charset utf-8;
        client_max_body_size 200m;
        fastcgi_intercept_errors on;

        access_log /dev/stdout stat;
        error_log /dev/stderr;
        index index.php index.html index.htm;

        location / {
          try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ /.*\.php(/|$) {
          fastcgi_index index.php;
          fastcgi_pass backend-fpm;

          fastcgi_split_path_info ^(.+\.php)(/.*)$;
          include fastcgi_params;
          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          fastcgi_param HTTPS off;
          fastcgi_param SUBDOMAIN $subdomain; # $_SERVER['SUBDOMAIN']
          fastcgi_param PHP_VALUE post_max_size=20M;
          fastcgi_param PHP_VALUE upload_max_filesize=20M;
          fastcgi_read_timeout 300;

          set $log_location "php";
        }
        location ~* "^\/_tech\/(php-status|php-ping)$" {
          include fastcgi_params;
          fastcgi_pass backend-fpm;
          set $log_location "tech-php";
          access_log off;
        }
        location ~* "^\/_tech\/ngx-status$" {
          stub_status;
          set $log_location "tech-nginx";
          access_log off;
        }
      }
    }

  fastcgi_params: |-
    fastcgi_param  QUERY_STRING       $query_string;
    fastcgi_param  REQUEST_METHOD     $request_method;
    fastcgi_param  CONTENT_TYPE       $content_type;
    fastcgi_param  CONTENT_LENGTH     $content_length;

    fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
    fastcgi_param  REQUEST_URI        $request_uri;
    fastcgi_param  DOCUMENT_URI       $document_uri;
    fastcgi_param  DOCUMENT_ROOT      $document_root;
    fastcgi_param  SERVER_PROTOCOL    $server_protocol;
    fastcgi_param  REQUEST_SCHEME     $thescheme;
    fastcgi_param  HTTPS              $phphttps if_not_empty;

    fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
    fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;

    fastcgi_param  REMOTE_ADDR        $remote_addr;
    fastcgi_param  REMOTE_PORT        $remote_port;
    fastcgi_param  SERVER_ADDR        $server_addr;
    fastcgi_param  SERVER_PORT        $server_port;
    fastcgi_param  SERVER_NAME        $server_name;

    # PHP only, required if PHP was built with --enable-force-cgi-redirect
    fastcgi_param  REDIRECT_STATUS    200;
