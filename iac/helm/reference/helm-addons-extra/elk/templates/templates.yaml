  entrypoint.sh: |-
    #!/bin/bash
    echo "Upload script"
    CURL_VARS="-s -u ${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD} --insecure https://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}"
    getElasticVersion() {
      VERSION=$(curl $CURL_VARS | jq -e .version.number)
    if [ "$VERSION" != "null" ]; then
      echo "ES version: ${VERSION}"
    else
      echo "Get version failed"
      exit 1
    fi
    }

    putElasticIndexTemplate() {
        for template in "k8s-app" "k8s-app-gra" "k8s-app-dev" "k8s-app-dashboard-api" "dashboard-api-sdk"; do
            RESULT=""
            echo "[INFO] Rendered Index Template '$template':"
            cat /opt/templates/index-$template.json | jq .
            echo "[INFO] Upload Index '$template':"
            RESULT=$(curl -H "Content-Type: application/json" $CURL_VARS/_index_template/$template -XPUT -d "@/opt/templates/index-$template.json")
            if [[ "$(echo $RESULT | jq .acknowledged)" == "true" ]]; then
                echo "[INFO] Index Template '$template' upload: Done"
            else
                echo "[ERROR] Upload Index Template '$template' failed"
                echo $RESULT | jq .
                exit 1
            fi
        done
    }

    putElasticILM() {
        for ilm in "k8s-app" "k8s-app-dashboard-api" "dashboard-api-sdk"; do
            RESULT=""
            echo "[INFO] Rendered ILM '$ilm':"
            cat /opt/templates/ilm-$ilm.json | jq .
            echo "[INFO] Upload ILM '$ilm':"
            RESULT=$(curl -H "Content-Type: application/json" $CURL_VARS/_ilm/policy/$ilm -XPUT -d "@/opt/templates/ilm-$ilm.json")
            if [[ "$(echo $RESULT | jq .acknowledged)" == "true" ]]; then
                echo "[INFO] ILM '$ilm' upload: Done"
            else
                echo "[ERROR] Upload ILM '$ilm' failed"
                echo $RESULT | jq .
                exit 1
            fi
        done
    }

    getElasticVersion
    putElasticIndexTemplate
    putElasticILM
