fullnameOverride: estate

global:
  imagePullSecrets:
    - name: gitlab-regcred

application:
  enabled: true
  replicaCount: 1

  imagePullSecrets:
    - name: gitlab-regcred

  image:
    repository: "example.registry/platform/web-site"
    tag: "2.0"
    pullPolicy: IfNotPresent

  service:
    enabled: true
    port: 80
    targetPort: 80
    type: ClusterIP

  containerPorts:
    - name: http
      containerPort: 80
      protocol: TCP

  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      kubernetes.io/tls-acme: "true"
    hosts:
      - host: site.example.com
        paths:
          - path: /
            pathType: Prefix
      - host: www.site.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: wildcard-tls
        hosts:
          - site.example.com
          - www.site.example.com

  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 600m
      memory: 384Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  podAnnotations: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}
