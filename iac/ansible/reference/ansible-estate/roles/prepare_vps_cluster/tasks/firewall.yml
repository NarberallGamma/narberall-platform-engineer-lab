---
- name: Check that Kubernetes source CIDRs are set for the :443 rule
  ansible.builtin.assert:
    that:
      - vps_k8s_egress_source_cidrs | length > 0
    fail_msg: >-
      Set vps_k8s_egress_source_cidrs in group_vars/vps_cluster.yml
      (public NAT IPs of cloud.ru and/or other egress gateway sources, CIDR format).
  tags: [vps, firewall, prepare_vps]

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    lock_timeout: "{{ prepare_servers_apt_lock_timeout | default(600) }}"
  tags: [vps, firewall, prepare_vps]

- name: Reset ufw rules before applying the VPS policy
  community.general.ufw:
    state: reset
  tags: [vps, firewall, prepare_vps]

- name: Default ufw policy for outgoing
  community.general.ufw:
    direction: outgoing
    policy: "{{ 'allow' if vps_firewall_allow_outgoing | bool else 'deny' }}"
  tags: [vps, firewall, prepare_vps]

- name: Default ufw policy for incoming
  community.general.ufw:
    direction: incoming
    policy: deny
  tags: [vps, firewall, prepare_vps]

- name: Allow SSH from any address (default mode)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: not vps_ssh_restrict_source_ips | bool
  tags: [vps, firewall, prepare_vps]

- name: Allow SSH only from listed CIDRs
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ vps_ssh_allowed_source_cidrs }}"
  when:
    - vps_ssh_restrict_source_ips | bool
    - vps_ssh_allowed_source_cidrs | length > 0
  tags: [vps, firewall, prepare_vps]

- name: Check CIDR list when SSH is restricted
  ansible.builtin.assert:
    that:
      - vps_ssh_allowed_source_cidrs | length > 0
    fail_msg: >-
      vps_ssh_restrict_source_ips=true requires a non-empty vps_ssh_allowed_source_cidrs
      (include the IP from which ansible-playbook is run).
  when: vps_ssh_restrict_source_ips | bool
  tags: [vps, firewall, prepare_vps]

- name: Allow inbound Envoy from Kubernetes / NAT addresses
  community.general.ufw:
    rule: allow
    port: "{{ vps_envoy_listen_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ vps_k8s_egress_source_cidrs }}"
  tags: [vps, firewall, prepare_vps]

- name: Enable ufw
  community.general.ufw:
    state: enabled
  tags: [vps, firewall, prepare_vps]
