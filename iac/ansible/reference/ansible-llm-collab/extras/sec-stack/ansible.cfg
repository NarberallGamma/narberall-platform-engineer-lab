[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
# community.sops.sops — прозрачная расшифровка *.sops.yml из group_vars/host_vars
vars_plugins_enabled = host_group_vars,community.sops.sops
# В закрытом сегменте можно ослабить, но лучше раздать known_hosts:
# host_key_checking = False

[ssh_connection]
pipelining = True
