---
# Expand nextcloud_matrix.folders into a flat path/view/edit list for WebDAV and occ.
# client_name — client name (in reapply it is set from _current_client before this file is included).
#
# Level 4 under a matrix node with children_mkcol (e.g. {client}/{client}/Accounting):
# - children_mkcol — subfolder names (MKCOL); by default each copies view/edit from the parent row,
#   occ_skip: false — occ and auto-deny apply the same as at level 3, so ACL shows the groups explicitly.
# - children_mkcol_occ_path_fallback — same order and length as children_mkcol: alternate L4 segment name on disk;
#   nextcloud_folders_flat for the L4 row gets path_occ_fallback; occ tries the primary path first, then the fallback.
# - children — dict { name, view?, edit? } for exceptions (e.g. "Contracts" — its own groups instead of copying the parent).
# - deny_on_l4_children — extra denies (e.g. Assistant on all L4 except except_child_name — see env matrix).
# - matrix_deny on a folders row — list { group: … [, perms: … ] }; copied into nextcloud_folders_flat (explicit occ deny on the path).
#
# Sentinel __NC_MATRIX_RO_ALL__ in view: see matrix defaults — RO expansion across all matrix groups happens in groupfolders_apply_permissions.yml.

# The result must be serialized to JSON and parsed (from_json): otherwise YAML `>- ... {{ ns.lst }}`
# yields a string, not a list → loop/nextcloud_folders_flat break (Ansible 2.14+).
- name: Expand the matrix into a flat folder list (path, view, edit; deny; L4 without a children entry — copy parent view/edit)
  ansible.builtin.set_fact:
    _folders_out_expanded: "{{ _folders_out_json | from_json }}"
  vars:
    _folders_out_json: >-
      {% set ns = namespace(lst=[]) %}
      {% for f in nextcloud_matrix.folders %}
      {% set p = f.path.replace('{client}', client_name) %}
      {% set row0 = {'path': p, 'view': f.view | default([]), 'edit': f.edit | default([]), 'occ_skip': false} %}
      {% if f.matrix_deny is defined %}
      {% set row0 = row0 | combine({'matrix_deny': f.matrix_deny}) %}
      {% endif %}
      {% set _ = ns.lst.append(row0) %}
      {% set ns_m = namespace(names=[]) %}
      {% for n in f.children_mkcol | default([]) %}
      {% set _ = ns_m.names.append(n) %}
      {% endfor %}
      {% for c in f.children | default([]) %}
      {% if c is mapping %}
      {% if c.name not in ns_m.names %}
      {% set _ = ns_m.names.append(c.name) %}
      {% endif %}
      {% else %}
      {% if c not in ns_m.names %}
      {% set _ = ns_m.names.append(c) %}
      {% endif %}
      {% endif %}
      {% endfor %}
      {% for chn in ns_m.names %}
      {% set ex = namespace(v=[], e=[], mapped=false) %}
      {% for c in f.children | default([]) %}
      {% if c is mapping and c.name == chn %}
      {% set ex.v = c.view | default(f.view | default([])) %}
      {% set ex.e = c.edit | default(f.edit | default([])) %}
      {% set ex.mapped = true %}
      {% endif %}
      {% endfor %}
      {% if ex.mapped %}
      {% set chv = ex.v %}
      {% set che = ex.e %}
      {% else %}
      {% set chv = f.view | default([]) %}
      {% set che = f.edit | default([]) %}
      {% endif %}
      {% set row = {'path': p ~ '/' ~ chn, 'view': chv, 'edit': che, 'occ_skip': false} %}
      {% set _mkcol = f.children_mkcol | default([]) %}
      {% set _fb = f.children_mkcol_occ_path_fallback | default([]) %}
      {% if loop.index0 < (_mkcol | length) and loop.index0 < (_fb | length) %}
      {% set _altn = _fb[loop.index0] %}
      {% if _altn != chn %}
      {% set row = row | combine({'path_occ_fallback': p ~ '/' ~ _altn}) %}
      {% endif %}
      {% endif %}
      {% if f.deny_on_l4_children is defined %}
      {% set exn = f.deny_on_l4_children.except_child_name | default('') %}
      {% if chn != exn %}
      {% set denyperm = f.deny_on_l4_children.perms | default(nextcloud_occ_deny_permissions | default('-read -write -create -delete -share')) %}
      {% set mdn = namespace(ll=[]) %}
      {% for dg in f.deny_on_l4_children.groups | default([]) %}
      {% set _ = mdn.ll.append({'group': dg, 'perms': denyperm}) %}
      {% endfor %}
      {% set row = row | combine({'matrix_deny': mdn.ll}) %}
      {% endif %}
      {% endif %}
      {% set _ = ns.lst.append(row) %}
      {% endfor %}
      {% endfor %}
      {{ ns.lst | to_json }}