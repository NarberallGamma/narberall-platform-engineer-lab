{{- if .Values.kafkaConnect }}
{{- $vaultSecret := lookup "v1" "Secret" "kafka" "kafka-vault-credentials" }}
apiVersion: v1
kind: Secret
metadata:
  name: kafka-user-pass
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $vaultSecret }}
  pass: {{ $vaultSecret.data.kafkaInterBrokerPassword }}
  {{- else }}
  pass: {{ "VAULT_KAFKA_CLIENT_PASSWORD" | b64enc }}
  {{- end }}
{{- end }}
