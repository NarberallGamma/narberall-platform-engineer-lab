---
- name: Check whether systemd-resolved service is present
  ansible.builtin.command: systemctl list-unit-files systemd-resolved.service
  register: systemd_resolved_check
  changed_when: false
  failed_when: false

- name: Install systemd-resolved if missing (Debian / minimal images)
  ansible.builtin.apt:
    name: systemd-resolved
    state: present
    update_cache: yes
  when: systemd_resolved_check.rc != 0
  register: systemd_resolved_installed
  ignore_errors: yes

- name: Ensure systemd is installed (base package)
  ansible.builtin.package:
    name: systemd
    state: present

- name: Start and enable systemd-resolved if it was just installed
  ansible.builtin.systemd:
    name: systemd-resolved
    state: started
    enabled: yes
    daemon_reload: yes
  when: systemd_resolved_installed.changed | default(false)
  ignore_errors: yes

- name: Check that systemd-resolved is running
  ansible.builtin.command: systemctl is-active systemd-resolved
  register: systemd_resolved_active
  changed_when: false
  failed_when: false

- name: Check that /run/systemd/resolve/resolv.conf exists
  ansible.builtin.stat:
    path: /run/systemd/resolve/resolv.conf
  register: systemd_resolve_file
  when: systemd_resolved_active.rc == 0

- name: Determine systemd-resolved availability (installed, running, and file exists)
  ansible.builtin.set_fact:
    systemd_resolved_available: "{{ (systemd_resolved_check.rc == 0 or systemd_resolved_installed.changed | default(false)) and systemd_resolved_active.rc == 0 and (systemd_resolve_file.stat.exists | default(false)) }}"

- name: Create/update resolved.conf (if systemd-resolved is available)
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Resolve]
      DNS={{ dns_servers | join(' ') }}
      Domains={{ search_domains | join(' ') }}
      # FallbackDNS and other options as needed
  notify: Restart systemd-resolved
  when: systemd_resolved_available | bool

- name: Ensure /etc/resolv.conf points at systemd-resolved (only if the file exists)
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  notify: Restart systemd-resolved
  when: systemd_resolved_available | bool and systemd_resolve_file.stat.exists | default(false)

- name: Configure DNS via /etc/resolv.conf directly (if systemd-resolved is unavailable)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # DNS configuration
      {% for dns_server in dns_servers %}
      nameserver {{ dns_server }}
      {% endfor %}
      {% for domain in search_domains %}
      search {{ domain }}
      {% endfor %}
  when: not (systemd_resolved_available | bool)

- name: Apply changes immediately (restart systemd-resolved)
  ansible.builtin.meta: flush_handlers
  when: systemd_resolved_available | bool

- name: Check domain visibility (realm discover)
  ansible.builtin.command: realm discover {{ ad_domain }}
  register: realm_discover
  changed_when: false
  failed_when: false

- name: Show discover result
  ansible.builtin.debug:
    var: realm_discover.stdout_lines
