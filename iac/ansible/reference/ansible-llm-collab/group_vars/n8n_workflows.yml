# Playbook n8n_workflows: manage n8n workflows as code (GitOps).
# API key — from Vault (n8n_init role): key ansible_main_n8n_api_key in Ubuntu_servers.
# Run: ./scripts/run/run_n8n_workflows.sh [--all | --workflow NAME] or ansible-playbook -i inventories/localhost/hosts.ini playbooks/n8n_workflows.yml.

# n8n URL without a trailing slash (the same host as in the browser: https://n8n.x.example.com).
n8n_base_url: "https://n8n.x.example.com"

# Workflows to sync: file names without .json in roles/n8n_workflows/files/workflows/
n8n_workflows_to_sync:
  - nextcloud_groupfolders_webhook
  - nextcloud_groupfolders_form

# Vault: path to the secret and **field (key) names inside** the KV (not the values). Set here or in playbook vars / -e.
# UI: Secrets → platform-infra → Ubuntu_servers. Secret contents are "field_name": value pairs.
n8n_vault_mount_point: "platform-infra"
n8n_vault_path: "Ubuntu_servers"
# Field names in the secret (values — API key; for workflows — only credential ids in n8n).
n8n_vault_key_api_key: "ansible_main_n8n_api_key"
n8n_vault_key_ssh_credential_id: "ansible_main_n8n_workflow_ssh_credential_id"
n8n_vault_key_jwt_credential_id: "ansible_main_n8n_workflow_jwt_credential_id"
# Read ids from Vault (n8n_init role). false — ids only from group_vars / -e (n8n_workflow_ssh_credential_id, n8n_workflow_jwt_credential_id).
n8n_vault_inject_credential_ids: true
# Labels in JSON (not ids): role defaults — n8n_workflow_ssh_credential_name, n8n_workflow_webhook_credential_name (Header Auth name on the Webhook node), n8n_workflow_jwt_credential_name (fallback).

# n8n API key: pulled from Vault by default. If set here (or in the playbook / -e / CI Variables) — Vault is not called.
# n8n_api_key: ""
# For Vault access (token with read on Ubuntu_servers) set in the environment when running the playbook (including repo CI Variables):
#   VAULT_ADDR=https://vault.x.example.com
#   VAULT_TOKEN=<token with read access to the Ubuntu_servers secret>
