---
# Secrets: Vault KV v2 mount docker_app_vault_mount_point, path docker_app_vault_path.
# Field names in the secret — docker_app_vault_key_map (logical name → key in Vault).

- name: "{{ docker_app.slug }} | secrets from Vault"
  ansible.builtin.set_fact:
    _docker_app_vault_secret: "{{ lookup('community.hashi_vault.vault_kv2_get', docker_app_vault_path, engine_mount_point=docker_app_vault_mount_point)['secret'] }}"
  no_log: true
  tags: [docker_app, deploy, vault]

- name: "{{ docker_app.slug }} | map Vault keys → app_vault"
  ansible.builtin.set_fact:
    app_vault: "{{ app_vault | default({}) | combine({item.key: _docker_app_vault_secret[item.value] | default('')}) }}"
  loop: "{{ docker_app_vault_key_map | dict2items }}"
  no_log: true
  tags: [docker_app, deploy, vault]

- name: "{{ docker_app.slug }} | extra Vault paths (ESO-style)"
  ansible.builtin.include_tasks: load_vault_extra_read.yml
  loop: "{{ docker_app_vault_extra_reads | default([]) }}"
  loop_control:
    loop_var: vault_extra
  tags: [docker_app, deploy, vault]
