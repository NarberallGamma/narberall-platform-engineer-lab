apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  tls:
  - hosts:
    - {{ .Values.jaeger.public_domain }}
    secretName: tls
  rules:
  - host: {{ .Values.jaeger.public_domain }}
    http:
      paths:
      - pathType: ImplementationSpecific
        backend:
          service:
            name: jaeger
            port:
              number: 16686
