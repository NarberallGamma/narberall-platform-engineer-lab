---
# Subtask: sync one workflow (key _workflow_key) into n8n.
# Called from main.yml in a loop over n8n_workflows_to_sync.
# Variable _workflow_key — filename without .json under files/workflows/.

- name: Load workflow JSON "{{ _workflow_key }}"
  ansible.builtin.set_fact:
    _workflow_json_raw: "{{ lookup('file', _workflow_file_path) }}"
  vars:
    _workflow_file_path: "{{ role_path }}/files/workflows/{{ _workflow_key }}.json"
  register: _load_file
  failed_when: _workflow_json_raw is not defined or _workflow_json_raw | length == 0

- name: Parse workflow JSON "{{ _workflow_key }}"
  ansible.builtin.set_fact:
    _workflow_body: "{{ _workflow_json_raw | from_json }}"
  when: _workflow_json_raw is defined

# set_fact + loop accumulates _wf_patched for the whole play; on the next include_tasks (next JSON)
# | default([]) does not reset the fact — nodes from the previous workflow are appended. Reset each iteration.
- name: Reset the node accumulator for credentials
  ansible.builtin.set_fact:
    _wf_patched: []
  when: _workflow_body is defined

# Credential ids: role n8n_init (Vault) or group_vars / -e. loop_var != item — otherwise collision with the outer include_tasks.
# Webhook: parameters.authentication — none|basicAuth|headerAuth|jwtAuth; credentials.httpHeaderAuth / jwtAuth.
# SSH (n8n-nodes-base.ssh): credentials.sshPassword | sshPrivateKey (not "ssh"); with privateKey — parameters.authentication: privateKey.
- name: Collect nodes with credential ids (SSH / Webhook)
  ansible.builtin.set_fact:
    _wf_patched: "{{ _wf_patched | default([]) + [_wf_one] }}"
  loop: "{{ _workflow_body.nodes | default([]) }}"
  loop_control:
    loop_var: n8n_wf_node
    label: "{{ n8n_wf_node.get('name', n8n_wf_node.get('id', '?')) }}"
  vars:
    _wname: "{{ n8n_workflow_webhook_credential_name | default(n8n_workflow_jwt_credential_name) | default('n8n JWT') }}"
    _wf_one: "{% if n8n_wf_node.get('type', '') == 'n8n-nodes-base.ssh' and n8n_workflow_ssh_credential_id | default('') | length > 0 and n8n_wf_node.get('parameters', {}).get('authentication', 'privateKey') == 'privateKey' %}{{ n8n_wf_node | combine({'credentials': {'sshPrivateKey': {'id': n8n_workflow_ssh_credential_id, 'name': n8n_workflow_ssh_credential_name | default('SSH Ansible Host') }}}, recursive=True) }}{% elif n8n_wf_node.get('type', '') == 'n8n-nodes-base.ssh' and n8n_workflow_ssh_credential_id | default('') | length > 0 and n8n_wf_node.get('parameters', {}).get('authentication', 'password') == 'password' %}{{ n8n_wf_node | combine({'credentials': {'sshPassword': {'id': n8n_workflow_ssh_credential_id, 'name': n8n_workflow_ssh_credential_name | default('SSH Ansible Host') }}}, recursive=True) }}{% elif n8n_wf_node.get('type', '') == 'n8n-nodes-base.webhook' and n8n_workflow_jwt_credential_id | default('') | length > 0 and n8n_wf_node.get('parameters', {}).get('authentication', 'jwtAuth') == 'jwtAuth' %}{{ n8n_wf_node | combine({'credentials': {'jwtAuth': {'id': n8n_workflow_jwt_credential_id, 'name': _wname }}}, recursive=True) }}{% elif n8n_wf_node.get('type', '') == 'n8n-nodes-base.webhook' and n8n_workflow_jwt_credential_id | default('') | length > 0 %}{{ n8n_wf_node | combine({'credentials': {'httpHeaderAuth': {'id': n8n_workflow_jwt_credential_id, 'name': _wname }}}, recursive=True) }}{% else %}{{ n8n_wf_node }}{% endif %}"
  when:
    - _workflow_body is defined
    - _workflow_body.nodes is defined
    - ((n8n_workflow_ssh_credential_id | default('') | length) > 0) or ((n8n_workflow_jwt_credential_id | default('') | length) > 0)

- name: Merge nodes with credential ids into the workflow body
  ansible.builtin.set_fact:
    _workflow_body: "{{ _workflow_body | combine({'nodes': _wf_patched}, recursive=True) }}"
  when: _wf_patched is defined and _wf_patched | length > 0

# Export from UI/CLI with meta: meta is not in the Public API schema; do not send it in POST/PUT body.
- name: Build workflow body for the API (without meta/pinData etc.)
  ansible.builtin.set_fact:
    _workflow_json_for_api: "{{ _workflow_body | dict2items | rejectattr('key', 'match', '^(meta|pinData|versionId|isArchived)$') | items2dict }}"
  when: _workflow_body is defined

- name: List workflows from n8n by name "{{ _workflow_body.name }}"
  ansible.builtin.uri:
    url: "{{ n8n_base_url }}/api/v1/workflows?name={{ _workflow_body.name | urlencode }}"
    method: GET
    headers:
      X-N8N-API-KEY: "{{ n8n_api_key }}"
      Accept: "application/json"
    return_content: true
    status_code: [200]
  register: _n8n_list
  no_log: "{{ n8n_workflows_no_log | default(true) }}"
  when: _workflow_body is defined

- name: Find existing workflow id by name
  ansible.builtin.set_fact:
    _existing_workflow_id: "{{ (_n8n_list.json.data | default([]) | selectattr('name', 'equalto', _workflow_body.name) | map(attribute='id') | first) | default('') }}"
  when: _n8n_list is defined and _n8n_list.json is defined

# PUT: body validated against the OpenAPI schema; extra fields (meta, pinData from export/GET) → 400.
# Schema: GET the full workflow, strip keys, merge name/nodes/connections/settings from the repo.
- name: Download workflow from n8n (body for PUT)
  ansible.builtin.uri:
    url: "{{ n8n_base_url }}/api/v1/workflows/{{ _existing_workflow_id }}"
    method: GET
    headers:
      X-N8N-API-KEY: "{{ n8n_api_key }}"
      Accept: "application/json"
    return_content: true
    status_code: [200]
  register: _n8n_get_current
  no_log: "{{ n8n_workflows_no_log | default(true) }}"
  when:
    - _existing_workflow_id is defined
    - _existing_workflow_id | length > 0

# Public API: whitelist. Do not include id in the body — only in path /workflows/{id}, otherwise 400: request/body/id is read-only.
- name: Build PUT body (whitelist, no id in body)
  ansible.builtin.set_fact:
    _n8n_workflow_put_body: "{{ {
      'name': _workflow_body['name'],
      'nodes': _workflow_body['nodes'],
      'connections': _workflow_body['connections'],
      'settings': (_n8n_get_current.json['settings'] | default({})) | combine(_workflow_body['settings'] | default({}), recursive=True)
    } | combine( {'staticData': _n8n_get_current.json['staticData']} if 'staticData' in _n8n_get_current.json else {} ) }}"
  when: _n8n_get_current.json is defined

- name: Update workflow in n8n (PUT) "{{ _workflow_body.name }}"
  ansible.builtin.uri:
    url: "{{ n8n_base_url }}/api/v1/workflows/{{ _existing_workflow_id }}"
    # Public API: full body; do not use |to_json together with body_format: json.
    method: PUT
    headers:
      X-N8N-API-KEY: "{{ n8n_api_key }}"
      Content-Type: "application/json"
    body: "{{ _n8n_workflow_put_body }}"
    body_format: json
    return_content: true
    status_code: [200]
  register: _n8n_patch
  no_log: "{{ n8n_workflows_no_log | default(true) }}"
  when:
    - _existing_workflow_id is defined
    - _existing_workflow_id | length > 0
    - _n8n_workflow_put_body is defined

# POST: same whitelist as for update (export may contain extra root keys).
# Do not put id, createdAt, updatedAt in files/workflows/*.json.
- name: Create workflow in n8n (POST) "{{ _workflow_body.name }}"
  ansible.builtin.uri:
    url: "{{ n8n_base_url }}/api/v1/workflows"
    method: POST
    headers:
      X-N8N-API-KEY: "{{ n8n_api_key }}"
      Content-Type: "application/json"
    body: "{{ {
      'name': _workflow_json_for_api['name'],
      'nodes': _workflow_json_for_api['nodes'],
      'connections': _workflow_json_for_api['connections'],
      'settings': _workflow_json_for_api['settings'] | default({})
    } | combine( {'staticData': _workflow_json_for_api['staticData']} if 'staticData' in _workflow_json_for_api else {} ) }}"
    body_format: json
    status_code: [200, 201]
  register: _n8n_post
  no_log: "{{ n8n_workflows_no_log | default(true) }}"
  when:
    - _existing_workflow_id is defined
    - _existing_workflow_id | length == 0

- name: Summary — workflow "{{ _workflow_body.name }}" updated
  ansible.builtin.debug:
    msg: "Workflow «{{ _workflow_body.name }}» ({{ _workflow_key }}) updated in n8n (id={{ _existing_workflow_id }})."
  when: _existing_workflow_id is defined and _existing_workflow_id | length > 0

- name: Summary — workflow "{{ _workflow_body.name }}" created
  ansible.builtin.debug:
    msg: "Workflow «{{ _workflow_body.name }}» ({{ _workflow_key }}) created in n8n (id={{ _n8n_post.json.id | default('?') }}). SSH/JWT ids: Vault (n8n_init) or attach nodes manually; activate the workflow in the UI."
  when:
    - _n8n_post is defined
    - _n8n_post.json is defined
