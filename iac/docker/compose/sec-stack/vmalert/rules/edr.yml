groups:
  - name: edr-coverage
    rules:
      # No threshold alert on the coverage percentage itself: at the current
      # ~63% it would fire for months and devalue the chat. Add one once
      # coverage is raised and a target value exists.
      - alert: EdrCollectionStale
        # Collection runs every 6 hours; a day and a half of silence means
        # the exporter is stuck or sources are unavailable.
        expr: time() - edr_collection_timestamp_seconds > 86400 * 1.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "EDR coverage has not been recalculated for more than a day"
          description: "Last successful collection: {{ $value | humanizeDuration }} ago."

      - alert: EdrCollectionFailing
        expr: edr_collect_errors > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "EDR coverage collection is failing on section {{ $labels.section }}"
          description: "Metrics are computed from previous data. Check edr-exporter container logs."

      - alert: EdrAgentsWithoutInventoryGrew
        # Coverage does not show a whole inventory source going missing: the
        # percentage is computed over hosts that are still visible and stays
        # pretty. That is only visible from the other side — agents with no
        # matching host.
        #
        # Threshold is not absolute: 73 orphan agents on 13.08.2026 is the
        # "for today" baseline (cloud B VDI pool, project-f tenant in cloud A,
        # office segment, uncollectable on-prem), not an incident. Alert on
        # GROWTH vs the weekly minimum: a vanished source jumps by tens.
        #
        # Metric is tenant-scoped: companies in a shared tenant share the
        # same value, so one lost source produces several rows in the
        # message — that is one problem, not several. Do not sum by company.
        expr: >
          edr_agents_without_inventory
          - min_over_time(edr_agents_without_inventory[7d]) > 15
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.company }} gained agents without inventory (+{{ $value }})"
          description: "Looks like an inventory source dropped: agents exist, hosts for them do not. Check AD/cloud exports in /opt/sec-stack/exporters/edr/data."

      - alert: EdrSourceDataStale
        # The EDR vendor export is still dropped in by hand — if it is
        # forgotten, dashboard coverage silently turns into a pumpkin. Look
        # at the timestamp INSIDE the data, not file mtime: a copy resets
        # mtime to "now", and a file-based metric would show freshness
        # where there is none.
        expr: time() - edr_source_data_timestamp_seconds{source="edr"} > 86400 * 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "EDR export for {{ $labels.company }} has not been updated for more than two weeks"
          description: "File {{ $labels.company }}_edr.csv is older than 14 days — coverage numbers are stale."
