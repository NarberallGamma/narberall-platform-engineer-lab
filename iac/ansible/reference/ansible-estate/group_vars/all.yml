# Shared variables for all hosts (user bootstrap and related).
# Override via group_vars/<service>.yml or --extra-vars when needed.
# Vault HA: group_vars/prod|preprod/vault_cluster.yml and playbooks/vault-*.yml.

# Public SSH keys for bootstrap (ansible and gitlab-runner).
# Private keys in GitLab CI Variables: ANSIBLE_SSH_PRIVATE_KEY_B64, GITLAB_RUNNER_SSH_PRIVATE_KEY_B64 (base64, Mask).
ansible_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA admin@example.com"
gitlab_runner_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA admin@example.com"

# Source restriction for authorized_keys (from="IP"). Empty = no restriction.
ansible_authorized_key_from: ""
gitlab_runner_authorized_key_from: ""

# Playbook setup_bootstrap_users (override via --extra-vars when needed).
setup_bootstrap_run_ansible: true
setup_bootstrap_run_gitlab_runner: true
setup_bootstrap_fetch_dest: "{{ playbook_dir }}/../artifacts/bootstrap_credentials"
setup_bootstrap_cleanup_tmp: false
setup_bootstrap_set_password: false
