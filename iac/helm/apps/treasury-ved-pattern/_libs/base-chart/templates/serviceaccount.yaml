{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  name: {{ include "base-chart.serviceAccountName" . }}
  labels:
    {{- include "base-chart.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  name: {{ include "base-chart.serviceAccountName" . }}
  labels:
    {{- include "base-chart.labels" . | nindent 4 }}  
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]      
  
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  name: {{ include "base-chart.serviceAccountName" . }}
  labels:
    {{- include "base-chart.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "base-chart.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "base-chart.serviceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io  
{{- if .Values.serviceAccount.authDelegator }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "base-chart.serviceAccountName" . }}:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: {{ include "base-chart.serviceAccountName" . }}
  namespace: default
{{- end }}
{{- end }}
