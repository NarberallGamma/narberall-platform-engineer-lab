---
# Override if needed (e.g. for another stand)
# nextcloud_webdav_url, nextcloud_container_name are set in group_vars/nextcloud_groupfolders.yml
#
# Parallelism: async+async_status batches (MKCOL and occ allow/deny). How many tasks in one batch on one host.
# Value 1 — sequential without async. Async wait: nextcloud_async_* below.
nextcloud_concurrency_mkcol: 1
nextcloud_concurrency_occ: 1
nextcloud_async_job_timeout_sec: 300
nextcloud_async_status_retries: 300
nextcloud_async_status_delay: 1
#
# Negative occ flags after "--" on deny from the matrix (see nextcloud_occ_deny_permissions in group_vars).
nextcloud_occ_deny_permissions: "-read -write -create -delete -share"
nextcloud_occ_edit_permissions: "+read +write +create +delete -- -share"
# Marker in matrix YAML (view): "all matrix groups RO only". Wording: group_vars/nextcloud_groupfolders.yml.
nextcloud_occ_ro_permissions: "+read -- -write -create -delete -share"
nextcloud_occ_view_permissions: "+read"
nextcloud_matrix_ro_sentinel: "__NC_MATRIX_RO_ALL__"
# Explicit occ deny for groups from the matrix union that are not listed in view/edit on this path (no inheritance to extra groups). occ_skip rows: see the matrix.
nextcloud_occ_auto_deny_unlisted_matrix_groups: true
# After all path attempts: if occ replies "Path not found in folder", finish the step with exit 0 (playbook does not fail).
nextcloud_occ_ignore_path_not_found: true
