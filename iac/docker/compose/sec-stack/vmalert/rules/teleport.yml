groups:
  - name: teleport
    rules:
      - alert: TeleportDown
        expr: up{job="teleport"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Teleport ({{ $labels.instance }}) is not serving metrics"
          description: "Diagnostic endpoint has been unreachable for 3 minutes. Check the teleport container and --diag-addr."

  - name: infra-nodes
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "VM {{ $labels.instance }} ({{ $labels.role }}): node_exporter is unreachable"
          description: "Either the VM is down, or node_exporter has crashed."

      - alert: NodeFilesystemAlmostFull
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: less than 10% space left on {{ $labels.mountpoint }}"

      - alert: NodeMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: less than 5% memory available"
