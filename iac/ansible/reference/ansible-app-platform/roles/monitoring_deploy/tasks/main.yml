---
- name: Ensure directory exists
  file:
    path: /docker/prometheus/config
    state: directory
    recurse: yes
    mode: '0755'

- name: Copy Prometheus config file
  copy:
    src: prometheus.yml
    dest: /docker/prometheus/config/prometheus.yml
    mode: '0644'

- name: Copy compose file
  copy:
    src: docker-compose.yml
    dest: /docker/victoriametrics/docker-compose.yml
    mode: '0644'

- name: Start docker-compose
  command: docker-compose up -d
  args:
    chdir: /docker/victoriametrics
