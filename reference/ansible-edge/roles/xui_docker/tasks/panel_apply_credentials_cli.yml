---
# Записать логин/пароль в БД панели без веб-логина (CLI в контейнере)

- name: Apply panel username and password via container CLI
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ xui_container_name }}"
      - /app/x-ui
      - setting
      - -username
      - "{{ xui_panel_username_effective }}"
      - -password
      - "{{ xui_panel_password_effective }}"
  register: xui_panel_credentials_cli
  changed_when: xui_panel_credentials_cli.rc == 0
  no_log: true
  when:
    - xui_panel_username_effective | default('') | length > 0
    - xui_panel_password_effective | default('') | length > 0
