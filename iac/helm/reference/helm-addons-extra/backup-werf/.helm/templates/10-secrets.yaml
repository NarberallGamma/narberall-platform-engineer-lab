---
apiVersion: v1
kind: Secret
metadata:
  name: backup-secrets
type: Opaque
data:
  .mysql-app.cnf: {{ pluck .Values.werf.env .Values.mysql.app.cnf | first | default .Values.mysql.app.cnf._default | b64enc | quote }}
{{- if eq .Values.werf.env "production" }}
  .mysql-app-rds.cnf: {{ .Values.mysql.app_rds.cnf | b64enc | quote }}
{{- end }}
{{- range $mongo_name, $mongo_password := pluck .Values.werf.env .Values.mongodb.password | first }}
  {{ printf ".mongo-%s-pass" $mongo_name }}: {{ $mongo_password | b64enc | quote }}
{{- end }}
