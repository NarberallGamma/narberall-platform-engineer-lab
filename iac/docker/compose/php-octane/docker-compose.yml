version: '3'
services:
  cli:
    image: ${DOCKER_REPOSITORY}/shop-app/${APP_NAME}:${APP_VERSION}
    container_name: ${APP_NAME}-cli
  server:
    image: ${DOCKER_REPOSITORY}/shop-app/${APP_NAME}:${APP_VERSION}
    container_name: ${APP_NAME}-server
    command: "php artisan octane:start --host=0.0.0.0 --port=3000"
    restart: always
    ports:
      - "${DOCKER_SERVER_PORT}:3000"
volumes:
  mysql:
