[defaults]
interpreter_python = /usr/bin/python3.12
inventory=./inventory.ini
host_key_checking=False
#remote_port = 22
gather_timeout = 60
timeout=60
forks = 60
gathering = smart
module_name = shell
display_skipped_hosts = True
strategy_plugins = plugins/mitogen-0.3.36/ansible_mitogen/plugins/strategy
strategy = mitogen_linear
lookup_plugins = ./plugins/

[ssh_connection]
ssh_args = -o ControlMaster=no
pipelining = True
[privilege_escalation]
become = yes
become_user = root
become_method = sudo
