# Конфигурация Nginx WAF для web-treasury.example.com
# Разместить в: /docker/nginx/config/web-treasury.example.com.conf

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/web-treasury.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/web-treasury.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/web-treasury.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name web-treasury.example.com;
    listen 80;

    return 301 https://web-treasury.example.com;
}

server {
    error_log  /var/log/nginx/error-aggregate.log warn;
    error_log  /var/log/nginx/web-treasury.example.com/error.log  warn;
    access_log /var/log/nginx/access-aggregate.log wallarm;
    access_log /var/log/nginx/web-treasury.example.com/access.log wallarm;
    access_log /dev/stdout wallarm;
    access_log /var/log/nginx/web-treasury.example.com/wallarm-security.log wallarm if=$wallarm_attack_type_list;
    server_name web-treasury.example.com;
    listen 443 ssl;
    ssl_certificate /docker/certgen/data/example.com.crt;
    ssl_certificate_key /docker/certgen/data/example.com.key;

    include /etc/nginx/conf_add/wallarm-blocked-page;
    client_max_body_size 100m;

    # ============================================
    # БЛОКИРОВКА SWAGGER И ACTUATOR для разрешенного API
    # ============================================
    
    # Блокировка swagger-ui для treasury-api
    location ~ ^/api/v0/treasury-api/swagger-ui {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Блокировка actuator для treasury-api (полная блокировка, включая health)
    location ~ ^/api/v0/treasury-api/actuator {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # Блокировка settings для treasury-api (полная блокировка всего пути)
    location ~ ^/api/v0/treasury-api/settings {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # БЛОКИРОВКА ПУТЕЙ ДО /api/v0 ВКЛЮЧИТЕЛЬНО
    # Возвращаем 403 для корня, /api и /api/v0
    # ============================================
    
    # Блокируем корневой путь
    location = / {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api (без слэша)
    location = /api {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api/ (со слэшем, но не /api/v0/)
    location ~ ^/api/$ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api/v0 (без слэша)
    location = /api/v0 {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }
    
    # Блокируем /api/v0/ (со слэшем, но не разрешенные пути)
    location = /api/v0/ {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # БЛОКИРОВКА ВСЕХ ДРУГИХ API ПУТЕЙ
    # Разрешаем только: /api/v0/treasury-api/
    # ============================================
    
    # Блокируем все /api/v0/* пути, кроме разрешенного
    # Чтобы разрешить treasury-csp (и любые другие сервисы): заменить (?!treasury-api/) на (?!treasury-api/|сервис/)
    location ~ ^/api/v0/(?!treasury-api/) {
        deny all;
        return 403;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # РАЗРЕШЕННЫЙ API ПУТЬ
    # ============================================
    
    # Разрешаем /api/v0/treasury-api/ (кроме уже заблокированных swagger/actuator)
    location ~ ^/api/v0/treasury-api/ {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web-treasury.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # ВРЕМЕННЫЙ ДОСТУП К /api/v0/treasury-csp/
    # Чтобы вернуть доступ: 1) раскомментировать блок ниже
    # 2) в location ~ ^/api/v0/(?!...) выше добавить |treasury-csp/
    # ============================================
    # location ~ ^/api/v0/treasury-csp/ {
    #     proxy_pass https://k8s-ift;
    #     proxy_ssl_server_name on;
    #     proxy_ssl_name $host;
    #     proxy_set_header Host web-treasury.example.com;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header x-ms-proxy $server_name;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    # ============================================
    # ВСЕ ОСТАЛЬНОЕ (не API пути) - разрешаем
    # ============================================
    
    location / {
        proxy_pass https://k8s-ift;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host web-treasury.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-ms-proxy $server_name;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

