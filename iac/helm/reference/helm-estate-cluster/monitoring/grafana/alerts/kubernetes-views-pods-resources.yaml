          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              refId: C
              expression: '{{ printf "$" }}A > 0'
        dashboardUid: k8s_views_pods
        panelId: 30
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: 'Memory vs limit ≥ 70% (warn): {{ "{{" }} {{ "$" }}{{ "labels.namespace" }} {{ "}}" }}/{{ "{{" }} {{ "$" }}{{ "labels.pod" }} {{ "}}" }}/{{ "{{" }} {{ "$" }}{{ "labels.container" }} {{ "}}" }}'
          description: "container_memory_working_set_bytes / kube_pod_container_resource_limits{resource=\"memory\"} for Running pods; threshold 70-90%. Panel: Memory Usage / Requests & Limits by container (limit ratio)."
        labels:
