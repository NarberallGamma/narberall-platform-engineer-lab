groups:
  - name: meta
    rules:
      # Deadman switch: the alert is ALWAYS firing. Alertmanager sends it to a
      # heartbeat receiver (healthchecks.io, etc.); if pings stop — monitoring
      # itself is dead. Without this, a stack outage goes unnoticed.
      - alert: DeadManSwitch
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Monitoring heartbeat (must stay firing)"

      # Catch-all for lost targets not covered by specific alerts.
      - alert: ScrapeTargetDown
        expr: up{job!~"panos|teleport|node"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.instance }} (job={{ $labels.job }}) has not been scraped for 10 minutes"
