idplat_public_hostname: "idplat.dev.example.com" # public Identity platform hostname

idplat_postgres_install: true # true when postgres is installed by the role
idplat_postgres_published_port: 62101

idplat_rdbms_name: postgres # Allowed: postgres/mssql/mysql; RDBMS that hosts the databases
idplat_rdbms_hostname: "host.docker.internal" # database connection settings
#idplat_rdbms_port: '7777' # DB port, set when it differs from the default

amcli_placement_constraints: [ "node.labels.idplat == amcli" ] # placement of the volume with AM plugins
amcli_volumes_custom_plugins: "/mnt/nfs/share/idplat_dev/am_plugins" # AM plugin path mapping

# deploydocs
deploydocs_published_port: 62100 # external port for documentation

#IGEXT
igext_published_port: 62500 # external port for Igext
igext_https_published_port: 62501 # external HTTPS port for Igext

#IG
ig_customs_folder: "{{ inventory_dir }}/ig_customs/" # directory with IG settings
ig_enable_demo_oidc: true #enable/disable the demo OIDC route (defaults to false when unset). Used only with am_first_deploy=true
ig_enable_demo_jwt: true #enable/disable the demo JWT route (defaults to false when unset). Used only with am_first_deploy=true
ig_dataProtection_key: key-405899ac-5a3e-4b11-9cfa-ab236a0ae3d0.xml
ig_published_port: 62510 # external port for Ig
ig_https_published_port: 62511 # external HTTPS port for Ig
ig_enable_ReverseAccess: true # Deploy IG in ReverseAccess mode (two IG instances). When enabled, add ReverseAccess settings files to the inventory
ig_caching_provider: redis  # InMemory / Redis (Redis from this deploy is for tests only; production needs an external Redis)

#Redis (test only)
redis_default_user: default  # Redis username
redis_default_passwd: CHANGE_ME  # comment this line or set empty string if no password

# AM
#required
am_db_name: "{{ docker_stack_name }}_am_config" # AM database
am_first_deploy: true # AM initial setup flag !!! Do not enable when AM is already installed !!!
am_deploy_debug: true # enable/disable debug for AM first-run init and plugin updates; when debug is on the service container is not removed
am_update_plugins: true # install AM plugin updates
am_update_migrations: true # starts a helper container to run migrations
# AM external port
am_published_port: 62443 # comment this line if need to disable this external port
# AM external api port
am_api_published_port: 62543 # comment this line if need to disable this external port
am_application: am #am app name basepath
#am_clients_realm_agent_fi: identityplatform #default realm name
am_cert_path: "am-sign.pfx" #Access Manager. Certificate signing tokens.
am_AdminUIDisabled: false # Disable the Access Manager UI. In this mode AM is configured only via the static config file, the CLI, and the service API
am_dataProtection_key: key-3e6f3c01-9f39-4656-b0ca-436cd18e0b8c.xml  #xml file containing DataProtectionKey — used to encrypt sensitive data
am_realms_folder: "{{ inventory_dir }}/am_realm/" # directory with AM Realm settings
am_Extensions_RestorePackages: "false" 
am_Extensions_StorageFolder: "null" # Package install folder. When set, AM runs FileSystemReadOnly and loads nuget packages from that folder at start. When null, AM runs DataBaseReadOnly and loads nuget packages from the AM admin UI.
am_AssemblyResolving: {"":""} # Used for AM SDK library compatibility inside custom plugins built against older SDKs (before assembly rename). Needed so newer AM versions work with older plugins (nugets).

#Optional
#am_UseProfiler: false #Enable/disable the profiler. Used to diagnose Access Manager issues.
#am_Swagger_enable: false
#am_STSUri: "" # STS service URL for Access Manager. STS extends AM and adds WS-Trust 1.4.
#am_DevelopMode: false # When set, AM runs in developer mode for UI or authentication-module development.
#am_HideAmVersion: false # Show/hide the AM version in the UI
#am_EnableCacheSignatureProviders: true # Enable/disable the JWT verification key cache in OIDC. With many clients sending client credentials signed by unique keys, all keys are cached and memory can grow. Use the cache only when the JWT verification key count is bounded.
#am_AntiForgeryTokenEnabled: true # When enabled, AM generates and validates the Antiforgery header.
#am_ContentSecurityPolicy: "" # Content-Security-Policy header template returned by AM.
#am_ContentSecurityPolicySpa: "" # Content-Security-Policy header template used when loading the SPA manifest
#am_Copyright: "Copyright &copy" # Copyright string shown in the UI
#am_LowercaseUrls: false # Force routing to lowercase request URLs for compatibility.
#am_LowercaseQueryStrings: false # Force routing to lowercase request URLs for compatibility.
  #//Authentication settings
#am_LocalIdp: "idplat.am" # On local authentication AM returns this value in the id_token "idp" parameter.
  #//Extension settings
#am_Extensions_ResolveInCurrentDomain: true # Look up types in assemblies already loaded into the app domain, ignoring version. When off, type lookup is limited to package assemblies.
  #// Antiforgery token
#am_AntiForgery_HeaderName: "X-AF" # HTTP header name the UI app sends the antiforgery token to AM in.
#am_AntiForgery_MessageStorageOptions: ""
#am_AntiForgery_ServerLifeTime: 00:00:00 # LoginMessage cookie lifetime
  #//DataProtection Key configuration
#am_DataProtection_Certificate: ""
#am_DataProtection_ApplicationName: "test"
  #// Scheduler settings
#am_Jobs_AgentSettings_MaxQueueCheckInterval: 300000 # max queue check interval (ms)
#am_Jobs_AgentSettings_QueuePollInterval: 15 # queue poll interval (sec)
#am_Jobs_AgentSettings_SchedulerPollInterval: 30 # schedule poll interval (sec)
#am_Jobs_AgentSettings_RetryDelaySeconds: 20 # retry delay for a failed job (sec)
#am_Jobs_AgentSettings_JobInitializationTimeout: 1 # job initialization timeout (min)
#am_Jobs_AgentSettings_AgentCheckInterval: 1 # running-agent check interval (min)
#am_Jobs_AgentSettings_AgentInactiveTimeout: 5 # max agent inactivity time (min)
#am_Jobs_AgentSettings_BadJobExceptionThreshold: 40 # job retry count
#am_Jobs_AgentSettings_MaxProcessor: 24 # max internal job-processing threads
#am_Jobs_AgentSettings_LogSuccessfulJobs: true # log successful jobs
#am_Jobs_AgentSettings_StartDelay: 10000 # service start delay (ms)
#am_Jobs_AgentSettings_ShutdownTimeout: 10000 # max wait for service shutdown (ms)
  #// Context settings
#am_RequestContext_CorrelationIdHeader: "X-Correlation-Id" # request header name that carries the Correlation ID
#am_RequestContext_XForwardedForAllowedSubnets: [] # Subnets allowed to use the X-Forwarded-For header. If the header contains an IP matching these subnets, X-Forwarded-For is allowed. Example: "127.0.0.1/24"
#am_RequestContext_XForwardedForMode: 0 # 0 - allow any address from X-Forwarded-For 1 - allow the X-Forwarded-For address only if it is in the XForwardedForMode subnet list 2 - ignore X-Forwarded-For
#am_RequestContext_EnableAutoGenerateCorrelationId: true # When true, generate a new CorrelationId if the corresponding header is missing. >=4.3
  #// Enable experimental options
#am_Experimental_ChildRealmAMRoles: true # Enable administrator at the security realm level. When on, users can be granted admin rights for a chosen Realm rather than all of Access Manager. Inside the realm all settings are available (users, groups, roles, applications, password policy, auth flows, and so on)
#am_Experimental_RootCombineStore: true # Allow a user store other than the internal one for the root Realm. By default root-Realm users live in the internal AM database. This setting attaches an external user store for the root Realm, e.g. AD or an external database. External store is attached only via static configuration.
  #// Options required for backward compatibility
#am_Legacy_SerilogAuditToPredconfigured: false
