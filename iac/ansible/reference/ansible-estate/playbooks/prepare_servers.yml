---
- name: Prepare servers and join the domain
  hosts: prepare
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: Include prepare_servers variables
      ansible.builtin.include_vars:
        file: ../group_vars/prepare_servers.yml
      tags: [always]

    - name: Include GitLab variables (override prepare_servers)
      ansible.builtin.include_vars:
        file: ../group_vars/gitlab.yml
      when: inventory_hostname in groups.get('gitlab', [])
      tags: [always]

    - name: Include teleport_k8s variables (override prepare_servers)
      ansible.builtin.include_vars:
        file: ../group_vars/teleport_k8s.yml
      when: inventory_hostname in groups.get('teleport_k8s', [])
      tags: [always]

  roles:
    - role: prepare_servers
