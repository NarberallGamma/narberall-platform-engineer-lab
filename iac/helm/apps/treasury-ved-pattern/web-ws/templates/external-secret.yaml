apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-ws-vault-secrets
  namespace: estate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: web-ws-vault-secrets
    creationPolicy: Owner
  data:
  - secretKey: kafkaClientPassword
    remoteRef:
      key: secret/estate-kafka
      property: kafkaClientPassword
