# Hosts excluded from EDR coverage calculation (appliances, network gear, etc.)
# Excluded hosts stay in edr_coverage_report.csv with excluded=True,
# but are not counted in metrics.
#
# Rules apply in order: global → company.
# A host is excluded if it matches at least one rule from any section.

# Applies to all companies
global:
  # Hostname glob patterns (case-insensitive). * — any substring, ? — one character.
  patterns:
    - "ngfw*"          # firewalls
    - "*-ngfw-*"       # ngfw nodes in the middle of the name (incl. cloud NGFW tag)
#    - "palo-*"        # Palo Alto
#    - "*.oob"         # out-of-band management
  # Exact hostnames (case-insensitive)
  hostnames: []
  # IP addresses (exact match against the sourceip field)
  ips: []
  # Active Directory OUs: a host is excluded if its DN contains any of these suffixes.
  # Specified as a DN fragment starting at OU= (case-insensitive).
  ous: []

# Per-company extras (added to global, do not replace it)
companies:
  my-company:
    patterns:
      - "printer-*"
      - "ups-*"
      - "kvm-*"
    hostnames:
      - "mgmt-idrac-01"
      - "mgmt-idrac-02"
    ips:
      - "192.168.1.1"
    ous:
      - "OU=Network Devices,DC=corp,DC=example,DC=com"
      - "OU=Printers,DC=corp,DC=example,DC=com"

  other-company:
    patterns:
      - "checkpoint-*"
    hostnames: []
    ips: []
    ous: []
