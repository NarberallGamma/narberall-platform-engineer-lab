# Ручные соответствия «хост -> имя агента в EDR» для расчёта покрытия.
#
# Нужны там, где связь есть, но в данных её нет. Основной случай — маки в домене:
# агент регистрируется под локальным именем (`MacBook-Air-admin.local`), а если
# сетевое имя выглядит как IP-адрес, macOS режет его по первой точке и в EDR
# приезжает `192`. Доменного имени нет ни в одном поле API — автоматически это
# не сшивается ничем.
#
# Сам по имени пользователя merge3 такие пары НЕ сопоставляет (второй ноутбук у
# того же человека молча испортил бы метрику): он пишет кандидатов в лог строкой
# «Кандидаты в aliases.yaml (совпал пользователь…)». Проверить глазами в панели
# EDR и перенести сюда:
#
#   sudo docker logs sec-stack-edr-exporter-1 2>&1 | grep 'Кандидаты в aliases'
#
# Имя агента — из колонки `name` файла `{company}_edr.csv` (регистр и подчёркивания
# не важны). Для обрезанных имён ссылаться на `displayname`: под именем `192`
# сидят несколько разных маков, и различает их только полное имя. Если агента с
# таким именем в выгрузке нет, merge3 предупредит — обычно значит, что агент
# переустановлен и соответствие протухло.
#
# Файл необязательный: без него всё считается как раньше. Правки — через MR,
# ansible выкладывает его на ВМ рядом с exclusions.yaml.
# Формат:
#
# companies:
#   project-e:
#     m-user-a: MAC              # Mac.loc, lastuser a.user
#     m-user-b: 192.168.1.15     # name обрезан до '192', ссылаемся на displayname

companies: {}
