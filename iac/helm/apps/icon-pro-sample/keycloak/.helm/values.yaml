contour: dev

replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: 20.0.2
  pullPolicy: Always
  # imagePullSecrets:
  #   - name: registry

nameOverride: ""

fullnameOverride: ""

#Env
env:
  PUBLIC_URL: "/"

# ExtraEnv
extraEnv: []

#args: ["start", "--db","postgres","--hostname-strict-https","false","--hostname-strict","false","--proxy","edge","--http-enabled","true","--import-realm","--spi-user-profile-legacy-user-profile-read-only-attributes","*_RES_ACCESS_MODE"]
#Service
service:
  type: ClusterIP
  externalIPs: []
  loadBalancerSourceRanges: []
  annotations: []
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080

common:
  virtualservice:
    enabled: false
    uriprefix: /

#Route
route:
  enabled: false
  host: 
  path: /
  annotations:
    haproxy.router.openshift.io/timeout: 180s
    haproxy.router.openshift.io/timeout-client: 180s
    haproxy.router.openshift.io/timeout-server: 180s
  labels: {}
  tls:
    enabled: true
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
    certificate: ""
    key: ""
    caCertificate: ""

#Ingress
ingress:
  enabled: false
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    kubernetes.io/ingress.class: "nginx"
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/whitelist-source-range: "203.0.113.0/24"
  hosts:
    - host:
      paths:
        - /
  tls:
    - secretName: 
      hosts:
        - 

securityContext:
  {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  # capabilities:
  #   drop: [ALL]

serviceAccount:
  create: false
  annotations: {}
  name: test

podSecurityContext:
  fsGroup: 
  runAsUser:
  runAsNonRoot: true

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 300
  periodSeconds: 10
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  successThreshold: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 1000m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}
## Node labels for pod assignment (this value is evaluated as a template)
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
nodeSelector: {}
## Tolerations for pod assignment (this value is evaluated as a template)
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#taints-and-tolerations-beta-feature
tolerations: []
## Annotations for external-dns pods
podAnnotations:
  sidecar.istio.io/inject: "false"
  sidecar.istio.io/rewriteAppHTTPProbers: "true"
  traffic.sidecar.istio.io/excludeOutboundPorts: ""
## Additional labels for the pod(s).
podLabels: {}
## Pod priority class name
priorityClassName: ""

## Configure volumes
volumes:
  - name: shop-keycloak
    configMap:
      name: shop-keycloak
  - name: truststore
    configMap:
      name: truststore

## Configure volumeMounts
volumeMounts:
  - name: truststore
    mountPath: /etc/ssl/certs/java/cacerts
    subPath: cacerts
  - name: truststore
    mountPath: /opt/java/openjdk/lib/security/cacerts
    subPath: cacerts
  - name: truststore
    mountPath: /etc/pki/ca-trust/extracted/java/cacerts
    subPath: cacerts
  - mountPath: /opt/keycloak/data/import/realm-export.json
    name: shop-keycloak
    subPath: realm-export.json
 
# Configure secret
secret:
  enabled: false
  filename: ""
  content: ""

metrics:
  enabled: false
  serviceMonitor:
    endpoints:
      - port: http
        path: /
        interval: 10s
        scrapeTimeout: 10s

    namespaceSelector:
      matchNames:
        - dev 

