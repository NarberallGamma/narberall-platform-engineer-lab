---
# Normalize webBasePath to a string without []/'' (regex_search and setting -show sometimes yield a list-like form)
- name: Normalize panel web base path for URL and API
  ansible.builtin.set_fact:
    xui_panel_web_base_path_effective: >-
      {{
        (xui_panel_web_base_path_effective | string)
        | regex_replace('^\[', '')
        | regex_replace('\]$', '')
        | regex_replace("['\"]", '')
        | trim
        | regex_replace('^/+', '')
        | regex_replace('/+$', '')
        | regex_replace('^panel/?$', '')
      }}
