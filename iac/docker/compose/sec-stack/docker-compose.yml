# Central monitoring stack. Lives on a VM in the management segment of cloud A.
# Versions are pinned (latest stable as of 2026-07-15).
services:

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.147.0
    command:
      - --storageDataPath=/storage
      - --retentionPeriod=6           # months of retention
      - --httpListenAddr=:8428
    volumes:
      - vmdata:/storage
    ports:
      # Exposed as the remote_write endpoint for vmagents from other sites
      # (cloud B, on-prem). Restrict with a firewall to those addresses and later
      # add TLS/basic auth (vmauth or nginx in front of VM).
      - "8428:8428"
    restart: unless-stopped

  vmagent:
    # Local collector for site-a: scrapes targets and writes to VM.
    # Other sites get the same vmagent plus their own prometheus.yml,
    # with remoteWrite.url pointing at this host.
    image: victoriametrics/vmagent:v1.147.0
    command:
      - --promscrape.config=/etc/vmagent/prometheus.yml
      - --promscrape.configCheckInterval=60s   # pick up a new config without a restart
      - --remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - --remoteWrite.tmpDataPath=/vmagentdata
    volumes:
      # directory, not a file: a file bind-mount keeps the inode, and after ansible
      # replaces the file, auto-reload would still see the old config
      - ./vmagent:/etc/vmagent:ro
      - vmagentdata:/vmagentdata
    restart: unless-stopped

  vmalert:
    # VictoriaMetrics does not evaluate rules itself — vmalert does.
    image: victoriametrics/vmalert:v1.147.0
    command:
      - --datasource.url=http://victoriametrics:8428
      - --remoteWrite.url=http://victoriametrics:8428
      - --remoteRead.url=http://victoriametrics:8428
      - --notifier.url=http://alertmanager:9093
      - --rule=/etc/vmalert/rules/*.yml
      - --configCheckInterval=60s              # reread rules without a restart
      - --external.label=site=site-a
      # Alert GeneratorURL = a vmui link with the rule query (📈 in Telegram)
      - --external.url=http://10.10.1.10:8428
      - "--external.alert.source=vmui/#/?g0.expr={{.Expr|queryEscape}}&g0.range_input=1h"
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # whole directory: config + templates/, so ansible file replacement does
      # not break the bind-mount (same inode story as vmagent)
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanagerdata:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-CHANGE_ME}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    # ICMP probes require CAP_NET_RAW
    cap_add:
      - NET_RAW
    restart: unless-stopped

  panos-exporter:
    # Custom PAN-OS exporter: HA, IPsec, licenses, certificates, sessions.
    build: ./exporters/panos
    environment:
      - PANOS_EXPORTER_CONFIG=/etc/panos-exporter/config.yml
    # Firewall API keys come from .env (PANOS_API_KEY_<NAME>)
    env_file:
      - .env
    volumes:
      - ./exporters/panos/config.yml:/etc/panos-exporter/config.yml:ro
    restart: unless-stopped

  edr-exporter:
    # Infrastructure coverage by EDR agents. The image is built by CI of
    # edr-coverage on a tag; the version is pinned here. No sources on the VM.
    image: example.registry/sec/edr-coverage:v0.7.2
    environment:
      - EDR_DATA_DIR=/data
      - EDR_CONFIG_DIR=/config
      # Run collectors (AD, cloud A, cloud B, EDR) before a merge. A source
      # without a config in /config is skipped — not an error.
      - EDR_COLLECT_SOURCES=1
      # Collection hits LDAP and cloud APIs — every 6 hours, not on every scrape;
      # /metrics serves the last snapshot (see the exporter README).
      - EDR_COLLECT_INTERVAL=21600
    volumes:
      - ./exporters/edr/data:/data
      # collector configs with creds — read-only, rendered by ansible from SOPS
      - ./exporters/edr/config:/config:ro
    restart: unless-stopped

volumes:
  vmdata:
  vmagentdata:
  grafanadata:
  alertmanagerdata:
