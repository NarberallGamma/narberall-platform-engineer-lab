---
# Vault Secrets Configuration for PREPROD Environment
# Secrets to load into the preprod Vault cluster
# IMPORTANT: change secret values before deploy.

vault_addr: "https://{{ vault_virtual_ip }}"
vault_mount_point: "secret"
vault_api_version: "v1"

# List of secrets to load into Vault
vault_secrets:
  # ========== TREASURY GLOBAL VALUES ==========
  - name: "treasury-global-values"
    path: "treasury-global-values"
    description: "Global values for all services"
    data:
      CHAIN_ID: "11155111"  # Sepolia testnet
      ETH_FEE: "0.005"
      ETH_USDT_ADDRESS: ""  # PREPROD: Sepolia USDT contract address
      PROVIDER_URL: ""  # PREPROD: Alchemy/Infura Sepolia URL
      QUOTE_EXPIRATION_JOB_DELAY: "5m"
      RETRY_TX_DELAY: "5m"
      SMS_CODE_RETRY_DELAY_IN_SECONDS: "60"
      TRON_PROVIDER_URL: "https://api.shasta.trongrid.io/v1"  # Shasta testnet
      TRON_USDT_ADDRESS: ""  # PREPROD: Shasta USDT address
      TRX_FEE: "20.0"
      TREASURY_BASE_URL: "https://operator.preprod.example.com"
      TREASURY_COMPANY_CARD_PAGE_URL: "https://operator.preprod.example.com/companies/"
      TREASURY_CONTRACT_PAGE_URL: "https://operator.preprod.example.com/contracts/"
      TREASURY_FROM: "no-replay@example.com"
      TREASURY_HELP_EMAIL: "no-replay@example.com"
      TREASURY_HELP_PHONE: "88005553535"
      TREASURY_LOGIN_PRIMARY_PAGE_URL: "https://operator.preprod.example.com/login"
      locale: "RU"

  # ========== TREASURY KAFKA ==========
  - name: "treasury-kafka"
    path: "treasury-kafka"
    description: "Kafka and PostgreSQL credentials"
    data:
      akhqAdminPassword: ""  # PREPROD: bcrypt hash
      akhqReaderPassword: ""  # PREPROD: bcrypt hash
      kafkaClientPassword: ""  # PREPROD: Kafka client password
      kafkaInterBrokerPassword: ""  # PREPROD: Kafka inter-broker password
      postgresPassword: ""  # PREPROD: PostgreSQL password
      postgresUser: "treasury_user"

  # ========== TREASURY AUTH PROVIDER APP ==========
  - name: "treasury-auth-provider-app"
    path: "treasury-auth-provider-app"
    description: "Auth Provider Service secrets"
    data:
      data: "general configuration data"
      private_key: ""  # PREPROD: RSA 2048 private key (base64)
      public_key: ""  # PREPROD: RSA 2048 public key (base64)
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

  # ========== TREASURY AML APP ==========
  - name: "treasury-aml-app"
    path: "treasury-aml-app"
    description: "AML Service secrets"
    data:
      data: "general configuration data"
      kyt.api-key-id: ""  # PREPROD: KYT API key ID
      kyt.secret-key: ""  # PREPROD: KYT secret key
      kyt.shard.token: ""  # PREPROD: KYT shard token
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

  # ========== TREASURY AUDIT APP ==========
  - name: "treasury-audit-app"
    path: "treasury-audit-app"
    description: "Audit Service secrets"
    data:
      data: "general configuration data"
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

  # ========== TREASURY CONTRACT APP ==========
  - name: "treasury-contract-app"
    path: "treasury-contract-app"
    description: "Contract Service secrets"
    data:
      data: "general configuration data"
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

  # ========== TREASURY CSP APP ==========
  - name: "treasury-csp-app"
    path: "treasury-csp-app"
    description: "CSP Service secrets"
    data:
      data: "general configuration data"
      private_key: ""  # PREPROD: RSA 2048 private key (base64)
      public_key: ""  # PREPROD: RSA 2048 public key (base64)
      rootCertificate: ""  # PREPROD: Root certificate (base64)
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

  # ========== TREASURY KYT BITOK EMULATOR APP ==========
  - name: "treasury-kyt-emulator-app"
    path: "treasury-kyt-emulator-app"
    description: "KYT Bitok Emulator Service secrets"
    data:
      kyt.api-key-id: ""  # PREPROD: Same as treasury-aml-app
      kyt.secret-key: ""  # PREPROD: Same as treasury-aml-app
      kyt.shard.token: ""  # PREPROD: Same as treasury-aml-app

  # ========== TREASURY NOTIFICATION APP ==========
  - name: "treasury-notification-app"
    path: "treasury-notification-app"
    description: "Notification Service secrets"
    data:
      data: "general configuration data"
      sms-aero-service.password: ""  # PREPROD: SMS service password
      sms-aero-service.username: ""  # PREPROD: SMS service username
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"
      spring.mail.password: ""  # PREPROD: Email password
      spring.mail.username: ""  # PREPROD: Email username

  # ========== TREASURY ONBOARDING APP ==========
  - name: "treasury-onboarding-app"
    path: "treasury-onboarding-app"
    description: "Onboarding Service secrets"
    data:
      data: "general configuration data"
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

  # ========== TREASURY OTP APP ==========
  - name: "treasury-otp-app"
    path: "treasury-otp-app"
    description: "OTP Service secrets"
    data:
      data: "general configuration data"
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

  # ========== TREASURY REPORT APP ==========
  - name: "treasury-report-app"
    path: "treasury-report-app"
    description: "Report Service secrets"
    data:
      data: "general configuration data"
      file-storage.s3.accessKey: ""  # PREPROD: S3 access key
      file-storage.s3.secretKey: ""  # PREPROD: S3 secret key
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

  # ========== TREASURY TX APP ==========
  - name: "treasury-tx-app"
    path: "treasury-tx-app"
    description: "Transaction Service secrets"
    data:
      data: "general configuration data"
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

  # ========== TREASURY WEB APP ==========
  - name: "treasury-web-app"
    path: "treasury-web-app"
    description: "Web Service secrets"
    data:
      data: "general configuration data"
      file-storage.s3.accessKey: ""  # PREPROD: S3 access key
      file-storage.s3.secretKey: ""  # PREPROD: S3 secret key
      spring.datasource.password: ""  # PREPROD: PostgreSQL password
      spring.datasource.username: "treasury_user"

