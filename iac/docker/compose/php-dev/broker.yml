services:
  rabbitmq:
    image: rabbitmq:4.0.5-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=CHANGE_ME
      - RABBITMQ_DEFAULT_PASS=CHANGE_ME
    ports:
      - 15672:15672
      - 5672:5672
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped