---
# Role llm_dev_init: LLM-dev secrets from Vault or from -e / group_vars.

# always tag: with a partial --tags run (e.g. llm_dev_deploy only) role-inherited-tag tasks are skipped,
# while the assert below with tags: [always] still runs; the Vault secret is then not injected. See the always tag on set_fact.
- name: Load llama-server API key from Vault
  ansible.builtin.set_fact:
    llm_dev_api_key: "{{ _vault.secret[llm_dev_vault_key_server_api_key] }}"
  vars:
    _vault: "{{ lookup('community.hashi_vault.vault_kv2_get', llm_dev_vault_path, engine_mount_point=llm_dev_vault_mount_point) }}"
  no_log: true
  tags: [always]
  when: >
    llm_dev_enable_api_key | bool and
    (llm_dev_api_key is not defined or (llm_dev_api_key | default('') | string | length) == 0)

- name: Load HF token from Vault
  ansible.builtin.set_fact:
    llm_dev_hf_token: "{{ _vault.secret[llm_dev_vault_key_hf_token] }}"
  vars:
    _vault: "{{ lookup('community.hashi_vault.vault_kv2_get', llm_dev_vault_path, engine_mount_point=llm_dev_vault_mount_point) }}"
  no_log: true
  tags: [always]
  when: >
    (
      llm_dev_enable_hf_token | bool or
      (
        llm_dev_model_fetch_enabled | default(false) | bool and
        (
          llm_dev_model_fetch_hf_token_from_vault | default(false) | bool or
          llm_dev_model_fetch_requires_hf_token | default(false) | bool
        )
      )
    ) and
    (llm_dev_hf_token is not defined or (llm_dev_hf_token | default('') | string | length) == 0)

- name: Load WEBUI_SECRET_KEY from Vault
  ansible.builtin.set_fact:
    llm_dev_webui_secret_key: "{{ _vault.secret[llm_dev_vault_key_webui_secret_key] }}"
  vars:
    _vault: "{{ lookup('community.hashi_vault.vault_kv2_get', llm_dev_vault_path, engine_mount_point=llm_dev_vault_mount_point) }}"
  no_log: true
  tags: [always]
  when: >
    llm_dev_open_webui_enabled | bool and
    (llm_dev_webui_secret_key is not defined or (llm_dev_webui_secret_key | default('') | string | length) == 0)

- name: Assert API key when protection is enabled
  ansible.builtin.assert:
    that:
      - llm_dev_api_key is defined
      - (llm_dev_api_key | default('') | string | length) > 0
    fail_msg: >-
      When llm_dev_enable_api_key is set, provide llm_dev_api_key or key {{ llm_dev_vault_key_server_api_key }} in Vault {{ llm_dev_vault_path }} (mount {{ llm_dev_vault_mount_point }}).
  when: llm_dev_enable_api_key | bool
  tags: [always]

- name: Assert HF token when injection into .env is enabled
  ansible.builtin.assert:
    that:
      - llm_dev_hf_token is defined
      - (llm_dev_hf_token | default('') | string | length) > 0
    fail_msg: >-
      When llm_dev_enable_hf_token is set, provide llm_dev_hf_token or key {{ llm_dev_vault_key_hf_token }} in Vault {{ llm_dev_vault_path }}.
  when: llm_dev_enable_hf_token | bool
  tags: [always]

- name: Assert WEBUI_SECRET_KEY when Open WebUI is enabled
  ansible.builtin.assert:
    that:
      - llm_dev_webui_secret_key is defined
      - (llm_dev_webui_secret_key | default('') | string | length) > 0
    fail_msg: >-
      When llm_dev_open_webui_enabled is set, provide key {{ llm_dev_vault_key_webui_secret_key }} in Vault {{ llm_dev_vault_path }} or -e llm_dev_webui_secret_key=...
  when: llm_dev_open_webui_enabled | bool
  tags: [always]
