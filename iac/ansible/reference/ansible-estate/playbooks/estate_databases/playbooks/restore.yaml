---
- name: Recreate PostgreSQL databases
  hosts: localhost
  connection: local
  become: no
  gather_facts: no
#  no_log: true
  vars:
    pg_host: "10.10.16.30" 
    pg_port: 5432
    pg_admin_user: root
    pg_admin_password: ""
    treasury_user: treasury_user
    treasury_password: ""
    default_encoding: "UTF8"  # Default encoding
    default_lc_collate: "en_US.UTF-8"  # Default collation locale
    default_lc_ctype: "en_US.UTF-8"  # Default character-classification locale

    target_schema: public

    # default_databases is intentionally empty: without an explicit db_name or db_list in --extra-vars the playbook
    # stops (see pre_tasks) so every database is not recreated by mistake.
    # Full-stack summary (22 databases), reference only: previous 19 + 3 new
    #   (new) treasury_safe_deal_adapter, treasury_lp_adapter, cryptopro_service, nodes_btc
    #   (previous) treasury_treasury_adapter, treasury_contract, treasury_audit, hsm, treasury_aml, treasury_api,
    #   treasury_csp, keycloak, nodes_eth, nodes_tron, treasury_aml, treasury_auth_provider,
    #   treasury_csp, treasury_notification, treasury_otp, treasury_rates, treasury_report, treasury_web, treasury_onboarding
    # Override: --extra-vars "db_name=treasury_contract" or "db_list=['db1','db2']"
    default_databases: []

    users: root

  pre_tasks:
    - name: Resolve the database list to process
      set_fact:
        db_list: "{{ db_list | default(default_databases) }}"
      when: db_name is not defined or db_name == "" or db_name is none

    - name: Resolve the database list from db_name (when a single database is set)
      set_fact:
        db_list: "{{ [db_name] }}"
      when: db_name is defined and db_name != "" and db_name is not none

    - name: Initialize an empty database list
      set_fact:
        db: []

    - name: Build the dictionary list for the role
      set_fact:
        db: "{{ db + [{'name': item}] }}"
      loop: "{{ db_list }}"

    - name: Fail when the database list is empty
      ansible.builtin.fail:
        msg: "ERROR: database list is empty. Set db_name='database_name' or db_list=['db1','db2'] via --extra-vars"
      when: db_list is not defined or db_list | length == 0

    - name: Show the database list to process
      ansible.builtin.debug:
        msg: "{{ db_list | length }} databases will be processed: {{ db_list | join(', ') }}"

  roles:
      - db

