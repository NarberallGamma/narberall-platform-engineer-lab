---
# Путь к API key n8n в Vault (тот же секрет, что и для nextcloud — Ubuntu_servers).
# Ключ в Vault: ansible_main_n8n_api_key (создать в n8n: Settings → n8n API → Create an API key).
n8n_vault_mount_point: "platform-infra"
n8n_vault_path: "Ubuntu_servers"
n8n_vault_key_api_key: "ansible_main_n8n_api_key"

# Id: SSH + Webhook (Header Auth / JWT в UI). Ключи Vault — имя поля; значение — id credentials в n8n.
# Имена для JSON (отображаемая строка) — не из Vault, константы в roles/n8n_workflows/defaults.
# n8n_vault_inject_credential_ids: false — не читать id из Vault.
n8n_vault_inject_credential_ids: true
n8n_vault_key_ssh_credential_id: "ansible_main_n8n_workflow_ssh_credential_id"
n8n_vault_key_jwt_credential_id: "ansible_main_n8n_workflow_jwt_credential_id"
