apiVersion: 1
# Датасорс был создан без явного uid — provisioning не умеет менять uid,
# поэтому пересоздаём (данных в датасорсе нет, это просто указатель).
deleteDatasources:
  - name: VictoriaMetrics
    orgId: 1
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics   # стабильный uid — на него ссылаются дашборды
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      timeInterval: 30s
