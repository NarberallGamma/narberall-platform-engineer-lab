# Folder and ACL matrix — cloud.example.com (NC group folder: "Regul clients").
# Source: Confluence "Clients Regul INTFS file-share access matrix" + level tree.
#
# Conventions (same as matrix_nextcloud_dev_cloud_platform.yaml for the nextcloud-dev profile):
# - Placeholder {client} — client name (level-1 directory). Paths are relative to the groupfolder root.
# - view for an explicit group list: +read; __NC_MATRIX_RO_ALL__ marker — all matrix groups RO only (see group_vars nextcloud_occ_ro_permissions).
# - edit: +read +write +create +delete (see nextcloud_occ_edit_permissions).
# - If Confluence has one column for view and edit — view and edit match (same groups).
# - Level 4 (children_mkcol + children dicts when needed) only on {client}/{client}/Accounting —
#   not on "File exchange/Accounting" or "Internal exchange".
# - children_mkcol — L4 names for MKCOL only; by default each L4 subfolder gets the same view/edit as the L3 Accounting node.
# - L4 "Contracts": same view/edit as {client}/{client}/Accounting (inherit from L3, including Cloud Clients Regul Assistant).
# - deny_on_l4_children: for Assistant — explicit deny on all L4 under Accounting except except_child_name "Contracts"
#   (Assistant sees only "Contracts" at level 4; other L3 Accounting groups stay on all L4 unless overridden).
# - Groups: full name "Cloud Clients Regul …"; short "IT", "Admin" in the table are normalized to the full prefix.
# - L3 "PAY requests" under {client}/{client}: no __NC_MATRIX_RO_ALL__ — only Cloud Clients Regul Payroll and
#   Cloud Clients Regul IntControl (view/edit *regul_edit_trebovaniya_pay); explicit matrix_deny for the other matrix groups
#   plus auto-deny in group_vars (duplicates are not sent to occ).

# - view uses the __NC_MATRIX_RO_ALL__ marker instead of the LDAP group "Cloud Clients Regul RO" (see defaults):
#   there is no RO group in AD — an object with this view gets read-only for every group in the matrix union
#   (nextcloud_occ_ro_permissions in group_vars), except groups listed in edit on that row.
#
# Alternate on-disk L4 names for occ — children_mkcol_occ_path_fallback under the Accounting node (same order and length as children_mkcol).

defaults:
  regul_view_ro: &regul_view_ro [__NC_MATRIX_RO_ALL__]
  regul_edit_it: &regul_edit_it [Cloud Clients Regul IT]
  regul_view_empty: &regul_view_empty []
  regul_edit_accounting_l3: &regul_edit_accounting_l3
    - Cloud Clients Regul Accounting
    - Cloud Clients Regul Admin
    - Cloud Clients Regul Finance
    - Cloud Clients Regul Corp
    - Cloud Clients Regul IntControl
    - Cloud Clients Regul Assistant
  regul_internal_merged: &regul_internal_merged
    - Cloud Clients Regul Payroll
    - Cloud Clients Regul Accounting
    - Cloud Clients Regul Admin
    - Cloud Clients Regul Compliance
    - Cloud Clients Regul EconSecurity
    - Cloud Clients Regul IntSecurity
    - Cloud Clients Regul Legal
    - Cloud Clients Regul HR
    - Cloud Clients Regul Corp
    - Cloud Clients Regul Finance
    - Cloud Clients Regul 1C
    - Cloud Clients Regul IntControl
    - Cloud Clients Regul Assistant
  regul_edit_file_exchange: &regul_edit_file_exchange
    - Cloud Clients Regul Admin
    - Cloud Clients Regul Finance
    - Cloud Clients Regul Compliance
    - Cloud Clients Regul EconSecurity
    - Cloud Clients Regul IntSecurity
    - Cloud Clients Regul Legal
    - Cloud Clients Regul Accounting
    - Cloud Clients Regul HR
    - Cloud Clients Regul IntControl
    - Cloud Clients Regul Assistant
  regul_edit_clients_info: &regul_edit_clients_info
    - Cloud Clients Regul Admin
    - Cloud Clients Regul Accounting
    - Cloud Clients Regul Legal
    - Cloud Clients Regul Finance
    - Cloud Clients Regul Assistant
    - Cloud Clients Regul IntControl
  regul_edit_corp: &regul_edit_corp
    - Cloud Clients Regul Corp
    - Cloud Clients Regul Admin
    - Cloud Clients Regul Finance
  regul_edit_payroll_hr: &regul_edit_payroll_hr
    - Cloud Clients Regul Payroll
    - Cloud Clients Regul HR
    - Cloud Clients Regul Admin
    - Cloud Clients Regul Finance
  regul_edit_int_security: &regul_edit_int_security
    - Cloud Clients Regul IntSecurity
    - Cloud Clients Regul EconSecurity
  regul_edit_econ_security: &regul_edit_econ_security
    - Cloud Clients Regul EconSecurity
    - Cloud Clients Regul IntSecurity
    - Cloud Clients Regul Compliance
    - Cloud Clients Regul Admin
    - Cloud Clients Regul IntControl
  regul_edit_compliance: &regul_edit_compliance
    - Cloud Clients Regul Compliance
    - Cloud Clients Regul IntSecurity
    - Cloud Clients Regul EconSecurity
    - Cloud Clients Regul Admin
    - Cloud Clients Regul IntControl
  regul_edit_legal: &regul_edit_legal
    - Cloud Clients Regul Legal
    - Cloud Clients Regul Admin
    - Cloud Clients Regul IntSecurity
    - Cloud Clients Regul Accounting
    - Cloud Clients Regul Assistant
    - Cloud Clients Regul IntControl
  regul_edit_purchasing: &regul_edit_purchasing
    - Cloud Clients Regul Admin
    - Cloud Clients Regul IntControl
  regul_edit_trebovaniya_pay: &regul_edit_trebovaniya_pay
    - Cloud Clients Regul Payroll
    - Cloud Clients Regul IntControl
  regul_matrix_deny_trebovaniya_pay: &regul_matrix_deny_trebovaniya_pay
    - group: Cloud Clients Regul IT
    - group: Cloud Clients Regul Accounting
    - group: Cloud Clients Regul Admin
    - group: Cloud Clients Regul Finance
    - group: Cloud Clients Regul Corp
    - group: Cloud Clients Regul Assistant
    - group: Cloud Clients Regul Compliance
    - group: Cloud Clients Regul EconSecurity
    - group: Cloud Clients Regul IntSecurity
    - group: Cloud Clients Regul Legal
    - group: Cloud Clients Regul HR
    - group: Cloud Clients Regul 1C
  regul_edit_file_hra: &regul_edit_file_hra
    - Cloud Clients Regul HR
    - Cloud Clients Regul Payroll
    - Cloud Clients Regul Admin
    - Cloud Clients Regul Finance
  regul_edit_file_corp: &regul_edit_file_corp
    - Cloud Clients Regul Corp
    - Cloud Clients Regul Admin
  regul_edit_file_accounting: &regul_edit_file_accounting
    - Cloud Clients Regul Payroll
    - Cloud Clients Regul HR
    - Cloud Clients Regul Admin
    - Cloud Clients Regul Finance
    - Cloud Clients Regul Accounting
    - Cloud Clients Regul IntControl
  regul_assistant_only: &regul_assistant_only [Cloud Clients Regul Assistant]

folders:
  - path: "{client}"
    view: *regul_view_ro
    edit: *regul_edit_it

  - path: "{client}/{client}"
    view: *regul_view_ro
    edit: *regul_edit_it

  - path: "{client}/Internal exchange"
    view: *regul_internal_merged
    edit: *regul_internal_merged

  - path: "{client}/File exchange"
    view: *regul_view_ro
    edit: *regul_edit_file_exchange

  # L4: children_mkcol — MKCOL; children — "Contracts": full access as on L3 Accounting; deny_on_l4_children — deny Assistant on the other L4.
  - path: "{client}/{client}/Accounting"
    view: *regul_edit_accounting_l3
    edit: *regul_edit_accounting_l3
    children_mkcol:
      - Expense reports
      - Reconciliations
      - Bank
      - Revenue
      - Civil contracts
      - Contracts
      - Period close
      - Inventory count
      - Client instructions
      - Minimum balances and deposits
      - Reporting
      - Entertainment expenses
      - Sales
      - Unified tax account reconciliation
      - Statistics
      - Invoices
      - FTS requests
      - Accounting policy
    children_mkcol_occ_path_fallback:
      - EXPENSE REPORTS
      - RECONCILIATIONS
      - BANK
      - REVENUE
      - CIVIL CONTRACTS
      - CONTRACTS
      - PERIOD CLOSE
      - INVENTORY COUNT
      - CLIENT INSTRUCTIONS
      - MINIMUM BALANCES AND DEPOSITS
      - REPORTING
      - ENTERTAINMENT EXPENSES
      - SALES
      - UNIFIED TAX ACCOUNT RECONCILIATION
      - STATISTICS
      - INVOICES
      - FTS REQUESTS
      - ACCOUNTING POLICY
    children:
      - name: Contracts
        view: *regul_edit_accounting_l3
        edit: *regul_edit_accounting_l3
    deny_on_l4_children:
      except_child_name: "Contracts"
      groups: *regul_assistant_only

  - path: "{client}/{client}/Clients info"
    view: *regul_view_ro
    edit: *regul_edit_clients_info

  - path: "{client}/{client}/Corp"
    view: *regul_edit_corp
    edit: *regul_edit_corp

  - path: "{client}/{client}/Payroll+HR"
    view: *regul_edit_payroll_hr
    edit: *regul_edit_payroll_hr

  - path: "{client}/{client}/IntSecurity"
    view: *regul_edit_int_security
    edit: *regul_edit_int_security

  - path: "{client}/{client}/EconSecurity"
    view: *regul_edit_econ_security
    edit: *regul_edit_econ_security

  - path: "{client}/{client}/Compliance"
    view: *regul_edit_compliance
    edit: *regul_edit_compliance

  - path: "{client}/{client}/Legal"
    view: *regul_edit_legal
    edit: *regul_edit_legal

  - path: "{client}/{client}/Purchasing"
    view: *regul_edit_purchasing
    edit: *regul_edit_purchasing

  - path: "{client}/{client}/PAY requests"
    view: *regul_edit_trebovaniya_pay
    edit: *regul_edit_trebovaniya_pay
    matrix_deny: *regul_matrix_deny_trebovaniya_pay

  - path: "{client}/File exchange/HRA"
    view: *regul_edit_file_hra
    edit: *regul_edit_file_hra

  - path: "{client}/File exchange/Corp"
    view: *regul_edit_file_corp
    edit: *regul_edit_file_corp

  # Level 3 "File exchange/Accounting" without children_mkcol (Confluence L4 tree only under {client}/{client}/Accounting).
  - path: "{client}/File exchange/Accounting"
    view: *regul_edit_file_accounting
    edit: *regul_edit_file_accounting
