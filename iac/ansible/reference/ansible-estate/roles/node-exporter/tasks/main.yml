---
# Node Exporter: Docker Compose в /docker/apps/node-exporter

- name: Check Docker availability
  ansible.builtin.command: docker --version
  register: node_exporter_docker_check
  changed_when: false
  failed_when: node_exporter_docker_check.rc != 0
  tags: [docker, node-exporter]

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  tags: [docker, node-exporter]

- name: Create node-exporter application directory
  ansible.builtin.file:
    path: "{{ node_exporter_base_dir }}"
    state: directory
    mode: "0755"
  tags: [node-exporter, deploy]

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ node_exporter_base_dir }}/docker-compose.yml"
    mode: "0644"
  tags: [node-exporter, deploy]

- name: Inspect existing node-exporter container
  community.docker.docker_container_info:
    name: "{{ node_exporter_container_name }}"
  register: node_exporter_existing
  failed_when: false
  tags: [node-exporter, deploy, legacy]

- name: Stop and remove legacy standalone node-exporter (without compose labels)
  community.docker.docker_container:
    name: "{{ node_exporter_container_name }}"
    state: absent
    force_kill: true
  when:
    - node_exporter_existing.exists | default(false)
    - (node_exporter_existing.container.Config.Labels | default({})).get('com.docker.compose.project', '') | length == 0
  tags: [node-exporter, deploy, legacy]

- name: Detect docker compose plugin
  ansible.builtin.command: docker compose version
  register: node_exporter_compose_plugin
  changed_when: false
  failed_when: false
  tags: [node-exporter, deploy, compose]

- name: Detect legacy docker-compose binary
  ansible.builtin.command: docker-compose --version
  register: node_exporter_compose_legacy
  changed_when: false
  failed_when: false
  tags: [node-exporter, deploy, compose]

- name: Require docker compose tooling
  ansible.builtin.fail:
    msg: >-
      Neither docker compose plugin nor docker-compose binary is available.
      Install docker-compose-plugin (prepare_servers) or docker-compose package.
  when:
    - node_exporter_compose_plugin.rc != 0
    - node_exporter_compose_legacy.rc != 0
  tags: [node-exporter, deploy, compose]

- name: Deploy node-exporter via docker compose plugin
  community.docker.docker_compose_v2:
    project_src: "{{ node_exporter_base_dir }}"
    state: present
    pull: "{{ node_exporter_compose_pull }}"
  when: node_exporter_compose_plugin.rc == 0
  tags: [node-exporter, deploy, compose]

- name: Deploy node-exporter via legacy docker-compose CLI
  ansible.builtin.shell: |
    set -euo pipefail
    if [ "{{ node_exporter_compose_pull }}" = "always" ] || [ "{{ node_exporter_compose_pull }}" = "yes" ] || [ "{{ node_exporter_compose_pull }}" = "True" ]; then
      docker-compose pull
    fi
    docker-compose up -d --remove-orphans
  args:
    chdir: "{{ node_exporter_base_dir }}"
    executable: /bin/bash
  when:
    - node_exporter_compose_plugin.rc != 0
    - node_exporter_compose_legacy.rc == 0
  tags: [node-exporter, deploy, compose]

- name: Wait for node-exporter container to be running
  community.docker.docker_container_info:
    name: "{{ node_exporter_container_name }}"
  register: node_exporter_running
  until: node_exporter_running.exists and node_exporter_running.container.State.Status == 'running'
  retries: 10
  delay: 2
  tags: [node-exporter, health]

- name: Wait for node-exporter metrics endpoint
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ node_exporter_metrics_port }}/metrics"
    method: GET
    status_code: 200
  register: node_exporter_health
  until: node_exporter_health.status == 200
  retries: 10
  delay: 2
  tags: [node-exporter, health]

- name: Display node-exporter status
  ansible.builtin.debug:
    msg:
      - "Node Exporter {{ inventory_hostname }} is running (Docker Compose)"
      - "Compose backend: {{ 'plugin' if node_exporter_compose_plugin.rc == 0 else 'legacy docker-compose' }}"
      - "Path: {{ node_exporter_base_dir }}"
      - "Image: {{ node_exporter_image }}"
      - "Restart policy: always"
      - "Metrics: http://{{ ansible_host }}:{{ node_exporter_metrics_port }}/metrics"
      - "HTTP status: {{ node_exporter_health.status | default('unknown') }}"
  tags: [node-exporter, health]
