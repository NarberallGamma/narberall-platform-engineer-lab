---
# KV v2 engine in Vault (mount point and secret path). Environment: VAULT_ADDR, VAULT_TOKEN.
nextcloud_vault_mount_point: "platform-infra"
nextcloud_vault_path: "Ubuntu_servers"
# Key names in the Ubuntu_servers secret (WebDAV login and password).
nextcloud_vault_key_webdav_user: "ansible_dev_nextcloud_webdav_user"
nextcloud_vault_key_webdav_password: "ansible_dev_nextcloud_webdav_password"
