# TODO: this stack still needs follow-up work.

# Kafka for local order-info plus shop streams.
# PLAINTEXT_HOST: the host connects to localhost:9092 (Spring local profile).
# PLAINTEXT: compose services use kafka:29092 (advertised listeners match).
# kafka-topics-bootstrap creates topics once.
# Broker auto.create is off: after an e2e test deletes the external topic,
# auto-create would rebuild it and the DLQ path would not fire.

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.5
    container_name: kafka
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "9092:9092"
      # host clients may use localhost:29092;
      # PLAINTEXT_HOST (container port 9092) advertises localhost
      # instead of the kafka hostname
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-topics-bootstrap:
    image: confluentinc/cp-kafka:7.7.5
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        set -e
        BOOT=kafka:29092
        create_topic() {
          kafka-topics --bootstrap-server "$$BOOT" --create --if-not-exists \
            --partitions 1 --replication-factor 1 --topic "$$1"
        }
        create_topic INTERNAL.ORDER.TEST.TOPIC.V1
        create_topic ORDER.TEST.TOPIC.V1
        create_topic INTERNAL.AGREEMENT.TEST.TOPIC.V1
        create_topic AGREEMENT.TEST.TOPIC.V1
        create_topic SHOP.ORDER.INFO.V1
        create_topic SHOP.ORDER.INFO.V1.EXTERNAL
        create_topic AUDIT.TEST.TOPIC.V1
        create_topic shop.audit
        create_topic search-order-info-group-producer-meta-info-store-changelog
        create_topic search-order-info-group-external-order-info-store-changelog
        create_topic search-order-info-group-external-order-info-store-repartition
        create_topic search-order-info-group-producer-meta-info-store-repartition
        create_topic search-agreement-info-group-agreement-producer-meta-info-store-changelog
        create_topic search-agreement-info-group-external-agreement-info-store-changelog
        create_topic search-agreement-info-group-external-agreement-info-store-repartition
        create_topic search-agreement-info-group-agreement-producer-meta-info-store-repartition
        create_topic search-payment-info-group-shop-payment-producer-meta-info-store-changelog
        create_topic search-payment-info-group-external-shop-payment-store-changelog
        create_topic search-payment-info-group-external-shop-payment-store-repartition
        create_topic search-payment-info-group-shop-payment-producer-meta-info-store-repartition
        echo "Kafka topics bootstrap finished."
