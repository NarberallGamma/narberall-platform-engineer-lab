---
# tasks file

- name: "{{ overrides_from_child_role.name |
            default(lookup('vars', role_name + '_' + 'name', default=''), true) |
            default(role_name, true) }} -> Initialize common vars"
  ansible.builtin.set_fact:
    "{{ role_name + '_' + 'deploy_to_k8s' }}": "{% if overrides_from_child_role.deploy_to_k8s is defined
                                                  %}{{ overrides_from_child_role.deploy_to_k8s
                                                }}{% elif (lookup('vars', role_name + '_' + 'deploy_to_k8s', default='not_defined') |
                                                           string) != 'not_defined'
                                                  %}{{ lookup('vars', role_name + '_' + 'deploy_to_k8s')
                                                }}{% else %}{{ deploy_to_k8s |
                                                               default(((lookup('vars', 'parent_role_for' + '_' + role_name, default='not_defined') |
                                                                         string) == 'k8s_service') | ternary(true, false)) }}{% endif %}"
    "{{ role_name + '_' + 'prepare_only' }}": "{% if overrides_from_child_role.prepare_only is defined
                                                 %}{{ overrides_from_child_role.prepare_only
                                               }}{% elif (lookup('vars', role_name + '_' + 'prepare_only', default='not_defined') |
                                                          string) != 'not_defined'
                                                 %}{{ lookup('vars', role_name + '_' + 'prepare_only')
                                               }}{% else %}{{ prepare_only | default(false, true) }}{% endif %}"
    "{{ role_name + '_' + 'dump_vars' }}": "{% if overrides_from_child_role.dump_vars is defined
                                              %}{{ overrides_from_child_role.dump_vars
                                            }}{% elif (lookup('vars', role_name + '_' + 'dump_vars', default='not_defined') |
                                                       string) != 'not_defined'
                                              %}{{ lookup('vars', role_name + '_' + 'dump_vars')
                                            }}{% else %}{{ dump_vars | default(false, true) }}{% endif %}"
    "{{ role_name + '_' + 'name' }}": "{{ overrides_from_child_role.name |
                                          default(lookup('vars', role_name + '_' + 'name', default=''), true) |
                                          default(role_name, true) }}"
    "{{ role_name }}": {}

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Initialize main vars"
  ansible.builtin.set_fact:
    "{{ 'parent_role_for' + '_' + role_name }}": "{% if (lookup('vars', 'parent_role_for' + '_' + role_name, default='not_defined') |
                                                         string) not in ['not_defined', 'docker_service', 'k8s_service']
                                                    %}{{ lookup('vars', 'parent_role_for' + '_' + role_name)
                                                  }}{% elif (lookup('vars', role_name + '_' + 'deploy_to_k8s') | bool)
                                                    %}k8s_service{% else %}docker_service{% endif %}"
    "{{ role_name + '_' + namespace_or_stack_var }}": "{% if (lookup('vars', role_name + '_' + 'deploy_to_k8s') | bool)
                                                         %}{{ overrides_from_child_role.namespace |
                                                              default(lookup('vars', role_name + '_' + 'namespace', default=''), true) |
                                                              default(k8s_namespace_name, true) |
                                                              default(docker_stack_name | lower | regex_replace('[^a-z0-9]', '-'), true)
                                                       }}{% else %}{{ overrides_from_child_role.stack |
                                                                      default(lookup('vars', role_name + '_' + 'stack', default=''), true) |
                                                                      default(docker_stack_name, true) }}{% endif %}"
  vars:
    namespace_or_stack_var: "{{ (lookup('vars', role_name + '_' + 'deploy_to_k8s') | bool) | ternary('namespace', 'stack') }}"

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Initialize output dir value"
  ansible.builtin.set_fact:
    "{{ role_name + '_' + 'output_dir' }}": "{{ overrides_from_child_role.output_dir |
                                                default(lookup('vars', role_name + '_' + 'output_dir', default=''), true) |
                                                default(([output_dir | default((lookup('vars', role_name + '_' + 'deploy_to_k8s') | bool) |
                                                                                ternary(lookup('vars', role_name + '_' + 'namespace', default=''),
                                                                                        lookup('vars', role_name + '_' + 'stack', default='')), true),
                                                          lookup('vars', role_name + '_' + 'name')] | path_join), true) }}"

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Create output dir"
  ansible.builtin.file:
    path: "{{ lookup('vars', role_name + '_' + 'output_dir') }}"
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Create defaults dict with all variables with prefix '{{ role_name + '_' }}' without this prefix"
  ansible.builtin.set_fact:
    "{{ role_name }}": "{{ lookup('vars', role_name) |
                           combine({(item | regex_replace('^' + role_name + '_')): lookup('vars', item)}, recursive=True, list_merge='replace') }}"
  loop: "{{  lookup('varnames', '^' + role_name + '_.+') | split(',') }}"

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Combine defaults dict with overrides"
  ansible.builtin.set_fact:
    "{{ role_name }}": "{{ lookup('vars', role_name) |
                           combine(overrides_from_child_role | default({}, true), recursive=True, list_merge='replace') }}"

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Ensure role variables dict file is absent if not dump vars"
  ansible.builtin.file:
    path: "{{ lookup('vars', role_name + '_' + 'output_dir') }}/vars_{{ role_name }}.yaml"
    state: absent
  when: not (lookup('vars', role_name + '_' + 'dump_vars') | bool)

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Dump to file role variables dict"
  ansible.builtin.copy:
    content: "{{ lookup('vars', role_name) | to_nice_yaml(width=5000) }}"
    dest: "{{ lookup('vars', role_name + '_' + 'output_dir') }}/vars_{{ role_name }}.yaml"
    mode: u=rw,g=r,o=r
  when: lookup('vars', role_name + '_' + 'dump_vars') | bool

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Run custom tasks (if exist)"
  ansible.builtin.include_tasks: "{{ run_custom_tasks_item }}"
  loop: "{{ query('fileglob', 'tasks/custom*.y*ml') | sort }}"
  loop_control:
    loop_var: run_custom_tasks_item

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> (After custom tasks) Dump to file role variables dict"
  ansible.builtin.copy:
    content: "{{ lookup('vars', role_name) | to_nice_yaml(width=5000) }}"
    dest: "{{ lookup('vars', role_name + '_' + 'output_dir') }}/vars_{{ role_name }}.yaml"
    mode: u=rw,g=r,o=r
  when: lookup('vars', role_name + '_' + 'dump_vars') | bool

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Set overrides for parent role"
  ansible.builtin.set_fact:
    overrides_for_parent_role: "{{ lookup('vars', role_name) }}"
  no_log: true

- name: "{{ lookup('vars', role_name + '_' + 'name') }} -> Run parent role: '{{ lookup('vars', 'parent_role_for' + '_' + role_name) }}'"
  ansible.builtin.include_role:
    name: "{{ lookup('vars', 'parent_role_for' + '_' + role_name) }}"
  vars:
    overrides_from_child_role: "{{ overrides_for_parent_role }}"
  when: (lookup('vars', 'parent_role_for' + '_' + role_name) | length) > 0
     and lookup('vars', 'parent_role_for' + '_' + role_name) != role_name
