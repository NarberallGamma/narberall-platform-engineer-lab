apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "feed-rss.fullname" . }}
  labels:
    {{- include "feed-rss.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: rss-poller
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - python3
                - rss_poller.py
                - --source
                - {{ .Values.rssSource }}
              {{- if .Values.persistence.enabled }}
              volumeMounts:
                - name: memory
                  mountPath: /app/memory
              {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          {{- if .Values.persistence.enabled }}
          volumes:
            - name: memory
              persistentVolumeClaim:
                claimName: {{ include "feed-rss.fullname" . }}-pvc
          {{- end }}
