---
# groupfolders_etc_ldap_reset: reset LDAP cache for the listed groups (occ ldap:reset-group).
# Included from main.yml when nextcloud_ldap_reset_groups_enabled and nextcloud_ldap_reset_groups is non-empty.
# Folder creation and matrix permissions are not run in this invocation.

- name: Reset LDAP cache for the listed groups (occ ldap:reset-group)
  ansible.builtin.shell: |
    docker exec -u www-data {{ nextcloud_container_name }} php occ --no-warnings ldap:reset-group -y "{{ item }}"
  loop: "{{ nextcloud_ldap_reset_groups }}"
  loop_control:
    label: "{{ item }}"
  register: _ldap_reset_result
  changed_when: (_ldap_reset_result.results | default([]) | length) > 0
  failed_when: false

- name: LDAP-reset summary — folder creation and permissions are skipped in this run
  ansible.builtin.debug:
    msg: "LDAP group reset completed ({{ nextcloud_ldap_reset_groups | length }} groups). Matrix hierarchy creation and permission apply were skipped in this run. On the next run with nextcloud_ldap_reset_groups_enabled: false, groups from AD are pulled under the correct names."
