---
- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ xui_compose_project_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart xui container

- name: Render docker environment file
  ansible.builtin.template:
    src: docker.env.j2
    dest: "{{ xui_compose_project_dir }}/.env"
    mode: "0600"
  notify: Restart xui container

- name: Pull 3X-UI image
  community.docker.docker_image:
    name: "{{ xui_docker_image }}"
    source: pull
    force_source: "{{ xui_docker_pull | bool }}"
  when:
    - not xui_docker_build | bool
    - xui_docker_pull | bool
  async: "{{ xui_docker_pull_timeout }}"
  poll: 30

- name: Start 3X-UI stack with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ xui_compose_project_dir }}"
    state: present
    pull: "{{ 'always' if (xui_docker_pull | bool and not xui_docker_build | bool) else 'missing' }}"
    build: "{{ 'always' if (xui_docker_build | bool) else 'never' }}"
    recreate: "{{ xui_docker_compose_recreate | default('auto') }}"
    remove_orphans: true
  register: xui_compose_up
  async: "{{ xui_docker_compose_up_timeout }}"
  poll: 15

- name: Wait for container running
  community.docker.docker_container_info:
    name: "{{ xui_container_name }}"
  register: xui_container_info
  until: >-
    xui_container_info.exists
    and xui_container_info.container.State.Status == 'running'
  retries: "{{ xui_panel_start_retries }}"
  delay: "{{ xui_panel_start_delay }}"
