---
# Role nextcloud_groupfolders: group-folder tree from the matrix plus permissions.
# Matrix: nextcloud-dev → matrix_nextcloud_dev_cloud_platform.yaml; nextcloud-prod → matrix_nextcloud_prod_cloud_platform.yaml; regul → matrix_regul_cloud_platform.yaml —
# selected via nextcloud_matrix_profile_by_host and nextcloud_profile_map (see group_vars/nextcloud_groupfolders.yml).
# WebDAV — from Vault (role nextcloud_init); URL can be overridden by the profile.
#
# Per spec/matrix: view and edit only. Mapping:
#   view (explicit group list) → +read (nextcloud_occ_view_permissions);
#   view = sentinel __NC_MATRIX_RO_ALL__ → each group from the matrix union without edit on that row → nextcloud_occ_ro_permissions;
#   edit → nextcloud_occ_edit_permissions (+rwcd and explicit -- -share in occ, as in the UI).
# Path permissions: for every matrix path with occ_skip: false — the groups and rights in view/edit; L4 subfolders from children_mkcol
# inherit the parent node's view/edit (explicit occ), except children entries with { name, view, edit } (e.g. Assistant only on "Contracts").
#
# 1) WebDAV MKCOL — create folders from the matrix (idempotent).
# 2) Root permissions: occ groupfolders:group (when nextcloud_apply_root_groups) — so the folder is visible.
# 3) Path permissions: occ groupfolders:permissions (when nextcloud_apply_per_folder_permissions); deny — matrix_deny (deny_on_l4_children).
#
# Reapply-all mode: nextcloud_reapply_all_clients_enabled; when nextcloud_reapply_all_clients_mkcol_enabled —
# for each client listed at the groupfolder root, MKCOL from the matrix first, then the same occ as without MKCOL.
# ACL-only mode without MKCOL for one client_name: nextcloud_reapply_permissions_only (+ client_name).
# LDAP reset mode (nextcloud_ldap_reset_groups_enabled + group list): only ldap:reset-group runs.
#
# Matrix / groupfolder / WebDAV profile by inventory_hostname (see group_vars nextcloud_matrix_profile_by_host).
- name: Groupfolders profile (host → nextcloud-dev|nextcloud-prod|regul)
  ansible.builtin.include_tasks: groupfolders_profile.yml
  tags: always

# Depending on vars: targeted ACL reapply for one client, reapply for all, LDAP, or the main path (MKCOL+permissions).
- name: Reapply matrix ACL only for one client without MKCOL (groupfolders_reapply_one_client)
  ansible.builtin.include_tasks: groupfolders_reapply_one_client.yml
  vars:
    _current_client: "{{ client_name }}"
  when:
    - nextcloud_reapply_permissions_only | default(false) | bool
    - not (nextcloud_reapply_all_clients_enabled | default(false) | bool)
    - not (nextcloud_ldap_reset_groups_enabled | default(false) | bool)

- name: Reapply permissions for all clients (groupfolders_reapply_all_clients)
  ansible.builtin.include_tasks: groupfolders_reapply_all_clients.yml
  when:
    - nextcloud_reapply_all_clients_enabled | default(false) | bool
    - not (nextcloud_reapply_permissions_only | default(false) | bool)

- name: Reset LDAP group cache (groupfolders_etc_ldap_reset)
  ansible.builtin.include_tasks: groupfolders_etc_ldap_reset.yml
  when:
    - nextcloud_ldap_reset_groups_enabled | default(false) | bool
    - (nextcloud_ldap_reset_groups | default([])) | length > 0
    - not (nextcloud_reapply_permissions_only | default(false) | bool)

- name: Main path — one client, matrix, folders, permissions (groupfolders_main)
  ansible.builtin.include_tasks: groupfolders_main.yml
  when:
    - not (nextcloud_reapply_all_clients_enabled | default(false) | bool)
    - not (nextcloud_reapply_permissions_only | default(false) | bool)
    - not (nextcloud_ldap_reset_groups_enabled | default(false) | bool)
