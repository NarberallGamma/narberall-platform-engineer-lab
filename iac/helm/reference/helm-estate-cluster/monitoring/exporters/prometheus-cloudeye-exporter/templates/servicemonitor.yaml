{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "prometheus-cloudeye-exporter.fullname" . }}
  namespace: {{ include "prometheus-cloudeye-exporter.namespace" . }}
  labels:
    {{- include "prometheus-cloudeye-exporter.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "prometheus-cloudeye-exporter.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: http
    path: /metrics
    interval: {{ .Values.serviceMonitor.interval | default "60s" }}
    scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | default "30s" }}
    # Single query value: exporter uses r.URL.Query().Get("services") (first value only).
    # Multiple list entries produced services=SYS.RDS&services=SYS.DCS... -> only SYS.RDS was scraped.
    params:
      services:
        - {{ join "," .Values.monitoredServices | quote }}
    {{- with .Values.serviceMonitor.relabelings }}
    relabelings:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.serviceMonitor.metricRelabelings }}
    metricRelabelings:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
